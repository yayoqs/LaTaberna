<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8">
  <title>Test B1 Temporal — CommandBus wrapper</title>
  <style>
    body { background:#0f0f14; color:#f1f5f9; font-family: monospace; padding: 20px; line-height: 1.5; }
    h1 { color:#f59e0b; }
    .t { margin: 4px 0; padding: 6px 10px; border-radius: 6px; font-size: 13px; }
    .p { background: rgba(16,185,129,.15); border-left: 4px solid #10b981; }
    .f { background: rgba(239,68,68,.15); border-left: 4px solid #ef4444; }
    .i { background: rgba(59,130,246,.15); border-left: 4px solid #3b82f6; }
    .s { margin-top: 24px; padding: 14px; background: #1f2937; border-radius: 6px; font-weight: bold; font-size: 14px; }
    pre { background:#1f2937; padding:10px; border-radius:6px; font-size:11px; overflow-x:auto; white-space:pre-wrap; }
  </style>
</head>
<body>
  <h1>🧪 Test B1 Temporal — CommandBus wrapper v1.0.0</h1>
  <p style="font-size:13px;color:#94a3b8;">
    Verifica si <code>CommandBus.ejecutar</code> inspecciona
    <code>data.exito</code> del handler. Indep de la versión del archivo.
    Si los 4 asserts pasan, el wrapper está corregido (E.x14 aplicado).
  </p>
  <div id="results"></div>

  <script type="module">
    const { CommandBus } = await import('/js/lib/command-bus.js');
    const { Logger }     = await import('/js/lib/logger.js');

    Logger.setLevel('ERROR');

    const resultsEl = document.getElementById('results');
    let passed = 0, failed = 0;

    const assert = (c, m) => {
      if (c) { passed++; resultsEl.innerHTML += `<div class="t p">✔ ${m}</div>`; }
      else { failed++; resultsEl.innerHTML += `<div class="t f">✘ ${m}</div>`; }
    };
    const info = m => resultsEl.innerHTML += `<div class="t i">ℹ️ ${m}</div>`;

    // ═══════════════════════════════════════════════════
    // Caso 1: handler devuelve { exito: false }
    // Esperado (E.x14): wrapper propaga exito: false.
    // ═══════════════════════════════════════════════════
    CommandBus.registrar('test_caso1', async () => {
      return { exito: false, error: 'Fallo simulado del handler' };
    });

    const r1 = await CommandBus.ejecutar({ type: 'test_caso1', datos: {} });
    info(`Caso 1 — retorno del wrapper: ${JSON.stringify(r1)}`);
    assert(r1.exito === false, 'Caso 1: handler devuelve {exito:false} → wrapper propaga exito:false');
    assert(r1.error === 'Fallo simulado del handler' || r1.data?.error === 'Fallo simulado del handler',
      'Caso 1: wrapper propaga el error del handler');

    // ═══════════════════════════════════════════════════
    // Caso 2: handler devuelve valor sin campo exito
    // Esperado: wrapper devuelve exito: true (compatibilidad).
    // ═══════════════════════════════════════════════════
    CommandBus.registrar('test_caso2', async () => {
      return { id: 'abc', valor: 42 };
    });

    const r2 = await CommandBus.ejecutar({ type: 'test_caso2', datos: {} });
    info(`Caso 2 — retorno del wrapper: ${JSON.stringify(r2)}`);
    assert(r2.exito === true, 'Caso 2: handler sin campo exito → wrapper propaga exito:true');
    assert(r2.data?.id === 'abc', 'Caso 2: wrapper propaga data con el valor del handler');

    // ═══════════════════════════════════════════════════
    // Caso 3: handler tira excepción
    // Esperado: wrapper captura y devuelve exito: false.
    // ═══════════════════════════════════════════════════
    CommandBus.registrar('test_caso3', async () => {
      throw new Error('Excepción simulada');
    });

    const r3 = await CommandBus.ejecutar({ type: 'test_caso3', datos: {} });
    info(`Caso 3 — retorno del wrapper: ${JSON.stringify(r3)}`);
    assert(r3.exito === false, 'Caso 3: handler tira excepción → wrapper devuelve exito:false');

    // ═══════════════════════════════════════════════════
    // Caso 4: handler devuelve { exito: true }
    // Esperado: wrapper devuelve exito: true.
    // ═══════════════════════════════════════════════════
    CommandBus.registrar('test_caso4', async () => {
      return { exito: true, data: { ok: true } };
    });

    const r4 = await CommandBus.ejecutar({ type: 'test_caso4', datos: {} });
    info(`Caso 4 — retorno del wrapper: ${JSON.stringify(r4)}`);
    assert(r4.exito === true, 'Caso 4: handler devuelve {exito:true} → wrapper propaga exito:true');

    // ═══ RESUMEN ═══
    resultsEl.innerHTML += `<div class="s">${passed} pasaron, ${failed} fallaron</div>`;
    if (failed === 0) {
      resultsEl.innerHTML += '<div class="t p">✅ Wrapper del CommandBus corregido (E.x14 aplicado). Nota B1 cerrada.</div>';
    } else {
      resultsEl.innerHTML += '<div class="t f">⚠️ Wrapper del CommandBus NO corregido. Coordinar con Célula E.</div>';
    }

    // Log para inspección
    resultsEl.innerHTML += `<pre>Diagnóstico completo:\n` +
      `Caso 1 → ${JSON.stringify(r1)}\n` +
      `Caso 2 → ${JSON.stringify(r2)}\n` +
      `Caso 3 → ${JSON.stringify(r3)}\n` +
      `Caso 4 → ${JSON.stringify(r4)}\n` +
      `</pre>`;
  </script>
</body>
</html>
