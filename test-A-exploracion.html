<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test A — Exploración y Login Ecosistema</title>
  <style>
    body { font-family: monospace; background: #111827; color: #f9fafb; padding: 24px; }
    h1 { color: #f59e0b; }
    .ok { color: #10b981; }
    .error { color: #ef4444; }
    .info { color: #94a3b8; }
    pre { background: #1f2937; padding: 12px; border-radius: 6px; white-space: pre-wrap; font-size: 12px; }
    input, button { font-family: inherit; padding: 8px; margin: 4px; border-radius: 6px; border: 1px solid #374151; background: #1f2937; color: #f9fafb; }
    button { cursor: pointer; }
  </style>
</head>
<body>
  <h1>🧪 Test A — Exploración y Login Ecosistema</h1>
  <p>Inicia sesión con un usuario para explorar sus espacios y colecciones.</p>

  <div>
    <input type="text" id="usuario" placeholder="Usuario" />
    <input type="password" id="password" placeholder="Contraseña" />
    <button id="btnLogin">Iniciar sesión y explorar</button>
  </div>

  <div id="results"></div>

  <script src="/js/appwrite.min.js"></script>

  <script type="module">
    import { Logger } from './js/lib/logger.js';
    import { Deps } from './js/lib/deps.js';
    import { DBAppwrite } from './js/db-appwrite.js';
    import { Auth } from './js/auth.js';
    import { inicializarAuth } from './js/auth.js';

    const resultsEl = document.getElementById('results');

    function info(msg) {
      const div = document.createElement('div');
      div.className = 'info';
      div.textContent = msg;
      resultsEl.appendChild(div);
    }

    function ok(msg) {
      const div = document.createElement('div');
      div.className = 'ok';
      div.textContent = '✔ ' + msg;
      resultsEl.appendChild(div);
    }

    function fail(msg) {
      const div = document.createElement('div');
      div.className = 'error';
      div.textContent = '✘ ' + msg;
      resultsEl.appendChild(div);
    }

    function pre(obj) {
      const el = document.createElement('pre');
      el.textContent = typeof obj === 'string' ? obj : JSON.stringify(obj, null, 2);
      resultsEl.appendChild(el);
    }

    async function explorar(usuario, password) {
      Logger.setLevel('ERROR');
      resultsEl.innerHTML = '';

      Deps.registrar('auth', Auth);

      info('Inicializando Appwrite...');
      await inicializarAuth();
      if (!(await DBAppwrite.iniciar())) {
        fail('No se pudo inicializar Appwrite');
        return;
      }
      ok('Appwrite inicializado');

      try { await Auth.cerrarSesion(); } catch {}

      info(`Autenticando con ${usuario}...`);
      if (!(await Auth.iniciarSesion(usuario, password))) {
        fail('No se pudo autenticar');
        return;
      }
      ok('Autenticado');

      const datos = Auth.obtenerUsuarioActual();
      pre(datos);

      info('Espacios del usuario:');
      if (!datos.espacios || datos.espacios.length === 0) {
        fail('No tiene espacios');
      } else {
        pre(datos.espacios);
        ok('Espacios resueltos');
      }

      info('Listando colecciones de negocio...');
      const colecciones = [
        'productos', 'pedidos', 'mesas', 'comandas', 'insumos', 'recetas',
        'configuracion', 'eventos_en_vivo', 'cartas', 'proveedores', 'entradas',
        'comensales', 'avisos', 'variantes'
      ];

      for (const coleccion of colecciones) {
        try {
          const filas = await DBAppwrite.listar(coleccion);
          info(`📦 ${coleccion}: ${filas.length} filas`);
          if (filas.length > 0) {
            pre(filas.slice(0, 2));
          }
        } catch (e) {
          fail(`Error al listar ${coleccion}: ${e.message}`);
        }
      }

      info('Prueba de escritura/borrado en mesas...');
      const mesaId = 'test_ecosistema_' + Date.now();
      try {
        const mesaCreada = await DBAppwrite.crear('mesas', mesaId, {
          numero: '9999', estado: 'libre', pedidoId: '', comensales: 1,
          zona: 'test_ecosistema', esVirtual: false, espacioId: datos.espacioActivoId
        });

        if (!mesaCreada) {
          fail('No se pudo crear mesa de prueba');
        } else {
          ok('Mesa de prueba creada');
          await DBAppwrite.eliminar('mesas', mesaId);
          ok('Mesa de prueba eliminada');
        }
      } catch (e) {
        fail('Error en escritura/borrado: ' + e.message);
      }
    }

    document.getElementById('btnLogin').addEventListener('click', () => {
      const usuario = document.getElementById('usuario').value.trim();
      const password = document.getElementById('password').value;
      if (!usuario || !password) {
        alert('Completa usuario y contraseña');
        return;
      }
      explorar(usuario, password);
    });
  </script>
</body>
</html>
