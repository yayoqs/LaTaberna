<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test A — Integración bootstrap</title>
  <!-- v1.0.0 — Cubre el flujo real de bootstrap: state.cartas
       poblado sin intervención del editor. Flujo en dos fases
       (login → reload → verificación). Aprobado por Coordinación
       A.76 (2026-10-10 06:00 UTC). -->
  <style>
    body { font-family: monospace; background: #111827; color: #f9fafb; padding: 24px; }
    h1 { color: #f59e0b; }
    .ok { color: #10b981; }
    .error { color: #ef4444; }
    .info { color: #94a3b8; }
    pre { background: #1f2937; padding: 8px; border-radius: 6px; font-size: 12px; }
    button { font-family: inherit; padding: 10px 14px; border-radius: 6px; border: 1px solid #374151; background: #1f2937; color: #f9fafb; cursor: pointer; }
  </style>
</head>
<body>
  <h1>🧪 Test A — Integración bootstrap</h1>
  <p>
    Verifica que <code>state.cartas</code> se puebla desde bootstrap
    sin intervención del editor de cartas. Flujo en dos fases con
    reload intermedio. Acepta espacio vacío como válido.
  </p>
  <button id="btnRun">Ejecutar</button>
  <div id="results"></div>

  <script src="/js/appwrite.min.js"></script>

  <script type="module">
    import { Logger } from './js/lib/logger.js';
    import { Deps } from './js/lib/deps.js';
    import { DBAppwrite } from './js/db-appwrite.js';
    import { DB } from './js/db.js';
    import { Store } from './js/lib/store.js';
    import { Auth, inicializarAuth } from './js/auth.js';
    import { EventBus } from './js/lib/eventBus.js';

    const resultsEl = document.getElementById('results');
    const FLAG = 'test-bootstrap-run';
    let passed = 0, failed = 0;

    function info(m) { resultsEl.innerHTML += `<div class="info">ℹ️ ${m}</div>`; }
    function ok(m) { passed++; resultsEl.innerHTML += `<div class="ok">✔ ${m}</div>`; }
    function fail(m) { failed++; resultsEl.innerHTML += `<div class="error">✘ ${m}</div>`; }
    function pre(o) { resultsEl.innerHTML += `<pre>${JSON.stringify(o, null, 2)}</pre>`; }

    async function fase1_prepararSesion() {
      resultsEl.innerHTML = '';
      Logger.setLevel('ERROR');
      Deps.registrar('auth', Auth);

      info('Fase 1: preparando sesión...');
      await inicializarAuth();
      if (!(await DBAppwrite.iniciar())) {
        fail('Appwrite no inicializó');
        return;
      }
      try { await Auth.cerrarSesion(); } catch {}
      if (!(await Auth.iniciarSesion('jefePub', 'jefe1234'))) {
        fail('Login falló');
        return;
      }
      ok('Sesión iniciada. Recargando para que bootstrap arranque naturalmente...');
      sessionStorage.setItem(FLAG, 'true');
      setTimeout(() => location.reload(), 800);
    }

    async function fase2_verificarBootstrap() {
      resultsEl.innerHTML = '';
      info('Fase 2: bootstrap arrancando en página recargada...');

      // Escuchar db:inicializada
      let inicializada = false;
      EventBus.on('db:inicializada', () => { inicializada = true; });

      // Cargar bootstrap (arranca toda la app). Es la única forma
      // limpia de cubrir el flujo real de bootstrap: el despacho
      // CARTAS_INICIALIZAR vive ahí, no en un módulo testeable en
      // aislamiento.
      info('Importando bootstrap.js...');
      try {
        await import('./js/bootstrap.js');
      } catch (e) {
        fail('Error al importar bootstrap: ' + e.message);
        sessionStorage.removeItem(FLAG);
        return;
      }

      info('Esperando db:inicializada (timeout 15s)...');
      const t0 = Date.now();
      while (!inicializada && Date.now() - t0 < 15000) {
        await new Promise(r => setTimeout(r, 200));
      }
      if (!inicializada) {
        fail('No llegó db:inicializada en 15s');
        sessionStorage.removeItem(FLAG);
        return;
      }
      ok('db:inicializada recibido');

      // Dar 2.5s a bootstrap para despachar CARTAS_INICIALIZAR
      // (vive después de DB.init() en bootstrap.arrancar()).
      info('Esperando 2.5s para que bootstrap complete sus despachos...');
      await new Promise(r => setTimeout(r, 2500));

      // Verificaciones
      const stateCartas = Store.obtenerEstado().cartas;
      const dbCartas = DB.cartas || [];

      pre({
        DB_cartas_len: dbCartas.length,
        Store_cartas_len: Array.isArray(stateCartas) ? stateCartas.length : 'no array'
      });

      if (Array.isArray(stateCartas)) {
        ok('state.cartas es array');
      } else {
        fail('state.cartas no es array');
      }

      if (Array.isArray(stateCartas) && stateCartas.length === dbCartas.length) {
        ok('state.cartas coincide con DB.cartas en longitud');
      } else {
        fail('state.cartas ≠ DB.cartas en longitud');
      }

      // Verificación independiente: releer cartas desde Appwrite.
      // Si PubPrueba tiene cartas, deben estar todas en state.cartas.
      let cartasAppwrite = [];
      try {
        cartasAppwrite = await DBAppwrite.listar('cartas');
      } catch (e) {
        info('No se pudo releer cartas de Appwrite: ' + e.message);
      }

      if (cartasAppwrite.length === 0) {
        ok('PubPrueba no tiene cartas en Appwrite. Estado vacío válido.');
      } else {
        const idsAppwrite = cartasAppwrite.map(c => c.id).sort();
        const idsStore = (stateCartas || []).map(c => c.id).sort();
        const faltantes = idsAppwrite.filter(id => !idsStore.includes(id));

        pre({ idsAppwrite, idsStore, faltantes });

        if (faltantes.length === 0) {
          ok(`Las ${cartasAppwrite.length} cartas de Appwrite están en state.cartas`);
        } else {
          fail(`${faltantes.length} cartas de Appwrite faltan en state.cartas: ${faltantes.join(', ')}`);
        }
      }

      // Limpieza
      try { await Auth.cerrarSesion(); } catch {}
      sessionStorage.removeItem(FLAG);

      resultsEl.innerHTML += `<div class="info">${passed} pasaron, ${failed} fallaron</div>`;
      if (failed === 0) {
        resultsEl.innerHTML += `<div class="ok">✔ Test de integración superado.</div>`;
      } else {
        resultsEl.innerHTML += `<div class="error">✘ Existen fallos que revisar.</div>`;
      }
    }

    document.getElementById('btnRun').addEventListener('click', () => {
      if (sessionStorage.getItem(FLAG) === 'true') {
        fase2_verificarBootstrap();
      } else {
        fase1_prepararSesion();
      }
    });

    // Autoarranque de fase 2 si venimos de un reload
    if (sessionStorage.getItem(FLAG) === 'true') {
      info('Bandera detectada al cargar. Corriendo fase 2 automáticamente...');
      fase2_verificarBootstrap();
    }
  </script>
</body>
</html>
