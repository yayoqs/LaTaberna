<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Test D — Temporal</title>
  <link rel="stylesheet" href="css/vars.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/modals.css">
  <link rel="stylesheet" href="css/config.css">
  <script src="js/appwrite.min.js"></script>
  <style>
    /* Ajustes específicos para tests temporales:
       permitir scroll en móvil y evitar bloqueo de altura fija */
    html, body {
      height: auto;
      min-height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
    }

    body {
      display: block;
      background: #0f0f14;
      color: #f1f5f9;
      font-family: 'Nunito', system-ui, sans-serif;
      padding: 20px;
      box-sizing: border-box;
    }

    .panel-test {
      background: #1a1a24;
      border: 1px solid #2e2e42;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-sizing: border-box;
    }

    .panel-test h2 {
      font-size: 18px;
      margin: 0 0 12px;
    }

    .log-positivo { color: #22c55e; font-weight: 700; }
    .log-error { color: #ef4444; font-weight: 700; }
    .log-info { color: #60a5fa; font-weight: 700; }

    code {
      background: #252535;
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* Asegurar que los contenedores internos no limiten scroll */
    #view-config {
      display: block;
      height: auto;
      min-height: 0;
      overflow: visible;
    }

    @media (max-width: 768px) {
      body {
        padding: 12px;
      }

      .panel-test {
        padding: 14px;
      }
    }
  </style>
</head>
<body>

  <div class="panel-test">
    <h2>Test D — Temporal</h2>
    <p style="font-size:13px; color:#94a3b8; margin:0 0 8px;">
      Test temporal para verificar cambios. Al pasar en verde, su lógica se incorpora al test unificado.
    </p>
    <div id="logTest"></div>
  </div>

  <!-- Contenedor donde Config.activar() montará la vista -->
  <div id="view-config"></div>

  <script type="module">
    import { Auth } from './js/auth.js';
    import { DB } from './js/db.js';
    import { DBAppwrite } from './js/db-appwrite.js';
    import { Logger } from './js/lib/logger.js';
    import { Config } from './js/ui/config.js';

    Logger.setLevel('ERROR');

    const log = document.getElementById('logTest');
    const resultados = [];

    function agregarResultado(nombre, ok, detalle = '') {
      const fila = document.createElement('div');
      fila.className = ok ? 'log-positivo' : 'log-error';
      fila.innerHTML = `${ok ? '✅' : '❌'} ${nombre}${detalle ? ` — <code>${detalle}</code>` : ''}`;
      log.appendChild(fila);
      resultados.push({ nombre, ok });
    }

    function agregarInfo(mensaje) {
      const fila = document.createElement('div');
      fila.className = 'log-info';
      fila.innerHTML = `ℹ️ ${mensaje}`;
      log.appendChild(fila);
    }

    const esperar = ms => new Promise(r => setTimeout(r, ms));

    async function run() {
      Logger.setLevel('ERROR');
      log.innerHTML = '';

      // Inicializar
      await DB.init();
      await Auth.cerrarSesion();

      const login = await Auth.iniciarSesion('master', 'master123');
      if (!login) {
        agregarResultado('Login master', false);
        return;
      }
      agregarResultado('Login master', true);

      // Crear documento global con espacioId falso para probar filtro
      const espacioFalso = 'espacio_falso_' + Date.now();
      await DBAppwrite.crear('configuracion', 'unique()', {
        clave: 'global',
        valor: JSON.stringify({ nombreLocal: 'Falso' }),
        espacioId: espacioFalso
      });

      // Activar Configuración real (monta en #view-config)
      Config.activar();

      const inputNombre = document.getElementById('cfgNombreLocal');
      if (!inputNombre) {
        agregarResultado('Campos de configuración disponibles', false);
        return;
      }
      inputNombre.value = 'La Taberna Test';
      document.getElementById('cfgDireccion').value = 'Dirección Test';
      document.getElementById('cfgCuit').value = '12345678';
      document.getElementById('cfgPie').value = 'Pie Test';

      document.getElementById('btnGuardarConfig').click();
      await esperar(2000); // esperar sincronización Appwrite

      // Verificar que el documento correcto fue actualizado
      const configs = await DBAppwrite.listar('configuracion');
      const docCorrecto = configs.find(d => d.clave === 'global' && d.espacioId === 'lataberna');
      const docFalso = configs.find(d => d.clave === 'global' && d.espacioId === espacioFalso);

      agregarResultado(
        'Documento con espacio correcto actualizado',
        !!docCorrecto && docCorrecto.valor.includes('La Taberna Test')
      );
      agregarResultado(
        'Documento con espacio falso no fue tocado',
        !!docFalso && docFalso.valor.includes('Falso')
      );

      // Limpiar documento falso
      if (docFalso) await DBAppwrite.eliminar('configuracion', docFalso.id);
      const configsDespues = await DBAppwrite.listar('configuracion');
      const falsoEliminado = !configsDespues.some(d => d.id === docFalso?.id);
      agregarResultado('Documento falso eliminado', falsoEliminado);

      // Resumen final
      const total = resultados.length;
      const pasaron = resultados.filter(r => r.ok).length;
      const fallaron = total - pasaron;

      const resumen = document.createElement('div');
      resumen.style.marginTop = '12px';
      resumen.className = fallaron === 0 ? 'log-positivo' : 'log-error';
      resumen.innerHTML = `<strong>Resumen:</strong> ${pasaron} correctos, ${fallaron} fallidos.`;
      log.appendChild(resumen);

      Logger.info(`[test-D-temporal] Finalizado. ${pasaron}/${total} correctos.`);
    }

    window.addEventListener('load', () => run().catch(e => {
      log.innerHTML += `<div class="log-error">Error: ${e.message}</div>`;
      console.error(e);
    }));
  </script>
</body>
</html>
