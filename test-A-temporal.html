<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test de carga completa</title>
</head>
<body>
  <h1>Test de carga completa</h1>
  <div id="resultado"></div>

  <script src="/js/appwrite.min.js"></script>
  <script type="module">
    const resultado = document.getElementById('resultado');
    const modulos = [
      { nombre: 'utils',              ruta: '/js/utils.js' },
      { nombre: 'logger',             ruta: '/js/lib/logger.js' },
      { nombre: 'eventBus',           ruta: '/js/lib/eventBus.js' },
      { nombre: 'commandBus',         ruta: '/js/lib/command-bus.js' },
      { nombre: 'store',              ruta: '/js/lib/store.js' },
      { nombre: 'deps',               ruta: '/js/lib/deps.js' },
      { nombre: 'dominio/resultado',  ruta: '/js/dominio/resultado.js' },
      { nombre: 'dominio/dinero',     ruta: '/js/dominio/dinero.js' },
      { nombre: 'dominio/cantidad',   ruta: '/js/dominio/cantidad.js' },
      { nombre: 'dominio/direccion',  ruta: '/js/dominio/direccion.js' },
      { nombre: 'dominio/pedido',     ruta: '/js/dominio/pedido.js' },
      { nombre: 'dominio/delivery',   ruta: '/js/dominio/delivery.js' },
      { nombre: 'dominio/ingrediente', ruta: '/js/dominio/ingrediente.js' },
      { nombre: 'db-core',            ruta: '/js/db-core.js' },
      { nombre: 'db-inventario',      ruta: '/js/db-inventario.js' },
      { nombre: 'db-fusion',          ruta: '/js/db-fusion.js' },
      { nombre: 'db-shim',            ruta: '/js/db-shim.js' },
      { nombre: 'db-appwrite',        ruta: '/js/db-appwrite.js' },
      { nombre: 'db',                 ruta: '/js/db.js' },
      { nombre: 'roles',              ruta: '/js/roles.js' },
      { nombre: 'auth',               ruta: '/js/auth.js' },
      { nombre: 'loader',             ruta: '/js/lib/loader.js' },
      { nombre: 'pedido-service',     ruta: '/js/servicios/pedido-service.js' },
      { nombre: 'delivery-service',   ruta: '/js/servicios/delivery-service.js' },
      { nombre: 'inventario-service', ruta: '/js/servicios/inventario-service.js' },
      { nombre: 'crear-pedido-mesa',  ruta: '/js/comandos/crear-pedido-mesa.js' },
      { nombre: 'enviar-comanda',     ruta: '/js/comandos/enviar-comanda.js' },
      { nombre: 'agregar-mesa',       ruta: '/js/comandos/agregar-mesa.js' },
      { nombre: 'liberar-mesa',       ruta: '/js/comandos/liberar-mesa.js' },
      { nombre: 'completar-subcomanda', ruta: '/js/comandos/completar-subcomanda.js' },
      { nombre: 'pedido-repository',  ruta: '/js/repositorios/pedido-repository.js' },
      { nombre: 'pedido-manager',     ruta: '/js/managers/pedido-manager.js' },
      { nombre: 'turno-manager',      ruta: '/js/managers/turno-manager.js' },
      { nombre: 'carta',              ruta: '/js/ui/carta.js' },
      { nombre: 'comanda',            ruta: '/js/ui/comanda.js' },
      { nombre: 'caja',               ruta: '/js/ui/caja.js' },
      { nombre: 'cobro',              ruta: '/js/ui/cobro.js' },
      { nombre: 'config',             ruta: '/js/ui/config.js' },
      { nombre: 'cuenta',             ruta: '/js/ui/cuenta.js' },
      { nombre: 'despensa',           ruta: '/js/ui/despensa.js' },
      { nombre: 'eventos',            ruta: '/js/ui/eventos.js' },
      { nombre: 'kds',                ruta: '/js/ui/kds.js' },
      { nombre: 'menu',               ruta: '/js/ui/menu.js' },
      { nombre: 'mesa-detalles',      ruta: '/js/ui/mesa-detalles.js' },
      { nombre: 'mesas',              ruta: '/js/ui/mesas.js' },
      { nombre: 'pedido-ui',          ruta: '/js/ui/pedido-ui.js' },
      { nombre: 'perfil',             ruta: '/js/ui/perfil.js' },
      { nombre: 'recetas',            ruta: '/js/ui/recetas.js' },
      { nombre: 'reparto',            ruta: '/js/ui/reparto.js' },
      { nombre: 'tickets',            ruta: '/js/ui/tickets.js' },
      { nombre: 'guia-mesero',        ruta: '/js/modulos/interno/guia-mesero.js' },
      { nombre: 'precarga-control',   ruta: '/js/modulos/interno/precarga-control.js' },
      { nombre: 'eventos-en-vivo',    ruta: '/js/modulos/admin/eventos-en-vivo.js' },
      { nombre: 'principal-cliente',  ruta: '/js/modulos/cliente/principal.js' },
    ];

    let todosOk = true;

    for (const mod of modulos) {
      try {
        await import(mod.ruta);
        resultado.innerHTML += `<p style="color:green">✔ ${mod.nombre}</p>`;
      } catch (error) {
        resultado.innerHTML += `<p style="color:red">✘ ${mod.nombre}: ${error.message}</p>`;
        console.error(`Error en ${mod.nombre}:`, error);
        todosOk = false;
      }
    }

    if (todosOk) {
      resultado.innerHTML += '<hr><p style="color:green"><strong>Todos los módulos cargaron correctamente.</strong></p>';
    } else {
      resultado.innerHTML += '<hr><p style="color:red"><strong>Algunos módulos fallaron.</strong></p>';
    }
  </script>
</body>
</html>
