<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test B2 — Recetario — Persistencia validada (db.js v1.0.13)</title>
  <style>
    body { font-family: monospace; background: #1a1a24; color: #f1f5f9; padding: 20px; }
    h1 { color: #f59e0b; }
    .suite { margin-bottom: 24px; border-bottom: 1px solid #2e2e42; padding-bottom: 12px; }
    .test { margin: 4px 0; padding: 4px 8px; border-radius: 4px; }
    .pass { background: rgba(34,197,94,.2); }
    .fail { background: rgba(239,68,68,.2); }
    .summary { margin-top: 20px; font-weight: bold; }
    .info { color: #94a3b8; font-size: 12px; margin: 2px 0; }
  </style>
</head>
<body>
  <h1>🧪 Test B2 — Persistencia validada (db.js v1.0.13)</h1>
  <p class="info">Verifica que db.js v1.0.13 normaliza categoria y nivel al cargar recetas.</p>
  <div id="results"></div>

  <script type="module">
    import { Store } from '../js/lib/store.js';
    import { Auth } from '../js/auth.js';
    import { DB } from '../js/db.js';
    import { Logger } from '../js/lib/logger.js';
    import { Recetas } from '../js/ui/recetas.js';

    Logger.setLevel('ERROR');
    window.Logger = Logger;

    Auth.getRol = () => 'cocina';

    Store.getState = () => ({
      productos: DB.productos || [],
      recetas: DB.recetas || [],
      ingredientes: DB.ingredientes || []
    });
    Store.subscribe = () => () => {};
    Store.dispatch = () => {};

    DB.productos = [];
    DB.recetas = [];
    DB.ingredientes = [];
    DB.saveRecetas = () => {};
    DB.saveProductos = () => {};
    DB.saveIngredientes = () => {};

    const resultsEl = document.getElementById('results');
    let passed = 0, failed = 0;
    function assert(condition, msg) {
      if (condition) { passed++; resultsEl.innerHTML += '<div class="test pass">✔ ' + msg + '</div>'; }
      else { failed++; resultsEl.innerHTML += '<div class="test fail">✘ ' + msg + '</div>'; }
    }
    const esperar = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    async function runTests() {
      resultsEl.innerHTML = '';
      if (!document.getElementById('toastContainer')) {
        const tc = document.createElement('div'); tc.id = 'toastContainer'; document.body.appendChild(tc);
      }

      // ═══════════════════════════════════════════════════
      // Suite 1: Normalización de categoria y nivel al cargar
      // ═══════════════════════════════════════════════════
      resultsEl.innerHTML += '<div class="suite"><h2>1. Normalización al cargar (db.js v1.0.13)</h2></div>';

      // 1.1 Simular que Appwrite/localStorage devuelve datos crudos sin categoria ni nivel
      const datosCrudos = [{
        id: 'rec_test', productoId: 'prod_test',
        // ¡Sin categoria ni nivel!
        es_intermedio: true,
        ingredientes: JSON.stringify([{ tipo: 'insumo', id: 'ing_test', cantidad: 1 }]),
        instrucciones: 'Paso', stockActual: 5, unidadStock: 'kg'
      }];

      // 1.2 Ejecutar la lógica de _procesarRecetas de db.js v1.0.13
      const recetasProcesadas = datosCrudos.map(function(r) {
        if (typeof r.ingredientes === 'string') {
          try { r.ingredientes = JSON.parse(r.ingredientes); } catch (e) { r.ingredientes = []; }
        }
        r.categoria = r.categoria || 'sin_categoria';
        r.nivel     = r.nivel || 'sin_nivel';
        return r;
      });

      DB.recetas = recetasProcesadas;
      const recetaCargada = DB.recetas[0];

      // 1.3 Verificar que db.js normalizó los campos
      assert(recetaCargada.categoria === 'sin_categoria', 'Categoria normalizada: sin_categoria');
      assert(recetaCargada.nivel === 'sin_nivel', 'Nivel normalizado: sin_nivel');

      // 1.4 Editar los campos y simular guardado
      DB.recetas[0].categoria = 'aderezos';
      DB.recetas[0].nivel = 'aderezo';
      Recetas.render('produccion');
      await esperar(100);
      assert(DB.recetas[0].categoria === 'aderezos', 'Categoría editada: aderezos');
      assert(DB.recetas[0].nivel === 'aderezo', 'Nivel editado: aderezo');

      // 1.5 Simular recarga: Appwrite devuelve los datos con los campos correctos
      const datosDeAppwrite = JSON.parse(JSON.stringify(DB.recetas));
      const recetasRecargadas = datosDeAppwrite.map(function(r) {
        if (typeof r.ingredientes === 'string') {
          try { r.ingredientes = JSON.parse(r.ingredientes); } catch (e) { r.ingredientes = []; }
        }
        r.categoria = r.categoria || 'sin_categoria';
        r.nivel     = r.nivel || 'sin_nivel';
        return r;
      });

      DB.recetas = recetasRecargadas;
      const recetaTrasRecarga = DB.recetas[0];
      assert(recetaTrasRecarga.categoria === 'aderezos', 'Tras recarga: categoria sigue siendo aderezos');
      assert(recetaTrasRecarga.nivel === 'aderezo', 'Tras recarga: nivel sigue siendo aderezo');

      // ═══════════════════════════════════════════════════
      // Suite 2: Verificación en el Store
      // ═══════════════════════════════════════════════════
      resultsEl.innerHTML += '<div class="suite"><h2>2. Store tras recarga</h2></div>';
      const state = Store.getState();
      const recetaEnStore = state.recetas[0];
      assert(!!recetaEnStore, 'Store tiene la receta');
      assert(recetaEnStore.categoria === 'aderezos', 'Store: categoria correcta');
      assert(recetaEnStore.nivel === 'aderezo', 'Store: nivel correcto');

      // Limpiar
      document.getElementById('view-recetas')?.remove();

      resultsEl.innerHTML += `<div class="summary">${passed} pasaron, ${failed} fallaron</div>`;
      if (failed === 0) {
        resultsEl.innerHTML += '<div class="test pass">✔ La normalización de db.js v1.0.13 funciona correctamente. Las recetas conservan categoria y nivel al recargar.</div>';
      }
    }

    window.addEventListener('load', () => runTests().catch(e => {
      resultsEl.innerHTML += `<div class="error">Error en tests: ${e.message}</div>`;
      console.error(e);
    }));
  </script>
</body>
</html>
