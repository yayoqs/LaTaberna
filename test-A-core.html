<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test A — Core (Comandos + Registro + completarSubcomanda + Factories) — Sin Mocks</title>
  <style>
    body { font-family: monospace; background: #1a1a24; color: #f1f5f9; padding: 20px; }
    h1 { color: #f59e0b; }
    .suite { margin-bottom: 24px; border-bottom: 1px solid #2e2e42; padding-bottom: 12px; }
    .test { margin: 4px 0; padding: 4px 8px; border-radius: 4px; }
    .pass { background: rgba(34,197,94,.2); }
    .fail { background: rgba(239,68,68,.2); }
    .summary { margin-top: 20px; font-weight: bold; }
    .error { color: #ef4444; margin-bottom: 16px; }
    .info { color: #94a3b8; font-size: 12px; margin: 2px 0; }
  </style>
</head>
<body>
  <h1>🧪 Test A — Core (Comandos + Registro + completarSubcomanda + Factories) — Sin Mocks</h1>
  <p class="info">Usa DBAppwrite real, DB real y PedidoManager real. Requiere autenticación como master.</p>
  <div id="results"></div>

  <script src="/js/appwrite.min.js"></script>

  <script type="module">
    import { Logger } from './js/lib/logger.js';
    import { EventBus } from './js/lib/eventBus.js';
    import { Store } from './js/lib/store.js';
    import { CommandBus } from './js/lib/command-bus.js';
    import { Deps } from './js/lib/deps.js';
    import { DBCore, mesaVacia } from './js/db-core.js';
    import { Auth } from './js/auth.js';
    import { inicializarAuth } from './js/auth.js';
    import { PedidoRepositoryLocal } from './js/repositorios/pedido-repository.js';
    import { PedidoManager } from './js/managers/pedido-manager.js';
    import { DBAppwrite } from './js/db-appwrite.js';
    import { DB } from './js/db.js';
    import './js/comandos/agregar-mesa.js';
    import './js/comandos/crear-pedido-mesa.js';
    import './js/comandos/liberar-mesa.js';
    import './js/comandos/enviar-comanda.js';
    import './js/comandos/completar-subcomanda.js';
    import { PedidoAgregado, reconstruirPedidoAgregado } from './js/dominio/pedido.js';
    import { Delivery, reconstruirDelivery } from './js/dominio/delivery.js';
    import { crearCantidad } from './js/dominio/cantidad.js';

    window.crearCantidad = crearCantidad;

    (function() {
      const resultsEl = document.getElementById('results');
      let passed = 0, failed = 0;
      const PREFIJO = 'testcore_';
      let sufijo = 0;
      function unico() { sufijo++; return PREFIJO + Date.now() + '_' + sufijo; }

      function assert(condition, msg) {
        if (condition) { passed++; resultsEl.innerHTML += '<div class="test pass">✔ ' + msg + '</div>'; }
        else { failed++; resultsEl.innerHTML += '<div class="test fail">✘ ' + msg + '</div>'; }
      }

      const esperar = ms => new Promise(r => setTimeout(r, ms));

      async function limpiarPrefijo() {
        try {
          const mesas = await DBAppwrite.listar('mesas');
          for (const m of mesas) { if (m.numero && m.numero.startsWith(PREFIJO)) await DBAppwrite.eliminar('mesas', m.numero); }
          const pedidos = await DBAppwrite.listar('pedidos');
          for (const p of pedidos) { if (p.id && p.id.startsWith(PREFIJO)) await DBAppwrite.eliminar('pedidos', p.id); }
          const comandas = await DBAppwrite.listar('comandas');
          for (const c of comandas) { if (c.id && c.id.startsWith(PREFIJO)) await DBAppwrite.eliminar('comandas', c.id); }
        } catch(e) {}
      }

      async function runTests() {
        Logger.setLevel('ERROR');
        await inicializarAuth();
        if (!(await Auth.iniciarSesion('master', 'master123'))) { resultsEl.innerHTML += '<div class="error">No se pudo autenticar como master.</div>'; return; }
        if (!(await DBAppwrite.iniciar())) { resultsEl.innerHTML += '<div class="error">Appwrite no disponible.</div>'; return; }

        await DB.init();
        PedidoManager.init({ pedidoRepo: PedidoRepositoryLocal });
        Deps.registrar('pedidoRepo', PedidoRepositoryLocal);
        await limpiarPrefijo();

        // Suite 1: agregarMesa (verificada con crearPedidoMesa)
        resultsEl.innerHTML += '<div class="suite"><h2>Comando: agregarMesa</h2></div>';
        const numMesa1 = unico();
        const r1 = await CommandBus.ejecutar({ type: 'agregarMesa', datos: { numero: numMesa1, zona: 'salon' } });
        assert(r1.exito === true, 'agregarMesa: crea mesa exitosamente');
        // Verificar que la mesa funciona abriendo un pedido sobre ella
        const pedidoVerif = await CommandBus.ejecutar({ type: 'crearPedidoMesa', datos: { numeroMesa: numMesa1, mozo: 'Test', comensales: 1 } });
        assert(pedidoVerif.exito === true, 'agregarMesa: se puede abrir pedido (mesa funcional)');
        await esperar(500);

        // Suite 2: crearPedidoMesa (falla controlada)
        resultsEl.innerHTML += '<div class="suite"><h2>Comando: crearPedidoMesa</h2></div>';
        const mesaInexistente = unico() + '_noexiste';
        const rFallo = await CommandBus.ejecutar({ type: 'crearPedidoMesa', datos: { numeroMesa: mesaInexistente, mozo: 'Test', comensales: 2 } });
        assert(!rFallo.exito, 'crearPedidoMesa: falla si mesa no existe');

        const numMesa2 = unico();
        await CommandBus.ejecutar({ type: 'agregarMesa', datos: { numero: numMesa2, zona: 'salon' } }); await esperar(500);
        const r2 = await CommandBus.ejecutar({ type: 'crearPedidoMesa', datos: { numeroMesa: numMesa2, mozo: 'Trini', comensales: 2 } });
        assert(r2.exito === true, 'crearPedidoMesa: crea pedido en mesa');
        await esperar(1000);
        const mesa2 = (await DBAppwrite.listar('mesas')).find(m => m.numero === numMesa2);
        assert(!!mesa2, 'crearPedidoMesa: mesa existe tras crear pedido');
        if (mesa2) { assert(mesa2.estado === 'ocupada', 'crearPedidoMesa: mesa pasa a ocupada'); assert(!!mesa2.pedidoId, 'crearPedidoMesa: mesa tiene pedidoId'); }

        // Suite 3: liberarMesa
        resultsEl.innerHTML += '<div class="suite"><h2>Comando: liberarMesa</h2></div>';
        assert((await CommandBus.ejecutar({ type: 'liberarMesa', datos: { numeroMesa: numMesa2 } })).exito === true, 'liberarMesa: libera mesa');
        await esperar(1000);
        const mesaLib = (await DBAppwrite.listar('mesas')).find(m => m.numero === numMesa2);
        assert(!!mesaLib, 'liberarMesa: mesa existe tras liberar');
        if (mesaLib) assert(mesaLib.estado === 'libre', 'liberarMesa: mesa vuelve a libre');

        // Suite 4: enviarComanda
        resultsEl.innerHTML += '<div class="suite"><h2>Comando: enviarComanda</h2></div>';
        const numMesa3 = unico();
        await CommandBus.ejecutar({ type: 'agregarMesa', datos: { numero: numMesa3, zona: 'salon' } }); await esperar(500);
        const rp3 = await CommandBus.ejecutar({ type: 'crearPedidoMesa', datos: { numeroMesa: numMesa3, mozo: 'Trini', comensales: 2 } });
        assert(rp3.exito, 'crearPedidoMesa para enviarComanda: exitoso');
        const itemPrueba = { prodId: 'prod_test', nombre: 'Hamburguesa', precio: 1500, qty: 1, destino: 'cocina', obs: '', enviado: false };
        await DB.actualizarPedido(rp3.data.id, { items: JSON.stringify([itemPrueba]) }); await esperar(500);
        const mesa3 = (await DBAppwrite.listar('mesas')).find(m => m.numero === numMesa3);
        assert(!!mesa3, 'enviarComanda: mesa existe');
        Deps.registrar('inventarioService', { validarStockParaArticulos: function() { return { ok: true, faltantes: [] }; } });
        const re = await CommandBus.ejecutar({ type: 'enviarComanda', datos: { mesa: mesa3, mozo: 'Trini', comensales: 2, observaciones: '', itemsPendientes: [itemPrueba] } });
        assert(re.exito === true, 'enviarComanda: envío exitoso');
        assert(re.data.comandas && re.data.comandas.length >= 1, 'enviarComanda: se creó al menos 1 comanda');
        await esperar(1000);
        const comEnApp = re.data.comandas ? (await DBAppwrite.listar('comandas')).find(c => c.id === re.data.comandas[0].id) : null;
        assert(!!comEnApp, 'enviarComanda: comanda existe en Appwrite');
        if (comEnApp) {
          assert(comEnApp.destino === 'cocina', 'enviarComanda: destino correcto');

          // Suite 5: completarSubcomanda
          resultsEl.innerHTML += '<div class="suite"><h2>Comando: completarSubcomanda</h2></div>';
          const rc = await CommandBus.ejecutar({ type: 'completarSubcomanda', datos: { idOriginal: comEnApp.id, destino: 'cocina' } });
          assert(rc.exito === true, 'Subcomanda cocina completada');
          assert(rc.data.ambasListas === true, 'Ambas listas (solo cocina)');
          await esperar(500);
          const comAct = (await DBAppwrite.listar('comandas')).find(c => c.id === comEnApp.id);
          if (comAct) assert(comAct.estado === 'completada', 'Comanda principal completada');
        }

        // Suite 6: Auth.registrarCliente
        resultsEl.innerHTML += '<div class="suite"><h2>Auth: registrarCliente</h2></div>';
        const nombreCli = unico();
        assert((await Auth.registrarCliente(nombreCli, 'testpass')).exito === true, 'Registro de cliente exitoso');
        const usuariosLocales = JSON.parse(localStorage.getItem('pubpos_usuarios') || '[]');
        localStorage.setItem('pubpos_usuarios', JSON.stringify(usuariosLocales.filter(u => u.nombre !== nombreCli)));

        // Suite 7: Normalización de productos
        resultsEl.innerHTML += '<div class="suite"><h2>Normalización: producto</h2></div>';
        const prod1 = DBCore._normalizarProducto({ nombre: 'Test', precio: 100 });
        assert(prod1.activo === true, 'Producto sin campo activo → por defecto true');
        assert(prod1.disponible === true, 'Producto sin campo disponible → por defecto true');

        // Suite 8: Normalización de mesas
        resultsEl.innerHTML += '<div class="suite"><h2>Normalización: mesa (nuevo esquema)</h2></div>';
        const mesaStr = DBCore._normalizarMesa({ numero: '1' });
        assert(mesaStr.numero === '1', 'Mesa con numero string se conserva');
        assert(mesaStr.estado === 'libre', 'Mesa sin estado → por defecto libre');
        assert(mesaStr.items === undefined, 'Mesa NO tiene campo items (eliminado)');
        assert(mesaStr.mozo === undefined, 'Mesa NO tiene campo mozo (eliminado)');

        // Suite 9: Fábrica mesaVacia
        resultsEl.innerHTML += '<div class="suite"><h2>Fábrica: mesaVacia (nuevo esquema)</h2></div>';
        const nueva = mesaVacia(50, 'salon');
        assert(nueva.numero === '50', 'mesaVacia: numero es string');
        assert(nueva.estado === 'libre', 'mesaVacia: estado libre');
        assert(nueva.esVirtual === false, 'mesaVacia: esVirtual = false');
        assert(nueva.items === undefined, 'mesaVacia: sin campo items');
        assert(nueva.mozo === undefined, 'mesaVacia: sin campo mozo');

        // Suite 10: Factories
        resultsEl.innerHTML += '<div class="suite"><h2>Factories: reconstruirPedidoAgregado y reconstruirDelivery</h2></div>';
        const pedRec = reconstruirPedidoAgregado({ id: 'ped_recon_test', mesa: 1, mozo: 'Trini', comensales: 2, items: [], descuento: 0, estado: 'abierto', observaciones: '' });
        assert(pedRec instanceof PedidoAgregado, 'reconstruirPedidoAgregado devuelve un PedidoAgregado');
        assert(pedRec.estado === 'abierto', 'El estado del pedido reconstruido es correcto');
        const delRec = reconstruirDelivery({ id: 'del_recon_test', direccion: { calle: 'Corrientes', numero: '1234' }, repartidor: 'Alex', items: [], estado: 'pendiente', observaciones: '' });
        assert(delRec instanceof Delivery, 'reconstruirDelivery devuelve un Delivery');
        assert(delRec.estado === 'pendiente', 'El estado del delivery reconstruido es correcto');

        await limpiarPrefijo();

        resultsEl.innerHTML += '<div class="summary">' + passed + ' pasaron, ' + failed + ' fallaron</div>';
        if (failed === 0) resultsEl.innerHTML += '<div class="test pass">✔ Todos los tests del Core pasaron (sin mocks).</div>';
      }

      window.addEventListener('load', () => runTests().catch(e => { resultsEl.innerHTML += '<div class="error">Error en tests: ' + e.message + '</div>'; }));
    })();
  </script>
</body>
</html>
