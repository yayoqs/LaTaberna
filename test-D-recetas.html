<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test Verificar Colección Menus (v3.0.1-fix)</title>
  <style>
    body { font-family: monospace; background: #1a1a24; color: #f1f5f9; padding: 20px; }
    h1 { color: #f59e0b; }
    .pass { color: #22c55e; }
    .fail { color: #ef4444; }
    .info { color: #94a3b8; }
    pre { background: #111; padding: 10px; white-space: pre-wrap; word-wrap: break-word; font-size: 11px; }
  </style>
</head>
<body>
  <h1>🧪 Test de verificación – Colección menus (v3.0.1-fix)</h1>
  <div id="resultado"></div>

  <script src="js/appwrite.min.js"></script>

  <script type="module">
    import { Logger } from './js/lib/logger.js';
    import { DBAppwrite } from './js/db-appwrite.js';
    
    const resultado = document.getElementById('resultado');
    Logger.setLevel('ERROR');

    function log(msg, tipo = 'info') {
      const clase = tipo === 'pass' ? 'pass' : tipo === 'fail' ? 'fail' : 'info';
      resultado.innerHTML += `<div class="${clase}">${msg}</div>`;
    }

    async function runTest() {
      log('🧪 Iniciando verificación de la colección menus...');

      // 1. Verificar mapeo en COLECCIONES (acepta ambos nombres)
      const nombreMapeado = DBAppwrite.COLECCIONES.menus;
      const esValido = nombreMapeado === 'Menus' || nombreMapeado === 'laTaberna_Menus';
      log(`1. Mapeo en COLECCIONES: ${esValido ? '✅' : '❌'} (${nombreMapeado})`, esValido ? 'pass' : 'fail');

      // 2. Inicializar Appwrite
      try {
        const ok = await DBAppwrite.iniciar();
        log(`2. ¿DBAppwrite.iniciar() exitoso?: ${ok ? '✅' : '❌'}`, ok ? 'pass' : 'fail');
        if (!ok) {
          log('No se pudo iniciar Appwrite. Revisa la conexión.', 'fail');
          return;
        }
      } catch (e) {
        log(`2. Error al iniciar: ${e.message}`, 'fail');
        return;
      }

      // 3. Listar documentos
      try {
        const lista = await DBAppwrite.listar('menus');
        const esArray = Array.isArray(lista);
        log(`3. ¿listar() retorna array?: ${esArray ? '✅' : '❌'}`, esArray ? 'pass' : 'fail');
        log(`   Documentos: ${lista.length}`, 'info');
      } catch (e) {
        log(`3. ❌ Error al listar menus: ${e.message}`, 'fail');
      }

      // 4. CRUD completo con nuevos campos
      try {
        const creado = await DBAppwrite.crear('menus', null, {
          nombre: 'Test v3.0.1-fix',
          estado: 'borrador',
          productos: '[]',
          fondo: '#1a1a2e',
          tipografia: "'Inter', sans-serif",
          grilla: false,
          creadoPor: 'Sistema'
        });
        const crearOk = creado && creado.id;
        log(`4. ¿crear() exitoso?: ${crearOk ? '✅' : '❌'} ${creado?.id || ''}`, crearOk ? 'pass' : 'fail');

        if (creado && creado.id) {
          // Verificar campos nuevos
          const listaVerif = await DBAppwrite.listar('menus');
          const docVerif = listaVerif.find(m => m.id === creado.id);
          if (docVerif) {
            const estadoOk = docVerif.estado === 'borrador';
            const fondoOk = docVerif.fondo === '#1a1a2e';
            const tipografiaOk = docVerif.tipografia === "'Inter', sans-serif";
            const grillaOk = docVerif.grilla === false;
            const camposOk = estadoOk && fondoOk && tipografiaOk && grillaOk;
            log(`   ¿Campos nuevos correctos?: ${camposOk ? '✅' : '❌'} (estado:${estadoOk} fondo:${fondoOk} tipografia:${tipografiaOk} grilla:${grillaOk})`, camposOk ? 'pass' : 'fail');
          }

          const eliminado = await DBAppwrite.eliminar('menus', creado.id);
          log(`   ¿eliminar() exitoso?: ${eliminado ? '✅' : '❌'}`, eliminado ? 'pass' : 'fail');
        }
      } catch (e) {
        log(`4. ❌ Error en CRUD de menus: ${e.message}`, 'fail');
      }

      log('🧪 Test finalizado.');
    }

    runTest();
  </script>
</body>
</html>
