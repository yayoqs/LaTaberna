<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test A — Diagnóstico Appwrite (TablesDB)</title>
  <style>
    body { font-family: monospace; background: #1a1a24; color: #f1f5f9; padding: 20px; }
    h1 { color: #f59e0b; }
    h2 { color: #94a3b8; margin-top: 24px; }
    .suite { margin-bottom: 16px; border-bottom: 1px solid #2e2e42; padding-bottom: 8px; }
    .test { margin: 4px 0; padding: 4px 8px; border-radius: 4px; }
    .pass { background: rgba(34,197,94,.2); }
    .fail { background: rgba(239,68,68,.2); }
    .summary { margin-top: 20px; font-weight: bold; }
    .info { color: #94a3b8; font-size: 12px; margin: 2px 0; }
    button { margin-top: 16px; padding: 12px 24px; background: #f59e0b; color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <h1>🧪 Test A — Diagnóstico Appwrite (TablesDB)</h1>
  <p class="info">Verifica conexión, listado de colecciones (incluidas las nuevas y globales), CRUD e integración con Store.</p>
  <div id="results"></div>
  <button onclick="location.reload()">🔄 Ejecutar de nuevo</button>

  <script src="/js/appwrite.min.js"></script>

  <script type="module">
    import { Logger } from './js/lib/logger.js';
    import { EventBus } from './js/lib/eventBus.js';
    import { Store } from './js/lib/store.js';
    import { DBAppwrite } from './js/db-appwrite.js';
    import { DB } from './js/db.js';
    import { Auth } from './js/auth.js';
    import { inicializarAuth } from './js/auth.js';

    (function() {
      const resultsEl = document.getElementById('results');
      let passed = 0, failed = 0;

      function assert(condition, msg) {
        if (condition) {
          passed++;
          resultsEl.innerHTML += '<div class="test pass">✔ ' + msg + '</div>';
        } else {
          failed++;
          resultsEl.innerHTML += '<div class="test fail">✘ ' + msg + '</div>';
        }
      }

      function logInfo(msg) {
        resultsEl.innerHTML += '<div class="info">' + msg + '</div>';
      }

      async function runTests() {
        resultsEl.innerHTML = '';
        Logger.setLevel('ERROR');

        // ── Suite 0: Autenticación ───────────────────────
        resultsEl.innerHTML += '<h2>0. Autenticación (master)</h2>';
        await inicializarAuth();
        const loginOk = await Auth.iniciarSesion('master', 'master123');
        assert(loginOk === true, 'Login como master exitoso');
        if (!loginOk) {
          resultsEl.innerHTML += '<div class="fail">No se pudo autenticar como master.</div>';
          return;
        }
        assert(Auth.obtenerRol() === 'master', 'Rol master confirmado');

        // ── Suite 1: Iniciar DBAppwrite ──────────────────
        resultsEl.innerHTML += '<h2>1. Iniciar DBAppwrite (TablesDB)</h2>';
        const appwriteOk = await DBAppwrite.iniciar();
        assert(appwriteOk === true, 'DBAppwrite.iniciar() exitoso');
        assert(DBAppwrite.habilitado === true, 'DBAppwrite.habilitado = true');
        if (!appwriteOk) {
          resultsEl.innerHTML += '<div class="fail">No se pudo conectar a Appwrite.</div>';
          return;
        }

        // ── Suite 2: Listar colecciones activas ──────────
        resultsEl.innerHTML += '<h2>2. Listar colecciones activas (14)</h2>';
        const colecciones = [
          'productos', 'pedidos', 'mesas', 'comandas',
          'insumos', 'recetas', 'staff', 'configuracion',
          'eventos_en_vivo', 'menus', 'proveedores',
          'entradas', 'comensales',
          'global_perfiles', 'global_puntos', 'global_eventos', 'global_espacios'
        ];

        const resultados = {};
        await Promise.all(colecciones.map(function(col) {
          return DBAppwrite.listar(col).then(function(lista) {
            resultados[col] = lista;
          }).catch(function(e) {
            resultados[col] = { error: e.message };
          });
        }));

        for (let i = 0; i < colecciones.length; i++) {
          const col = colecciones[i];
          const lista = resultados[col];
          if (lista && Array.isArray(lista)) {
            assert(true, col + ': ' + lista.length + ' documentos');
          } else {
            assert(false, col + ': Error - ' + (lista?.error || 'desconocido'));
          }
        }

        // ── Suite 3: CRUD básico en pedidos ─────────────
        resultsEl.innerHTML += '<h2>3. CRUD básico en pedidos (nuevo modelo)</h2>';
        try {
          const doc = {
            mesa: '999',
            tipo: 'local',
            origen: 'staff',
            mozo: 'Test',
            comensales: 1,
            estado: 'abierta',
            items: '[]',
            total: 0,
            transacciones: '[]'
          };
          const creado = await DBAppwrite.crear('pedidos', 'unique()', doc);
          assert(!!creado && !!creado.id, 'Pedido creado: ' + (creado ? creado.id : 'falló'));
          const leido = await DBAppwrite.listar('pedidos').then(l => l.find(p => p.id === creado.id));
          assert(leido && leido.tipo === 'local', 'Lectura correcta (tipo = local)');
          assert(leido && leido.origen === 'staff', 'Lectura correcta (origen = staff)');
          await DBAppwrite.eliminar('pedidos', creado.id);
          assert(true, 'Pedido eliminado');
        } catch(e) {
          assert(false, 'Error CRUD: ' + e.message);
        }

        // ── Suite 4: Integración con Store ───────────────
        resultsEl.innerHTML += '<h2>4. Integración Appwrite → Store</h2>';

        const productos = resultados.productos || [];
        const pedidos = resultados.pedidos || [];
        const mesas = resultados.mesas || [];
        const insumos = resultados.insumos || [];
        const recetas = resultados.recetas || [];

        DB.productos = productos.map(p => DB._normalizarProducto(p));
        DB.pedidos = pedidos;
        DB.mesas = mesas.length ? mesas.map(m => DB._normalizarMesa(m)) : DB.mesas;
        DB.insumos = insumos.map(i => DB._normalizarInsumo(i));
        DB.recetas = recetas;

        Store.despachar({ type: 'PRODUCTOS_INICIALIZAR', payload: DB.productos });
        Store.despachar({ type: 'PEDIDOS_INICIALIZAR', payload: DB.pedidos });
        Store.despachar({ type: 'MESAS_INICIALIZAR', payload: DB.mesas });
        Store.despachar({ type: 'INGREDIENTES_INICIALIZAR', payload: DB.insumos });
        Store.despachar({ type: 'RECETAS_INICIALIZAR', payload: DB.recetas });

        const state = Store.obtenerEstado();
        assert(state.productos.length === productos.length, 'Store tiene ' + state.productos.length + ' productos');
        assert(state.pedidos.length === pedidos.length, 'Store tiene ' + state.pedidos.length + ' pedidos');
        assert(state.ingredientes.length === insumos.length, 'Store tiene ' + state.ingredientes.length + ' insumos');
        assert(state.recetas.length === recetas.length, 'Store tiene ' + state.recetas.length + ' recetas');

        if (productos.length === 0 && pedidos.length === 0 && mesas.length === 0) {
          logInfo('⚠️ Todas las colecciones están vacías. ¿Ejecutaste la migración inicial?');
        }

        // ── Suite 5: Verificar colecciones nuevas ────────
        resultsEl.innerHTML += '<h2>5. Colecciones nuevas (post-migración)</h2>';
        const entradas = resultados.entradas || [];
        const comensales = resultados.comensales || [];
        assert(Array.isArray(entradas), 'entradas: ' + entradas.length + ' documentos');
        assert(Array.isArray(comensales), 'comensales: ' + comensales.length + ' documentos');

        const staff = resultados.staff || [];
        assert(Array.isArray(staff), 'staff: ' + staff.length + ' documentos');

        // ── Suite 6: Verificar colecciones globales ──────
        resultsEl.innerHTML += '<h2>6. Colecciones globales</h2>';
        const perfiles = resultados.global_perfiles || [];
        const puntos = resultados.global_puntos || [];
        const eventosGlobales = resultados.global_eventos || [];
        const espacios = resultados.global_espacios || [];
        assert(Array.isArray(perfiles), 'global_perfiles: ' + perfiles.length + ' perfiles');
        assert(Array.isArray(puntos), 'global_puntos: ' + puntos.length + ' registros');
        assert(Array.isArray(eventosGlobales), 'global_eventos: ' + eventosGlobales.length + ' eventos');
        assert(Array.isArray(espacios), 'global_espacios: ' + espacios.length + ' espacios');

        // ── Resumen ──────────────────────────────────────
        resultsEl.innerHTML += '<h2>Resultado</h2>';
        resultsEl.innerHTML += '<p>' + passed + ' pasaron, ' + failed + ' fallaron.</p>';
        if (failed === 0) {
          resultsEl.innerHTML += '<div class="test pass">✔ Appwrite operativo, Store sincronizado y colecciones migradas.</div>';
        }
      }

      window.addEventListener('load', function() {
        setTimeout(runTests, 500);
      });
    })();
  </script>
</body>
</html>
