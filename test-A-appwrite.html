<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test A — Diagnóstico Appwrite (TablesDB)</title>
  <style>
    body { font-family: monospace; background: #1a1a24; color: #f1f5f9; padding: 20px; }
    h1 { color: #f59e0b; }
    h2 { color: #94a3b8; margin-top: 24px; }
    .suite { margin-bottom: 16px; border-bottom: 1px solid #2e2e42; padding-bottom: 8px; }
    .test { margin: 4px 0; padding: 4px 8px; border-radius: 4px; }
    .pass { background: rgba(34,197,94,.2); }
    .fail { background: rgba(239,68,68,.2); }
    .summary { margin-top: 20px; font-weight: bold; }
    .info { color: #94a3b8; font-size: 12px; margin: 2px 0; }
    button { margin-top: 16px; padding: 12px 24px; background: #f59e0b; color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <h1>🧪 Test A — Diagnóstico Appwrite (TablesDB)</h1>
  <p class="info">Verifica conexión, listado de colecciones (incluidas las nuevas y globales), CRUD e integración con Store.</p>
  <div id="results"></div>
  <button onclick="location.reload()">🔄 Ejecutar de nuevo</button>

  <!-- Solo el SDK de Appwrite como script global -->
  <script src="/js/appwrite.min.js"></script>

  <script type="module">
    import { Logger } from './js/lib/logger.js';
    import { EventBus } from './js/lib/eventBus.js';
    import { Store } from './js/lib/store.js';
    import { DBAppwrite } from './js/db-appwrite.js';
    import { DB } from './js/db.js';

    (function() {
      var resultsEl = document.getElementById('results');
      var passed = 0, failed = 0;

      function assert(condition, msg) {
        if (condition) {
          passed++;
          resultsEl.innerHTML += '<div class="test pass">✔ ' + msg + '</div>';
        } else {
          failed++;
          resultsEl.innerHTML += '<div class="test fail">✘ ' + msg + '</div>';
        }
      }

      async function runTests() {
        resultsEl.innerHTML = '';
        Logger.setLevel('ERROR');

        // ── Suite 1: Iniciar DBAppwrite ──────────────────
        resultsEl.innerHTML += '<h2>1. Iniciar DBAppwrite (TablesDB)</h2>';
        var appwriteOk = await DBAppwrite.iniciar();
        assert(appwriteOk === true, 'DBAppwrite.iniciar() exitoso');
        assert(DBAppwrite.habilitado === true, 'DBAppwrite.habilitado = true');
        if (!appwriteOk) {
          resultsEl.innerHTML += '<div class="fail">No se pudo conectar a Appwrite.</div>';
          return;
        }

        // Mock de Auth con los nombres actuales de las funciones
        window.Auth = {
          obtenerEspacioActivo: function() { return { id: 'esp_taberna' }; },
          getEspacioActivo: function() { return { id: 'esp_taberna' }; } // alias por si acaso
        };

        // ── Suite 2: Listar colecciones (paralelo) ───────
        resultsEl.innerHTML += '<h2>2. Listar colecciones (paralelo)</h2>';
        var colecciones = [
          'productos', 'pedidos', 'mesas', 'comandas',
          'ingredientes', 'recetas', 'pedidos_delivery',
          'usuarios', 'configuracion', 'precargas_cliente',
          'eventos_en_vivo', 'menus', 'proveedores',
          'global_perfiles', 'global_puntos', 'global_eventos', 'global_espacios'
        ];

        var resultados = {};
        await Promise.all(colecciones.map(function(col) {
          return DBAppwrite.listar(col).then(function(lista) {
            resultados[col] = lista;
          }).catch(function(e) {
            resultados[col] = { error: e.message };
          });
        }));

        for (var i = 0; i < colecciones.length; i++) {
          var col = colecciones[i];
          var lista = resultados[col];
          if (lista && Array.isArray(lista)) {
            assert(true, col + ': ' + lista.length + ' documentos');
          } else {
            assert(false, col + ': Error - ' + (lista?.error || 'desconocido'));
          }
        }

        // ── Suite 3: CRUD básico ─────────────────────────
        resultsEl.innerHTML += '<h2>3. CRUD básico en pedidos</h2>';
        try {
          var doc = {
            mesa: 999, mozo: 'Test', comensales: 1, estado: 'abierta',
            items: '[]', total: 0
          };
          var creado = await DBAppwrite.crear('pedidos', 'unique()', doc);
          assert(!!creado && !!creado.id, 'Documento creado: ' + (creado ? creado.id : 'falló'));
          var leido = await DBAppwrite.listar('pedidos').then(l => l.find(p => p.id === creado.id));
          assert(leido && leido.mesa === 999, 'Lectura correcta');
          await DBAppwrite.eliminar('pedidos', creado.id);
          assert(true, 'Documento eliminado');
        } catch(e) {
          assert(false, 'Error CRUD: ' + e.message);
        }

        // ── Suite 4: Integración con Store ───────────────
        resultsEl.innerHTML += '<h2>4. Integración Appwrite → Store</h2>';
        // El mock de Auth ya está definido arriba
        window.PedidoManager = window.PedidoManager || { getTurnoActual: function() { return { id: 'test', estado: 'abierto' }; }, registrar: function() {} };

        var productos = resultados.productos || [];
        var pedidos = resultados.pedidos || [];
        var mesas = resultados.mesas || [];
        var ingredientes = resultados.ingredientes || [];
        var recetas = resultados.recetas || [];

        DB.productos = productos.map(p => DB._normalizarProducto(p));
        DB.pedidos = pedidos;
        DB.mesas = mesas.length ? mesas.map(m => DB._normalizarMesa(m)) : DB.mesas;
        DB.ingredientes = ingredientes.map(i => DB._normalizarIngrediente(i));
        DB.recetas = recetas;

        Store.dispatch({ type: 'PRODUCTOS_INICIALIZAR', payload: DB.productos });
        Store.dispatch({ type: 'PEDIDOS_INICIALIZAR', payload: DB.pedidos });
        Store.dispatch({ type: 'MESAS_INICIALIZAR', payload: DB.mesas });
        Store.dispatch({ type: 'INGREDIENTES_INICIALIZAR', payload: DB.ingredientes });
        Store.dispatch({ type: 'RECETAS_INICIALIZAR', payload: DB.recetas });

        var state = Store.getState();
        assert(state.productos.length === productos.length, 'Store tiene ' + state.productos.length + ' productos');
        assert(state.pedidos.length === pedidos.length, 'Store tiene ' + state.pedidos.length + ' pedidos');
        assert(state.ingredientes.length === ingredientes.length, 'Store tiene ingredientes');
        assert(state.recetas.length === recetas.length, 'Store tiene recetas');

        if (productos.length === 0 && pedidos.length === 0 && mesas.length === 0) {
          resultsEl.innerHTML += '<div class="info">⚠️ Todas las colecciones están vacías. ¿Ejecutaste la migración inicial?</div>';
        }

        // ── Resumen ──────────────────────────────────────
        resultsEl.innerHTML += '<h2>Resultado</h2>';
        resultsEl.innerHTML += '<p>' + passed + ' pasaron, ' + failed + ' fallaron.</p>';
        if (failed === 0) {
          resultsEl.innerHTML += '<div class="test pass">✔ Appwrite operativo y Store sincronizado.</div>';
        }
      }

      window.addEventListener('load', function() {
        setTimeout(runTests, 500);
      });
    })();
  </script>
</body>
</html>
