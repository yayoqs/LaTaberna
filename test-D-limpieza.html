<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test D — Limpieza General de Datos de Prueba</title>
  <link rel="stylesheet" href="css/vars.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/modals.css">
  <script src="js/appwrite.min.js"></script>
  <style>
    body {
      background: #0f0f14;
      color: #f1f5f9;
      font-family: 'Nunito', system-ui, sans-serif;
      padding: 20px;
    }
    .panel-test {
      background: #1a1a24;
      border: 1px solid #2e2e42;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .panel-test h2 {
      font-size: 18px;
      margin: 0 0 12px;
    }
    select, button {
      background: #252535;
      border: 1px solid #2e2e42;
      color: #f1f5f9;
      border-radius: 8px;
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      outline: none;
    }
    button:hover { border-color: #f59e0b; color: #f59e0b; }
    .btn-eliminar {
      background: #ef4444;
      border: none;
      color: #fff;
      border-radius: 20px;
      padding: 10px 20px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 12px;
    }
    .btn-eliminar:disabled {
      opacity: .4;
      cursor: not-allowed;
    }
    .data-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: #252535;
      border: 1px solid #2e2e42;
      border-radius: 8px;
      margin-bottom: 6px;
    }
    .data-row label {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      cursor: pointer;
    }
    .data-row input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: #f59e0b;
    }
    .data-row .info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .data-row .info .titulo {
      font-weight: 700;
    }
    .data-row .info .detalle {
      font-size: 11px;
      color: #94a3b8;
    }
    .log-positivo { color: #22c55e; font-weight: 700; }
    .log-error { color: #ef4444; font-weight: 700; }
    .log-info { color: #60a5fa; font-weight: 700; }
  </style>
</head>
<body>
  <div class="panel-test">
    <h2>Test D — Limpieza General de Datos de Prueba</h2>
    <div id="logTest"></div>

    <div style="display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap;">
      <label for="selectColeccion">Colección:</label>
      <select id="selectColeccion">
        <option value="productos">Productos</option>
        <option value="pedidos">Pedidos</option>
        <option value="comandas">Comandas</option>
        <option value="mesas">Mesas</option>
        <option value="insumos">Insumos</option>
        <option value="recetas">Recetas</option>
        <option value="proveedores">Proveedores</option>
        <option value="entradas">Entradas</option>
        <option value="menus">Menús</option>
        <option value="eventos_en_vivo">Eventos en vivo</option>
      </select>
      <button id="btnCargar">Cargar registros</button>
    </div>

    <div id="listaRegistros"></div>

    <button class="btn-eliminar" id="btnEliminarSeleccionados" disabled>Eliminar seleccionados</button>
  </div>

  <script type="module">
    import { Auth } from './js/auth.js';
    import { DB } from './js/db.js';
    import { DBAppwrite } from './js/db-appwrite.js';
    import { Logger } from './js/lib/logger.js';

    Logger.setLevel('ERROR');

    const log = document.getElementById('logTest');
    const selectColeccion = document.getElementById('selectColeccion');
    const btnCargar = document.getElementById('btnCargar');
    const listaRegistros = document.getElementById('listaRegistros');
    const btnEliminar = document.getElementById('btnEliminarSeleccionados');

    function agregarInfo(msg) {
      const div = document.createElement('div');
      div.className = 'log-info';
      div.textContent = msg;
      log.appendChild(div);
    }

    function agregarResultado(msg, ok) {
      const div = document.createElement('div');
      div.className = ok ? 'log-positivo' : 'log-error';
      div.textContent = `${ok ? '✅' : '❌'} ${msg}`;
      log.appendChild(div);
    }

    // Patrones para identificar datos de prueba
    function esSospechoso(item) {
      const texto = JSON.stringify(item).toLowerCase();
      const patrones = [
        'test', 'prueba', 'prueba automática', 'test_', 'ped_test', 'kds_test',
        'testcore', 'test_flujo', 'testflujo', 'prov test', 'receta test',
        'intermedia test', 'insumo test', 'staff test', 'admin test', 'gerente test',
        'mesero test', 'staff temporal', 'mesa 997', 'mesa 999', 'test_mesa',
        'test pedido', 'test producto', 'test receta', 'test entrada', 'test menu',
        'test evento', 'test proveedor', 'test staff', 'test local', 'test global'
      ];
      return patrones.some(p => texto.includes(p));
    }

    function actualizarBoton() {
      const seleccionados = listaRegistros.querySelectorAll('input[type="checkbox"]:checked');
      btnEliminar.disabled = seleccionados.length === 0;
      btnEliminar.textContent = seleccionados.length > 0
        ? `Eliminar seleccionados (${seleccionados.length})`
        : 'Eliminar seleccionados';
    }

    async function autenticarMaster() {
      await DB.init();
      await Auth.cerrarSesion();
      const login = await Auth.iniciarSesion('master', 'master123');
      if (!login) {
        agregarResultado('No se pudo autenticar como master', false);
        return false;
      }
      return true;
    }

    async function cargarRegistros() {
      const coleccion = selectColeccion.value;
      agregarInfo(`Cargando registros de ${coleccion}...`);
      listaRegistros.innerHTML = '<p style="color:#94a3b8;">Cargando...</p>';
      btnEliminar.disabled = true;

      try {
        const registros = await DBAppwrite.listar(coleccion);
        agregarInfo(`Se encontraron ${registros.length} registros.`);
        listaRegistros.innerHTML = '';

        if (registros.length === 0) {
          listaRegistros.innerHTML = '<p style="color:#94a3b8;">No hay registros en esta colección.</p>';
          return;
        }

        registros.forEach(item => {
          const row = document.createElement('div');
          row.className = 'data-row';

          const nombreMostrar = item.nombre || item.mesa || item.titulo || item.clave || item.id || 'Sin nombre';
          const detalle = `${item.id} · ${item.estado || item.tipo || item.destino || item.fecha || ''}`;

          const esPrueba = esSospechoso(item);

          row.innerHTML = `
            <label>
              <input type="checkbox" ${esPrueba ? 'checked' : ''} data-id="${item.id}">
              <div class="info">
                <span class="titulo">${nombreMostrar}</span>
                <span class="detalle">${detalle}</span>
              </div>
            </label>
          `;
          listaRegistros.appendChild(row);
        });

        actualizarBoton();
        agregarResultado('Registros cargados correctamente', true);
      } catch (e) {
        agregarResultado(`Error al cargar ${coleccion}: ${e.message}`, false);
        listaRegistros.innerHTML = '';
      }
    }

    btnCargar.addEventListener('click', cargarRegistros);

    listaRegistros.addEventListener('change', (e) => {
      if (e.target.matches('input[type="checkbox"]')) {
        actualizarBoton();
      }
    });

    btnEliminar.addEventListener('click', async () => {
      const coleccion = selectColeccion.value;
      const seleccionados = [...listaRegistros.querySelectorAll('input[type="checkbox"]:checked')];
      if (seleccionados.length === 0) return;

      const confirmar = confirm(`¿Eliminar ${seleccionados.length} registro(s) de ${coleccion}?`);
      if (!confirmar) return;

      btnEliminar.disabled = true;
      let eliminados = 0;

      for (const checkbox of seleccionados) {
        const id = checkbox.dataset.id;
        try {
          const ok = await DBAppwrite.eliminar(coleccion, id);
          if (ok) eliminados++;
          else agregarResultado(`No se pudo eliminar ${id}`, false);
        } catch (e) {
          agregarResultado(`Error al eliminar ${id}: ${e.message}`, false);
        }
      }

      agregarResultado(`Se eliminaron ${eliminados} de ${seleccionados.length} registros seleccionados.`, eliminados === seleccionados.length);
      await cargarRegistros();
    });

    window.addEventListener('load', async () => {
      log.innerHTML = '';
      const authOk = await autenticarMaster();
      if (authOk) {
        agregarResultado('Autenticado como master', true);
        await cargarRegistros();
      }
    });
  </script>
</body>
</html>
