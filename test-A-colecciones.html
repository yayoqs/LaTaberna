<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test Rápido – SDK TablesDB</title>
  <style>
    body { font-family: monospace; background: #1a1a24; color: #f1f5f9; padding: 20px; }
    h1 { color: #f59e0b; }
    h2 { color: #94a3b8; margin-top: 24px; }
    pre { background: #111; padding: 10px; white-space: pre-wrap; word-wrap: break-word; font-size: 11px; }
    .pass { background: rgba(34,197,94,.2); }
    .fail { background: rgba(239,68,68,.2); }
    .info { color: #94a3b8; font-size: 12px; margin: 2px 0; }
    .test { margin: 4px 0; padding: 4px 8px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>🧪 Test Rápido – SDK TablesDB</h1>
  <p class="info">Verifica que la nueva API listRows devuelve los mismos datos.</p>
  <div id="resultado">
    <p>⏳ Iniciando Appwrite...</p>
  </div>

  <script src="/js/appwrite.min.js"></script>

  <script type="module">
    import { Logger } from './js/lib/logger.js';
    import { DBAppwrite } from './js/db-appwrite.js';
    import { Auth } from './js/auth.js';
    import { inicializarAuth } from './js/auth.js';

    (async function() {
      const resultado = document.getElementById('resultado');
      Logger.setLevel('ERROR');

      try {
        // Autenticación
        await inicializarAuth();
        const loginOk = await Auth.iniciarSesion('master', 'master123');
        if (!loginOk) {
          resultado.innerHTML = '<p class="fail">❌ No se pudo autenticar como master.</p>';
          return;
        }
        resultado.innerHTML += '<p class="pass">✔ Autenticado como master.</p>';

        // Iniciar Appwrite
        const ok = await DBAppwrite.iniciar();
        if (!ok) {
          resultado.innerHTML += '<p class="fail">❌ No se pudo iniciar DBAppwrite. Revisá la conexión.</p>';
          return;
        }
        resultado.innerHTML += '<p class="pass">✔ DBAppwrite.iniciar() exitoso.</p>';

        // Colecciones activas
        const colecciones = [
          'productos', 'pedidos', 'mesas', 'comandas',
          'insumos', 'recetas', 'staff', 'configuracion',
          'eventos_en_vivo', 'menus', 'proveedores',
          'entradas', 'comensales',
          'global_perfiles', 'global_puntos', 'global_eventos', 'global_espacios'
        ];

        for (let i = 0; i < colecciones.length; i++) {
          const col = colecciones[i];
          try {
            const datos = await DBAppwrite.listar(col);
            resultado.innerHTML += '<h2>' + col + ' (' + datos.length + ' documentos)</h2>';
            if (datos.length > 0) {
              resultado.innerHTML += '<pre>' + JSON.stringify(datos.slice(0, 2), null, 2) + '</pre>';
              const primero = datos[0];
              if (primero.creadoEn && primero.actualizadoEn) {
                resultado.innerHTML += '<p class="test pass">✔ Timestamps en español presentes.</p>';
              } else {
                resultado.innerHTML += '<p class="test fail">❌ Faltan creadoEn/actualizadoEn.</p>';
              }
            } else {
              resultado.innerHTML += '<p class="info">(colección vacía)</p>';
            }
          } catch (e) {
            resultado.innerHTML += '<h2>' + col + '</h2><p class="fail">Error: ' + e.message + '</p>';
          }
        }

        resultado.innerHTML += '<h2>✔ Test finalizado.</h2>';
      } catch (e) {
        resultado.innerHTML = '<p class="fail">Error general: ' + e.message + '</p>';
      }
    })();
  </script>
</body>
</html>
