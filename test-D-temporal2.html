<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test Temporal — Error 401 en perfil global</title>
  <style>
    body { font-family: monospace; background: #111827; color: #f9fafb; padding: 30px; line-height: 1.5; }
    h1 { color: #f59e0b; }
    button { background: #f59e0b; color: #000; border: none; padding: 12px 24px; font-weight: bold; border-radius: 6px; cursor: pointer; font-family: monospace; margin: 10px 0; }
    .test { margin: 6px 0; padding: 8px 12px; border-radius: 6px; }
    .pass { background: rgba(16,185,129,.15); border-left: 4px solid #10b981; }
    .fail { background: rgba(239,68,68,.15); border-left: 4px solid #ef4444; }
    .info { background: rgba(59,130,246,.15); border-left: 4px solid #3b82f6; }
    pre { background: #000; padding: 12px; white-space: pre-wrap; word-wrap: break-word; border-radius: 6px; font-size: 12px; margin: 8px 0; }
  </style>
</head>
<body>
  <h1>🧪 Test Temporal — Error 401 en perfil global</h1>
  <p>Aísla qué consulta exacta genera el error 401 con la sesión autenticada.</p>

  <button id="btnProbar">⚡ Probar diagnóstico</button>

  <div id="resultado"></div>

  <script src="/js/appwrite.min.js"></script>

  <script type="module">
    import { Logger } from './js/lib/logger.js';
    import { DBAppwrite } from './js/db-appwrite.js';
    import { Auth } from './js/auth.js';
    import { inicializarAuth } from './js/auth.js';

    const resultado = document.getElementById('resultado');

    function agregar(tipo, msg) {
      const div = document.createElement('div');
      div.className = tipo;
      div.textContent = msg;
      resultado.appendChild(div);
    }

    async function probar() {
      resultado.innerHTML = '';
      Logger.setLevel('ERROR');

      await inicializarAuth();
      await DBAppwrite.iniciar();

      // 1. Login master
      try { await Auth.cerrarSesion(); } catch {}
      await Auth.iniciarSesion('master', 'master123');
      agregar('info', 'Master autenticado');

      // 2. Registrar staff temporal
      const nombreUsuario = 'test_401_' + Date.now();
      const password = 'pass12345';
      const reg = await Auth.registrarUsuario(nombreUsuario, password);
      if (!reg.exito) {
        agregar('fail', 'No se pudo registrar usuario staff');
        return;
      }
      const usuarioId = reg.usuarioId;
      agregar('info', 'Usuario staff registrado: ' + usuarioId);

      // 3. Crear staff con roles y token
      const token = 'tk_401_' + Date.now();
      const staffCreado = await DBAppwrite.crear('staff', 'unique()', {
        nombre: nombreUsuario,
        usuarioId,
        espacioId: 'lataberna',
        roles: JSON.stringify(['mesero']),
        rolPrincipal: 'mesero',
        estado: 'activo',
        fechaIngreso: new Date().toISOString(),
        telefono: '',
        email: '',
        notas: '',
        tokenVinculacion: token
      });
      if (!staffCreado) {
        agregar('fail', 'No se pudo crear staff');
        return;
      }
      agregar('pass', 'Staff creado');

      // 4. Login como staff
      await Auth.cerrarSesion();
      await Auth.iniciarSesion(nombreUsuario, password);
      agregar('info', 'Staff autenticado');

      const usuarioIdActual = await Auth.obtenerIdUsuarioAppwrite();
      agregar('info', 'userId de sesión actual: ' + usuarioIdActual);

      // 5. Consulta directa a global_perfiles
      agregar('info', 'Consultando global_perfiles con DBAppwrite...');
      try {
        const perfiles = await DBAppwrite.listar('global_perfiles');
        agregar('pass', 'listar global_perfiles: OK (' + perfiles.length + ' filas)');
        const encontrado = perfiles.find(p => p.usuarioId === usuarioIdActual);
        if (encontrado) agregar('pass', 'Se encontró el perfil del usuario actual');
        else agregar('fail', 'No se encontró el perfil del usuario actual en la lista');
      } catch (e) {
        agregar('fail', 'Error al listar global_perfiles: ' + e.message);
        agregar('fail', 'Code: ' + e.code);
        if (e.response) agregar('fail', 'Response: ' + e.response);
      }

      // 6. Consulta específica por usuarioId
      agregar('info', 'Consultando perfil por usuarioId...');
      try {
        const perfil = await DBAppwrite.obtenerPerfilPorUsuarioId(usuarioIdActual);
        if (perfil) {
          agregar('pass', 'obtenerPerfilPorUsuarioId: OK');
          resultado.innerHTML += '<pre>' + JSON.stringify(perfil, null, 2) + '</pre>';
        } else {
          agregar('fail', 'obtenerPerfilPorUsuarioId devolvió null o undefined');
        }
      } catch (e) {
        agregar('fail', 'Error al obtener perfil por usuarioId: ' + e.message);
        agregar('fail', 'Code: ' + e.code);
        agregar('fail', 'Type: ' + e.type);
        if (e.response) agregar('fail', 'Response: ' + e.response);
      }

      // 7. Consulta específica por nombreUsuario
      agregar('info', 'Consultando perfil por nombreUsuario...');
      try {
        const perfil2 = await DBAppwrite.obtenerPerfilPorNombreUsuario(nombreUsuario);
        if (perfil2) {
          agregar('pass', 'obtenerPerfilPorNombreUsuario: OK');
        } else {
          agregar('fail', 'obtenerPerfilPorNombreUsuario devolvió null o undefined');
        }
      } catch (e) {
        agregar('fail', 'Error al obtener perfil por nombreUsuario: ' + e.message);
        agregar('fail', 'Code: ' + e.code);
        if (e.response) agregar('fail', 'Response: ' + e.response);
      }
    }

    document.getElementById('btnProbar').addEventListener('click', probar);
  </script>
</body>
</html>
