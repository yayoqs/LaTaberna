<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>La Taberna</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Monoton&display=swap" rel="stylesheet">
  <script src="js/appwrite.min.js"></script>

  <link rel="stylesheet" href="css/vars.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/mesas.css">
  <link rel="stylesheet" href="css/mesa-detalles.css">
  <link rel="stylesheet" href="css/pedido.css">
  <link rel="stylesheet" href="css/modal-opciones.css">
  <link rel="stylesheet" href="css/cliente-modal-opciones.css">
  <link rel="stylesheet" href="css/kds.css">
  <link rel="stylesheet" href="css/caja.css">
  <link rel="stylesheet" href="css/caja-cobro.css">
  <link rel="stylesheet" href="css/caja-arqueo.css">
  <link rel="stylesheet" href="css/caja-movimientos.css">
  <link rel="stylesheet" href="css/caja-historial.css">
  <link rel="stylesheet" href="css/config.css">
  <link rel="stylesheet" href="css/modals.css">
  <link rel="stylesheet" href="css/ticket.css">
  <link rel="stylesheet" href="css/despensa.css">
  <link rel="stylesheet" href="css/recetas.css">
  <link rel="stylesheet" href="css/reparto.css">
  <link rel="stylesheet" href="css/carta-editor.css">
  <link rel="stylesheet" href="css/perfil.css">
  <link rel="stylesheet" href="css/cliente-inicio.css">
  <link rel="stylesheet" href="css/cliente-bienvenida.css">
  <link rel="stylesheet" href="css/cliente-menu.css">
  <link rel="stylesheet" href="css/cliente-orden.css">
  <link rel="stylesheet" href="css/cliente-eventos.css">
  <link rel="stylesheet" href="css/eventos-en-vivo.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/extra.css">
</head>
<body>

  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>

  <header class="app-header">
    <div class="header-left">
      <div class="logo">
        <i class="fas fa-beer"></i>
        <span>LaTaberna</span>
      </div>
    </div>

    <nav class="header-nav">
      <button class="nav-btn" data-view="mesas" data-rol="master,owner,admin,mesero">
        <i class="fas fa-chair"></i><span> Mesas</span>
      </button>
      <button class="nav-btn" data-view="cocina" data-rol="master,owner,admin,chef,cocinaAyudante,barman,barraAyudante">
        <i class="fas fa-fire-burner"></i><span> Cocina</span>
      </button>
      <button class="nav-btn" data-view="caja" data-rol="master,owner,admin,caja">
        <i class="fas fa-cash-register"></i><span> Caja</span>
      </button>
      <button class="nav-btn" data-view="despensa" data-rol="master,owner,admin,chef">
        <i class="fas fa-boxes"></i><span> Despensa</span>
      </button>
      <button class="nav-btn" data-view="recetas" data-rol="master,owner,admin,chef,cocinaAyudante,barman,barraAyudante">
        <i class="fas fa-book"></i><span> Recetas</span>
      </button>
      <button class="nav-btn" data-view="reparto" data-rol="master,owner,admin,repartidor">
        <i class="fas fa-motorcycle"></i><span> Reparto</span>
      </button>
      <button class="nav-btn" data-view="eventos" data-rol="master,owner,admin,artista">
        <i class="fas fa-calendar-alt"></i><span> Eventos</span>
      </button>
      <button class="nav-btn" data-view="eventos-en-vivo" data-rol="master,owner,admin,artista">
        <i class="fas fa-broadcast-tower"></i><span> En Vivo</span>
      </button>
      <button class="nav-btn" data-view="perfil" data-rol="master,owner,admin,chef,cocinaAyudante,barman,barraAyudante,mesero,caja,repartidor,artista,jugador">
        <i class="fas fa-id-card"></i><span> Perfil</span>
      </button>
      <button class="nav-btn" data-view="config" data-rol="master,owner,admin">
        <i class="fas fa-sliders"></i><span> Config</span>
      </button>
      <button class="nav-btn" data-view="carta-editor" data-rol="master,owner,admin">
        <i class="fas fa-pen-ruler"></i><span> Diseñar Carta</span>
      </button>
    </nav>

    <div class="header-center">
      <div class="header-info">
        <span id="currentDate"></span>
        <span id="currentTime"></span>
      </div>
    </div>

    <div class="header-right">
      <span id="espacioSelectorContainer"></span>
      <span id="usuarioActualDisplay"></span>
      <button class="btn-secondary" id="btnLogout" title="Cerrar sesión" style="padding:6px 10px;">
        <i class="fas fa-sign-out-alt"></i>
      </button>
    </div>
  </header>

  <main id="view-mesas" class="view"></main>
  <main id="view-cocina" class="view"></main>
  <main id="view-caja" class="view"></main>
  <main id="view-config" class="view"></main>
  <main id="view-despensa" class="view"></main>
  <main id="view-recetas" class="view"></main>
  <main id="view-reparto" class="view"></main>
  <main id="view-eventos" class="view"></main>
  <main id="view-eventos-en-vivo" class="view"></main>
  <main id="view-perfil" class="view"></main>
  <main id="view-inicio" class="view"></main>
  <main id="view-bienvenida" class="view"></main>
  <main id="view-menu-digital" class="view"></main>
  <main id="view-eventos-cliente" class="view"></main>
  <main id="view-carta-editor" class="view"></main>

  <div id="popoverContainer" style="display:none; position:fixed; z-index:9999;"></div>

</body>
</html>
