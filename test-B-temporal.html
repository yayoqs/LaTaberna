<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test B – Insignia Cliente Esperando (v1.0.3)</title>
  <style>
    body { font-family: monospace; background: #1a1a24; color: #f1f5f9; padding: 20px; }
    h1 { color: #f59e0b; }
    .suite { margin-bottom: 24px; border-bottom: 1px solid #2e2e42; padding-bottom: 12px; }
    .test { margin: 4px 0; padding: 4px 8px; border-radius: 4px; }
    .pass { background: rgba(34,197,94,.2); }
    .fail { background: rgba(239,68,68,.2); }
    .summary { margin-top: 20px; font-weight: bold; }
    .info { color: #94a3b8; font-size: 12px; margin: 2px 0; }
    .error { color: #ef4444; }
  </style>
</head>
<body>
  <h1>🧪 Test B – Insignia Cliente Esperando (v1.0.3)</h1>
  <p class="info">Verifica que la insignia se active con el evento cliente:mesa_ingresada y solo en la mesa correcta.</p>
  <div id="results"></div>

  <!-- Mocks tempranos -->
  <script>
    window.DBInventario = { validarStockParaItems: function() { return { ok: true, faltantes: [] }; } };
    window.DBFusion = { fusionarMesas: function() { return null; } };
  </script>

  <!-- Dependencias -->
  <script src="/js/utils.js"></script>
  <script src="/js/lib/logger.js"></script>
  <script src="/js/lib/eventBus.js"></script>
  <script src="/js/lib/store.js"></script>
  <script src="/js/lib/command-bus.js"></script>
  <script src="/js/lib/deps.js"></script>
  <script src="/js/dominio/resultado.js"></script>
  <script src="/js/dominio/dinero.js"></script>
  <script src="/js/dominio/cantidad.js"></script>
  <script src="/js/db-core.js"></script>
  <script src="/js/db.js"></script>

  <!-- Módulo a testear -->
  <script src="/js/ui/mesas.js"></script>

  <script>
    (function() {
      var resultsEl = document.getElementById('results');
      var passed = 0, failed = 0;

      function assert(condition, msg) {
        if (condition) {
          passed++;
          resultsEl.innerHTML += '<div class="test pass">✔ ' + msg + '</div>';
        } else {
          failed++;
          resultsEl.innerHTML += '<div class="test fail">✘ ' + msg + '</div>';
        }
      }

      function esperar(ms) {
        return new Promise(function(resolve) { setTimeout(resolve, ms); });
      }

      async function runTests() {
        resultsEl.innerHTML = '';
        Logger.setLevel('ERROR');

        // ── Configurar entorno ──────────────────────────
        DB.config = { zonas: [{ nombre: 'salon', cantidad: 5 }] };
        DB.mozos = [{ id: 'm1', nombre: 'Carlos', activo: true }];
        DB.mesas = [
          { numero: 1, estado: 'libre', zona: 'salon', items: [], mozo: '', comensales: 1, pedidoId: null, esVirtual: false, permite_prepedidos: false },
          { numero: 2, estado: 'libre', zona: 'salon', items: [], mozo: '', comensales: 1, pedidoId: null, esVirtual: false, permite_prepedidos: false }
        ];
        DB.pedidos = [];
        DB.comandas = [];
        DB.saveMesas = function() {};
        DB.fusionarMesas = function() { return null; };

        window.showToast = function() {};

        // Mock del Store
        var originalGetState = Store.getState;
        Store.getState = function() {
          var state = originalGetState.call(Store);
          state.mesas = DB.mesas;
          return state;
        };

        Store.dispatch({ type: 'MESAS_INICIALIZAR', payload: DB.mesas });

        // Crear DOM mínimo
        var main = document.createElement('main');
        main.id = 'view-mesas';
        main.className = 'view active';
        main.innerHTML = '<div id="mesasGrid"></div><div id="popoverContainer"></div>';
        document.body.appendChild(main);

        Mesas.render();
        await esperar(50);

        // ── Suite 1: Ninguna insignia al inicio ──────────
        resultsEl.innerHTML += '<div class="suite"><h2>1. Sin insignias al inicio</h2></div>';
        var insignias = document.querySelectorAll('.esperando-cliente-badge');
        assert(insignias.length === 0, 'No hay insignias de cliente esperando al inicio');

        // ── Suite 2: Emitir evento y ver aparición ────────
        resultsEl.innerHTML += '<div class="suite"><h2>2. Insignia aparece al emitir cliente:mesa_ingresada</h2></div>';
        EventBus.emit('cliente:mesa_ingresada', { mesa: 1 });
        await esperar(50);
        insignias = document.querySelectorAll('.esperando-cliente-badge');
        assert(insignias.length === 1, 'Aparece una insignia de cliente esperando');
        if (insignias.length > 0) {
          assert(insignias[0].querySelector('.fa-clock') !== null, 'La insignia tiene ícono de reloj');
        }
        // Verificar que esté solo en mesa 1
        var mesa1 = document.querySelector('.mesa-card:nth-child(1) .esperando-cliente-badge');
        var mesa2 = document.querySelector('.mesa-card:nth-child(2) .esperando-cliente-badge');
        assert(!!mesa1, 'Insignia en mesa 1');
        assert(!mesa2, 'No hay insignia en mesa 2');

        // ── Suite 3: Desaparece al cambiar estado de la mesa ──
        resultsEl.innerHTML += '<div class="suite"><h2>3. Desaparece al cambiar estado de la mesa</h2></div>';
        DB.mesas[0].estado = 'ocupada';
        DB.mesas[0].permite_prepedidos = true;
        Mesas.render();
        await esperar(50);
        insignias = document.querySelectorAll('.esperando-cliente-badge');
        assert(insignias.length === 0, 'La insignia desaparece al ocupar la mesa');

        // ── Suite 4: Reemitir evento y aparecer de nuevo ──
        resultsEl.innerHTML += '<div class="suite"><h2>4. Reaparece si el cliente vuelve a ingresar</h2></div>';
        DB.mesas[0].estado = 'libre';
        DB.mesas[0].permite_prepedidos = false;
        Mesas.render();
        await esperar(50);
        // Aún no debería haber insignia porque el mapa se limpió al ocupar
        insignias = document.querySelectorAll('.esperando-cliente-badge');
        assert(insignias.length === 0, 'No hay insignia sin evento');
        // Emitir evento de nuevo
        EventBus.emit('cliente:mesa_ingresada', { mesa: 1 });
        await esperar(50);
        insignias = document.querySelectorAll('.esperando-cliente-badge');
        assert(insignias.length === 1, 'Vuelve a aparecer tras evento');

        // ── Resumen ──────────────────────────────────────
        resultsEl.innerHTML += '<div class="summary">' + passed + ' pasaron, ' + failed + ' fallaron</div>';
        if (failed === 0) {
          resultsEl.innerHTML += '<div class="test pass">✔ Todos los tests de la insignia pasaron.</div>';
        }
      }

      window.addEventListener('load', function() {
        runTests().catch(function(e) {
          resultsEl.innerHTML += '<div class="error">Error en tests: ' + e.message + '</div>';
        });
      });
    })();
  </script>
</body>
</html>
