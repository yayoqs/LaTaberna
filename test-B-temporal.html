<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test Temporal — Flujo de Precarga</title>
  <style>
    body { font-family: monospace; background: #1a1a24; color: #f1f5f9; padding: 20px; }
    h1 { color: #f59e0b; }
    .suite { margin: 20px 0; border-top: 1px solid #2e2e42; padding-top: 10px; }
    .test { margin: 4px 0; padding: 4px 8px; border-radius: 4px; }
    .pass { background: rgba(34,197,94,.2); }
    .fail { background: rgba(239,68,68,.2); }
    .log { background: rgba(99,102,241,.2); }
    .summary { margin-top: 24px; font-weight: bold; }
    .info { color: #94a3b8; font-size: 13px; }
  </style>
</head>
<body>
  <h1>🧪 Test Temporal — Flujo de Precarga</h1>
  <p class="info">Aísla: recepción de precarga → badge → clic → carga en comanda → limpieza de badge.</p>
  <div id="results"></div>

  <script type="module">
    import { EventBus } from '../js/lib/eventBus.js';
    import { Store } from '../js/lib/store.js';
    import { Logger } from '../js/lib/logger.js';
    import { Mesas } from '../js/ui/mesas.js';
    import { Comanda } from '../js/ui/comanda.js';
    import { PrecargaControl } from '../js/modulos/interno/precarga-control.js';

    const resultsEl = document.getElementById('results');
    let passed = 0, failed = 0;

    function assert(condition, msg) {
      if (condition) { passed++; resultsEl.innerHTML += '<div class="test pass">✔ ' + msg + '</div>'; }
      else { failed++; resultsEl.innerHTML += '<div class="test fail">✘ ' + msg + '</div>'; }
    }
    function log(msg) { resultsEl.innerHTML += '<div class="test log">🔍 ' + msg + '</div>'; }
    const esperar = ms => new Promise(r => setTimeout(r, ms));

    // ── Configurar entorno mínimo ──
    Logger.setLevel('ERROR');
    window.DB = {
      config: { zonas: [{ nombre: 'salon', cantidad: 5 }] },
      mozos: [{ id: 'm1', nombre: 'Carlos', activo: true }],
      mesas: [
        { numero: 1, estado: 'libre', zona: 'salon', items: [], mozo: '', comensales: 1, pedidoId: null, permite_prepedidos: false, esVirtual: false }
      ],
      pedidos: [],
      comandas: [],
      productos: [],
      recetas: [],
      ingredientes: [],
      saveMesas: () => {},
      savePedidos: () => {},
      saveComandas: () => {},
      getMesa: num => DB.mesas.find(m => m.numero == num),
      fusionarMesas: () => null
    };
    window.Auth = {
      puede: () => true,
      esAdmin: () => true,
      getUsuarioActual: () => ({ nombre: 'Test' }),
      getAppwriteUserId: async () => 'user_test_123',
      getRol: () => 'admin'
    };
    window.CommandBus = {
      _handlers: {},
      registrar: function(type, handler) { this._handlers[type] = handler; },
      ejecutar: async function(comando) {
        log('CommandBus.ejecutar: ' + comando.type);
        if (comando.type === 'precarga:revisar') return { exito: true };
        return { exito: false };
      }
    };
    window.DBAppwrite = {
      actualizar: async (col, id, cambios, permisos) => {
        log('DBAppwrite.actualizar: ' + col + ' ' + id);
        return true;
      }
    };
    window.showToast = () => {};
    window.confirm = () => true;
    window.fmtMoney = v => '$' + v;

    // Sincronizar Store (getState)
    const _origGet = Store.getState.bind(Store);
    Store.getState = () => ({ ..._origGet(), mesas: DB.mesas, comandas: DB.comandas, productos: DB.productos, config: DB.config });

    // Mock de Store.dispatch para procesar COMANDA_ITEM_AGREGAR sobre DB.mesas
    const _origDispatch = Store.dispatch.bind(Store);
    Store.dispatch = function(action) {
      if (action.type === 'COMANDA_ITEM_AGREGAR') {
        const mesa = DB.mesas.find(m => m.numero === action.payload.numeroMesa);
        if (mesa) {
          const item = action.payload.item;
          const existente = mesa.items.find(it =>
            it.prodId === item.prodId && !it.enviado && it.persona === (item.persona || 'General')
          );
          if (existente) existente.qty++;
          else mesa.items.push({ ...item, qty: 1 });
          log('Item agregado a DB.mesas: ' + item.nombre + ' (total items: ' + mesa.items.length + ')');
        }
      }
      _origDispatch(action);
    };

    Store.dispatch({ type: 'MESAS_INICIALIZAR', payload: DB.mesas });

    // Crear DOM para mesas
    const main = document.createElement('main');
    main.id = 'view-mesas';
    main.className = 'view active';
    main.innerHTML = '<div id="mesasGrid"></div><div id="popoverContainer"></div>';
    document.body.appendChild(main);
    Mesas.render();
    await esperar(50);

    // Activar mesa 1 en Comanda
    const mesa1 = DB.mesas[0];
    mesa1.estado = 'ocupada';
    mesa1.pedidoId = 'ped_test';
    mesa1.mozo = 'Carlos';
    mesa1.comensales = 2;
    mesa1.personas = ['General'];
    mesa1.personaActiva = 'General';
    mesa1.items = [];
    Comanda.setMesaActiva(mesa1);
    log('Mesa 1 activa en Comanda, items iniciales: ' + mesa1.items.length);

    // Suite 1: Emitir precarga y verificar badge
    resultsEl.innerHTML += '<div class="suite"><h2>1. Recepción de precarga</h2></div>';
    const payload = {
      id: 'prec_001',
      mesa: 1,
      items: [
        { prodId: 'prod_a', nombre: 'Hamburguesa', precio: 1500, categoria: 'platos', destino: 'cocina', qty: 2, obs: 'sin cebolla' },
        { prodId: 'prod_b', nombre: 'Cerveza', precio: 800, categoria: 'bebidas', destino: 'barra', qty: 1, obs: '' }
      ],
      clienteId: 'juan',
      observaciones: '',
      timestamp: Date.now()
    };

    EventBus.emit('cliente:precarga_enviada', payload);
    await esperar(100);

    const badge = document.querySelector('.precarga-badge');
    log('Badge después de emitir: ' + (badge ? 'VISIBLE' : 'NO VISIBLE'));
    if (badge) log('Contenido: ' + badge.textContent);
    assert(!!badge, 'Aparece insignia de precarga');
    assert(PrecargaControl._precargas.has('prec_001'), 'Precarga almacenada en PrecargaControl');

    // Suite 2: Clic en badge → carga de ítems
    resultsEl.innerHTML += '<div class="suite"><h2>2. Clic en insignia → carga en comanda</h2></div>';
    if (badge) {
      badge.click();
      await esperar(200);
    }
    log('Items en mesa1 después del clic: ' + mesa1.items.length);
    if (mesa1.items.length > 0) {
      mesa1.items.forEach((it, i) => log('  Item ' + i + ': ' + it.nombre + ' x' + it.qty));
    }
    assert(mesa1.items.length === 2, 'Se agregaron 2 líneas de ítems (real: ' + mesa1.items.length + ')');
    const total = mesa1.items.reduce((s, it) => s + it.qty, 0);
    assert(total === 3, 'Total de unidades = 3 (real: ' + total + ')');

    // Suite 3: Badge desaparece
    resultsEl.innerHTML += '<div class="suite"><h2>3. Badge desaparece después de cargar</h2></div>';
    const badgePost = document.querySelector('.precarga-badge');
    log('Badge post-clic: ' + (badgePost ? 'VISIBLE' : 'NO VISIBLE'));
    assert(!badgePost, 'Badge desaparece después de cargar');
    assert(!PrecargaControl._precargas.has('prec_001'), 'Precarga removida de memoria');

    resultsEl.innerHTML += '<div class="summary">' + passed + ' pasaron, ' + failed + ' fallaron</div>';
  </script>
</body>
</html>
