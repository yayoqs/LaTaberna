<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test D – Despensa v4.5.0 (Proveedores)</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f0f14; color: #f1f5f9; padding: 20px; }
    h1 { color: #f59e0b; }
    .resultado { background: #1a1a24; border-radius: 8px; padding: 12px 16px; margin: 8px 0; display: flex; align-items: center; gap: 12px; }
    .ok { border-left: 4px solid #22c55e; }
    .fallo { border-left: 4px solid #ef4444; }
    .salto { border-left: 4px solid #3b82f6; }
    .seccion { color: #f59e0b; font-size: 13px; min-width: 100px; }
  </style>
</head>
<body>
  <h1>Test D – Despensa (v4.5.0 — Proveedores + Relaciones)</h1>
  <p style="color:#a0a0a0;">Flujo completo de proveedores y su integración con ingredientes.</p>
  <div id="resultados"></div>
  <div id="toastContainer"></div>

  <!-- SDK de Appwrite -->
  <script src="js/appwrite.min.js"></script>

  <!-- Dependencias del sistema -->
  <script type="module" src="js/lib/logger.js"></script>
  <script type="module" src="js/lib/eventBus.js"></script>
  <script type="module" src="js/lib/store.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/utils.js"></script>
  <script type="module" src="js/db.js"></script>
  <script type="module" src="js/db-appwrite.js"></script>
  <script type="module" src="js/dominio/cantidad.js?v=1.1.3"></script>
  <script type="module" src="js/dominio/dinero.js?v=1.1.3"></script>
  <script type="module" src="js/dominio/ingrediente.js"></script>
  <script type="module" src="js/servicios/inventario-service.js"></script>
  <script type="module" src="js/repositorios/inventario-repository.js"></script>
  <script type="module" src="js/repositorios/proveedor-repository.js"></script>

  <!-- Inyectar datos de prueba -->
  <script type="module">
    import { Store } from './js/lib/store.js';
    import { DB } from './js/db.js';

    const ingredientesDePrueba = [
      { id:'ing1', nombre:'Queso Cheddar', stock:1, stock_minimo:5, unidad:'kg', categoria:'cocina', ubicacion:'Estante 1 — Lácteos', valor_unitario:800, proveedor:'Distribuidora Norte' },
      { id:'ing2', nombre:'Mantequilla', stock:5, stock_minimo:2, unidad:'kg', categoria:'cocina', ubicacion:'Estante 1 — Lácteos', valor_unitario:500, proveedor:'Distribuidora Norte' },
      { id:'ing3', nombre:'Cerveza Corona', stock:24, stock_minimo:10, unidad:'un.', categoria:'barra', ubicacion:'Estante 2 — Bebidas', valor_unitario:1200, proveedor:'Mayorista Central' },
      { id:'ing4', nombre:'Detergente', stock:5, stock_minimo:2, unidad:'L', categoria:'limpieza', ubicacion:'Cajón 3 — Limpieza', valor_unitario:300, proveedor:'La Bodega' },
      { id:'ing5', nombre:'Tallarines', stock:2, stock_minimo:6, unidad:'paq.', categoria:'cocina', ubicacion:'Estante 4 — Insumos cocina', valor_unitario:400, proveedor:'Mayorista Central' }
    ];

    const movimientosDePrueba = [
      { id:'mov1', tipo:'entrada', ingrediente:'Queso Cheddar', cantidad:5, unidad:'kg', fecha: new Date().toISOString(), motivo:'Compra', usuario:'Admin' },
      { id:'mov2', tipo:'salida', ingrediente:'Tallarines', cantidad:2, unidad:'paq.', fecha: new Date(Date.now()-86400000).toISOString(), motivo:'Consumo', usuario:'Cocina' },
      { id:'mov3', tipo:'ajuste', ingrediente:'Cerveza Corona', cantidad:3, unidad:'un.', fecha: new Date().toISOString(), motivo:'Inventario', usuario:'Admin' }
    ];

    const proveedoresDePrueba = [
      { id:'prov1', nombre:'Distribuidora Norte', tipo:'distribuidor', notas:'Pago a 30 días' },
      { id:'prov2', nombre:'Mayorista Central', tipo:'supermercado', notas:'' },
      { id:'prov3', nombre:'La Bodega', tipo:'negocio_local', notas:'Al lado de la panadería' }
    ];

    Store.despachar({ type: 'INGREDIENTES_INICIALIZAR', payload: ingredientesDePrueba });
    DB.movimientos = movimientosDePrueba;
    DB.ingredientes = [...ingredientesDePrueba];
    DB.proveedores = [...proveedoresDePrueba];
  </script>

  <!-- Módulo real de despensa -->
  <script type="module" src="js/ui/despensa.js"></script>

  <script type="module">
    import { Store } from './js/lib/store.js';
    import { DB } from './js/db.js';
    import { DBAppwrite } from './js/db-appwrite.js';
    import { InventarioService } from './js/servicios/inventario-service.js';
    import { crearInventarioRepo } from './js/repositorios/inventario-repository.js';
    import { crearProveedorRepo } from './js/repositorios/proveedor-repository.js';
    import { Despensa } from './js/ui/despensa.js';
    import { getListaCompras, agregarAListaCompras, quitarDeListaCompras, limpiarListaCompras } from './js/ui/despensa/estado.js';
    import { renderListaCompras } from './js/ui/despensa/renderer.js';

    // Configurar repositorios
    const inventarioRepo = crearInventarioRepo();
    InventarioService.configurar(inventarioRepo);
    const proveedorRepo = crearProveedorRepo();

    function resultado(ok, seccion, mensaje) {
      const div = document.createElement('div');
      const clase = ok === 'salto' ? 'salto' : (ok ? 'ok' : 'fallo');
      div.className = 'resultado ' + clase;
      const icono = ok === 'salto' ? '→' : (ok ? '✔' : '✘');
      div.innerHTML = `<span>${icono}</span><span class="seccion">[${seccion}]</span><span>${mensaje}</span>`;
      document.getElementById('resultados').appendChild(div);
    }

    async function iniciarTests() {
      // Render inicial
      Despensa.render();
      await new Promise(r => setTimeout(r, 300));

      // 1. Render general
      resultado(document.getElementById('view-despensa') !== null, 'Render', 'Vista de despensa creada');
      resultado(document.querySelector('.main-layout') !== null, 'Render', 'Layout de tres paneles presente');
      resultado(document.getElementById('panelIzquierdo') !== null, 'Render', 'Panel izquierdo creado');
      resultado(document.getElementById('panelDerecho') !== null, 'Render', 'Panel derecho creado');

      // 2. Pestañas panel izquierdo
      const tabs = document.querySelectorAll('.panel-tab');
      resultado(tabs.length === 2, 'Panel izq', 'Dos pestañas: Proveedores y Productos');
      resultado(tabs[0].classList.contains('activo'), 'Panel izq', 'Proveedores activa por defecto');

      // 3. Verificar tarjetas de proveedores
      const cardsProveedores = document.querySelectorAll('#tab-proveedores .item-card');
      resultado(cardsProveedores.length >= 3, 'Proveedores', 'Se muestran al menos 3 proveedores');

      // 4. Expansión de tarjeta
      if (cardsProveedores.length > 0) {
        cardsProveedores[0].click();
        await new Promise(r => setTimeout(r, 100));
        resultado(cardsProveedores[0].classList.contains('abierto'), 'Proveedores', 'Tarjeta de proveedor se expande');
        const detalle = cardsProveedores[0].querySelector('.detalle');
        resultado(detalle && detalle.style.display !== 'none', 'Proveedores', 'Detalle de productos visible');
      }

      // 5. Pestaña Productos
      tabs[1].click();
      await new Promise(r => setTimeout(r, 100));
      resultado(tabs[1].classList.contains('activo'), 'Panel izq', 'Pestaña Productos activada');
      const cardsProductos = document.querySelectorAll('#tab-productos .item-card');
      resultado(cardsProductos.length >= 5, 'Productos', 'Se muestran al menos 5 productos');
      if (cardsProductos.length > 0) {
        cardsProductos[0].click();
        await new Promise(r => setTimeout(r, 100));
        resultado(cardsProductos[0].classList.contains('abierto'), 'Productos', 'Tarjeta de producto se expande');
      }

      // 6. Crear proveedor programáticamente
      const nuevoProv = await proveedorRepo.guardarProveedor({
        nombre: 'Proveedor Test ' + Date.now(),
        tipo: 'negocio_local',
        notas: 'Nota de prueba'
      });
      resultado(!!nuevoProv && !!nuevoProv.id, 'ProveedorRepo', 'Proveedor guardado correctamente');
      resultado(DB.proveedores.some(p => p.id === nuevoProv.id), 'ProveedorRepo', 'Proveedor en DB local');

      // 7. Asociar ingrediente a nuevo proveedor (simulación)
      if (DB.ingredientes.length > 0) {
        DB.ingredientes[0].proveedor = nuevoProv.nombre;
        DB.ingredientes[0].precio_proveedor = 850;
        Store.despachar({ type: 'INGREDIENTE_GUARDADO', payload: DB.ingredientes[0] });
        await new Promise(r => setTimeout(r, 200));
        // Volver a pestaña proveedores
        tabs[0].click();
        await new Promise(r => setTimeout(r, 200));
        const cardsActualizadas = document.querySelectorAll('#tab-proveedores .item-card');
        resultado(cardsActualizadas.length >= 4, 'Integración', 'Nuevo proveedor visible en panel');
      }

      // 8. Persistencia Appwrite (si disponible)
      try {
        if (!DBAppwrite.habilitado) await DBAppwrite.iniciar();
        if (DBAppwrite.habilitado) {
          const provId = 'tp_' + Date.now().toString(36).slice(-6);
          const res = await proveedorRepo.guardarProveedor({
            id: provId,
            nombre: 'Test Appwrite ' + Date.now(),
            tipo: 'otro',
            notas: ''
          });
          resultado(!!res, 'Appwrite', 'Proveedor guardado en Appwrite');
          const lista = await proveedorRepo.obtenerProveedores();
          const encontrado = lista.find(p => p.id === provId);
          resultado(!!encontrado, 'Appwrite', 'Proveedor encontrado en Appwrite');
          await proveedorRepo.eliminarProveedor(provId);
        } else {
          resultado('salto', 'Appwrite', 'Appwrite no disponible');
        }
      } catch (e) {
        resultado(false, 'Appwrite', 'Error: ' + e.message);
      }

      // 9. Limpiar
      document.getElementById('view-despensa').style.display = 'none';
      console.log('Tests de despensa v4.5.0 completados.');
    }

    window.addEventListener('load', () => setTimeout(iniciarTests, 100));
  </script>
</body>
</html>
