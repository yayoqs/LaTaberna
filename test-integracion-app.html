<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test de Integración - App vs Appwrite</title>
  <style>
    body { font-family: monospace; background: #1a1a24; color: #f1f5f9; padding: 20px; }
    h1 { color: #f59e0b; }
    h2 { color: #94a3b8; margin-top: 24px; }
    .test { margin: 4px 0; padding: 4px 8px; border-radius: 4px; }
    .pass { background: rgba(34,197,94,.2); }
    .fail { background: rgba(239,68,68,.2); }
    .info { color: #94a3b8; font-size: 12px; margin: 2px 0; }
    button { margin-top: 16px; padding: 12px 24px; background: #f59e0b; color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <h1>🧪 Test de Integración App ↔ Appwrite</h1>
  <p class="info">Carga los mismos scripts que la app y verifica que los datos fluyan desde Appwrite al Store.</p>
  <div id="results"></div>
  <button onclick="location.reload()">🔄 Ejecutar de nuevo</button>

  <!-- Cargar los scripts exactamente igual que index.html, en orden -->
  <script src="js/utils.js"></script>
  <script src="js/lib/logger.js"></script>
  <script src="js/lib/eventBus.js"></script>
  <script src="js/lib/command-bus.js"></script>
  <script src="js/lib/store.js"></script>
  <script src="js/lib/deps.js"></script>
  <script src="js/db-core.js"></script>
  <script src="js/db-inventario.js"></script>
  <script src="js/db-fusion.js"></script>
  <script src="js/appwrite.min.js"></script>
  <script src="js/init-appwrite.js"></script>
  <script src="js/db-appwrite.js"></script>
  <script src="js/db-shim.js"></script>
  <script src="js/db.js"></script>

  <script>
    (function() {
      var resultsEl = document.getElementById('results');
      var passed = 0, failed = 0;

      function assert(condition, msg) {
        if (condition) {
          passed++;
          resultsEl.innerHTML += '<div class="test pass">✔ ' + msg + '</div>';
        } else {
          failed++;
          resultsEl.innerHTML += '<div class="test fail">✘ ' + msg + '</div>';
        }
      }

      async function runTests() {
        resultsEl.innerHTML = '';
        Logger.setLevel('ERROR');

        // 1. Verificar credenciales en localStorage
        resultsEl.innerHTML += '<h2>1. Credenciales en localStorage</h2>';
        var habilitado = localStorage.getItem('appwrite_habilitado') === 'true';
        var projectId = localStorage.getItem('appwrite_project_id') || '';
        var apiKey = localStorage.getItem('appwrite_api_key') || '';
        assert(habilitado, 'appwrite_habilitado = true');
        assert(projectId.length > 0, 'Project ID presente');
        assert(apiKey.length > 0, 'API Key presente');
        if (!habilitado || !projectId || !apiKey) {
          resultsEl.innerHTML += '<div class="fail">Credenciales no configuradas. Ejecuta init-appwrite.js primero.</div>';
          return;
        }

        // 2. Inicializar DBAppwrite
        resultsEl.innerHTML += '<h2>2. Inicializar DBAppwrite</h2>';
        var appwriteOk = await DBAppwrite.init();
        assert(appwriteOk === true, 'DBAppwrite.init() exitoso');
        assert(DBAppwrite.habilitado === true, 'DBAppwrite.habilitado = true');
        if (!appwriteOk) {
          resultsEl.innerHTML += '<div class="fail">No se pudo conectar a Appwrite. Revisa credenciales y red.</div>';
          return;
        }

        // 3. Listar colecciones directamente desde DBAppwrite
        resultsEl.innerHTML += '<h2>3. Datos en Appwrite</h2>';
        var productos = await DBAppwrite.listar('productos');
        assert(Array.isArray(productos), 'Productos: ' + productos.length + ' documentos');
        
        var pedidos = await DBAppwrite.listar('pedidos');
        assert(Array.isArray(pedidos), 'Pedidos: ' + pedidos.length + ' documentos');
        
        var mesas = await DBAppwrite.listar('mesas');
        assert(Array.isArray(mesas), 'Mesas: ' + mesas.length + ' documentos');
        
        var ingredientes = await DBAppwrite.listar('ingredientes');
        assert(Array.isArray(ingredientes), 'Ingredientes: ' + ingredientes.length + ' documentos');
        
        var recetas = await DBAppwrite.listar('recetas');
        assert(Array.isArray(recetas), 'Recetas: ' + recetas.length + ' documentos');

        if (productos.length === 0 && pedidos.length === 0 && mesas.length === 0) {
          resultsEl.innerHTML += '<div class="info">⚠️ Todas las colecciones están vacías. ¿Ejecutaste la migración inicial en Apps Script?</div>';
        }

        // 4. Simular DB.init() sin dependencias de Auth/PedidoManager
        resultsEl.innerHTML += '<h2>4. Inicializar DB (simulado)</h2>';
        try {
          // Mock mínimo para que DB.init no falle
          window.Auth = window.Auth || { getEspacioActivo: function() { return { id: 'esp_taberna' }; } };
          window.PedidoManager = window.PedidoManager || { getTurnoActual: function() { return { id: 'test', estado: 'abierto' }; }, registrar: function() {} };

          // Forzar carga de configuración y mesas
          DB._cargarConfigLocal();
          DB._inicializarMesas();
          
          // Cargar datos desde Appwrite manualmente
          DB.productos = productos.map(p => DB._normalizarProducto(p));
          DB.pedidos = pedidos;
          DB.mesas = mesas.length ? mesas.map(m => DB._normalizarMesa(m)) : DB.mesas;
          DB.ingredientes = ingredientes.map(i => DB._normalizarIngrediente(i));
          DB.recetas = recetas;

          // Poblar Store
          Store.dispatch({ type: 'PRODUCTOS_INICIALIZAR', payload: DB.productos });
          Store.dispatch({ type: 'PEDIDOS_INICIALIZAR', payload: DB.pedidos });
          Store.dispatch({ type: 'MESAS_INICIALIZAR', payload: DB.mesas });
          Store.dispatch({ type: 'INGREDIENTES_INICIALIZAR', payload: DB.ingredientes });
          Store.dispatch({ type: 'RECETAS_INICIALIZAR', payload: DB.recetas });

          var state = Store.getState();
          assert(state.productos.length === productos.length, 'Store tiene ' + state.productos.length + ' productos');
          assert(state.pedidos.length === pedidos.length, 'Store tiene ' + state.pedidos.length + ' pedidos');
          assert(state.mesas.length > 0 || mesas.length === 0, 'Store tiene mesas');
          assert(state.ingredientes.length === ingredientes.length, 'Store tiene ingredientes');
          assert(state.recetas.length === recetas.length, 'Store tiene recetas');
        } catch (e) {
          assert(false, 'Error en DB.init simulado: ' + e.message);
        }

        // Resumen
        resultsEl.innerHTML += '<h2>Resultado</h2>';
        resultsEl.innerHTML += '<p>' + passed + ' pruebas pasaron, ' + failed + ' fallaron.</p>';
        if (failed === 0 && productos.length > 0) {
          resultsEl.innerHTML += '<div class="pass">✔ La conexión Appwrite funciona y los datos están disponibles.</div>';
        } else if (productos.length === 0) {
          resultsEl.innerHTML += '<div class="fail">Las colecciones de Appwrite están vacías. Ejecuta la migración inicial en Apps Script (función migrarDatosIniciales).</div>';
        }
      }

      window.addEventListener('load', function() {
        setTimeout(runTests, 500); // pequeña espera para que init-appwrite.js termine
      });
    })();
  </script>
</body>
</html>
