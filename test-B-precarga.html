<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test B – Recepción de Precargas (ES6)</title>
  <style>
    body { font-family: monospace; background: #1a1a24; color: #f1f5f9; padding: 20px; }
    h1 { color: #f59e0b; }
    .suite { margin-bottom: 24px; border-bottom: 1px solid #2e2e42; padding-bottom: 12px; }
    .test { margin: 4px 0; padding: 4px 8px; border-radius: 4px; }
    .pass { background: rgba(34,197,94,.2); }
    .fail { background: rgba(239,68,68,.2); }
    .log { background: rgba(99,102,241,.2); }
    .summary { margin-top: 20px; font-weight: bold; }
    .info { color: #94a3b8; font-size: 12px; margin: 2px 0; }
    .error { color: #ef4444; }
  </style>
</head>
<body>
  <h1>🧪 Test B – Recepción de Precargas (ES6)</h1>
  <p class="info">Verifica que el Frontend Interno muestre la insignia, cargue los ítems, asigne observaciones y actualice el estado de la precarga.</p>
  <div id="results"></div>

  <script type="module">
    const resultsEl = document.getElementById('results');
    
    function log(msg) {
      resultsEl.innerHTML += '<div class="test log">🔍 ' + msg + '</div>';
    }
    
    log('Iniciando imports...');
    
    try {
      const { Mesas } = await import('../js/ui/mesas.js');
      log('Mesas importado OK');
      
      const { Comanda } = await import('../js/ui/comanda.js');
      log('Comanda importado OK');
      
      const { PrecargaControl } = await import('../js/modulos/interno/precarga-control.js');
      log('PrecargaControl importado OK');
      
      const { Store } = await import('../js/lib/store.js');
      log('Store importado OK');
      
      const { EventBus } = await import('../js/lib/eventBus.js');
      log('EventBus importado OK');
      
      const { Logger } = await import('../js/lib/logger.js');
      log('Logger importado OK');

      // Mocks
      log('Configurando mocks...');
      window.DBInventario = { validarStockParaItems: () => ({ ok: true, faltantes: [] }) };
      window.DBFusion = { fusionarMesas: () => null };
      window.Auth = {
        puede: () => true,
        esAdmin: () => true,
        getUsuarioActual: () => ({ nombre: 'Test' }),
        getAppwriteUserId: async () => 'user_test_123'
      };
      window.showToast = () => {};
      
      window.DB = {
        config: { zonas: [{ nombre: 'salon', cantidad: 5 }] },
        mozos: [{ id: 'm1', nombre: 'Carlos', activo: true }],
        mesas: [
          { numero: 1, estado: 'libre', zona: 'salon', items: [], mozo: '', comensales: 1, pedidoId: null, esVirtual: false, permite_prepedidos: false },
          { numero: 2, estado: 'libre', zona: 'salon', items: [], mozo: '', comensales: 1, pedidoId: null, esVirtual: false, permite_prepedidos: false }
        ],
        pedidos: [],
        comandas: [],
        productos: [],
        saveMesas: () => {},
        savePedidos: () => {},
        saveComandas: () => {},
        getMesa: function(num) { return this.mesas.find(m => m.numero == num); },
        fusionarMesas: () => null
      };
      
      window.DBAppwrite = {
        actualizar: async (col, id, cambios, permisos) => {
          log('DBAppwrite.actualizar llamado: ' + col + ' ' + id);
          return true;
        }
      };
      
      window.CommandBus = {
        _handlers: {},
        registrar: function(type, handler) { this._handlers[type] = handler; },
        ejecutar: async function(comando) {
          log('CommandBus.ejecutar: ' + comando.type);
          if (comando.type === 'precarga:revisar') return { exito: true };
          return { exito: false };
        }
      };

      log('Mocks configurados OK');

      // Sincronizar Store
      const originalGetState = Store.getState.bind(Store);
      Store.getState = function() {
        const state = originalGetState();
        state.mesas = window.DB.mesas;
        state.comandas = window.DB.comandas;
        return state;
      };

      const originalDispatch = Store.dispatch.bind(Store);
      Store.dispatch = function(action) {
        log('Store.dispatch: ' + action.type);
        if (action.type === 'COMANDA_ITEM_AGREGAR') {
          const mesa = window.DB.mesas.find(m => m.numero === action.payload.numeroMesa);
          if (mesa) {
            const item = action.payload.item;
            const existente = mesa.items.find(it =>
              it.prodId === item.prodId && !it.enviado && it.persona === (item.persona || 'General')
            );
            if (existente) existente.qty++;
            else mesa.items.push({ ...item, qty: 1 });
          }
        }
        originalDispatch(action);
      };

      Store.dispatch({ type: 'MESAS_INICIALIZAR', payload: window.DB.mesas });
      log('Store inicializado OK');

      // Crear DOM
      const main = document.createElement('main');
      main.id = 'view-mesas';
      main.innerHTML = '<div id="mesasGrid"></div>';
      document.body.appendChild(main);
      log('DOM creado OK');

      // Renderizar mesas
      Mesas.render();
      log('Mesas.render() ejecutado');

      // Preparar mesa activa
      const mesa1 = window.DB.mesas[0];
      mesa1.estado = 'ocupada';
      mesa1.pedidoId = 'ped_test';
      mesa1.mozo = 'Carlos';
      mesa1.comensales = 2;
      mesa1.personas = ['General'];
      mesa1.personaActiva = 'General';
      mesa1.items = [];
      Comanda.setMesaActiva(mesa1);
      log('Mesa 1 configurada como activa');

      // Ahora sí ejecutar tests
      let passed = 0, failed = 0;
      
      function assert(condition, msg) {
        if (condition) {
          passed++;
          resultsEl.innerHTML += '<div class="test pass">✔ ' + msg + '</div>';
        } else {
          failed++;
          resultsEl.innerHTML += '<div class="test fail">✘ ' + msg + '</div>';
        }
      }

      const esperar = ms => new Promise(resolve => setTimeout(resolve, ms));

      // Suite 1
      resultsEl.innerHTML += '<div class="suite"><h2>1. Insignia al recibir precarga</h2></div>';
      
      const precargaPrueba = {
        id: 'prec_001',
        mesa: 1,
        items: [
          { prodId: 'prod_a', nombre: 'Hamburguesa', precio: 1500, categoria: 'platos', destino: 'cocina', qty: 2, obs: 'sin cebolla' },
          { prodId: 'prod_b', nombre: 'Cerveza', precio: 800, categoria: 'bebidas', destino: 'barra', qty: 1, obs: '' }
        ],
        clienteId: 'juan',
        observaciones: '',
        timestamp: Date.now()
      };

      log('Emitiendo cliente:precarga_enviada...');
      EventBus.emit('cliente:precarga_enviada', precargaPrueba);
      await esperar(100);

      const badgeEl = document.querySelector('.precarga-badge');
      log('Badge encontrado: ' + (badgeEl ? 'SI' : 'NO'));
      if (badgeEl) log('Contenido del badge: ' + badgeEl.textContent);
      
      assert(!!badgeEl, 'Aparece una insignia en la mesa 1');
      if (badgeEl) {
        assert(badgeEl.textContent.includes('2'), 'La insignia muestra la cantidad de ítems (2)');
      }

      log('Precargas en memoria: ' + PrecargaControl._precargas.size);
      assert(PrecargaControl._precargas.has('prec_001'), 'Precarga almacenada en PrecargaControl');

      // Resumen
      resultsEl.innerHTML += '<div class="summary">' + passed + ' pasaron, ' + failed + ' fallaron</div>';

    } catch (e) {
      resultsEl.innerHTML += '<div class="test fail">✘ ERROR: ' + e.message + '</div>';
      resultsEl.innerHTML += '<div class="test log">🔍 Stack: ' + e.stack + '</div>';
      console.error(e);
    }
  </script>
</body>
</html>
