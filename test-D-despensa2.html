<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test D – Despensa Automático (Appwrite real)</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f0f14; color: #f1f5f9; padding: 20px; }
    h1 { color: #f59e0b; }
    .resultado { background: #1a1a24; border-radius: 8px; padding: 12px 16px; margin: 8px 0; display: flex; align-items: center; gap: 12px; }
    .ok { border-left: 4px solid #22c55e; }
    .fallo { border-left: 4px solid #ef4444; }
    .seccion { color: #f59e0b; font-size: 13px; min-width: 100px; }
  </style>
</head>
<body>
  <h1>Test D – Despensa Automático (Appwrite real)</h1>
  <p style="color:#a0a0a0;">Flujo completo sin intervención: proveedores, productos, relaciones y persistencia.</p>
  <div id="resultados"></div>
  <div id="toastContainer"></div>

  <!-- SDK de Appwrite -->
  <script src="js/appwrite.min.js"></script>

  <!-- Dependencias del sistema -->
  <script type="module" src="js/lib/logger.js"></script>
  <script type="module" src="js/lib/eventBus.js"></script>
  <script type="module" src="js/lib/store.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/utils.js"></script>
  <script type="module" src="js/db.js"></script>
  <script type="module" src="js/db-appwrite.js"></script>
  <script type="module" src="js/dominio/cantidad.js?v=1.1.3"></script>
  <script type="module" src="js/dominio/dinero.js?v=1.1.3"></script>
  <script type="module" src="js/dominio/ingrediente.js"></script>
  <script type="module" src="js/servicios/inventario-service.js"></script>
  <script type="module" src="js/repositorios/inventario-repository.js"></script>
  <script type="module" src="js/repositorios/proveedor-repository.js"></script>

  <script type="module">
    import { DBAppwrite } from './js/db-appwrite.js';
    import { InventarioService } from './js/servicios/inventario-service.js';
    import { crearInventarioRepo } from './js/repositorios/inventario-repository.js';
    import { crearProveedorRepo } from './js/repositorios/proveedor-repository.js';

    function resultado(ok, seccion, mensaje) {
      const div = document.createElement('div');
      div.className = 'resultado ' + (ok ? 'ok' : 'fallo');
      div.innerHTML = `<span>${ok ? '✔' : '✘'}</span><span class="seccion">[${seccion}]</span><span>${mensaje}</span>`;
      document.getElementById('resultados').appendChild(div);
    }

    async function esperar(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function iniciarTests() {
      if (!DBAppwrite.habilitado) {
        await DBAppwrite.iniciar();
      }
      if (!DBAppwrite.habilitado) {
        resultado(false, 'Inicio', 'No se pudo inicializar Appwrite. Abortando.');
        return;
      }
      resultado(true, 'Inicio', 'Appwrite inicializado correctamente.');

      const inventarioRepo = crearInventarioRepo();
      InventarioService.configurar(inventarioRepo);
      const proveedorRepo = crearProveedorRepo();

      // ── 1. PROVEEDORES ────────────────────────────────
      try {
        // Crear
        const prov = await proveedorRepo.guardarProveedor({
          nombre: 'Proveedor Test ' + Date.now(),
          notas: 'Prueba automática'
        });
        const provId = prov.id;
        resultado(!!provId, 'Proveedor', 'Proveedor creado. ID: ' + provId);
        await esperar(2000);

        // Verificar en Appwrite
        const listaProv = await DBAppwrite.listar('proveedores');
        const encontrado = listaProv.find(p => p.id === provId);
        resultado(!!encontrado, 'Proveedor', 'Proveedor encontrado en Appwrite.');

        // Editar
        const provEdit = await proveedorRepo.guardarProveedor({
          id: provId,
          nombre: 'Proveedor Editado ' + Date.now(),
          notas: 'Editado'
        });
        resultado(provEdit.nombre !== prov.nombre, 'Proveedor', 'Proveedor editado localmente.');
        await esperar(2000);

        // Verificar edición
        const listaProv2 = await DBAppwrite.listar('proveedores');
        const encontradoEdit = listaProv2.find(p => p.id === provId && p.nombre === provEdit.nombre);
        resultado(!!encontradoEdit, 'Proveedor', 'Edición reflejada en Appwrite.');

        // Eliminar
        await proveedorRepo.eliminarProveedor(provId);
        await esperar(2000);
        const listaProv3 = await DBAppwrite.listar('proveedores');
        const encontradoDel = listaProv3.find(p => p.id === provId);
        resultado(!encontradoDel, 'Proveedor', 'Proveedor eliminado de Appwrite.');
      } catch (e) {
        resultado(false, 'Proveedor', 'Error: ' + e.message);
      }

      // ── 2. PRODUCTOS ──────────────────────────────────
      try {
        const prod = await InventarioService.guardarIngrediente({
          nombre: 'Producto Test ' + Date.now(),
          stock: 10.5,
          stock_minimo: 2,
          unidad: 'kg',
          categoria: 'cocina',
          ubicacion: 'Estante Test',
          valor_unitario: 100,
          proveedor: 'Sin proveedor',
          precio_proveedor: 0
        });
        const prodId = prod.datos?.id || prod.datos?._id;
        resultado(!!prodId, 'Producto', 'Producto creado. ID: ' + prodId);
        await esperar(2000);

        const listaProd = await DBAppwrite.listar('ingredientes');
        const encontradoProd = listaProd.find(p => p.id === prodId);
        resultado(!!encontradoProd, 'Producto', 'Producto encontrado en Appwrite.');

        // Editar
        const prodEdit = await InventarioService.guardarIngrediente({
          id: prodId,
          nombre: 'Producto Editado ' + Date.now(),
          stock: 8,
          stock_minimo: 1,
          unidad: 'kg',
          categoria: 'barra',
          ubicacion: 'Estante Editado',
          valor_unitario: 120,
          proveedor: 'Proveedor Test',
          precio_proveedor: 85
        });
        resultado(prodEdit.exito, 'Producto', 'Producto editado localmente.');
        await esperar(2000);

        const listaProd2 = await DBAppwrite.listar('ingredientes');
        const encontradoProdEdit = listaProd2.find(p => p.id === prodId && p.nombre === prodEdit.datos?.nombre);
        resultado(!!encontradoProdEdit && encontradoProdEdit.proveedor === 'Proveedor Test', 'Producto', 'Edición y proveedor reflejados en Appwrite.');

        // Eliminar
        await DBAppwrite.eliminar('ingredientes', prodId);
        await esperar(2000);
        const listaProd3 = await DBAppwrite.listar('ingredientes');
        const encontradoProdDel = listaProd3.find(p => p.id === prodId);
        resultado(!encontradoProdDel, 'Producto', 'Producto eliminado de Appwrite.');
      } catch (e) {
        resultado(false, 'Producto', 'Error: ' + e.message);
      }

      console.log('Tests automáticos completados.');
    }

    window.addEventListener('load', () => setTimeout(iniciarTests, 100));
  </script>
</body>
</html>
