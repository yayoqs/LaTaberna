<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test D – Despensa Automático (v5.0.2)</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f0f14; color: #f1f5f9; padding: 20px; }
    h1 { color: #f59e0b; }
    .resultado { background: #1a1a24; border-radius: 8px; padding: 12px 16px; margin: 8px 0; display: flex; align-items: center; gap: 12px; }
    .ok { border-left: 4px solid #22c55e; }
    .fallo { border-left: 4px solid #ef4444; }
    .seccion { color: #f59e0b; font-size: 13px; min-width: 100px; }
  </style>
</head>
<body>
  <h1>Test D – Despensa Automático (v5.0.2)</h1>
  <p style="color:#a0a0a0;">Flujo completo: insumos, proveedores (Appwrite) + entradas (local).</p>
  <div id="resultados"></div>
  <div id="toastContainer"></div>

  <script src="js/appwrite.min.js"></script>

  <script type="module" src="js/lib/logger.js"></script>
  <script type="module" src="js/lib/eventBus.js"></script>
  <script type="module" src="js/lib/store.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/utils.js"></script>
  <script type="module" src="js/db.js?v=1.1.0"></script>
  <script type="module" src="js/db-appwrite.js"></script>
  <script type="module" src="js/db-inventario.js?v=1.1.1"></script>
  <script type="module" src="js/dominio/cantidad.js?v=1.1.3"></script>
  <script type="module" src="js/dominio/dinero.js?v=1.1.3"></script>
  <script type="module" src="js/dominio/ingrediente.js"></script>
  <script type="module" src="js/servicios/inventario-service.js?v=1.2.2"></script>
  <script type="module" src="js/repositorios/inventario-repository.js?v=1.1.1"></script>
  <script type="module" src="js/repositorios/proveedor-repository.js?v=1.1.0"></script>

  <script type="module">
    import { DBAppwrite } from './js/db-appwrite.js';
    import { DB } from './js/db.js';
    import { InventarioService } from './js/servicios/inventario-service.js';
    import { crearInventarioRepo } from './js/repositorios/inventario-repository.js';
    import { crearProveedorRepo } from './js/repositorios/proveedor-repository.js';

    function resultado(ok, seccion, mensaje) {
      const div = document.createElement('div');
      div.className = 'resultado ' + (ok ? 'ok' : 'fallo');
      div.innerHTML = `<span>${ok ? '✔' : '✘'}</span><span class="seccion">[${seccion}]</span><span>${mensaje}</span>`;
      document.getElementById('resultados').appendChild(div);
    }

    async function esperar(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function iniciarTests() {
      if (!DBAppwrite.habilitado) await DBAppwrite.iniciar();
      if (!DBAppwrite.habilitado) {
        resultado(false, 'Inicio', 'No se pudo inicializar Appwrite. Abortando.');
        return;
      }
      resultado(true, 'Inicio', 'Appwrite inicializado correctamente.');

      const inventarioRepo = crearInventarioRepo();
      InventarioService.configurar(inventarioRepo);
      const proveedorRepo = crearProveedorRepo();

      // ── 1. PROVEEDORES ────────────────────────────────
      try {
        const prov = await proveedorRepo.guardarProveedor({
          nombre: 'Proveedor Test ' + Date.now(),
          tipo: 'distribuidor', contacto: 'Juan Pérez', telefono: '+56912345678',
          email: 'juan@test.cl', direccion: 'Av. Test 123', rubro: 'Lácteos',
          notas: 'Prueba automática', activo: true
        });
        const provId = prov.id;
        resultado(!!provId, 'Proveedor', 'Proveedor creado. ID: ' + provId);
        await esperar(2000);

        const listaProv = await DBAppwrite.listar('proveedores');
        const encontrado = listaProv.find(p => p.id === provId);
        resultado(!!encontrado, 'Proveedor', 'Proveedor encontrado en Appwrite.');
        resultado(encontrado.tipo === 'distribuidor' && encontrado.rubro === 'Lácteos', 'Proveedor', 'Campos nuevos en Appwrite.');

        const provEdit = await proveedorRepo.guardarProveedor({
          id: provId, nombre: 'Proveedor Editado ' + Date.now(), tipo: 'huerta',
          contacto: 'María Editada', telefono: '+56999999999', email: 'maria@editado.cl',
          direccion: 'Camino Editado 789', rubro: 'Verduras', notas: 'Editado', activo: true
        });
        resultado(provEdit.nombre !== prov.nombre, 'Proveedor', 'Proveedor editado localmente.');
        await esperar(2000);

        const listaProv2 = await DBAppwrite.listar('proveedores');
        const encontradoEdit = listaProv2.find(p => p.id === provId && p.nombre === provEdit.nombre && p.tipo === 'huerta');
        resultado(!!encontradoEdit, 'Proveedor', 'Edición reflejada en Appwrite.');

        await proveedorRepo.eliminarProveedor(provId);
        await esperar(2000);
        const listaProv3 = await DBAppwrite.listar('proveedores');
        resultado(!listaProv3.find(p => p.id === provId), 'Proveedor', 'Proveedor eliminado de Appwrite.');
      } catch (e) {
        resultado(false, 'Proveedor', 'Error: ' + e.message);
      }

      // ── 2. INSUMOS ────────────────────────────────────
      try {
        const insumo = await InventarioService.guardarInsumo({
          nombre: 'Insumo Test ' + Date.now(), stock: 10.5, stock_minimo: 2,
          unidad: 'kg', categoria: 'cocina', ubicacion: 'Estante Test',
          tipo: 'cocina', costo_manual: 850
        });
        const insumoId = insumo.datos?.id || insumo.datos?._id;
        resultado(!!insumoId, 'Insumo', 'Insumo creado. ID: ' + insumoId);
        await esperar(2000);

        const listaInsumos = await DBAppwrite.listar('insumos');
        const encontradoInsumo = listaInsumos.find(p => p.id === insumoId);
        resultado(!!encontradoInsumo, 'Insumo', 'Insumo encontrado en Appwrite.');
        resultado(encontradoInsumo?.tipo === 'cocina' && encontradoInsumo?.costo_manual == 850, 'Insumo', 'Campos nuevos en Appwrite.');

        const insumoEdit = await InventarioService.guardarInsumo({
          id: insumoId, nombre: 'Insumo Editado ' + Date.now(), stock: 8,
          stock_minimo: 1, unidad: 'kg', categoria: 'barra', ubicacion: 'Estante Editado',
          tipo: 'operativo', costo_manual: 900
        });
        resultado(insumoEdit.exito, 'Insumo', 'Insumo editado localmente.');
        await esperar(2000);

        const listaInsumos2 = await DBAppwrite.listar('insumos');
        const encontradoInsumoEdit = listaInsumos2.find(p => p.id === insumoId && p.nombre === insumoEdit.datos?.nombre && p.tipo === 'operativo');
        resultado(!!encontradoInsumoEdit, 'Insumo', 'Edición reflejada en Appwrite.');

        await DBAppwrite.eliminar('insumos', insumoId);
        await esperar(2000);
        const listaInsumos3 = await DBAppwrite.listar('insumos');
        resultado(!listaInsumos3.find(p => p.id === insumoId), 'Insumo', 'Insumo eliminado de Appwrite.');
      } catch (e) {
        resultado(false, 'Insumo', 'Error: ' + e.message);
      }

      // ── 3. ENTRADAS (local) ───────────────────────────
      try {
        // Usar el repositorio para crear una entrada local
        const entradaId = 'ent_' + Date.now();
        const entradaLocal = await inventarioRepo.guardarEntrada({
          insumoId: 'ins_test_local',
          proveedorId: 'prov_test_local',
          formato: 'Caja',
          cantidad: 10,
          unidad_por_formato: 2,
          costo_total: 17000,
          costo_unitario: 850,
          fecha: new Date().toISOString()
        });
        resultado(!!entradaLocal && !!entradaLocal.id, 'Entrada', 'Entrada creada en repositorio local.');

        // Verificar que se guardó en DB.entradas
        const entradasDB = DB.entradas || [];
        const encontradaLocal = entradasDB.find(e => e.id === entradaLocal.id);
        resultado(!!encontradaLocal, 'Entrada', 'Entrada persistida en DB.entradas.');

        // Verificar en localStorage
        const raw = localStorage.getItem('pubpos_entradas');
        const entradasLS = raw ? JSON.parse(raw) : [];
        const encontradaLS = entradasLS.find(e => e.id === entradaLocal.id);
        resultado(!!encontradaLS, 'Entrada', 'Entrada persistida en localStorage.');

        // Limpiar datos de prueba
        DB.entradas = entradasDB.filter(e => e.id !== entradaLocal.id);
        localStorage.setItem('pubpos_entradas', JSON.stringify(DB.entradas));
      } catch (e) {
        resultado(false, 'Entrada', 'Error: ' + e.message);
      }

      console.log('Tests automáticos completados.');
    }

    window.addEventListener('load', () => setTimeout(iniciarTests, 100));
  </script>
</body>
</html>
