<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test D – Recetas Unificado (Diagnóstico final)</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #1a1a1a; color: #e0e0e0; padding: 30px; max-width: 700px; margin: auto; }
    h1 { color: #f59e0b; }
    .resultado { background: #2a2a2a; border-radius: 8px; padding: 12px 16px; margin: 8px 0; display: flex; align-items: center; gap: 12px; }
    .ok { border-left: 4px solid #22c55e; }
    .fallo { border-left: 4px solid #ef4444; }
    .seccion { color: #f59e0b; font-size: 13px; min-width: 120px; }
  </style>
</head>
<body>
  <h1>Test D – Recetas (v2.0.2) — Diagnóstico final</h1>
  <p style="color:#a0a0a0; font-size:13px;">Prueba directa de la lógica de filtrado de recetas.</p>
  <div id="resultados"></div>

  <script>
    // ─── Mocks globales mínimos ───
    const Logger = { info: console.log, warn: console.warn, error: console.error };
    const EventBus = { events: {}, on(ev, cb) { (this.events[ev] = this.events[ev] || []).push(cb); }, emit(ev, data) { (this.events[ev] || []).forEach(cb => cb(data)); } };
    const Auth = { getRol() { return 'cocina'; }, getNombre() { return 'Test'; } };
    let toastMessages = [];
    function showToast(tipo, msg) { toastMessages.push({tipo, msg}); }
    window.fmtMoney = (val) => `$${val.toFixed(0)}`;

    // ─── Estado de prueba (igual que en el mock-store) ───
    const state = {
      productos: [
        { id: 'prod1', nombre: 'Hamburguesa', precio: 1500, categoria: 'Comidas', destino: 'cocina', activo: true }
      ],
      ingredientes: [
        { id: 'ing1', nombre: 'Pan', stock: 50, stock_minimo: 5, unidad: 'u', categoria: 'cocina', valor_unitario: 100 }
      ],
      recetas: [
        { productoId: 'prod1', ingredientes: [{ ingredienteId: 'ing1', cantidad: 1 }], instrucciones: 'Paso 1' }
      ]
    };

    // ─── Implementación exacta del filtro de recetas.js ───
    function filtrarProductos(productos, recetas, ingredientes, rol) {
      // 1. Filtrar por destino según rol
      if (rol === 'cocina') {
        productos = productos.filter(p => p.destino === 'cocina' || p.destino === 'ambos');
      } else if (rol === 'barra') {
        productos = productos.filter(p => p.destino === 'barra' || p.destino === 'ambos');
      }

      // 2. Solo productos con receta e ingredientes
      productos = productos.filter(prod => {
        const receta = recetas.find(r => r.productoId == prod.id);
        return receta && receta.ingredientes && receta.ingredientes.length > 0;
      });

      return productos;
    }

    function resultado(ok, seccion, mensaje) {
      const div = document.createElement('div');
      div.className = 'resultado ' + (ok ? 'ok' : 'fallo');
      div.innerHTML = `<span>${ok ? '✔' : '✘'}</span><span class="seccion">[${seccion}]</span><span>${mensaje}</span>`;
      document.getElementById('resultados').appendChild(div);
    }

    // ─── Ejecutar prueba ───
    const productosFiltrados = filtrarProductos(
      state.productos,
      state.recetas,
      state.ingredientes,
      'cocina'
    );

    console.log('Productos después del filtro:', productosFiltrados);
    resultado(productosFiltrados.length === 1, 'Filtro', 'Se encuentra 1 producto (Hamburguesa)');
    resultado(productosFiltrados[0].nombre === 'Hamburguesa', 'Filtro', 'El producto es Hamburguesa');
  </script>
</body>
</html>
