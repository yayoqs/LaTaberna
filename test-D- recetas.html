<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test D – Recetas Unificado</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #1a1a1a; color: #e0e0e0; padding: 30px; max-width: 700px; margin: auto; }
    h1 { color: #f59e0b; }
    .resultado { background: #2a2a2a; border-radius: 8px; padding: 12px 16px; margin: 8px 0; display: flex; align-items: center; gap: 12px; }
    .ok { border-left: 4px solid #22c55e; }
    .fallo { border-left: 4px solid #ef4444; }
    .seccion { color: #f59e0b; font-size: 13px; min-width: 120px; }
  </style>
</head>
<body>
  <h1>Test D – Recetas (v7.0)</h1>
  <p style="color:#a0a0a0; font-size:13px;">Modo administración y modo consulta unificados.</p>
  <div id="resultados"></div>

  <script>
    const Logger = { info: console.log, warn: console.warn, error: console.error };
    const EventBus = { events: {}, on(ev, cb) { (this.events[ev] = this.events[ev] || []).push(cb); }, emit(ev, data) { (this.events[ev] || []).forEach(cb => cb(data)); } };
    const Store = { state: {}, getState() { return this.state; }, subscribe() {} };
    let toastMessages = [];
    function showToast(tipo, msg) { toastMessages.push({tipo, msg}); }
    window.fmtMoney = (val) => `$${val.toFixed(0)}`;

    const DB = {
      recetas: [],
      productos: [],
      ingredientes: [],
      saveRecetas() {},
      syncGuardarReceta() {}
    };
  </script>

  <script src="js/ui/recetas.js"></script>

  <script>
    function resultado(ok, seccion, mensaje) {
      const div = document.createElement('div');
      div.className = 'resultado ' + (ok ? 'ok' : 'fallo');
      div.innerHTML = `<span>${ok ? '✔' : '✘'}</span><span class="seccion">[${seccion}]</span><span>${mensaje}</span>`;
      document.getElementById('resultados').appendChild(div);
    }

    async function iniciarTests() {
      const prodConReceta = {
        id: 'prod1', nombre: 'Hamburguesa', precio: 1500, categoria: 'Comidas', destino: 'cocina', activo: true
      };
      const ingPan = { id: 'ing1', nombre: 'Pan', stock: 50, stock_minimo: 5, unidad: 'u', categoria: 'cocina', valor_unitario: 100 };
      const ingCarne = { id: 'ing2', nombre: 'Carne molida', stock: 20, stock_minimo: 2, unidad: 'kg', categoria: 'cocina', valor_unitario: 500 };
      const receta = {
        id: 'rec1', productoId: 'prod1',
        ingredientes: [
          { ingredienteId: 'ing1', cantidad: 1 },
          { ingredienteId: 'ing2', cantidad: 0.2 }
        ],
        instrucciones: '1. Cocinar carne\n2. Armar hamburguesa'
      };

      Store.state = {
        productos: [prodConReceta],
        ingredientes: [ingPan, ingCarne],
        recetas: [receta]
      };
      DB.productos = [prodConReceta];
      DB.ingredientes = [ingPan, ingCarne];
      DB.recetas = [receta];

      // ── Modo administración ──────────────────────────
      window.Auth = { getRol() { return 'admin'; }, getNombre() { return 'Admin'; } };
      EventBus.emit('vista:cambiada', 'recetas');
      await new Promise(r => setTimeout(r, 100));
      resultado(document.getElementById('view-recetas') !== null, 'Admin', 'Vista creada');
      resultado(document.getElementById('btnNuevaReceta').style.display !== 'none', 'Admin', 'Botón Nueva Receta visible');

      Recetas.mostrarDetalle('prod1');
      await new Promise(r => setTimeout(r, 100));
      resultado(document.getElementById('btnEditarReceta').style.display !== 'none', 'Admin', 'Botón Editar visible en detalle');
      Recetas.cerrarDetalle();

      // ── Modo consulta (cocina) ───────────────────────
      window.Auth = { getRol() { return 'cocina'; }, getNombre() { return 'Cocinero'; } };
      Recetas.render(); // forzar re-render en modo consulta
      await new Promise(r => setTimeout(r, 100));
      resultado(document.getElementById('btnNuevaReceta').style.display === 'none', 'Consulta', 'Botón Nueva Receta oculto');

      Recetas.mostrarDetalle('prod1');
      await new Promise(r => setTimeout(r, 100));
      resultado(document.getElementById('btnEditarReceta').style.display === 'none', 'Consulta', 'Botón Editar oculto en detalle');
      // El botón Exportar PDF debe seguir visible
      const btnPDF = document.getElementById('btnExportarPDF');
      resultado(btnPDF && btnPDF.style.display !== 'none', 'Consulta', 'Botón Exportar PDF visible');
      Recetas.cerrarDetalle();

      // Limpiar
      const vista = document.getElementById('view-recetas');
      if (vista) vista.style.display = 'none';
      console.log('Tests unificados finalizados.');
    }

    window.addEventListener('load', () => setTimeout(iniciarTests, 200));
  </script>
</body>
</html>
