<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test Robusto - Diagnóstico Completo</title>
  <style>
    body { font-family: monospace; background: #1a1a24; color: #f1f5f9; padding: 20px; }
    h1 { color: #f59e0b; }
    h2 { color: #94a3b8; margin-top: 24px; }
    .test { margin: 4px 0; padding: 4px 8px; border-radius: 4px; }
    .pass { background: rgba(34,197,94,.2); }
    .fail { background: rgba(239,68,68,.2); }
    .warn { background: rgba(245,158,11,.2); }
    .info { color: #94a3b8; font-size: 12px; margin: 2px 0; }
    button { margin-top: 16px; padding: 12px 24px; background: #f59e0b; color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <h1>🧪 Test Robusto de Integridad</h1>
  <p class="info">Carga todos los scripts en orden y verifica cada módulo, función y operación CRUD.</p>
  <div id="results"></div>
  <button onclick="location.reload()">🔄 Ejecutar de nuevo</button>

  <!-- Cargar los scripts exactamente igual que index.html -->
  <script src="js/utils.js"></script>
  <script src="js/lib/logger.js"></script>
  <script src="js/lib/eventBus.js"></script>
  <script src="js/lib/command-bus.js"></script>
  <script src="js/lib/store.js"></script>
  <script src="js/lib/deps.js"></script>
  <script src="js/db-core.js"></script>
  <script src="js/db-inventario.js"></script>
  <script src="js/db-fusion.js"></script>
  <script src="js/appwrite.min.js"></script>
  <script src="js/init-appwrite.js"></script>
  <script src="js/db-appwrite.js"></script>
  <script src="js/db-shim.js"></script>
  <script src="js/db.js"></script>
  <script src="js/puente-appwrite.js"></script>

  <script>
    (function() {
      var resultsEl = document.getElementById('results');
      var passed = 0, failed = 0, warnings = 0;

      function assert(condition, msg, isWarning) {
        if (condition) {
          passed++;
          resultsEl.innerHTML += '<div class="test pass">✔ ' + msg + '</div>';
        } else if (isWarning) {
          warnings++;
          resultsEl.innerHTML += '<div class="test warn">⚠ ' + msg + '</div>';
        } else {
          failed++;
          resultsEl.innerHTML += '<div class="test fail">✘ ' + msg + '</div>';
        }
      }

      async function runTests() {
        resultsEl.innerHTML = '';
        Logger.setLevel('ERROR');

        // ==================== FASE 1: VERIFICACIÓN DE ARCHIVOS ====================
        resultsEl.innerHTML += '<h2>Fase 1: Carga de archivos</h2>';
        var scriptsEsperados = [
          'js/utils.js', 'js/lib/logger.js', 'js/lib/eventBus.js', 'js/lib/command-bus.js',
          'js/lib/store.js', 'js/lib/deps.js', 'js/db-core.js', 'js/db-inventario.js',
          'js/db-fusion.js', 'js/appwrite.min.js', 'js/init-appwrite.js', 'js/db-appwrite.js',
          'js/db-shim.js', 'js/db.js', 'js/puente-appwrite.js'
        ];
        for (var i = 0; i < scriptsEsperados.length; i++) {
          var archivo = scriptsEsperados[i];
          try {
            var res = await fetch(archivo, { method: 'HEAD' });
            assert(res.ok, 'Archivo accesible: ' + archivo, false);
          } catch(e) {
            assert(false, 'No se pudo acceder a: ' + archivo + ' (' + e.message + ')', false);
          }
        }

        // ==================== FASE 2: FUNCIONES GLOBALES ====================
        resultsEl.innerHTML += '<h2>Fase 2: Utilidades globales (utils.js)</h2>';
        assert(typeof $id === 'function', '$id() está definida');
        assert(typeof $val === 'function', '$val() está definida');
        assert(typeof fmtMoney === 'function', 'fmtMoney() está definida');
        assert(typeof fmtHoraCorta === 'function', 'fmtHoraCorta() está definida');
        assert(typeof fmtFechaCorta === 'function', 'fmtFechaCorta() está definida');
        assert(typeof showToast === 'function', 'showToast() está definida');
        assert(typeof calcularTotal === 'function', 'calcularTotal() está definida');

        // ==================== FASE 3: MÓDULOS DEL NÚCLEO ====================
        resultsEl.innerHTML += '<h2>Fase 3: Módulos del núcleo</h2>';
        assert(typeof Logger !== 'undefined', 'Logger');
        assert(typeof EventBus !== 'undefined', 'EventBus');
        assert(typeof Store !== 'undefined', 'Store');
        assert(typeof CommandBus !== 'undefined', 'CommandBus');
        assert(typeof Deps !== 'undefined', 'Deps');
        assert(typeof DBCore !== 'undefined', 'DBCore');
        assert(typeof DBInventario !== 'undefined', 'DBInventario');
        assert(typeof DBFusion !== 'undefined', 'DBFusion');

        // ==================== FASE 4: APPWRITE ====================
        resultsEl.innerHTML += '<h2>Fase 4: Appwrite</h2>';
        assert(typeof Appwrite !== 'undefined', 'SDK Appwrite cargado');
        assert(typeof DBAppwrite !== 'undefined', 'DBAppwrite módulo');
        assert(typeof DBShim !== 'undefined', 'DBShim módulo');
        assert(typeof DB !== 'undefined', 'DB orquestador');

        // ==================== FASE 5: CREDENCIALES ====================
        resultsEl.innerHTML += '<h2>Fase 5: Credenciales</h2>';
        var hab = localStorage.getItem('appwrite_habilitado') === 'true';
        var pid = localStorage.getItem('appwrite_project_id') || '';
        var key = localStorage.getItem('appwrite_api_key') || '';
        assert(hab, 'Habilitado');
        assert(pid.length > 0, 'Project ID');
        assert(key.length > 0, 'API Key');

        if (!hab || !pid || !key) {
          assert(false, 'Credenciales no configuradas. init-appwrite.js no se ejecutó.');
          return;
        }

        // ==================== FASE 6: INICIALIZACIÓN ====================
        resultsEl.innerHTML += '<h2>Fase 6: Inicialización de Appwrite</h2>';
        var appwriteOk = await DBAppwrite.init();
        assert(appwriteOk, 'DBAppwrite.init() exitoso');
        assert(DBAppwrite.habilitado === true, 'DBAppwrite.habilitado = true');
        if (!appwriteOk) return;

        // ==================== FASE 7: LISTADO DE COLECCIONES ====================
        resultsEl.innerHTML += '<h2>Fase 7: Lectura de colecciones</h2>';
        var prod = await DBAppwrite.listar('productos');
        assert(Array.isArray(prod) && prod.length > 0, 'Productos: ' + prod.length + ' docs');

        var ped = await DBAppwrite.listar('pedidos');
        assert(Array.isArray(ped), 'Pedidos: ' + ped.length + ' docs');

        var mes = await DBAppwrite.listar('mesas');
        assert(Array.isArray(mes), 'Mesas: ' + mes.length + ' docs');

        var ing = await DBAppwrite.listar('ingredientes');
        assert(Array.isArray(ing), 'Ingredientes: ' + ing.length + ' docs');

        var rec = await DBAppwrite.listar('recetas');
        assert(Array.isArray(rec), 'Recetas: ' + rec.length + ' docs');

        // ==================== FASE 8: INICIALIZACIÓN COMPLETA DE DB ====================
        resultsEl.innerHTML += '<h2>Fase 8: DB.init() simulado</h2>';
        window.Auth = window.Auth || { getEspacioActivo: function() { return { id: 'esp_taberna' }; } };
        window.PedidoManager = window.PedidoManager || { getTurnoActual: function() { return { id: 'test', estado: 'abierto' }; }, registrar: function() {} };

        DB._cargarConfigLocal();
        DB._inicializarMesas();
        DB.productos = prod.map(p => DB._normalizarProducto(p));
        DB.pedidos = ped;
        DB.mesas = mes.length ? mes.map(m => DB._normalizarMesa(m)) : DB.mesas;
        DB.ingredientes = ing.map(i => DB._normalizarIngrediente(i));
        DB.recetas = rec;

        Store.dispatch({ type: 'PRODUCTOS_INICIALIZAR', payload: DB.productos });
        Store.dispatch({ type: 'PEDIDOS_INICIALIZAR', payload: DB.pedidos });
        Store.dispatch({ type: 'MESAS_INICIALIZAR', payload: DB.mesas });
        Store.dispatch({ type: 'INGREDIENTES_INICIALIZAR', payload: DB.ingredientes });
        Store.dispatch({ type: 'RECETAS_INICIALIZAR', payload: DB.recetas });

        var state = Store.getState();
        assert(state.productos.length > 0, 'Store: productos');
        assert(state.mesas.length > 0, 'Store: mesas');
        assert(state.ingredientes.length > 0, 'Store: ingredientes');
        assert(state.recetas.length > 0, 'Store: recetas');

        // ==================== FASE 9: PRUEBA 
        // ==================== FASE 9: DIAGNÓSTICO AVANZADO (API CORRECTA) ====================
        resultsEl.innerHTML += '<h2>Fase 9: Diagnóstico avanzado (usando misma API que DBAppwrite)</h2>';
        
        // Activar el puente
        if (typeof activarPuenteAppwrite === 'function') {
          activarPuenteAppwrite();
          assert(true, 'Función activarPuenteAppwrite() ejecutada');
        } else {
          assert(false, 'activarPuenteAppwrite no está definida');
        }
        
        // Usar exactamente la misma inicialización que DBAppwrite.init()
        try {
          var client = new Appwrite.Client()
            .setEndpoint(localStorage.getItem('appwrite_endpoint'))
            .setProject(localStorage.getItem('appwrite_project_id'));
          var databases = new Appwrite.Databases(client, localStorage.getItem('appwrite_api_key'));
        
          var minDoc = {
            nombre: 'Test Min',
            precio: 100,
            categoria: 'Test',
            destino: 'cocina',
            activo: true
          };
        
          var creado = await databases.createDocument(
            '6a0275cb0022ebf7d30d',
            'Productos',
            'unique()',
            minDoc
          );
        
          if (creado && creado.$id) {
            assert(true, 'Documento mínimo creado directamente: ' + creado.$id);
            // Limpiar
            await databases.deleteDocument('6a0275cb0022ebf7d30d', 'Productos', creado.$id);
            assert(true, 'Documento de prueba eliminado');
          } else {
            assert(false, 'La creación no devolvió error pero tampoco un documento válido.');
          }
        } catch (e) {
          assert(false, 'Error al crear directamente: ' + e.message);
          resultsEl.innerHTML += '<div class="fail">Error detallado: ' + e.message + '</div>';
          if (e.message.indexOf('atributo') !== -1 || e.message.indexOf('attribute') !== -1) {
            resultsEl.innerHTML += '<div class="info">Parece que falta un atributo en la colección Productos. Revisa en Appwrite Console que tenga: nombre, precio, categoria, destino, activo (todos como requeridos o con valores por defecto).</div>';
          } else if (e.message.indexOf('permiso') !== -1 || e.message.indexOf('unauthorized') !== -1) {
            resultsEl.innerHTML += '<div class="info">Parece un error de permisos. Revisa que la API Key tenga los scopes databases.write y documents.write, y que la colección tenga el rol Any con Create/Read/Update/Delete.</div>';
          }
        }
        // ==================== FASE 10: VERIFICAR PUENTE ====================
        resultsEl.innerHTML += '<h2>Fase 10: Puente Appwrite</h2>';
        assert(typeof DB.syncGuardarProducto === 'function', 'DB.syncGuardarProducto existe');
        assert(typeof DB.syncEliminarProducto === 'function', 'DB.syncEliminarProducto existe');
        assert(typeof DB.syncGuardarIngrediente === 'function', 'DB.syncGuardarIngrediente existe');
        assert(typeof DB.syncEliminarIngrediente === 'function', 'DB.syncEliminarIngrediente existe');
        assert(typeof DB.syncGuardarReceta === 'function', 'DB.syncGuardarReceta existe');

        // ==================== FASE 11: EVENTBUS ====================
        resultsEl.innerHTML += '<h2>Fase 11: EventBus</h2>';
        var eventoRecibido = false;
        EventBus.on('test:robusto', function() { eventoRecibido = true; });
        EventBus.emit('test:robusto');
        assert(eventoRecibido, 'EventBus emite y recibe eventos');

        // ==================== RESUMEN FINAL ====================
        resultsEl.innerHTML += '<h2>Resultado Final</h2>';
        resultsEl.innerHTML += '<p>' + passed + ' pruebas pasaron, ' + failed + ' fallaron, ' + warnings + ' advertencias.</p>';
        if (failed === 0) {
          resultsEl.innerHTML += '<div class="pass">✔ Todos los módulos, la conexión Appwrite y las operaciones CRUD funcionan correctamente. El problema puede estar en la UI (revisa app.js o mesas.js).</div>';
        } else {
          resultsEl.innerHTML += '<div class="fail">✘ Se encontraron ' + failed + ' errores. Revisa los mensajes de arriba para identificar el módulo o archivo problemático.</div>';
        }
      }

      window.addEventListener('load', function() {
        setTimeout(runTests, 1500); // Esperar a que puente-appwrite.js se active
      });
    })();
  </script>
</body>
</html>
