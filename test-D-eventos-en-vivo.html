<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test D – Eventos en Vivo (Votación)</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #1a1a1a; color: #e0e0e0; padding: 30px; max-width: 700px; margin: auto; }
    h1 { color: #f59e0b; }
    .resultado { background: #2a2a2a; border-radius: 8px; padding: 12px 16px; margin: 8px 0; display: flex; align-items: center; gap: 12px; }
    .ok { border-left: 4px solid #22c55e; }
    .fallo { border-left: 4px solid #ef4444; }
    .seccion { color: #f59e0b; font-size: 13px; min-width: 120px; }
  </style>
</head>
<body>
  <h1>Test D – Eventos en Vivo (Votación)</h1>
  <p style="color:#a0a0a0; font-size:13px;">Flujo completo de votación: creación, envío de votos y actualización en tiempo real.</p>
  <div id="resultados"></div>

  <script>
    const Logger = { info: console.log, warn: console.warn, error: console.error };
    const EventBus = {
      events: {},
      on(ev, cb) { (this.events[ev] = this.events[ev] || []).push(cb); },
      emit(ev, data) { (this.events[ev] || []).forEach(cb => cb(data)); }
    };
    const Store = { state: {}, getState() { return this.state; }, subscribe() {} };
    const Auth = {
      _rol: 'artista',
      getRol() { return this._rol; },
      getNombre() { return 'Animador Test'; }
    };
    let toastMessages = [];
    function showToast(tipo, msg) { toastMessages.push({tipo, msg}); }

    let _docActual = null;
    const DBAppwrite = {
      async crear(coleccion, id, datos) {
        _docActual = { id: 'doc_votacion', ...datos };
        return _docActual;
      },
      async actualizar(coleccion, id, cambios) {
        if (cambios.datos) {
          _docActual.datos = { ..._docActual.datos, ...cambios.datos };
        }
        if (cambios.estado) {
          _docActual.estado = cambios.estado;
        }
        EventBus.emit('eventos_en_vivo:actualizada', { ..._docActual });
      }
    };
  </script>

  <script type="module" src="js/modulos/admin/eventos-en-vivo.js"></script>

  <script>
    function resultado(ok, seccion, mensaje) {
      const div = document.createElement('div');
      div.className = 'resultado ' + (ok ? 'ok' : 'fallo');
      div.innerHTML = `<span>${ok ? '✔' : '✘'}</span><span class="seccion">[${seccion}]</span><span>${mensaje}</span>`;
      document.getElementById('resultados').appendChild(div);
    }

    async function iniciarTests() {
      if (typeof window.EventosEnVivo === 'undefined') {
        await new Promise(r => setTimeout(r, 300));
      }
      if (typeof window.EventosEnVivo === 'undefined') {
        resultado(false, 'Carga', 'El módulo EventosEnVivo no se cargó');
        return;
      }

      EventBus.emit('vista:cambiada', 'eventos-en-vivo');
      await new Promise(r => setTimeout(r, 50));
      resultado(document.getElementById('view-eventos-en-vivo') !== null, 'Render', 'Vista creada');
      resultado(document.getElementById('estadoEvento').textContent.includes('Sin evento'), 'Render', 'Estado inicial sin evento');

      document.getElementById('selTipoEvento').value = 'votacion';
      await EventosEnVivo.crearEvento();
      resultado(document.getElementById('estadoEvento').textContent.includes('votacion'), 'Votación', 'Badge muestra votación');
      resultado(document.getElementById('estadoEvento').textContent.includes('configuracion'), 'Votación', 'Estado configuracion');

      await EventosEnVivo.cambiarEstado('activo');
      await new Promise(r => setTimeout(r, 50));
      resultado(document.getElementById('estadoEvento').textContent.includes('activo'), 'Votación', 'Estado activo');

      document.getElementById('nuevaOpcion').value = 'Opción A';
      await EventosEnVivo.agregarOpcion();
      await new Promise(r => setTimeout(r, 50));
      resultado(_docActual.datos.opciones.includes('Opción A'), 'Votación', 'Opción A registrada');

      document.getElementById('nuevaOpcion').value = 'Opción B';
      await EventosEnVivo.agregarOpcion();
      await new Promise(r => setTimeout(r, 50));
      resultado(_docActual.datos.opciones.includes('Opción B'), 'Votación', 'Opción B registrada');

      // ── Simular llegada de votos ──────────────────────
      // Voto inicial para Opción A
      await DBAppwrite.actualizar('eventos_en_vivo', 'doc_votacion', {
        datos: { resultados: { 'Opción A': 1, 'Opción B': 0 } }
      });
      await new Promise(r => setTimeout(r, 50));
      let listaVotos = document.querySelector('.votacion-lista');
      resultado(listaVotos !== null, 'Votos', 'Lista de opciones visible');
      resultado(listaVotos.textContent.includes('Opción A — 1 votos'), 'Votos', 'Opción A muestra 1 voto');
      resultado(listaVotos.textContent.includes('Opción B — 0 votos'), 'Votos', 'Opción B muestra 0 votos');

      // Voto adicional para Opción B
      await DBAppwrite.actualizar('eventos_en_vivo', 'doc_votacion', {
        datos: { resultados: { 'Opción A': 1, 'Opción B': 1 } }
      });
      await new Promise(r => setTimeout(r, 50));
      listaVotos = document.querySelector('.votacion-lista'); // Volver a obtener del DOM actualizado
      resultado(listaVotos.textContent.includes('Opción B — 1 votos'), 'Votos', 'Opción B ahora muestra 1 voto');

      // Múltiples votos acumulados
      await DBAppwrite.actualizar('eventos_en_vivo', 'doc_votacion', {
        datos: { resultados: { 'Opción A': 5, 'Opción B': 3 } }
      });
      await new Promise(r => setTimeout(r, 50));
      listaVotos = document.querySelector('.votacion-lista'); // Obtener de nuevo
      resultado(listaVotos.textContent.includes('Opción A — 5 votos'), 'Votos', 'Opción A muestra 5 votos acumulados');
      resultado(listaVotos.textContent.includes('Opción B — 3 votos'), 'Votos', 'Opción B muestra 3 votos acumulados');

      await EventosEnVivo.cambiarEstado('finalizado');
      await new Promise(r => setTimeout(r, 50));
      resultado(document.getElementById('estadoEvento').textContent.includes('finalizado'), 'Votación', 'Votación finalizada');

      const vista = document.getElementById('view-eventos-en-vivo');
      if (vista) vista.style.display = 'none';

      console.log('Todos los tests de votación en vivo finalizados.');
    }

    window.addEventListener('load', () => setTimeout(iniciarTests, 100));
  </script>
</body>
</html>
