<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test D – Eventos en Vivo</title>
  <style>
    body { font-family: sans-serif; background: #111; color: #eee; padding: 20px; }
    .test { margin: 10px 0; padding: 10px; border-left: 4px solid #666; }
    .pass { border-color: #4caf50; }
    .fail { border-color: #f44336; }
  </style>
</head>
<body>
  <h1>Test D – Eventos en Vivo</h1>
  <div id="resultados"></div>

  <!-- 1. Stubs del sistema -->
  <script>
    const Logger = { info: console.log, warn: console.warn, error: console.error };
    const EventBus = {
      events: {},
      on(ev, cb) { (this.events[ev] = this.events[ev] || []).push(cb); },
      emit(ev, data) { (this.events[ev] || []).forEach(cb => cb(data)); }
    };
    const Store = { state: {}, getState() { return this.state; }, subscribe() {} };
    const Auth = {
      _rol: 'artista',
      getRol() { return this._rol; },
      getNombre() { return 'Animador Test'; },
      esArtista() { return this._rol === 'artista'; },
      esEventos() { return this._rol === 'eventos'; },
      esAdmin() { return this._rol === 'admin'; },
      esMaster() { return this._rol === 'master'; }
    };
    let toastMessages = [];
    function showToast(tipo, msg) { toastMessages.push({tipo, msg}); }

    let _docActual = null;
    const DBAppwrite = {
      async crear(coleccion, id, datos) {
        _docActual = { id: 'doc_123', ...datos };
        this.ultimoCreado = { coleccion, id, datos };
        return _docActual;
      },
      async actualizar(coleccion, id, cambios) {
        _docActual = { ..._docActual, ...cambios };
        this.ultimaActualizacion = { coleccion, id, cambios };
        EventBus.emit('eventos_en_vivo:actualizada', _docActual);
      }
    };
  </script>

  <!-- 2. Función assert y batería de tests -->
  <script>
    function assert(cond, desc) {
      const div = document.createElement('div');
      div.className = 'test ' + (cond ? 'pass' : 'fail');
      div.textContent = (cond ? '✔' : '✘') + ' ' + desc;
      document.getElementById('resultados').appendChild(div);
    }

    async function iniciarTests() {
      // Esperar a que el módulo esté disponible en el ámbito global
      // (se expone como window.EventosEnVivo)
      if (typeof window.EventosEnVivo === 'undefined') {
        assert(false, 'El módulo EventosEnVivo no se cargó correctamente');
        return;
      }

      const EventosEnVivo = window.EventosEnVivo;

      // Test 1: Render inicial
      EventBus.emit('vista:cambiada', 'eventos-en-vivo');
      await new Promise(r => setTimeout(r, 50));
      assert(document.getElementById('view-eventos-en-vivo') !== null, 'La vista se crea');
      assert(document.getElementById('estadoEvento').textContent.includes('Sin evento'), 'Estado inicial sin evento');

      // Test 2: Crear bingo
      document.getElementById('selTipoEvento').value = 'bingo';
      await EventosEnVivo.crearEvento();
      assert(document.getElementById('estadoEvento').textContent.includes('bingo'), 'Badge muestra bingo');
      assert(document.getElementById('estadoEvento').textContent.includes('configuracion'), 'Estado inicial configuracion');

      // Test 3: Iniciar y cantar bola
      await EventosEnVivo.cambiarEstado('activo');
      await new Promise(r => setTimeout(r, 50));
      const btnCantar = document.querySelector('#zonaInteraccion .btn-primary');
      assert(btnCantar && !btnCantar.disabled, 'Botón Cantar bola habilitado');

      await EventosEnVivo.cantarBola();
      await new Promise(r => setTimeout(r, 50));
      const bolas = document.querySelectorAll('.bola');
      assert(bolas.length === 1, 'Aparece una bola tras cantar');
      assert(document.getElementById('estadoEvento').textContent.includes('activo'), 'Estado sigue activo');

      // Test 4: Finalizar y reiniciar
      await EventosEnVivo.cambiarEstado('finalizado');
      await new Promise(r => setTimeout(r, 50));
      assert(document.getElementById('estadoEvento').textContent.includes('finalizado'), 'Estado finalizado');
      const btnReiniciar = document.getElementById('btnReiniciar');
      assert(btnReiniciar.style.display !== 'none', 'Botón reiniciar visible');

      await EventosEnVivo.reiniciarEvento();
      await new Promise(r => setTimeout(r, 50));
      assert(document.getElementById('estadoEvento').textContent.includes('configuracion'), 'Reiniciado a configuracion');
      const bolasDespues = document.querySelectorAll('.bola');
      assert(bolasDespues.length === 0, 'Bolas limpiadas tras reiniciar');

      // Test 5: Karaoke
      document.getElementById('selTipoEvento').value = 'karaoke';
      await EventosEnVivo.crearEvento();
      await EventosEnVivo.cambiarEstado('activo');
      await new Promise(r => setTimeout(r, 50));
      document.getElementById('letraKaraoke').value = 'Estribillo de prueba';
      await EventosEnVivo.actualizarLetra();
      await new Promise(r => setTimeout(r, 50));
      assert(DBAppwrite.ultimaActualizacion.cambios.datos.letra === 'Estribillo de prueba', 'Letra guardada correctamente');

      await EventosEnVivo.limpiarLetra();
      await new Promise(r => setTimeout(r, 50));
      assert(DBAppwrite.ultimaActualizacion.cambios.datos.letra === '', 'Letra limpia correctamente');

      // Test 6: Votación
      document.getElementById('selTipoEvento').value = 'votacion';
      await EventosEnVivo.crearEvento();
      await EventosEnVivo.cambiarEstado('activo');
      await new Promise(r => setTimeout(r, 50));
      document.getElementById('nuevaOpcion').value = 'Opción A';
      await EventosEnVivo.agregarOpcion();
      await new Promise(r => setTimeout(r, 50));
      assert(DBAppwrite.ultimaActualizacion.cambios.datos.opciones.includes('Opción A'), 'Opción A agregada');

      document.getElementById('nuevaOpcion').value = 'Opción B';
      await EventosEnVivo.agregarOpcion();
      await new Promise(r => setTimeout(r, 50));
      await EventosEnVivo.eliminarUltimaOpcion();
      await new Promise(r => setTimeout(r, 50));
      assert(!DBAppwrite.ultimaActualizacion.cambios.datos.opciones.includes('Opción B'), 'Opción B eliminada');
      assert(DBAppwrite.ultimaActualizacion.cambios.datos.opciones.includes('Opción A'), 'Opción A permanece');

      // Test 7: Acceso denegado
      Auth._rol = 'cliente';
      EventBus.emit('vista:cambiada', 'otra');
      EventBus.emit('vista:cambiada', 'eventos-en-vivo');
      await new Promise(r => setTimeout(r, 50));
      const panel = document.getElementById('panelEventoVivo');
      assert(panel.textContent.includes('Acceso denegado'), 'Muestra acceso denegado para rol no autorizado');

      console.log('Todos los tests finalizados.');
    }
  </script>

  <!-- 3. Carga del módulo como ES6 -->
  <script type="module" src="js/modulos/admin/eventos-en-vivo.js"></script>

  <!-- 4. Arranque de los tests (esperar a que el módulo esté listo) -->
  <script>
    window.addEventListener('load', () => {
      // Pequeño retraso para asegurar que el módulo se haya ejecutado completamente
      setTimeout(iniciarTests, 100);
    });
  </script>
</body>
</html>
