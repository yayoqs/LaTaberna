<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test D – Eventos en Vivo</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #1a1a1a; color: #e0e0e0; padding: 30px; max-width: 700px; margin: auto; }
    h1 { color: #f59e0b; }
    .resultado { background: #2a2a2a; border-radius: 8px; padding: 12px 16px; margin: 8px 0; display: flex; align-items: center; gap: 12px; }
    .ok { border-left: 4px solid #22c55e; }
    .fallo { border-left: 4px solid #ef4444; }
    .seccion { color: #f59e0b; font-size: 13px; min-width: 110px; }
  </style>
</head>
<body>
  <h1>Test D – Eventos en Vivo</h1>
  <p style="color:#a0a0a0; font-size:13px;">Panel del animador: bingo, karaoke, votación y control de acceso.</p>
  <div id="resultados"></div>

  <script>
    // ─── Stubs del sistema ───────────────────────────────
    const Logger = { info: console.log, warn: console.warn, error: console.error };
    const EventBus = {
      events: {},
      on(ev, cb) { (this.events[ev] = this.events[ev] || []).push(cb); },
      emit(ev, data) { (this.events[ev] || []).forEach(cb => cb(data)); }
    };
    const Store = { state: {}, getState() { return this.state; }, subscribe() {} };
    const Auth = {
      _rol: 'artista',
      getRol() { return this._rol; },
      getNombre() { return 'Animador Test'; },
      esArtista() { return this._rol === 'artista'; },
      esEventos() { return this._rol === 'eventos'; },
      esAdmin() { return this._rol === 'admin'; },
      esMaster() { return this._rol === 'master'; }
    };
    let toastMessages = [];
    function showToast(tipo, msg) { toastMessages.push({tipo, msg}); }

    let _docActual = null;
    const DBAppwrite = {
      async crear(coleccion, id, datos) {
        _docActual = { id: 'doc_123', ...datos };
        this.ultimoCreado = { coleccion, id, datos };
        return _docActual;
      },
      async actualizar(coleccion, id, cambios) {
        _docActual = { ..._docActual, ...cambios };
        this.ultimaActualizacion = { coleccion, id, cambios };
        EventBus.emit('eventos_en_vivo:actualizada', _docActual);
      }
    };
  </script>

  <!-- Cargar el módulo como ES6 -->
  <script type="module" src="js/modulos/admin/eventos-en-vivo.js"></script>

  <script>
    function resultado(ok, seccion, mensaje) {
      const div = document.createElement('div');
      div.className = 'resultado ' + (ok ? 'ok' : 'fallo');
      div.innerHTML = `<span>${ok ? '✔' : '✘'}</span><span class="seccion">[${seccion}]</span><span>${mensaje}</span>`;
      document.getElementById('resultados').appendChild(div);
    }

    async function iniciarTests() {
      // Esperar a que el módulo esté disponible
      if (typeof window.EventosEnVivo === 'undefined') {
        await new Promise(r => setTimeout(r, 300));
      }
      if (typeof window.EventosEnVivo === 'undefined') {
        resultado(false, 'Carga', 'El módulo EventosEnVivo no se cargó');
        return;
      }

      // Test 1: Render inicial
      EventBus.emit('vista:cambiada', 'eventos-en-vivo');
      await new Promise(r => setTimeout(r, 50));
      resultado(document.getElementById('view-eventos-en-vivo') !== null, 'Render', 'La vista se crea');
      resultado(document.getElementById('estadoEvento').textContent.includes('Sin evento'), 'Render', 'Estado inicial sin evento');

      // Test 2: Crear bingo
      document.getElementById('selTipoEvento').value = 'bingo';
      await EventosEnVivo.crearEvento();
      resultado(document.getElementById('estadoEvento').textContent.includes('bingo'), 'Bingo', 'Badge muestra bingo');
      resultado(document.getElementById('estadoEvento').textContent.includes('configuracion'), 'Bingo', 'Estado inicial configuracion');

      // Test 3: Iniciar y cantar bola
      await EventosEnVivo.cambiarEstado('activo');
      await new Promise(r => setTimeout(r, 50));
      const btnCantar = document.querySelector('#zonaInteraccion .btn-primary');
      resultado(btnCantar && !btnCantar.disabled, 'Bingo', 'Botón Cantar bola habilitado');

      await EventosEnVivo.cantarBola();
      await new Promise(r => setTimeout(r, 50));
      const bolas = document.querySelectorAll('.bola');
      resultado(bolas.length === 1, 'Bingo', 'Aparece una bola tras cantar');
      resultado(document.getElementById('estadoEvento').textContent.includes('activo'), 'Bingo', 'Estado sigue activo');

      // Test 4: Finalizar y reiniciar
      await EventosEnVivo.cambiarEstado('finalizado');
      await new Promise(r => setTimeout(r, 50));
      resultado(document.getElementById('estadoEvento').textContent.includes('finalizado'), 'Bingo', 'Estado finalizado');
      const btnReiniciar = document.getElementById('btnReiniciar');
      resultado(btnReiniciar.style.display !== 'none', 'Bingo', 'Botón reiniciar visible');

      await EventosEnVivo.reiniciarEvento();
      await new Promise(r => setTimeout(r, 50));
      resultado(document.getElementById('estadoEvento').textContent.includes('configuracion'), 'Bingo', 'Reiniciado a configuracion');
      const bolasDespues = document.querySelectorAll('.bola');
      resultado(bolasDespues.length === 0, 'Bingo', 'Bolas limpiadas tras reiniciar');

      // Test 5: Karaoke
      document.getElementById('selTipoEvento').value = 'karaoke';
      await EventosEnVivo.crearEvento();
      await EventosEnVivo.cambiarEstado('activo');
      await new Promise(r => setTimeout(r, 50));
      document.getElementById('letraKaraoke').value = 'Estribillo de prueba';
      await EventosEnVivo.actualizarLetra();
      await new Promise(r => setTimeout(r, 50));
      resultado(DBAppwrite.ultimaActualizacion.cambios.datos.letra === 'Estribillo de prueba', 'Karaoke', 'Letra guardada correctamente');

      await EventosEnVivo.limpiarLetra();
      await new Promise(r => setTimeout(r, 50));
      resultado(DBAppwrite.ultimaActualizacion.cambios.datos.letra === '', 'Karaoke', 'Letra limpia correctamente');

      // Test 6: Votación
      document.getElementById('selTipoEvento').value = 'votacion';
      await EventosEnVivo.crearEvento();
      await EventosEnVivo.cambiarEstado('activo');
      await new Promise(r => setTimeout(r, 50));
      document.getElementById('nuevaOpcion').value = 'Opción A';
      await EventosEnVivo.agregarOpcion();
      await new Promise(r => setTimeout(r, 50));
      resultado(DBAppwrite.ultimaActualizacion.cambios.datos.opciones.includes('Opción A'), 'Votación', 'Opción A agregada');

      document.getElementById('nuevaOpcion').value = 'Opción B';
      await EventosEnVivo.agregarOpcion();
      await new Promise(r => setTimeout(r, 50));
      await EventosEnVivo.eliminarUltimaOpcion();
      await new Promise(r => setTimeout(r, 50));
      resultado(!DBAppwrite.ultimaActualizacion.cambios.datos.opciones.includes('Opción B'), 'Votación', 'Opción B eliminada');
      resultado(DBAppwrite.ultimaActualizacion.cambios.datos.opciones.includes('Opción A'), 'Votación', 'Opción A permanece');

      // Test 7: Acceso denegado
      Auth._rol = 'cliente';
      EventBus.emit('vista:cambiada', 'otra');
      EventBus.emit('vista:cambiada', 'eventos-en-vivo');
      await new Promise(r => setTimeout(r, 50));
      const panel = document.getElementById('panelEventoVivo');
      resultado(panel.textContent.includes('Acceso denegado'), 'Acceso', 'Muestra acceso denegado para rol no autorizado');

      // Ocultar la vista para limpiar la interfaz
      const vista = document.getElementById('view-eventos-en-vivo');
      if (vista) vista.style.display = 'none';

      console.log('Todos los tests de eventos en vivo finalizados.');
    }

    window.addEventListener('load', () => setTimeout(iniciarTests, 100));
  </script>
</body>
</html>
