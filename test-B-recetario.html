<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test B — Recetario Unificado (ES6 v2.0.2)</title>
  <style>
    body { font-family: monospace; background: #1a1a24; color: #f1f5f9; padding: 20px; }
    h1 { color: #f59e0b; }
    .suite { margin-bottom: 24px; border-bottom: 1px solid #2e2e42; padding-bottom: 12px; }
    .test { margin: 4px 0; padding: 4px 8px; border-radius: 4px; }
    .pass { background: rgba(34,197,94,.2); }
    .fail { background: rgba(239,68,68,.2); }
    .summary { margin-top: 20px; font-weight: bold; }
    .info { color: #94a3b8; font-size: 12px; margin: 2px 0; }
    .error { color: #ef4444; }
  </style>
</head>
<body>
  <h1>🧪 Test B — Recetario Unificado (ES6 v2.0.2)</h1>
  <p class="info">Valida que Recetas.render('consulta') muestre recetas correctamente y maneje el caso sin datos.</p>
  <div id="results"></div>

  <script type="module">
    import { Store } from '../js/lib/store.js';
    import { Auth } from '../js/auth.js';
    import { DB } from '../js/db.js';
    import { Logger } from '../js/lib/logger.js';
    import { Recetas } from '../js/ui/recetas.js';

    Logger.setLevel('ERROR');

    // ── Configuración de mocks ──────────────────────────
    // State base
    const stateBase = {
      productos: DB.productos || [],
      recetas: DB.recetas || [],
      ingredientes: DB.ingredientes || []
    };
    Store.getState = () => ({ ...stateBase, productos: DB.productos, recetas: DB.recetas, ingredientes: DB.ingredientes });
    Store.subscribe = () => {};

    Auth.getRol = () => 'admin';

    // Datos iniciales
    DB.productos = [{ id: 'prod_1', nombre: 'Hamburguesa', activo: true, destino: 'cocina' }];
    DB.recetas = [
      { productoId: 'prod_1', ingredientes: [{ ingredienteId: 'ing_a', cantidad: 200, unidad: 'g' }], instrucciones: 'Cocinar 10 min' }
    ];
    DB.ingredientes = [{ id: 'ing_a', nombre: 'Carne', unidad: 'g', stock: 1000, valor_unitario: 0.05 }];

    const resultsEl = document.getElementById('results');
    let passed = 0, failed = 0;
    function assert(cond, msg) {
      if (cond) { passed++; resultsEl.innerHTML += '<div class="test pass">✔ ' + msg + '</div>'; }
      else { failed++; resultsEl.innerHTML += '<div class="test fail">✘ ' + msg + '</div>'; }
    }
    const esperar = (ms) => new Promise(res => setTimeout(res, ms));

    async function runTests() {
      resultsEl.innerHTML = '';

      // Asegurar toastContainer
      if (!document.getElementById('toastContainer')) {
        const tc = document.createElement('div'); tc.id = 'toastContainer'; document.body.appendChild(tc);
      }

      // ── Suite 1: Render con recetas ──────────────────
      resultsEl.innerHTML += '<div class="suite"><h2>1. Render con recetas</h2></div>';
      Recetas.render('consulta');
      await esperar(50);

      const tarjeta = document.querySelector('.receta-card');
      assert(!!tarjeta, 'Aparece tarjeta de receta');
      if (tarjeta) {
        assert(tarjeta.textContent.includes('Hamburguesa'), 'Muestra nombre del producto');
        // Probar detalle
        tarjeta.click();
        await esperar(150);
        const modal = document.getElementById('modalRecetaDetalle');
        assert(!!modal && modal.style.display === 'flex', 'Modal de detalle abierto');
        const contenido = modal ? modal.textContent : '';
        assert(contenido.includes('Carne'), 'Muestra ingrediente');
        assert(contenido.includes('200'), 'Muestra cantidad');
        assert(contenido.includes('Cocinar 10 min'), 'Muestra instrucciones');
        // Cerrar detalle
        document.getElementById('btnCerrarDetalle')?.click();
        await esperar(50);
      }

      // ── Suite 2: Sin recetas ──────────────────────────
      resultsEl.innerHTML += '<div class="suite"><h2>2. Vista sin recetas</h2></div>';
      DB.recetas = [];
      Recetas.render('consulta');
      await esperar(50);
      const grid = document.getElementById('recetasGrid');
      assert(!!grid, 'El grid existe');
      assert(grid.textContent.includes('No se encontraron recetas'), 'Muestra mensaje de vacío');

      // Limpiar
      document.getElementById('view-recetas')?.remove();
      document.querySelectorAll('.modal-overlay').forEach(o => o.remove());

      resultsEl.innerHTML += `<div class="summary">${passed} pasaron, ${failed} fallaron</div>`;
      if (failed === 0) resultsEl.innerHTML += '<div class="test pass">✔ Todos los tests del recetario unificado v2.0.2 pasaron.</div>';
    }

    window.addEventListener('load', () => runTests().catch(e => {
      resultsEl.innerHTML += `<div class="error">Error en tests: ${e.message}</div>`;
      console.error(e);
    }));
  </script>
</body>
</html>
