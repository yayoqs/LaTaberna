<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test B — Recetario Unificado</title>
  <style>
    body { font-family: monospace; background: #1a1a24; color: #f1f5f9; padding: 20px; }
    h1 { color: #f59e0b; }
    .suite { margin-bottom: 24px; border-bottom: 1px solid #2e2e42; padding-bottom: 12px; }
    .test { margin: 4px 0; padding: 4px 8px; border-radius: 4px; }
    .pass { background: rgba(34,197,94,.2); }
    .fail { background: rgba(239,68,68,.2); }
    .summary { margin-top: 20px; font-weight: bold; }
    .info { color: #94a3b8; font-size: 12px; margin: 2px 0; }
    .error { color: #ef4444; }
  </style>
</head>
<body>
  <h1>🧪 Test B — Recetario Unificado</h1>
  <p class="info">Valida que el módulo unificado Recetas.render('consulta') muestre recetas correctamente y maneje el caso sin datos.</p>
  <div id="results"></div>

  <!-- Mocks tempranos para evitar errores -->
  <script>
    window.DBInventario = {
      validarStockParaItems: function() { return { ok: true, faltantes: [] }; }
    };
    window.DBFusion = {
      fusionarMesas: function() { return null; }
    };
  </script>

  <!-- Dependencias básicas -->
  <script src="/js/utils.js"></script>
  <script src="/js/lib/logger.js"></script>
  <script src="/js/lib/eventBus.js"></script>
  <script src="/js/lib/store.js"></script>
  <script src="/js/lib/command-bus.js"></script>
  <script src="/js/lib/deps.js"></script>
  <script src="/js/dominio/resultado.js"></script>
  <script src="/js/dominio/dinero.js"></script>
  <script src="/js/dominio/cantidad.js"></script>
  <script src="/js/db-core.js"></script>
  <script src="/js/db-appwrite.js"></script>
  <script src="/js/puente-appwrite.js"></script>
  <script src="/js/db.js"></script>

  <!-- Mock del módulo unificado Recetas (simula lo que hace la Célula D) -->
  <script>
    window.Recetas = {
      render: function(modo) {
        if (modo !== 'consulta') return;

        // Eliminar vista anterior si existe
        var vieja = document.getElementById('view-recetario');
        if (vieja) vieja.remove();

        var main = document.createElement('main');
        main.id = 'view-recetario';
        main.className = 'view';
        main.innerHTML = `
          <div class="view-toolbar">
            <h2><i class="fas fa-book"></i> Recetario (consulta)</h2>
            <button class="btn-secondary" onclick="Recetas.render('consulta')">
              <i class="fas fa-sync-alt"></i> Actualizar
            </button>
          </div>
          <div id="recetarioGrid" class="recetario-grid"></div>
        `;
        document.body.appendChild(main);

        var grid = document.getElementById('recetarioGrid');
        if (!grid) return;

        // Obtener datos desde DB (mockeado en el test)
        var recetas = window.DB && window.DB.recetas ? window.DB.recetas : [];
        if (!recetas.length) {
          grid.innerHTML = '<p style="color:var(--color-text-muted);">No hay recetas disponibles.</p>';
          return;
        }

        var html = '';
        recetas.forEach(function(receta) {
          var producto = (window.DB.productos || []).find(function(p) { return p.id === receta.productoId; });
          var nombreProducto = producto ? producto.nombre : receta.productoId;
          var ingredientes = Array.isArray(receta.ingredientes) ? receta.ingredientes : [];
          var ingHTML = '';
          ingredientes.forEach(function(ing) {
            var ingData = (window.DB.ingredientes || []).find(function(i) { return i.id === ing.ingredienteId; });
            var nombreIng = ingData ? ingData.nombre : ing.ingredienteId;
            var unidad = ingData ? ingData.unidad : '';
            ingHTML += '<li>' + nombreIng + ': ' + ing.cantidad + ' ' + unidad + '</li>';
          });
          html += `
            <div class="receta-card">
              <h3>${nombreProducto}</h3>
              ${receta.instrucciones ? '<p class="receta-instr">' + receta.instrucciones + '</p>' : ''}
              <ul>${ingHTML || '<li>Sin ingredientes</li>'}</ul>
            </div>
          `;
        });
        grid.innerHTML = html;
      }
    };
  </script>

  <script>
    (function() {
      var resultsEl = document.getElementById('results');
      var passed = 0, failed = 0;

      function assert(condition, msg) {
        if (condition) {
          passed++;
          resultsEl.innerHTML += '<div class="test pass">✔ ' + msg + '</div>';
        } else {
          failed++;
          resultsEl.innerHTML += '<div class="test fail">✘ ' + msg + '</div>';
        }
      }

      function esperar(ms) {
        return new Promise(function(resolve) { setTimeout(resolve, ms); });
      }

      async function runTests() {
        resultsEl.innerHTML = '';
        Logger.setLevel('ERROR');

        // ── Configurar mocks ──────────────────────────
        window.DB = window.DB || {};
        DB.recetas = [];
        DB.productos = [];
        DB.ingredientes = [];

        // ── Suite 1: Render con recetas ───────────────
        resultsEl.innerHTML += '<div class="suite"><h2>1. Render con recetas</h2></div>';

        DB.recetas = [
          { productoId: 'prod_1', ingredientes: [{ ingredienteId: 'ing_a', cantidad: 200, unidad: 'g' }], instrucciones: 'Cocinar 10 min' }
        ];
        DB.productos = [{ id: 'prod_1', nombre: 'Hamburguesa' }];
        DB.ingredientes = [{ id: 'ing_a', nombre: 'Carne', unidad: 'g' }];

        window.Recetas.render('consulta');
        await esperar(50);

        var tarjeta = document.querySelector('.receta-card');
        assert(!!tarjeta, 'Aparece tarjeta de receta');
        if (tarjeta) {
          assert(tarjeta.textContent.includes('Hamburguesa'), 'Muestra nombre del producto');
          assert(tarjeta.textContent.includes('Carne'), 'Muestra ingrediente');
          assert(tarjeta.textContent.includes('200'), 'Muestra cantidad');
        }

        // ── Suite 2: Sin recetas ──────────────────────
        resultsEl.innerHTML += '<div class="suite"><h2>2. Vista sin recetas</h2></div>';

        DB.recetas = [];
        window.Recetas.render('consulta');
        await esperar(50);

        var grid = document.getElementById('recetarioGrid');
        assert(!!grid, 'El grid existe');
        assert(grid.textContent.includes('No hay recetas'), 'Muestra mensaje de vacío');

        // ── Limpiar DOM ───────────────────────────────
        var main = document.getElementById('view-recetario');
        if (main) main.remove();

        // ── Resumen ───────────────────────────────────
        resultsEl.innerHTML += '<div class="summary">' + passed + ' pasaron, ' + failed + ' fallaron</div>';
        if (failed === 0) {
          resultsEl.innerHTML += '<div class="test pass">✔ Todos los tests del recetario unificado pasaron.</div>';
        }
      }

      window.addEventListener('load', function() {
        runTests().catch(function(e) {
          resultsEl.innerHTML += '<div class="error">Error en tests: ' + e.message + '</div>';
          console.error(e);
        });
      });
    })();
  </script>
</body>
</html>
