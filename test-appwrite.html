<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test de Conexión Appwrite - La Taberna</title>
  <style>
    body { font-family: monospace; background: #1a1a24; color: #f1f5f9; padding: 20px; }
    h1 { color: #f59e0b; }
    .suite { margin-bottom: 24px; border-bottom: 1px solid #2e2e42; padding-bottom: 12px; }
    .test { margin: 4px 0; padding: 4px 8px; border-radius: 4px; }
    .pass { background: rgba(34,197,94,.2); }
    .fail { background: rgba(239,68,68,.2); }
    .summary { margin-top: 20px; font-weight: bold; }
    .info { color: #94a3b8; font-size: 12px; margin: 2px 0; }
    button { margin-top: 20px; padding: 12px 24px; background: #f59e0b; color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <h1>🧪 Test de Conexión Appwrite (Database ID correcto)</h1>
  <p class="info">Usa el Database ID definitivo: 6a0275cb0022ebf7d30d</p>
  <div id="results"></div>
  <button onclick="location.reload()">🔄 Ejecutar de nuevo</button>

  <script src="js/appwrite.min.js"></script>

  <script>
    (function() {
      var resultsEl = document.getElementById('results');
      var passed = 0, failed = 0;
      var DATABASE_ID = '6a0275cb0022ebf7d30d';

      function assert(condition, msg) {
        if (condition) {
          passed++;
          resultsEl.innerHTML += '<div class="test pass">✔ ' + msg + '</div>';
        } else {
          failed++;
          resultsEl.innerHTML += '<div class="test fail">✘ ' + msg + '</div>';
        }
      }

      async function runTests() {
        resultsEl.innerHTML = '';

        if (typeof Appwrite === 'undefined') {
          resultsEl.innerHTML += '<div class="fail">❌ SDK no cargado.</div>';
          return;
        }

        var endpoint = localStorage.getItem('appwrite_endpoint') || 'https://tor.cloud.appwrite.io/v1';
        var projectId = localStorage.getItem('appwrite_project_id') || '';
        var apiKey = localStorage.getItem('appwrite_api_key') || '';
        var habilitado = localStorage.getItem('appwrite_habilitado') === 'true';

        resultsEl.innerHTML += '<div class="suite"><h2>1. Credenciales</h2></div>';
        assert(habilitado, 'Habilitado');
        assert(projectId.length > 0, 'Project ID');
        assert(apiKey.length > 0, 'API Key');
        if (!habilitado || !projectId || !apiKey) return;

        var client;
        try {
          client = new Appwrite.Client().setEndpoint(endpoint).setProject(projectId);
          assert(true, 'Cliente creado');
        } catch(e) { assert(false, 'Error: '+e.message); return; }

        try {
          await client.ping();
          assert(true, 'Ping exitoso');
        } catch(e) { assert(false, 'Fallo ping: '+e.message); }

        var databases;
        try {
          databases = new Appwrite.Databases(client, apiKey);
          assert(true, 'Databases iniciado');
        } catch(e) { assert(false, 'Error Databases: '+e.message); return; }

        resultsEl.innerHTML += '<div class="suite"><h2>2. Acceso a colección Pedidos</h2></div>';
        try {
          var lista = await databases.listDocuments(DATABASE_ID, 'Pedidos');
          assert(true, 'Conexión exitosa (documentos en Pedidos: ' + lista.total + ')');
        } catch(e) {
          assert(false, 'Error: ' + e.message);
        }

        resultsEl.innerHTML += '<div class="suite"><h2>3. Prueba CRUD</h2></div>';
        try {
          var doc = {
            mesa: 999, mozo: 'Test', comensales: 1, estado: 'abierta',
            items: '[]', total: 0,
            created_at: new Date().toISOString(),
            updated_at: new Date().toISOString()
          };
          var creado = await databases.createDocument(DATABASE_ID, 'Pedidos', 'unique()', doc);
          assert(!!creado.$id, 'Creado');
          var leido = await databases.getDocument(DATABASE_ID, 'Pedidos', creado.$id);
          assert(leido.mesa === 999, 'Lectura correcta');
          await databases.deleteDocument(DATABASE_ID, 'Pedidos', creado.$id);
          assert(true, 'Eliminado');
        } catch(e) {
          assert(false, 'Error CRUD: ' + e.message);
        }

        resultsEl.innerHTML += '<div class="summary">' + passed + ' pasaron, ' + failed + ' fallaron</div>';
      }

      window.addEventListener('load', runTests);
    })();
  </script>
</body>
</html>
