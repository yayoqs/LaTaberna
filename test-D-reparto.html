<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test D – Reparto (Pedidos Unificados)</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f0f14; color: #f1f5f9; padding: 20px; }
    h1 { color: #f59e0b; }
    .resultado { background: #1a1a24; border-radius: 8px; padding: 12px 16px; margin: 8px 0; display: flex; align-items: center; gap: 12px; }
    .ok { border-left: 4px solid #22c55e; }
    .fallo { border-left: 4px solid #ef4444; }
    .seccion { color: #f59e0b; font-size: 13px; min-width: 120px; }
  </style>
</head>
<body>
  <h1>Test D – Reparto (Pedidos Unificados)</h1>
  <p style="color:#a0a0a0;">Prueba de filtro por tipo 'reparto' en laTaberna_Pedidos y protección contra IDs nulos.</p>
  <div id="resultados"></div>
  <div id="toastContainer"></div>

  <script src="js/appwrite.min.js"></script>
  <script type="module" src="js/lib/logger.js"></script>
  <script type="module" src="js/lib/eventBus.js"></script>
  <script type="module" src="js/lib/store.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/utils.js"></script>
  <script type="module" src="js/db.js?v=1.1.0"></script>
  <script type="module" src="js/db-appwrite.js"></script>

  <!-- Inyectar pedidos de prueba en el Store -->
  <script type="module">
    import { Store } from './js/lib/store.js';
    import { DB } from './js/db.js';

    const pedidosDePrueba = [
      { id:'ped1', tipo:'reparto', direccion:'Av. Siempre Viva 742', telefono:'123456789',
        items:[{nombre:'Hamburguesa', precio:1500, qty:1}], total:1500, estado:'pendiente', repartidor:'Juan', creadoEn: new Date().toISOString() },
      { id:'ped2', tipo:'local', direccion:'Mesa 3', telefono:'', items:[], total:0, estado:'abierta', repartidor:'', creadoEn: new Date().toISOString() },
      null,
      { id:null, tipo:'reparto', direccion:'Calle Falsa', telefono:'000', items:[], total:0, estado:'pendiente', repartidor:'Nadie', creadoEn: new Date().toISOString() }
    ];

    Store.despachar({ type: 'PEDIDOS_INICIALIZAR', payload: pedidosDePrueba });
    DB.pedidos = [...pedidosDePrueba];
  </script>

  <!-- Módulo real de reparto -->
  <script type="module" src="js/ui/reparto.js"></script>

  <script type="module">
    import { Store } from './js/lib/store.js';
    import { Reparto } from './js/ui/reparto.js';

    function resultado(ok, seccion, mensaje) {
      const div = document.createElement('div');
      div.className = 'resultado ' + (ok ? 'ok' : 'fallo');
      div.innerHTML = `<span>${ok ? '✔' : '✘'}</span><span class="seccion">[${seccion}]</span><span>${mensaje}</span>`;
      document.getElementById('resultados').appendChild(div);
    }

    async function iniciarTests() {
      Reparto.render();
      await new Promise(r => setTimeout(r, 300));

      const filas = document.querySelectorAll('#repartoBody tr');
      
      // Solo debe aparecer el pedido con tipo 'reparto' y ID válido
      resultado(filas.length === 1, 'Filtro', 'Solo se muestra 1 pedido (tipo reparto, ID válido)');
      resultado(!document.querySelector('#repartoBody')?.textContent.includes('Calle Falsa'), 'Protección', 'Pedido con ID nulo no aparece');
      resultado(!document.querySelector('#repartoBody')?.textContent.includes('Mesa 3'), 'Filtro', 'Pedido local no aparece en vista reparto');
      // ✅ Ajuste: la dirección se renderiza completa
      resultado(document.querySelector('#repartoBody')?.textContent.includes('Av. Siempre Viva 742'), 'Render', 'Pedido de reparto visible correctamente');

      document.getElementById('view-reparto').style.display = 'none';
      console.log('Tests de reparto completados.');
    }

    window.addEventListener('load', () => setTimeout(iniciarTests, 100));
  </script>
</body>
</html>
