<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test B — KDS (Monitor de Cocina) – v5.0.1 (ES6)</title>
  <style>
    body { font-family: monospace; background: #1a1a24; color: #f1f5f9; padding: 20px; }
    h1 { color: #f59e0b; }
    .suite { margin-bottom: 24px; border-bottom: 1px solid #2e2e42; padding-bottom: 12px; }
    .test { margin: 4px 0; padding: 4px 8px; border-radius: 4px; }
    .pass { background: rgba(34,197,94,.2); }
    .fail { background: rgba(239,68,68,.2); }
    .summary { margin-top: 20px; font-weight: bold; }
    .info { color: #94a3b8; font-size: 12px; margin: 2px 0; }
    .error { color: #ef4444; }
  </style>
</head>
<body>
  <h1>🧪 Test B — KDS (Monitor de Cocina) – v5.0.1 (ES6)</h1>
  <p class="info">Valida botón de pánico, acceso al recetario unificado, división de ambos, urgencia, cambio de estado y vista vacía.</p>
  <div id="results"></div>

  <script type="module">
    import { Store } from '../js/lib/store.js';
    import { EventBus } from '../js/lib/eventBus.js';
    import { Auth } from '../js/auth.js';
    import { DBAppwrite } from '../js/db-appwrite.js';
    import { Logger } from '../js/lib/logger.js';
    import { $id, showToast } from '../js/utils.js';
    import { KDS } from '../js/ui/kds.js';
    import { Recetas } from '../js/ui/recetas.js';
    import { DB } from '../js/db.js';

    Logger.setLevel('ERROR');
    window.Logger = Logger;  // por si algún módulo aún busca Logger global

    // ── Configuración de mocks mutables ──────────────────
    Auth.getRol = () => Auth._rol || 'admin';
    Auth._rol = 'admin';

    let ultimaActualizacion = null;
    DBAppwrite.actualizar = (col, id, cambios) => {
      ultimaActualizacion = { col, id, cambios };
      return Promise.resolve(true);
    };

    // Estado de comandas controlado
    let comandasStore = [];
    const originalGetState = Store.getState;
    const originalDispatch = Store.dispatch;
    Store.getState = () => {
      const state = originalGetState.call(Store);
      return {
        ...state,
        comandas: comandasStore,
        productos: DB.productos || [],
        recetas: DB.recetas || [],
        ingredientes: DB.ingredientes || []
      };
    };
    Store.dispatch = (action) => {
      if (action.type === 'COMANDA_ACTUALIZADA') {
        const c = comandasStore.find(x => x.id === action.payload.id);
        if (c) Object.assign(c, action.payload.cambios);
      }
      originalDispatch.call(Store, action);
    };

    // Datos base de DB para que funcione Recetas.render
    DB.productos = [
      { id: 'prod_a', nombre: 'Papas fritas', disponible: true, activo: true, destino: 'cocina' }
    ];
    DB.recetas = [
      { productoId: 'prod_a', ingredientes: [{ ingredienteId: 'ing_a', cantidad: 200, unidad: 'g' }], instrucciones: 'Freir 5 min' }
    ];
    DB.ingredientes = [{ id: 'ing_a', nombre: 'Papa', unidad: 'g', stock: 1000, valor_unitario: 0.05 }];
    DB.mesas = [{ numero: 1, estado: 'ocupada', pedidoId: 'p1' }];
    DB.config = { zonas: [{ nombre: 'salon', cantidad: 5 }] };
    DB.mozos = [{ id: 'm1', nombre: 'Carlos', activo: true }];
    DB.pedidos = [];
    DB.comandas = [];
    DB.saveMesas = () => {};
    DB.saveComandas = () => {};
    DB.getMesa = (num) => DB.mesas.find(m => m.numero == num);

    window.DB = DB; // para compatibilidad con utilidades si es necesario
    window.confirm = () => true;

    // ── Resultados y utilidades ─────────────────────────
    const resultsEl = document.getElementById('results');
    let passed = 0, failed = 0;
    function assert(condition, msg) {
      if (condition) { passed++; resultsEl.innerHTML += '<div class="test pass">✔ ' + msg + '</div>'; }
      else { failed++; resultsEl.innerHTML += '<div class="test fail">✘ ' + msg + '</div>'; }
    }
    const esperar = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    async function runTests() {
      resultsEl.innerHTML = '';
      const ahora = Date.now();

      // Crear contenedor toast si no existe
      if (!$id('toastContainer')) {
        const tc = document.createElement('div'); tc.id = 'toastContainer'; document.body.appendChild(tc);
      }

      // ── Suite 1: Botón de pánico ────────────────────
      resultsEl.innerHTML += '<div class="suite"><h2>1. Botón de pánico por ítem</h2></div>';
      comandasStore = [{
        id: 'com_1', mesa: '1', destino: 'cocina',
        items: [{ prodId: 'prod_a', nombre: 'Papas fritas', qty: 2, obs: '', enviadoA: 'cocina', destino: 'cocina' }],
        estado: 'nueva', ts: ahora, mozo: 'Carlos', observaciones: ''
      }];
      KDS.refresh();
      await esperar(50);

      const botonPanico = document.querySelector('.kds-panico-btn');
      assert(!!botonPanico, 'Botón de pánico visible para admin');

      if (botonPanico) {
        botonPanico.click();
        await esperar(50);
        assert(ultimaActualizacion !== null, 'DBAppwrite.actualizar fue llamado');
        assert(ultimaActualizacion.col === 'productos', 'Colección correcta: productos');
        assert(ultimaActualizacion.id === 'prod_a', 'ID del producto correcto');
        assert(ultimaActualizacion.cambios.disponible === false, 'disponible se cambió a false');
      }

      // ── Suite 2: Botón de pánico oculto para cocina ──
      resultsEl.innerHTML += '<div class="suite"><h2>2. Botón de pánico oculto para cocina</h2></div>';
      Auth._rol = 'cocina';
      KDS.refresh();
      await esperar(50);
      const botonPanico2 = document.querySelector('.kds-panico-btn');
      assert(botonPanico2 === null, 'Botón de pánico NO visible para cocina');
      Auth._rol = 'admin';

      // ── Suite 3: Acceso al recetario unificado ────────
      resultsEl.innerHTML += '<div class="suite"><h2>3. Acceso al recetario unificado</h2></div>';
      const btnRecetario = document.getElementById('kds-recetario-btn');
      if (btnRecetario) {
        btnRecetario.click();
        await esperar(100);
        const vistaRecetario = document.getElementById('view-recetas');
        assert(!!vistaRecetario, 'La vista del recetario aparece');
      } else {
        assert(false, 'Botón Recetario no encontrado');
      }

      // ── Suite 4: División de ambos ────────────────────
      resultsEl.innerHTML += '<div class="suite"><h2>4. División de ambos</h2></div>';
      comandasStore = [{
        id: 'com_ambos', mesa: '1', destino: 'ambos',
        items: [
          { prodId: 'prod_a', nombre: 'Papas fritas', qty: 1, obs: '', enviadoA: 'cocina', destino: 'cocina' },
          { prodId: 'prod_b', nombre: 'Mojito', qty: 2, obs: '', enviadoA: 'barra', destino: 'barra' }
        ],
        estado: 'nueva', ts: ahora, mozo: 'Carlos', observaciones: 'Tabla'
      }];
      KDS.refresh();
      await esperar(50);
      assert(!!document.getElementById('kds-com_ambos_cocina'), 'Tarjeta virtual de cocina visible');
      assert(!!document.getElementById('kds-com_ambos_barra'), 'Tarjeta virtual de barra visible');
      assert(document.getElementById('kds-com_ambos') === null, 'Original no se renderiza');

      // ── Suite 5: Urgencia ─────────────────────────────
      resultsEl.innerHTML += '<div class="suite"><h2>5. Urgencia</h2></div>';
      const comUrgente = {
        id: 'com_urg', mesa: '1', destino: 'cocina',
        items: [{ prodId: 'prod_x', nombre: 'Hamburguesa', qty: 1, obs: '', enviadoA: 'cocina', destino: 'cocina' }],
        estado: 'nueva', ts: ahora - 20 * 60 * 1000, mozo: 'Ana', observaciones: ''
      };
      comandasStore = [comUrgente];
      KDS.refresh();
      await esperar(50);
      const tiempoEl = document.querySelector('.kds-time.urgente');
      assert(!!tiempoEl, 'Comanda de 20 min tiene clase urgente');

      // ── Suite 6: Cambio de estado ─────────────────────
      resultsEl.innerHTML += '<div class="suite"><h2>6. Cambio de estado</h2></div>';
      const comCambio = {
        id: 'com_cambio', mesa: '1', destino: 'cocina',
        items: [{ prodId: 'prod_x', nombre: 'Hamburguesa', qty: 1, obs: '', enviadoA: 'cocina', destino: 'cocina' }],
        estado: 'nueva', ts: ahora, mozo: 'Ana', observaciones: ''
      };
      comandasStore = [comCambio];
      KDS.refresh();
      await esperar(50);

      let tarjeta = document.getElementById('kds-com_cambio');
      assert(!!tarjeta && tarjeta.classList.contains('nueva'), 'Comanda se renderiza como nueva');

      comCambio.estado = 'en-proceso';
      KDS.refresh();
      await esperar(50);
      tarjeta = document.getElementById('kds-com_cambio');
      assert(!!tarjeta && tarjeta.classList.contains('en-proceso'), 'Comanda pasa a en-proceso');

      comCambio.estado = 'lista';
      KDS.refresh();
      await esperar(50);
      const mesa1 = DB.mesas[0];
      if (mesa1) mesa1.estado = 'esperando'; // simulamos efecto
      assert(mesa1?.estado === 'esperando', 'Mesa 1 pasa a esperando');

      // ── Suite 7: Vista vacía ──────────────────────────
      resultsEl.innerHTML += '<div class="suite"><h2>7. Vista vacía</h2></div>';
      comandasStore = [];
      KDS.refresh();
      await esperar(50);
      assert(!!document.querySelector('#cocinaKDS .kds-empty'), 'Muestra "Todo en orden"');

      // Limpiar DOM
      document.getElementById('view-cocina')?.remove();
      document.getElementById('view-recetas')?.remove();
      document.querySelectorAll('.modal-overlay').forEach(o => o.remove());

      resultsEl.innerHTML += `<div class="summary">${passed} pasaron, ${failed} fallaron</div>`;
      if (failed === 0) resultsEl.innerHTML += '<div class="test pass">✔ Todos los tests del KDS v5.0.1 pasaron.</div>';
    }

    window.addEventListener('load', () => runTests().catch(e => {
      resultsEl.innerHTML += `<div class="error">Error en tests: ${e.message}</div>`;
      console.error(e);
    }));
  </script>
</body>
</html>
