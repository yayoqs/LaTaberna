<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test Final Appwrite - La Taberna</title>
  <style>
    body { font-family: monospace; background: #1a1a24; color: #f1f5f9; padding: 20px; }
    h1 { color: #f59e0b; }
    .suite { margin-bottom: 16px; border-bottom: 1px solid #2e2e42; padding-bottom: 8px; }
    .test { margin: 4px 0; padding: 4px 8px; border-radius: 4px; }
    .pass { background: rgba(34,197,94,.2); }
    .fail { background: rgba(239,68,68,.2); }
    .summary { margin-top: 20px; font-weight: bold; }
    .info { color: #94a3b8; font-size: 12px; margin: 2px 0; }
    button { margin-top: 16px; padding: 12px 24px; background: #f59e0b; color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <h1>🧪 Test Final de Appwrite</h1>
  <p class="info">Verifica que la API Key pueda leer todas las colecciones necesarias.</p>
  <div id="results"></div>
  <button onclick="location.reload()">🔄 Ejecutar de nuevo</button>

  <script src="js/appwrite.min.js"></script>
  <script>
    (function() {
      var resultsEl = document.getElementById('results');
      var passed = 0, failed = 0;
      var DATABASE_ID = '6a0275cb0022ebf7d30d';

      var COLECCIONES = [
        'Productos',
        'Pedidos',
        'Ingredientes',
        'Recetas',
        'Mesas',
        'Comandas',
        'Pedidos_delivery',
        'Usuarios'
      ];

      function assert(condition, msg) {
        if (condition) {
          passed++;
          resultsEl.innerHTML += '<div class="test pass">✔ ' + msg + '</div>';
        } else {
          failed++;
          resultsEl.innerHTML += '<div class="test fail">✘ ' + msg + '</div>';
        }
      }

      async function runTests() {
        resultsEl.innerHTML = '';

        if (typeof Appwrite === 'undefined') {
          resultsEl.innerHTML += '<div class="fail">❌ SDK no cargado.</div>';
          return;
        }

        var endpoint = localStorage.getItem('appwrite_endpoint') || 'https://tor.cloud.appwrite.io/v1';
        var projectId = localStorage.getItem('appwrite_project_id') || '';
        var apiKey = localStorage.getItem('appwrite_api_key') || '';
        var habilitado = localStorage.getItem('appwrite_habilitado') === 'true';

        resultsEl.innerHTML += '<div class="suite"><h2>Credenciales</h2></div>';
        assert(habilitado, 'Habilitado');
        assert(projectId.length > 0, 'Project ID');
        assert(apiKey.length > 0, 'API Key');
        if (!habilitado || !projectId || !apiKey) return;

        var client, databases;
        try {
          client = new Appwrite.Client().setEndpoint(endpoint).setProject(projectId);
          databases = new Appwrite.Databases(client, apiKey);
          assert(true, 'Cliente inicializado');
        } catch(e) { assert(false, 'Error: '+e.message); return; }

        // Verificar cada colección
        for (var i = 0; i < COLECCIONES.length; i++) {
          var coleccion = COLECCIONES[i];
          resultsEl.innerHTML += '<div class="suite"><h2>' + coleccion + '</h2></div>';
          try {
            var response = await databases.listDocuments(DATABASE_ID, coleccion);
            assert(true, 'Lectura exitosa (' + response.total + ' documentos)');
          } catch(e) {
            assert(false, 'Error: ' + e.message);
          }
        }

        resultsEl.innerHTML += '<div class="summary">' + passed + ' pasaron, ' + failed + ' fallaron</div>';
        if (failed === 0) {
          resultsEl.innerHTML += '<div class="test pass">✔ Todas las colecciones accesibles.</div>';
        } else {
          resultsEl.innerHTML += '<div class="fail">⚠️ Revisa los permisos de las colecciones fallidas en Appwrite (rol Any).</div>';
        }
      }

      window.addEventListener('load', runTests);
    })();
  </script>
</body>
</html>
