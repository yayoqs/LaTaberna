<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test B1 – Gran Test Unificado del Mesero</title>
  <style>
    body { font-family: monospace; background: #1a1a24; color: #f1f5f9; padding: 20px; }
    h1 { color: #f59e0b; }
    .suite { margin-bottom: 24px; border-bottom: 1px solid #2e2e42; padding-bottom: 12px; }
    .test { margin: 4px 0; padding: 4px 8px; border-radius: 4px; }
    .pass { background: rgba(34,197,94,.2); }
    .fail { background: rgba(239,68,68,.2); }
    .log  { background: rgba(99,102,241,.2); }
    .summary { margin-top: 20px; font-weight: bold; }
    .info { color: #94a3b8; font-size: 12px; margin: 2px 0; }
    .error { color: #ef4444; }
  </style>
</head>
<body>
  <h1>🧪 Test B1 – Gran Test Unificado del Mesero</h1>
  <p class="info">Mapa de Mesas + Vinculación → Pedido → Comanda → Precarga → Cuenta.</p>
  <div id="results"></div>

  <script src="/js/appwrite.min.js"></script>

  <script type="module">
    // ── Imports ──────────────────────────────────────
    const { Logger }         = await import('/js/lib/logger.js');
    const { EventBus }       = await import('/js/lib/eventBus.js');
    const { Store }          = await import('/js/lib/store.js');
    const { CommandBus }     = await import('/js/lib/command-bus.js');
    const { DBAppwrite }     = await import('/js/db-appwrite.js');
    const { DB }             = await import('/js/db.js');
    const { Auth, inicializarAuth } = await import('/js/auth.js');
    const { Mesas }          = await import('/js/ui/mesas.js');
    const { Comanda }        = await import('/js/ui/comanda.js');
    const { Cuenta }         = await import('/js/ui/cuenta.js');
    const { PrecargaControl }= await import('/js/modulos/interno/precarga-control.js');
    const { MesaDetalles }   = await import('/js/ui/mesa-detalles.js');
    const { PedidoManager }  = await import('/js/managers/pedido-manager.js');
    const { PedidoRepositoryLocal } = await import('/js/repositorios/pedido-repository.js');
    const { Deps }           = await import('/js/lib/deps.js');

    await import('/js/comandos/agregar-mesa.js');
    await import('/js/comandos/crear-pedido-mesa.js');
    await import('/js/comandos/liberar-mesa.js');
    await import('/js/comandos/enviar-comanda.js');
    await import('/js/comandos/completar-subcomanda.js');

    Logger.setLevel('ERROR');
    const resultsEl = document.getElementById('results');
    let passed = 0, failed = 0;
    const log = msg => { resultsEl.innerHTML += `<div class="test log">🔍 ${msg}</div>`; };
    const pass = msg => { passed++; resultsEl.innerHTML += `<div class="test pass">✔ ${msg}</div>`; };
    const fail = msg => { failed++; resultsEl.innerHTML += `<div class="test fail">✘ ${msg}</div>`; };
    const esperar = ms => new Promise(r => setTimeout(r, ms));

    let prodIdA = null, prodIdB = null, recetaId = null;
    let pedidoId = null, precargaDocId = null;

    try {
      log('Inicializando Appwrite...');
      if (!(await DBAppwrite.iniciar()) || !DBAppwrite.habilitado) throw new Error('Appwrite no disponible');

      log('Autenticando master...');
      await inicializarAuth();
      if (!(await Auth.iniciarSesion('master', 'master123'))) throw new Error('Auth falló');

      const espacioActivo = Auth.obtenerLocalActivo?.() || {};
      const espacioId = espacioActivo.id || 'lataberna';

      await DB.init();
      PedidoManager.init({ pedidoRepo: PedidoRepositoryLocal });
      Deps.registrar('pedidoRepo', PedidoRepositoryLocal);

      // Limpiar residuos de ejecuciones anteriores
      for (const m of (await DBAppwrite.listar('mesas')).filter(m => m.numero === '99')) {
        await DBAppwrite.eliminar('mesas', m.id);
      }

      // ════════════════════════════════════════════════
      // SETUP – Crear mesa y productos
      // ════════════════════════════════════════════════
      log('Creando mesa 99...');
      await DBAppwrite.crear('mesas', '99', {
        numero: '99', estado: 'libre', comensales: 1, zona: 'salon', esVirtual: false, espacioId
      });
      DB.mesas = await DBAppwrite.listar('mesas');
      Store.despachar({ type: 'MESAS_INICIALIZAR', payload: DB.mesas });

      log('Creando productos...');
      prodIdA = (await DBAppwrite.crear('productos', 'unique()', {
        nombre: 'Hamburguesa (test)', precio: 1500, categoria: 'platos', destino: 'cocina', activo: true, estado: 'disponible', espacioId
      })).id;
      prodIdB = (await DBAppwrite.crear('productos', 'unique()', {
        nombre: 'Cerveza (test)', precio: 800, categoria: 'bebidas', destino: 'barra', activo: true, estado: 'disponible', espacioId
      })).id;
      recetaId = (await DBAppwrite.crear('recetas', 'unique()', {
        productoId: prodIdA, ingredientes: '[]', instrucciones: 'Armar y cocinar', es_intermedio: false, espacioId
      })).id;

      Store.despachar({ type: 'PRODUCTOS_INICIALIZAR', payload: await DBAppwrite.listar('productos') });
      Store.despachar({ type: 'RECETAS_INICIALIZAR', payload: await DBAppwrite.listar('recetas') });

      Comanda.activar();
      PrecargaControl.activar();

      const main = document.createElement('main');
      main.id = 'view-mesas';
      main.innerHTML = '<div id="mesasGrid"></div><div id="popoverContainer"></div>';
      document.body.appendChild(main);
      EventBus.emit('vista:cambiada', 'mesas');
      Mesas.render();
      await esperar(300);

      // ════════════════════════════════════════════════
      // SUITE 0 – Mapa de Mesas (micro-insignias, popover, etc.)
      // ════════════════════════════════════════════════
      resultsEl.innerHTML += '<div class="suite"><h2>0. Mapa de Mesas</h2></div>';

      // Micro-insignias visibles
      let microCocina = document.querySelector('.micro-cocina');
      let microBarra = document.querySelector('.micro-barra');
      if (microCocina) pass('Aparece micro-insignia de cocina');
      else fail('No aparece micro-insignia de cocina');
      if (microBarra) pass('Aparece micro-insignia de barra');
      else fail('No aparece micro-insignia de barra');

      // Colores iniciales (gris)
      const gris = 'rgb(156, 163, 175)';
      if (microCocina && microCocina.style.background === gris) pass('Cocina gris (pendiente) sin comandas');
      else fail('Cocina no está gris');
      if (microBarra && microBarra.style.background === gris) pass('Barra gris (pendiente) sin comandas');
      else fail('Barra no está gris');

      // Agregar comanda en-proceso
      DB.comandas = [{
        id: 'com_1', mesa: '99', destino: 'cocina',
        items: [{ prodId: prodIdA, nombre: 'Hamburguesa (test)', qty: 1, obs: '', enviadoA: 'cocina' }],
        estado: 'en-proceso', ts: Date.now() - 5 * 60 * 1000, mozo: 'Carlos', observaciones: ''
      }];
      Store.despachar({ type: 'COMANDA_AGREGADA', payload: DB.comandas[0] });
      Mesas.render();
      await esperar(200);
      microCocina = document.querySelector('.micro-cocina');
      if (microCocina && microCocina.style.background === 'rgb(245, 158, 11)') pass('Cocina amarilla (en-proceso)');
      else fail('Cocina no cambió a amarillo');

      // Cambiar a lista
      DB.comandas[0].estado = 'lista';
      Store.despachar({ type: 'COMANDA_ACTUALIZADA', payload: { id: 'com_1', cambios: { estado: 'lista' } } });
      Mesas.render();
      await esperar(200);
      microCocina = document.querySelector('.micro-cocina');
      if (microCocina && microCocina.style.background === 'rgb(34, 197, 94)') pass('Cocina verde (lista)');
      else fail('Cocina no cambió a verde');

      // Long-press despliega popover
      const card = document.querySelector('.mesa-card');
      if (card) pass('Tarjeta de mesa existe');
      else fail('No hay tarjeta de mesa');
      if (card) {
        card.dispatchEvent(new MouseEvent('mousedown', { bubbles: true }));
        await esperar(450);
        card.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
        await esperar(200);
        const popover = document.querySelector('#popoverContainer div');
        if (popover) {
          pass('Popover aparece tras long-press');
          if (popover.textContent.includes('Mesa 99')) pass('Popover muestra número de mesa');
          else fail('Popover no muestra número de mesa');
          if (popover.textContent.includes('lista')) pass('Popover muestra estado lista');
          else fail('Popover no muestra estado lista');
          const btnCerrar = popover.querySelector('button');
          if (btnCerrar) btnCerrar.click();
        } else {
          fail('Popover no apareció');
        }
      }

      // Clic simple no despliega popover
      const popoverAntes = document.querySelector('#popoverContainer div');
      if (card) {
        card.dispatchEvent(new MouseEvent('mousedown', { bubbles: true }));
        await esperar(100);
        card.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
        await esperar(200);
        const popoverDespues = document.querySelector('#popoverContainer div');
        if (!popoverAntes && !popoverDespues) pass('Clic simple NO despliega popover');
        else if (!popoverAntes && popoverDespues) fail('Clic simple SÍ despliega popover');
      }

      // Limpiar comandas para no interferir con el flujo
      DB.comandas = [];
      Store.despachar({ type: 'MESAS_INICIALIZAR', payload: DB.mesas });
      Mesas.render();
      await esperar(200);

      // ════════════════════════════════════════════════
      // SUITE 1 – Vinculación de cliente
      // ════════════════════════════════════════════════
      resultsEl.innerHTML += '<div class="suite"><h2>1. Vinculación de cliente</h2></div>';
      
      EventBus.emit('cliente:mesa_ingresada', { mesa: 99 });
      await esperar(200);
      
      MesaDetalles.abrir(99);
      await esperar(300);

      const seccionEspera = document.getElementById('seccionEspera');
      if (seccionEspera && seccionEspera.style.display === 'flex') {
        pass('Sección de espera visible');
      } else {
        fail('Sección de espera NO visible');
      }

      const btnAceptar = document.querySelector('#modalMesaDetalles .btn-atender[data-num-mesa="99"]');
      if (btnAceptar) {
        pass('Botón Aceptar presente');
        btnAceptar.click();
        await esperar(500);
      } else {
        fail('Botón Aceptar NO encontrado');
      }

      const mesaVinculada = (await DBAppwrite.listar('mesas')).find(m => m.id === '99');
      if (mesaVinculada && mesaVinculada.estado === 'ocupada' && mesaVinculada.pedidoId) {
        pass('Mesa 99 ocupada con pedidoId');
        pedidoId = mesaVinculada.pedidoId;
      } else {
        fail('Mesa 99 NO tiene pedidoId');
        throw new Error('Sin pedidoId no se puede continuar');
      }

      // Cargar el pedido por ID
      log('Cargando pedido por ID...');
      const pedidoRemoto = await DBAppwrite.baseDeDatos.getRow({
        databaseId: DBAppwrite.idBaseDeDatos,
        tableId: DBAppwrite.COLECCIONES['pedidos'],
        rowId: pedidoId
      });
      if (pedidoRemoto) {
        const pedidoLocal = {
          id: pedidoRemoto.$id,
          mesa: pedidoRemoto.mesa,
          mozo: pedidoRemoto.mozo,
          comensales: pedidoRemoto.comensales,
          items: typeof pedidoRemoto.items === 'string' ? JSON.parse(pedidoRemoto.items) : (pedidoRemoto.items || []),
          total: pedidoRemoto.total || 0,
          estado: pedidoRemoto.estado,
          tipo: pedidoRemoto.tipo,
          origen: pedidoRemoto.origen,
          transacciones: [],
          observaciones: pedidoRemoto.observaciones || '',
          creadoEn: pedidoRemoto.$createdAt || pedidoRemoto.creadoEn
        };
        DB.pedidos = [pedidoLocal];
        Store.despachar({ type: 'PEDIDOS_INICIALIZAR', payload: DB.pedidos });
      }

      // ════════════════════════════════════════════════
      // SUITE 2 – Tomar pedido
      // ════════════════════════════════════════════════
      resultsEl.innerHTML += '<div class="suite"><h2>2. Tomar pedido</h2></div>';

      Comanda.establecerMesaActiva(mesaVinculada);

      const prod1 = { id: prodIdA, nombre: 'Hamburguesa (test)', precio: 1500, categoria: 'platos', destino: 'cocina' };
      const prod2 = { id: prodIdB, nombre: 'Cerveza (test)', precio: 800, categoria: 'bebidas', destino: 'barra' };

      EventBus.emit('producto:seleccionado', prod1);
      await esperar(100);
      EventBus.emit('producto:seleccionado', prod1);
      await esperar(100);
      EventBus.emit('producto:seleccionado', prod2);
      await esperar(200);

      const pedidoLocal = DB.pedidos.find(p => p.id === pedidoId);
      const items = pedidoLocal?.items || [];
      
      if (items.length === 2) pass('Hay 2 ítems distintos en el pedido');
      else fail(`Ítems distintos: esperado 2, actual ${items.length}`);
      
      const totalQty = items.reduce((s, i) => s + (i.qty || 1), 0);
      if (totalQty === 3) pass('Cantidad total = 3 (2 hamburguesas + 1 cerveza)');
      else fail(`Cantidad total: esperado 3, actual ${totalQty}`);

      // ════════════════════════════════════════════════
      // SUITE 3 – Enviar comanda
      // ════════════════════════════════════════════════
      resultsEl.innerHTML += '<div class="suite"><h2>3. Enviar comanda</h2></div>';
      
      const pendientes = items.map(i => ({ ...i, enviado: false }));
      const resEnvio = await CommandBus.ejecutar({
        type: 'enviarComanda',
        datos: { mesa: mesaVinculada, mozo: 'Test', comensales: 2, observaciones: '', itemsPendientes: pendientes }
      });
      
      if (resEnvio.exito) pass('Envío de comanda exitoso');
      else fail('Fallo el envío: ' + (resEnvio.error || ''));
      
      if (DB.comandas.length >= 1) pass('Se creó al menos 1 comanda');
      else fail('No se crearon comandas');

      // ════════════════════════════════════════════════
      // SUITE 4 – Precarga de cliente
      // ════════════════════════════════════════════════
      resultsEl.innerHTML += '<div class="suite"><h2>4. Precarga de cliente</h2></div>';

      const precargaItems = [
        { prodId: prodIdA, nombre: 'Hamburguesa (test)', precio: 1500, categoria: 'platos', destino: 'cocina', qty: 1, obs: 'sin cebolla' }
      ];
      
      const precargaDoc = await DBAppwrite.crear('pedidos', 'unique()', {
        mesa: '99', tipo: 'local', origen: 'cliente', estado: 'precarga', comensales: 1,
        items: JSON.stringify(precargaItems), total: 1500, id_usuario: 'cliente_test', espacioId
      });
      precargaDocId = precargaDoc.id;

      EventBus.emit('cliente:precarga_enviada', {
        id: precargaDocId, mesa: 99,
        items: precargaItems,
        clienteId: 'cliente_test', observaciones: '', timestamp: Date.now()
      });
      await esperar(300);

      const badgeEl = document.querySelector('.precarga-badge');
      if (badgeEl) {
        pass('Aparece insignia de precarga');
        if (badgeEl.textContent.includes('1')) pass('Insignia muestra 1 ítem');
        else fail('Insignia no muestra la cantidad correcta');
      } else {
        fail('No apareció insignia de precarga');
      }

      EventBus.emit('precarga:items_listos', { mesa: '99', items: precargaItems, precargaId: precargaDocId });
      await esperar(200);

      await DBAppwrite.actualizar('pedidos', pedidoId, {
        items: JSON.stringify(precargaItems),
        estado: 'abierta',
        total: precargaItems.reduce((s, i) => s + (i.precio || 0) * (i.qty || 1), 0)
      });

      await esperar(500);
      
      const pedidoFinal = await DBAppwrite.baseDeDatos.getRow({
        databaseId: DBAppwrite.idBaseDeDatos,
        tableId: DBAppwrite.COLECCIONES['pedidos'],
        rowId: pedidoId
      });
      
      const itemsFinal = JSON.parse(pedidoFinal.items || '[]');
      const totalFinal = itemsFinal.reduce((s, i) => s + (i.qty || 1), 0);
      
      if (totalFinal === 1) pass('Total de ítems tras precarga = 1');
      else fail(`Total tras precarga: esperado 1, actual ${totalFinal}`);

      // ════════════════════════════════════════════════
      // SUITE 5 – Revisar cuenta
      // ════════════════════════════════════════════════
      resultsEl.innerHTML += '<div class="suite"><h2>5. Revisar cuenta</h2></div>';
      try {
        Cuenta.pedirCuenta();
        pass('pedirCuenta ejecutado sin errores');
      } catch (e) {
        fail('Error en pedirCuenta: ' + e.message);
      }

      // ════════════════════════════════════════════════
      // RESULTADOS
      // ════════════════════════════════════════════════
      resultsEl.innerHTML += `<div class="summary">${passed} pasaron, ${failed} fallaron</div>`;
      if (!failed) {
        resultsEl.innerHTML += '<div class="test pass">✔ Todos los tests del gran test unificado pasaron.</div>';
      } else {
        resultsEl.innerHTML += '<div class="test fail">✘ Algunos tests fallaron. Revisar.</div>';
      }

    } catch (e) {
      fail('ERROR: ' + e.message);
      console.error(e);
    } finally {
      if (DBAppwrite) {
        try {
          if (prodIdA) await DBAppwrite.eliminar('productos', prodIdA);
          if (prodIdB) await DBAppwrite.eliminar('productos', prodIdB);
          if (recetaId) await DBAppwrite.eliminar('recetas', recetaId);
          if (pedidoId) await DBAppwrite.eliminar('pedidos', pedidoId);
          if (precargaDocId) await DBAppwrite.eliminar('pedidos', precargaDocId);
          await DBAppwrite.eliminar('mesas', '99');
        } catch {}
      }
      document.querySelectorAll('.modal-overlay').forEach(o => o.remove());
      document.getElementById('view-mesas')?.remove();
      log('🏁 Gran test unificado finalizado');
    }
  </script>
</body>
</html>
