<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test B1 – Gran Test Unificado del Mesero (v8)</title>
  <style>
    body { font-family: monospace; background: #1a1a24; color: #f1f5f9; padding: 20px; }
    h1 { color: #f59e0b; }
    .suite { margin-bottom: 20px; border-bottom: 1px solid #2e2e42; padding-bottom: 12px; }
    .test { margin: 4px 0; padding: 4px 8px; border-radius: 4px; }
    .pass { background: rgba(34,197,94,.2); }
    .fail { background: rgba(239,68,68,.2); }
    .log { background: rgba(99,102,241,.2); }
    .summary { margin-top: 20px; font-weight: bold; }
    .info { color: #94a3b8; font-size: 12px; margin: 2px 0; }
  </style>
</head>
<body>
  <h1>🧪 Test B1 – Gran Test Unificado del Mesero (v8)</h1>
  <p class="info">Zonas → Mapa → Fusión/Renombrado → Agregar mesa → Vinculación → Pedido → Comanda → Precarga → Cuenta.</p>
  <div id="results"></div>

  <script src="/js/appwrite.min.js"></script>

  <script type="module">
    const { Logger }         = await import('/js/lib/logger.js');
    const { EventBus }       = await import('/js/lib/eventBus.js');
    const { Store }          = await import('/js/lib/store.js');
    const { CommandBus }     = await import('/js/lib/command-bus.js');
    const { DBAppwrite }     = await import('/js/db-appwrite.js');
    const { DB }             = await import('/js/db.js');
    const { Auth, inicializarAuth } = await import('/js/auth.js');
    const { Mesas }          = await import('/js/ui/mesas.js');
    const { Comanda }        = await import('/js/ui/comanda.js');
    const { Cuenta }         = await import('/js/ui/cuenta.js');
    const { PrecargaControl }= await import('/js/modulos/interno/precarga-control.js');
    const { MesaDetalles }   = await import('/js/ui/mesa-detalles.js');
    const { agregarMesa }    = await import('/js/ui/mesas/acciones-mesa.js');
    const { PedidoManager }  = await import('/js/managers/pedido-manager.js');
    const { PedidoRepositoryLocal } = await import('/js/repositorios/pedido-repository.js');
    const { Deps }           = await import('/js/lib/deps.js');

    await import('/js/comandos/agregar-mesa.js');
    await import('/js/comandos/crear-pedido-mesa.js');
    await import('/js/comandos/liberar-mesa.js');
    await import('/js/comandos/enviar-comanda.js');
    await import('/js/comandos/completar-subcomanda.js');

    Logger.setLevel('ERROR');
    const resultsEl = document.getElementById('results');
    let passed = 0, failed = 0;
    const log = msg => { resultsEl.innerHTML += `<div class="test log">🔍 ${msg}</div>`; };
    const pass = msg => { passed++; resultsEl.innerHTML += `<div class="test pass">✔ ${msg}</div>`; };
    const fail = msg => { failed++; resultsEl.innerHTML += `<div class="test fail">✘ ${msg}</div>`; };
    const esperar = ms => new Promise(r => setTimeout(r, ms));

    const obtenerTarjeta = num => [...document.querySelectorAll('.mesa-card')].find(c => c.textContent.includes(String(num)));
    const obtenerNumerosDOM = () => [...document.querySelectorAll('.mesa-card .mesa-numero')].map(el => el.textContent.trim());

    let prodIdA = null, prodIdB = null, recetaId = null;
    let pedidoId = null, precargaDocId = null;
    let mesaVinculada = null;

    try {
      log('Inicializando Appwrite...');
      if (!(await DBAppwrite.iniciar()) || !DBAppwrite.habilitado) throw new Error('Appwrite no disponible');

      log('Autenticando master...');
      await inicializarAuth();
      if (!(await Auth.iniciarSesion('master', 'master123'))) throw new Error('Auth falló');

      await DB.init();
      PedidoManager.init({ pedidoRepo: PedidoRepositoryLocal });
      Deps.registrar('pedidoRepo', PedidoRepositoryLocal);

      // ══ ACTIVAR MÓDULOS DE ESCUCHA ══
      log('Activando Comanda y PrecargaControl...');
      Comanda.activar();
      PrecargaControl.activar();

      // ══ LIMPIEZA PREVIA ══
      log('Eliminando mesas y productos de pruebas anteriores...');
      const mesasPrevias = await DBAppwrite.listar('mesas');
      for (const m of mesasPrevias) {
        if (/^\d+$/.test(m.numero) || m.numero === 'cumpleaños' || m.id === 'cumpleanos') {
          await DBAppwrite.eliminar('mesas', m.id).catch(() => {});
        }
      }
      const productosPrevios = await DBAppwrite.listar('productos');
      for (const p of productosPrevios) {
        if (p.nombre.includes('(test)')) {
          await DBAppwrite.eliminar('productos', p.id).catch(() => {});
        }
      }
      const recetasPrevias = await DBAppwrite.listar('recetas');
      for (const r of recetasPrevias) {
        if (r.productoId === prodIdA || r.id === recetaId) {
          await DBAppwrite.eliminar('recetas', r.id).catch(() => {});
        }
      }
      localStorage.removeItem('pubpos_mesas');
      localStorage.removeItem('pubpos_config');
      DB.mesas = [];

      // ══ CONFIGURAR ZONAS Y MESAS ══
      const zonas = [{ nombre: 'zona1', cantidad: 12 }];
      DB.config = { ...DB.config, zonas };
      DB.saveConfig();
      log('Sincronizando 12 mesas...');
      await DB.sincronizarMesasConConfig();
      Store.despachar({ type: 'MESAS_INICIALIZAR', payload: DB.mesas });

      // ══ CREAR PRODUCTOS DE PRUEBA ══
      log('Creando productos de prueba...');
      prodIdA = (await DBAppwrite.crear('productos', 'unique()', {
        nombre: 'Hamburguesa (test)', precio: 1500, categoria: 'platos', destino: 'cocina', activo: true, estado: 'disponible', espacioId: 'lataberna'
      })).id;
      prodIdB = (await DBAppwrite.crear('productos', 'unique()', {
        nombre: 'Cerveza (test)', precio: 800, categoria: 'bebidas', destino: 'barra', activo: true, estado: 'disponible', espacioId: 'lataberna'
      })).id;
      recetaId = (await DBAppwrite.crear('recetas', 'unique()', {
        productoId: prodIdA, ingredientes: '[]', instrucciones: 'Armar y cocinar', es_intermedio: false, espacioId: 'lataberna'
      })).id;

      Store.despachar({ type: 'PRODUCTOS_INICIALIZAR', payload: await DBAppwrite.listar('productos') });
      Store.despachar({ type: 'RECETAS_INICIALIZAR', payload: await DBAppwrite.listar('recetas') });

      // ══ VISTA DE MESAS ══
      const main = document.createElement('main');
      main.id = 'view-mesas';
      main.className = 'view active';
      document.body.appendChild(main);
      EventBus.emit('vista:cambiada', 'mesas');
      Mesas.render();
      await esperar(300);

      // ══ SUITE 0: MAPA DE MESAS ══
      resultsEl.innerHTML += '<div class="suite"><h2>0. Mapa de Mesas</h2></div>';
      const mesasIniciales = await DBAppwrite.listar('mesas');
      if (mesasIniciales.length === 12) pass('Appwrite tiene 12 mesas');
      else fail(`Appwrite tiene ${mesasIniciales.length} mesas (esperado 12)`);

      let card = obtenerTarjeta(1);
      if (card) pass('Tarjeta de mesa 1 existe'); else fail('No se encontró tarjeta de mesa 1');
      if (!card) throw new Error('Sin tarjeta de mesa 1');

      let microCocina = card.querySelector('.micro-cocina');
      let microBarra = card.querySelector('.micro-barra');
      if (microCocina) pass('Aparece micro-insignia de cocina'); else fail('No aparece micro-insignia de cocina');
      if (microBarra) pass('Aparece micro-insignia de barra'); else fail('No aparece micro-insignia de barra');

      const gris = 'rgb(156, 163, 175)';
      if (microCocina && microCocina.style.background === gris) pass('Cocina gris (pendiente)');
      else fail('Cocina no está gris');
      if (microBarra && microBarra.style.background === gris) pass('Barra gris (pendiente)');
      else fail('Barra no está gris');

      DB.comandas = [{
        id: 'com_1', mesa: '1', destino: 'cocina',
        items: [], estado: 'en-proceso', ts: Date.now() - 5 * 60 * 1000, mozo: 'Carlos', observaciones: ''
      }];
      Store.despachar({ type: 'COMANDA_AGREGADA', payload: DB.comandas[0] });
      Mesas.render();
      await esperar(200);

      card = obtenerTarjeta(1);
      microCocina = card?.querySelector('.micro-cocina');
      if (microCocina && microCocina.style.background === 'rgb(245, 158, 11)') pass('Cocina amarilla (en-proceso)');
      else fail('Cocina no cambió a amarillo');

      DB.comandas[0].estado = 'lista';
      Store.despachar({ type: 'COMANDA_ACTUALIZADA', payload: { id: 'com_1', cambios: { estado: 'lista' } } });
      Mesas.render();
      await esperar(200);

      card = obtenerTarjeta(1);
      microCocina = card?.querySelector('.micro-cocina');
      if (microCocina && microCocina.style.background === 'rgb(34, 197, 94)') pass('Cocina verde (lista)');
      else fail('Cocina no cambió a verde');

      if (card) {
        card.dispatchEvent(new MouseEvent('mousedown', { bubbles: true }));
        await esperar(450);
        card.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
        await esperar(200);
        const popover = document.querySelector('#popoverContainer div');
        if (popover) {
          pass('Popover aparece tras long-press');
          if (popover.textContent.includes('Mesa 1')) pass('Popover muestra número de mesa');
          else fail('Popover no muestra número de mesa');
          if (popover.textContent.includes('lista')) pass('Popover muestra estado lista');
          else fail('Popover no muestra estado lista');
          popover.querySelector('button')?.click();
        } else {
          fail('Popover no apareció');
        }
      }

      DB.comandas = [];
      Store.despachar({ type: 'MESAS_INICIALIZAR', payload: DB.mesas });
      Mesas.render();
      await esperar(200);

      // ══ SUITE 1: FUSIÓN Y RENOMBRADO ══
      resultsEl.innerHTML += '<div class="suite"><h2>1. Fusión y Renombrado</h2></div>';
      log('Fusionando 3+5+6 como "cumpleaños"...');
      const virtual = await DB.fusionarMesas(['3','5','6'], 'Mozo Test', 'cumpleaños');
      if (virtual && virtual.numero === 'cumpleaños') pass('Fusión devuelve mesa virtual "cumpleaños"');
      else fail(`Fusión retornó ${JSON.stringify(virtual)}`);

      await esperar(500);
      Store.despachar({ type: 'MESAS_INICIALIZAR', payload: DB.mesas });
      Mesas.render();
      await esperar(300);

      const localVirtual = DB.mesas.find(m => m.numero === 'cumpleaños');
      if (localVirtual) pass('DB: mesa virtual "cumpleaños" existe');
      else fail('DB: no se encontró mesa virtual "cumpleaños"');
      if (localVirtual && localVirtual.esVirtual) pass('DB: esVirtual=true');
      else fail('DB: mesa virtual no tiene esVirtual=true');

      if (localVirtual && Array.isArray(localVirtual.mesasFusionadas) && ['3','5','6'].every(n => localVirtual.mesasFusionadas.includes(n))) pass('DB: incluye 3,5,6');
      else fail('DB: mesa virtual no incluye 3,5,6');

      const estadosOriginalesDB = ['3','5','6'].map(n => {
        const m = DB.mesas.find(x => String(x.numero) === n);
        return m ? m.estado : 'no_existe';
      });
      if (estadosOriginalesDB.every(e => e === 'fusionada')) pass('DB: originales fusionadas');
      else fail(`DB: originales ${estadosOriginalesDB.join(', ')}`);

      const storeVirtual = Store.obtenerEstado().mesas.find(m => m.numero === 'cumpleaños');
      if (storeVirtual) pass('Store: mesa virtual presente');
      else fail('Store: mesa virtual no encontrada');

      const domFusion = obtenerNumerosDOM();
      if (domFusion.includes('cumpleaños')) pass('DOM: muestra "cumpleaños"');
      else fail(`DOM: no muestra "cumpleaños" (${domFusion.join(', ')})`);

      const mesasAppwriteFusion = await DBAppwrite.listar('mesas');
      const appwriteVirtual = mesasAppwriteFusion.find(m => m.numero === 'cumpleaños');
      if (appwriteVirtual) pass('Appwrite: virtual "cumpleaños" persistida');
      else fail('Appwrite: mesa virtual NO encontrada');

      const appwriteRowId = mesasAppwriteFusion.find(m => m.id === 'cumpleanos');
      if (appwriteRowId) pass('Appwrite: rowId "cumpleanos" correcto');
      else fail('Appwrite: no se encontró rowId "cumpleanos"');

      const estadosOriginalesAppwrite = ['3','5','6'].map(n => {
        const m = mesasAppwriteFusion.find(x => String(x.numero) === n);
        return m ? m.estado : 'no_existe';
      });
      if (estadosOriginalesAppwrite.every(e => e === 'fusionada')) pass('Appwrite: originales fusionadas');
      else fail(`Appwrite: originales ${estadosOriginalesAppwrite.join(', ')}`);

      // ══ SUITE 2: AGREGAR MESA NUEVA ══
      resultsEl.innerHTML += '<div class="suite"><h2>2. Agregar Mesa Nueva</h2></div>';
      await agregarMesa();
      await esperar(1000);
      Mesas.render();
      await esperar(300);

      const mesa13DB = DB.mesas.find(m => String(m.numero) === '13');
      if (mesa13DB) pass('DB: mesa 13 creada');
      else fail('DB: mesa 13 no existe');

      const store13 = Store.obtenerEstado().mesas.find(m => String(m.numero) === '13');
      if (store13) pass('Store: mesa 13 presente');
      else fail('Store: mesa 13 no existe');

      const appwrite13 = (await DBAppwrite.listar('mesas')).find(m => m.numero === '13');
      if (appwrite13) pass('Appwrite: mesa 13 creada');
      else fail('Appwrite: mesa 13 no existe');

      const dom13 = obtenerNumerosDOM();
      if (dom13.includes('13')) pass('DOM: muestra mesa 13');
      else fail(`DOM: no muestra mesa 13 (${dom13.join(', ')})`);

      // ══ SUITE 3: VINCULACIÓN ══
      resultsEl.innerHTML += '<div class="suite"><h2>3. Vinculación de cliente</h2></div>';
      EventBus.emit('cliente:mesa_ingresada', { mesa: 1 });
      await esperar(200);
      MesaDetalles.abrir(1);
      await esperar(300);

      const seccionEspera = document.getElementById('seccionEspera');
      if (seccionEspera && seccionEspera.style.display === 'flex') pass('Sección de espera visible');
      else fail('Sección de espera NO visible');

      const btnAceptar = document.querySelector('#modalMesaDetalles .btn-atender[data-num-mesa="1"]');
      if (btnAceptar) {
        pass('Botón Aceptar presente');
        btnAceptar.click();
        mesaVinculada = await new Promise(async (resolve) => {
          const timeout = Date.now() + 3000;
          while (Date.now() < timeout) {
            const mesas = await DBAppwrite.listar('mesas');
            const mesa = mesas.find(m => m.numero === '1');
            if (mesa && mesa.pedidoId) { resolve(mesa); return; }
            await esperar(100);
          }
          resolve(null);
        });
        if (mesaVinculada && mesaVinculada.estado === 'ocupada' && mesaVinculada.pedidoId) {
          pass('Mesa 1 ocupada con pedidoId');
          pedidoId = mesaVinculada.pedidoId;
        } else {
          fail('Mesa 1 NO tiene pedidoId');
          throw new Error('Sin pedidoId no se puede continuar');
        }
      } else {
        fail('Botón Aceptar NO encontrado');
      }

      // Cargar pedido
      const pedidoRemoto = await DBAppwrite.baseDeDatos.getRow({
        databaseId: DBAppwrite.idBaseDeDatos,
        tableId: DBAppwrite.COLECCIONES['pedidos'],
        rowId: pedidoId
      });
      if (pedidoRemoto) {
        const pedidoLocal = {
          id: pedidoRemoto.$id,
          mesa: pedidoRemoto.mesa,
          mozo: pedidoRemoto.mozo,
          comensales: pedidoRemoto.comensales,
          items: typeof pedidoRemoto.items === 'string' ? JSON.parse(pedidoRemoto.items) : (pedidoRemoto.items || []),
          total: pedidoRemoto.total || 0,
          estado: pedidoRemoto.estado,
          tipo: pedidoRemoto.tipo,
          origen: pedidoRemoto.origen,
          transacciones: [],
          observaciones: pedidoRemoto.observaciones || '',
          creadoEn: pedidoRemoto.$createdAt || pedidoRemoto.creadoEn
        };
        DB.pedidos = [pedidoLocal];
        Store.despachar({ type: 'PEDIDOS_INICIALIZAR', payload: DB.pedidos });
      }

      // ══ SUITE 4: TOMAR PEDIDO ══
      resultsEl.innerHTML += '<div class="suite"><h2>4. Tomar Pedido</h2></div>';
      Comanda.establecerMesaActiva(mesaVinculada);

      const prod1 = { id: prodIdA, nombre: 'Hamburguesa (test)', precio: 1500, categoria: 'platos', destino: 'cocina' };
      const prod2 = { id: prodIdB, nombre: 'Cerveza (test)', precio: 800, categoria: 'bebidas', destino: 'barra' };
      EventBus.emit('producto:seleccionado', prod1);
      await esperar(100);
      EventBus.emit('producto:seleccionado', prod1);
      await esperar(100);
      EventBus.emit('producto:seleccionado', prod2);
      await esperar(200);

      const pedidoLocal = DB.pedidos.find(p => p.id === pedidoId);
      const items = pedidoLocal?.items || [];
      if (items.length === 2) pass('Hay 2 ítems distintos en el pedido');
      else fail(`Ítems distintos: esperado 2, actual ${items.length}`);
      const totalQty = items.reduce((s, i) => s + (i.qty || 1), 0);
      if (totalQty === 3) pass('Cantidad total = 3');
      else fail(`Cantidad total: esperado 3, actual ${totalQty}`);

      // ══ SUITE 5: ENVIAR COMANDA ══
      resultsEl.innerHTML += '<div class="suite"><h2>5. Enviar Comanda</h2></div>';
      const pendientes = items.map(i => ({ ...i, enviado: false }));
      const resEnvio = await CommandBus.ejecutar({
        type: 'enviarComanda',
        datos: { mesa: mesaVinculada, mozo: 'Test', comensales: 2, observaciones: '', itemsPendientes: pendientes }
      });
      if (resEnvio.exito) pass('Envío de comanda exitoso');
      else fail('Fallo el envío: ' + (resEnvio.error || ''));
      if (DB.comandas.length >= 1) pass('Se creó al menos 1 comanda');
      else fail('No se crearon comandas');

      // ══ SUITE 6: PRECARGA ══
      resultsEl.innerHTML += '<div class="suite"><h2>6. Precarga de cliente</h2></div>';
      const precargaItems = [
        { prodId: prodIdA, nombre: 'Hamburguesa (test)', precio: 1500, categoria: 'platos', destino: 'cocina', qty: 1, obs: 'sin cebolla' }
      ];
      const precargaDoc = await DBAppwrite.crear('pedidos', 'unique()', {
        mesa: '1', tipo: 'local', origen: 'cliente', estado: 'precarga', comensales: 1,
        items: JSON.stringify(precargaItems), total: 1500, id_usuario: 'cliente_test', espacioId: 'lataberna'
      });
      precargaDocId = precargaDoc.id;
      EventBus.emit('cliente:precarga_enviada', {
        id: precargaDocId, mesa: 1,
        items: precargaItems,
        clienteId: 'cliente_test', observaciones: '', timestamp: Date.now()
      });
      await esperar(300);
      const badgeEl = document.querySelector('.precarga-badge');
      if (badgeEl) {
        pass('Aparece insignia de precarga');
        if (badgeEl.textContent.includes('1')) pass('Insignia muestra 1 ítem');
        else fail('Insignia no muestra la cantidad correcta');
      } else {
        fail('No apareció insignia de precarga');
      }

      EventBus.emit('precarga:items_listos', { mesa: '1', items: precargaItems, precargaId: precargaDocId });
      await esperar(200);
      await DBAppwrite.actualizar('pedidos', pedidoId, {
        items: JSON.stringify(precargaItems),
        estado: 'abierta',
        total: precargaItems.reduce((s, i) => s + (i.precio || 0) * (i.qty || 1), 0)
      });
      await esperar(500);
      const pedidoFinal = await DBAppwrite.baseDeDatos.getRow({
        databaseId: DBAppwrite.idBaseDeDatos,
        tableId: DBAppwrite.COLECCIONES['pedidos'],
        rowId: pedidoId
      });
      const itemsFinal = JSON.parse(pedidoFinal.items || '[]');
      const totalFinal = itemsFinal.reduce((s, i) => s + (i.qty || 1), 0);
      if (totalFinal === 1) pass('Total de ítems tras precarga = 1');
      else fail(`Total tras precarga: esperado 1, actual ${totalFinal}`);

      // ══ SUITE 7: CUENTA ══
      resultsEl.innerHTML += '<div class="suite"><h2>7. Revisar Cuenta</h2></div>';
      try {
        Cuenta.pedirCuenta();
        pass('pedirCuenta ejecutado sin errores');
      } catch (e) {
        fail('Error en pedirCuenta: ' + e.message);
      }

      // ══ RESULTADOS ══
      resultsEl.innerHTML += `<div class="summary">${passed} pasaron, ${failed} fallaron</div>`;
      if (!failed) {
        resultsEl.innerHTML += '<div class="test pass">✔ Todos los tests del gran test unificado pasaron.</div>';
      } else {
        resultsEl.innerHTML += '<div class="test fail">✘ Algunos tests fallaron. Revisar.</div>';
      }

    } catch (e) {
      fail('ERROR: ' + e.message);
      console.error(e);
    } finally {
      // Limpieza final
      try {
        const todasMesas = await DBAppwrite.listar('mesas');
        for (const m of todasMesas) {
          if (/^\d+$/.test(m.numero) || m.numero === 'cumpleaños') await DBAppwrite.eliminar('mesas', m.id).catch(() => {});
        }
        const todosPedidos = await DBAppwrite.listar('pedidos');
        for (const p of todosPedidos) {
          if (p.mesa === '1' || p.id === pedidoId || p.id === precargaDocId) await DBAppwrite.eliminar('pedidos', p.id).catch(() => {});
        }
        const todosProductos = await DBAppwrite.listar('productos');
        for (const p of todosProductos) {
          if (p.nombre.includes('(test)')) await DBAppwrite.eliminar('productos', p.id).catch(() => {});
        }
        const todasRecetas = await DBAppwrite.listar('recetas');
        for (const r of todasRecetas) {
          if (r.productoId === prodIdA || r.id === recetaId) await DBAppwrite.eliminar('recetas', r.id).catch(() => {});
        }
      } catch (e) {
        console.warn('Error en limpieza final:', e);
      }
      document.querySelectorAll('.modal-overlay').forEach(o => o.remove());
      document.getElementById('view-mesas')?.remove();
      log('🏁 Gran test unificado finalizado');
    }
  </script>
</body>
</html>
