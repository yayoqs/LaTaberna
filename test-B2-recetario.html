<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test B2 — Recetario v6.2.x (Appwrite real, 50 aserciones)</title>
  <style>
    body { font-family: monospace; background: #1a1a24; color: #f1f5f9; padding: 20px; }
    h1 { color: #f59e0b; }
    .suite { margin-bottom: 24px; border-bottom: 1px solid #2e2e42; padding-bottom: 12px; }
    .test { margin: 4px 0; padding: 4px 8px; border-radius: 4px; }
    .pass { background: rgba(34,197,94,.2); }
    .fail { background: rgba(239,68,68,.2); }
    .summary { margin-top: 20px; font-weight: bold; }
    .info { color: #94a3b8; font-size: 12px; margin: 2px 0; }
    .error { color: #ef4444; }
  </style>
</head>
<body>
  <h1>🧪 Test B2 — Recetario v6.2.x (Appwrite real, 50 aserciones)</h1>
  <p class="info">Ciclo completo sin mocks: crear, editar, ejecutar, eliminar, detalle. Verifica Appwrite, localStorage y Store. Migrado a state.insumos y métodos en español.</p>
  <div id="results"></div>
  <div id="toastContainer"></div>

  <!-- Contenedor necesario para el modal de detalle -->
  <main id="view-recetas" class="view"></main>

  <!-- SDK de Appwrite -->
  <script src="js/appwrite.min.js"></script>

  <!-- Dependencias del sistema -->
  <script type="module" src="js/lib/logger.js"></script>
  <script type="module" src="js/lib/eventBus.js"></script>
  <script type="module" src="js/lib/store.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/utils.js"></script>
  <script type="module" src="js/db.js"></script>
  <script type="module" src="js/db-appwrite.js"></script>
  <script type="module" src="js/ui/recetas.js"></script>
  <script type="module" src="js/repositorios/receta-repository.js"></script>

  <script type="module">
    import { Store } from './js/lib/store.js';
    import { EventBus } from './js/lib/eventBus.js';
    import { Auth } from './js/auth.js';
    import { DB } from './js/db.js';
    import { DBAppwrite } from './js/db-appwrite.js';
    import { DBInventario } from './js/db-inventario.js';
    import { Logger } from './js/lib/logger.js';
    import { Recetas } from './js/ui/recetas.js';
    import { crearRecetaRepo } from './js/repositorios/receta-repository.js';

    Logger.setLevel('ERROR');
    window.Logger = Logger;

    const resultsEl = document.getElementById('results');
    let passed = 0, failed = 0;
    let insumoTestId = null;
    let recetaCreadaId = null;
    let productoCreadoId = null;

    function assert(condition, msg) {
      if (condition) { passed++; resultsEl.innerHTML += '<div class="test pass">✔ ' + msg + '</div>'; }
      else { failed++; resultsEl.innerHTML += '<div class="test fail">✘ ' + msg + '</div>'; }
    }
    const esperar = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    // ── Mock Store.obtenerEstado para devolver DB directamente ──
    const originalObtenerEstado = Store.obtenerEstado;
    Store.obtenerEstado = () => ({
      productos: DB.productos || [],
      recetas: DB.recetas || [],
      insumos: DB.insumos || []
    });

    // ── Sincronizar DBInventario con DB ──
    function sincronizarInventario() {
      DBInventario.productos = DB.productos || [];
      DBInventario.recetas = DB.recetas || [];
      DBInventario.insumos = DB.insumos || [];
    }

    async function runTests() {
      resultsEl.innerHTML = '';
      if (!document.getElementById('toastContainer')) {
        const tc = document.createElement('div'); tc.id = 'toastContainer'; document.body.appendChild(tc);
      }

      // ── Inicializar Appwrite ────────────────────────
      if (!DBAppwrite.habilitado) {
        await DBAppwrite.iniciar();
      }
      assert(DBAppwrite.habilitado, 'Appwrite inicializado correctamente');

      const repo = crearRecetaRepo();
      const sufijo = Date.now() + '_' + Math.random().toString(36).substr(2, 6);
      const nombreInsumo = 'Insumo Test ' + sufijo;

      // ═══════════════════════════════════════════════════
      // 0. PREPARACIÓN: Crear insumo de prueba
      // ═══════════════════════════════════════════════════
      resultsEl.innerHTML += '<div class="suite"><h2>0. Preparación</h2></div>';
      try {
        const ingCreado = await DBAppwrite.crear('insumos', null, {
          nombre: nombreInsumo,
          stock: 100,
          unidad: 'kg',
          stock_minimo: 5,
          categoria: 'cocina',
          tipo: 'cocina',
          ubicacion: 'Test'
        });
        if (ingCreado && ingCreado.id) {
          insumoTestId = ingCreado.id;
          DB.insumos = DB.insumos || [];
          DB.insumos.push({ id: ingCreado.id, nombre: nombreInsumo, unidad: 'kg', stock: 100, tipo: 'cocina' });
          DB.saveInsumos();
          sincronizarInventario();
          assert(true, 'Insumo de prueba creado: ' + ingCreado.id);
        } else {
          assert(false, 'No se pudo crear insumo de prueba');
          return;
        }
      } catch (e) {
        assert(false, 'Error al crear insumo: ' + e.message);
        return;
      }
      await esperar(1000);

      // ═══════════════════════════════════════════════════
      // 1. CREAR RECETA (producto automático)
      // ═══════════════════════════════════════════════════
      resultsEl.innerHTML += '<div class="suite"><h2>1. CREAR receta</h2></div>';
      const nombreReceta = 'Receta Test ' + sufijo;
      try {
        const nueva = await repo.guardarReceta({
          _nombreProducto: nombreReceta,
          nivel: 'preparacion',
          categoria: 'test_capitulo_' + sufijo,
          es_intermedio: true,
          destino: 'cocina',
          ingredientes: [{ tipo: 'insumo', id: insumoTestId, cantidad: 2, unidad: 'kg' }],
          instrucciones: 'Paso 1\nPaso 2',
          unidadStock: 'kg',
          creadoPor: 'test'
        });
        productoCreadoId = nueva.productoId;
        recetaCreadaId = nueva.id;
        sincronizarInventario();
        assert(!!productoCreadoId, 'Producto creado automáticamente (productoId)');
        assert(!!recetaCreadaId, 'Receta creada con ID: ' + recetaCreadaId);
      } catch (e) {
        assert(false, 'Error al crear receta: ' + e.message);
        return;
      }
      await esperar(2000);

      // Verificar en DB local
      const recetaLocal = DB.recetas.find(r => r.id === recetaCreadaId);
      assert(!!recetaLocal, 'DB local: receta existe');
      if (recetaLocal) {
        assert(recetaLocal.nivel === 'preparacion', 'DB local: nivel correcto');
        assert(recetaLocal.categoria === 'test_capitulo_' + sufijo, 'DB local: categoría correcta');
        assert(recetaLocal.es_intermedio === true, 'DB local: es intermedio');
      }

      // Verificar en Appwrite
      const recetasAppwrite = await DBAppwrite.listar('recetas');
      const recetaRemota = recetasAppwrite.find(r => r.id === recetaCreadaId);
      assert(!!recetaRemota, 'Appwrite: receta encontrada');
      if (recetaRemota) {
        assert(recetaRemota.nivel === 'preparacion', 'Appwrite: nivel correcto');
        assert(recetaRemota.categoria === 'test_capitulo_' + sufijo, 'Appwrite: categoría correcta');
        assert(recetaRemota.es_intermedio === true, 'Appwrite: es intermedio');
        assert(recetaRemota.destino === 'cocina', 'Appwrite: destino correcto');
      }

      // Verificar en Store
      const state1 = Store.obtenerEstado();
      const recetaStore = state1.recetas.find(r => r.id === recetaCreadaId);
      assert(!!recetaStore, 'Store: receta sincronizada');
      if (recetaStore) {
        assert(recetaStore.categoria === 'test_capitulo_' + sufijo, 'Store: categoría sincronizada');
      }

      // ═══════════════════════════════════════════════════
      // 2. EDITAR receta
      // ═══════════════════════════════════════════════════
      resultsEl.innerHTML += '<div class="suite"><h2>2. EDITAR receta</h2></div>';
      try {
        const recetaAEditar = await repo.obtenerPorId(recetaCreadaId);
        assert(!!recetaAEditar, 'Receta obtenida para editar');
        recetaAEditar.nivel = 'aderezo';
        recetaAEditar.categoria = 'editado_' + sufijo;
        recetaAEditar.es_intermedio = false;
        recetaAEditar.destino = 'barra';
        recetaAEditar.instrucciones = 'Nuevo paso';
        await repo.guardarReceta(recetaAEditar);
        await esperar(2000);
        sincronizarInventario();

        // DB local
        const editLocal = DB.recetas.find(r => r.id === recetaCreadaId);
        assert(!!editLocal, 'DB local: receta editada existe');
        assert(editLocal.nivel === 'aderezo', 'DB local: nivel editado');
        assert(editLocal.categoria === 'editado_' + sufijo, 'DB local: categoría editada');
        assert(editLocal.es_intermedio === false, 'DB local: ya no es intermedio');
        assert(editLocal.destino === 'barra', 'DB local: destino cambiado');

        // Appwrite
        const recetasEditRemoto = await DBAppwrite.listar('recetas');
        const editRemoto = recetasEditRemoto.find(r => r.id === recetaCreadaId);
        assert(!!editRemoto, 'Appwrite: receta editada encontrada');
        if (editRemoto) {
          assert(editRemoto.nivel === 'aderezo', 'Appwrite: nivel editado');
          assert(editRemoto.categoria === 'editado_' + sufijo, 'Appwrite: categoría editada');
          assert(editRemoto.es_intermedio === false, 'Appwrite: ya no es intermedio');
          assert(editRemoto.destino === 'barra', 'Appwrite: destino actualizado');
        }

        // Store
        const state2 = Store.obtenerEstado();
        const recetaStoreEdit = state2.recetas.find(r => r.id === recetaCreadaId);
        assert(!!recetaStoreEdit, 'Store: receta editada sincronizada');
        if (recetaStoreEdit) {
          assert(recetaStoreEdit.categoria === 'editado_' + sufijo, 'Store: categoría editada sincronizada');
        }
      } catch (e) {
        assert(false, 'Error al editar: ' + e.message);
      }

      // ═══════════════════════════════════════════════════
      // 3. EJECUTAR preparación
      // ═══════════════════════════════════════════════════
      resultsEl.innerHTML += '<div class="suite"><h2>3. EJECUTAR preparación</h2></div>';
      const nombreIntermedia = 'Intermedia Test ' + sufijo;
      let idIntermedia = null;
      try {
        const intermedia = await repo.guardarReceta({
          _nombreProducto: nombreIntermedia,
          nivel: 'preparacion',
          categoria: 'test_intermedia',
          es_intermedio: true,
          destino: 'cocina',
          ingredientes: [{ tipo: 'insumo', id: insumoTestId, cantidad: 5, unidad: 'kg' }],
          instrucciones: 'Ejecutar',
          unidadStock: 'kg',
          creadoPor: 'test'
        });
        idIntermedia = intermedia.id;
        sincronizarInventario();
        assert(!!idIntermedia, 'Receta intermedia creada para ejecución');
        await esperar(1500);

        const insumosRemotos = await DBAppwrite.listar('insumos');
        const insumoRemoto = insumosRemotos.find(i => i.id === insumoTestId);
        const stockInicial = insumoRemoto ? insumoRemoto.stock : 100;
        assert(stockInicial === 100, 'Stock inicial del insumo: 100');

        const tipoInsumo = 'cocina';
        let insumoAsociado = insumosRemotos.find(i => i.nombre === nombreIntermedia && i.tipo === tipoInsumo);
        if (!insumoAsociado) {
          insumoAsociado = await repo.guardarInsumo({
            nombre: nombreIntermedia,
            unidad: 'kg',
            tipo: tipoInsumo,
            categoria: 'test_intermedia',
            stock: 0,
            stock_minimo: 1
          });
        }
        await repo.actualizarStockInsumo(insumoAsociado.id, (insumoAsociado.stock || 0) + 3);

        const nuevoStockIng = stockInicial - 15;
        await repo.actualizarStockInsumo(insumoTestId, nuevoStockIng);
        await esperar(2000);
        sincronizarInventario();

        const insumosPost = await DBAppwrite.listar('insumos');
        const insumoPost = insumosPost.find(i => i.id === insumoTestId);
        assert(!!insumoPost, 'Appwrite: insumo existe post-ejecución');
        if (insumoPost) {
          assert(insumoPost.stock === nuevoStockIng, `Appwrite: stock descontado (${nuevoStockIng})`);
        }

        const insumoInterPost = insumosPost.find(i => i.nombre === nombreIntermedia && i.tipo === 'cocina');
        assert(!!insumoInterPost, 'Appwrite: insumo de preparación intermedia creado');
        if (insumoInterPost) {
          assert(insumoInterPost.stock === 3, 'Appwrite: stock de preparación intermedia = 3');
        }
      } catch (e) {
        assert(false, 'Error en ejecución: ' + e.message);
      }

      // ═══════════════════════════════════════════════════
      // 4. ELIMINAR receta principal
      // ═══════════════════════════════════════════════════
      resultsEl.innerHTML += '<div class="suite"><h2>4. ELIMINAR receta</h2></div>';
      try {
        await repo.eliminarReceta(recetaCreadaId);
        await esperar(2000);
        sincronizarInventario();

        // DB local
        assert(!DB.recetas.some(r => r.id === recetaCreadaId), 'DB local: receta eliminada');
        // Appwrite
        const recetasFinal = await DBAppwrite.listar('recetas');
        assert(!recetasFinal.some(r => r.id === recetaCreadaId), 'Appwrite: receta eliminada');
        // Store (ahora refleja DB gracias al mock de obtenerEstado)
        const state3 = Store.obtenerEstado();
        assert(!state3.recetas.some(r => r.id === recetaCreadaId), 'Store: receta eliminada');
      } catch (e) {
        assert(false, 'Error al eliminar: ' + e.message);
      }

      // ═══════════════════════════════════════════════════
      // 5. Modal de detalle
      // ═══════════════════════════════════════════════════
      resultsEl.innerHTML += '<div class="suite"><h2>5. Modal de detalle</h2></div>';
      try {
        const detalleReceta = await repo.guardarReceta({
          _nombreProducto: 'Detalle Test ' + sufijo,
          nivel: 'final',
          categoria: 'test_detalle',
          es_intermedio: false,
          destino: 'cocina',
          ingredientes: [{ tipo: 'insumo', id: insumoTestId, cantidad: 1, unidad: 'kg' }],
          instrucciones: 'Instrucción de prueba',
          creadoPor: 'test'
        });
        await esperar(1500);
        sincronizarInventario();

        // Asegurar que DBInventario.productos tenga el producto
        const prodParaDetalle = DB.productos.find(p => p.id === detalleReceta.productoId);
        if (prodParaDetalle) {
          DBInventario.productos = DBInventario.productos || [];
          if (!DBInventario.productos.find(p => p.id === prodParaDetalle.id)) {
            DBInventario.productos.push(prodParaDetalle);
          }
        }

        Recetas.mostrarDetalle(detalleReceta.id);
        await esperar(500);
        const modal = document.getElementById('modalRecetaDetalle');
        assert(modal && modal.style.display === 'flex', 'Modal de detalle abierto');
        if (modal) {
          const contenido = modal.textContent;
          assert(contenido.includes('Detalle Test ' + sufijo), 'Modal: nombre del producto visible');
          assert(contenido.includes(nombreInsumo), 'Modal: insumo visible');
          const btnCerrar = document.getElementById('btnCerrarDetalle');
          if (btnCerrar) btnCerrar.click();
          await esperar(300);
          assert(modal.style.display === 'none', 'Modal de detalle cerrado');
        }

        await repo.eliminarReceta(detalleReceta.id);
        await esperar(1500);
        sincronizarInventario();
      } catch (e) {
        assert(false, 'Error en modal de detalle: ' + e.message);
      }

      // ═══════════════════════════════════════════════════
      // 6. Limpieza final
      // ═══════════════════════════════════════════════════
      resultsEl.innerHTML += '<div class="suite"><h2>6. Limpieza</h2></div>';
      try {
        if (insumoTestId) {
          await DBAppwrite.eliminar('insumos', insumoTestId);
          assert(true, 'Insumo de prueba eliminado');
        }
        if (idIntermedia) {
          const insumosFinal = await DBAppwrite.listar('insumos');
          const insumoInter = insumosFinal.find(i => i.nombre === nombreIntermedia && i.tipo === 'cocina');
          if (insumoInter) {
            await DBAppwrite.eliminar('insumos', insumoInter.id);
          }
        }
      } catch (e) {
        assert(false, 'Error al limpiar: ' + e.message);
      }

      // Limpiar DOM
      document.getElementById('view-recetas')?.remove();
      document.querySelectorAll('.modal-overlay').forEach(o => o.remove());

      resultsEl.innerHTML += `<div class="summary">${passed} pasaron, ${failed} fallaron</div>`;
      if (failed === 0) resultsEl.innerHTML += '<div class="test pass">✔ Todos los tests del flujo real Appwrite pasaron.</div>';
    }

    window.addEventListener('load', () => setTimeout(runTests, 200));
  </script>
</body>
</html>
