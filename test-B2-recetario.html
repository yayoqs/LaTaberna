<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test B2 — Recetario v6.2.x (Persistencia y Ciclo Completo)</title>
  <style>
    body { font-family: monospace; background: #1a1a24; color: #f1f5f9; padding: 20px; }
    h1 { color: #f59e0b; }
    .suite { margin-bottom: 24px; border-bottom: 1px solid #2e2e42; padding-bottom: 12px; }
    .test { margin: 4px 0; padding: 4px 8px; border-radius: 4px; }
    .pass { background: rgba(34,197,94,.2); }
    .fail { background: rgba(239,68,68,.2); }
    .summary { margin-top: 20px; font-weight: bold; }
    .info { color: #94a3b8; font-size: 12px; margin: 2px 0; }
    .error { color: #ef4444; }
  </style>
</head>
<body>
  <h1>🧪 Test B2 — Recetario v6.2.x (Persistencia)</h1>
  <p class="info">Valida creación, edición, eliminación, ejecución, persistencia en Appwrite/localStorage y Store.</p>
  <div id="results"></div>

  <script type="module">
    import { Store } from '../js/lib/store.js';
    import { EventBus } from '../js/lib/eventBus.js';
    import { Auth } from '../js/auth.js';
    import { DB } from '../js/db.js';
    import { DBAppwrite } from '../js/db-appwrite.js';
    import { Logger } from '../js/lib/logger.js';
    import { Recetas } from '../js/ui/recetas.js';

    Logger.setLevel('ERROR');
    window.Logger = Logger;

    // ── Mocks de Appwrite ──────────────────────────────
    // Simulamos una "base de datos" remota para verificar que los datos se envían
    const appwriteMockDB = {
      productos: [],
      recetas: [],
      ingredientes: []
    };

    DBAppwrite.habilitado = true;
    DBAppwrite.crear = async (coleccion, id, datos) => {
      const nuevo = { id: id || ('mock_' + Date.now()), ...datos };
      if (!appwriteMockDB[coleccion]) appwriteMockDB[coleccion] = [];
      appwriteMockDB[coleccion].push(nuevo);
      return nuevo;
    };
    DBAppwrite.actualizar = async (coleccion, id, datos) => {
      if (!appwriteMockDB[coleccion]) appwriteMockDB[coleccion] = [];
      const idx = appwriteMockDB[coleccion].findIndex(item => item.id === id);
      if (idx >= 0) {
        appwriteMockDB[coleccion][idx] = { ...appwriteMockDB[coleccion][idx], ...datos };
      } else {
        appwriteMockDB[coleccion].push({ id, ...datos });
      }
      return true;
    };
    DBAppwrite.eliminar = async (coleccion, id) => {
      if (!appwriteMockDB[coleccion]) return;
      appwriteMockDB[coleccion] = appwriteMockDB[coleccion].filter(item => item.id !== id);
    };
    DBAppwrite.listar = async (coleccion) => {
      return appwriteMockDB[coleccion] || [];
    };

    // ── Mocks de Auth ──────────────────────────────────
    Auth.getRol = () => 'cocina';
    Auth._rol = 'cocina';

    // ── Estado inicial ─────────────────────────────────
    DB.productos = [
      { id: 'prod_a', nombre: 'Papas fritas', activo: true, destino: 'cocina' }
    ];
    DB.ingredientes = [
      { id: 'ing_cebolla', nombre: 'Cebolla', unidad: 'kg', stock: 10, valor_unitario: 0.5 },
      { id: 'ing_aceite', nombre: 'Aceite', unidad: 'L', stock: 20, valor_unitario: 1.2 }
    ];
    DB.recetas = [
      {
        id: 'rec_1', productoId: 'prod_a', nivel: 'producto_final', categoria: 'pizzas', destino: 'cocina',
        es_intermedio: false, ingredientes: [
          { tipo: 'insumo', id: 'ing_aceite', cantidad: 0.5, unidad: 'L' }
        ], instrucciones: 'Freír 5 min', stockActual: 0, unidadStock: ''
      }
    ];
    DB.saveRecetas = () => localStorage.setItem('pubpos_recetas', JSON.stringify(DB.recetas));
    DB.saveProductos = () => localStorage.setItem('pubpos_productos', JSON.stringify(DB.productos));
    DB.saveIngredientes = () => localStorage.setItem('pubpos_ingredientes', JSON.stringify(DB.ingredientes));

    // Sincronizar estado inicial con Appwrite mock
    appwriteMockDB.recetas = JSON.parse(JSON.stringify(DB.recetas));
    appwriteMockDB.productos = JSON.parse(JSON.stringify(DB.productos));
    appwriteMockDB.ingredientes = JSON.parse(JSON.stringify(DB.ingredientes));

    // Store mock
    const originalGetState = Store.getState;
    Store.getState = () => ({
      productos: DB.productos,
      recetas: DB.recetas,
      ingredientes: DB.ingredientes
    });
    Store.subscribe = () => () => {};
    Store.dispatch = (action) => {
      if (action.type === 'PRODUCTO_GUARDADO') {
        const idx = DB.productos.findIndex(p => p.id === action.payload.id);
        if (idx >= 0) DB.productos[idx] = action.payload;
        else DB.productos.push(action.payload);
        DB.saveProductos();
      } else if (action.type === 'RECETA_GUARDADA') {
        const idx = DB.recetas.findIndex(r => r.id === action.payload.id);
        if (idx >= 0) DB.recetas[idx] = action.payload;
        else DB.recetas.push(action.payload);
        DB.saveRecetas();
      } else if (action.type === 'INGREDIENTE_GUARDADO') {
        const idx = DB.ingredientes.findIndex(i => i.id === action.payload.id);
        if (idx >= 0) DB.ingredientes[idx] = action.payload;
        else DB.ingredientes.push(action.payload);
        DB.saveIngredientes();
      } else if (action.type === 'RECETA_ELIMINADA') {
        DB.recetas = DB.recetas.filter(r => r.id !== action.payload);
        DB.saveRecetas();
      }
    };

    // Limpiar localStorage antes de empezar
    localStorage.removeItem('pubpos_recetas');
    localStorage.removeItem('pubpos_productos');
    localStorage.removeItem('pubpos_ingredientes');

    // ── Utilidades de test ────────────────────────────
    const resultsEl = document.getElementById('results');
    let passed = 0, failed = 0;
    function assert(condition, msg) {
      if (condition) { passed++; resultsEl.innerHTML += '<div class="test pass">✔ ' + msg + '</div>'; }
      else { failed++; resultsEl.innerHTML += '<div class="test fail">✘ ' + msg + '</div>'; }
    }
    const esperar = (ms) => new Promise(resolve => setTimeout(resolve, ms));

    function simularClick(selector) {
      const el = document.querySelector(selector);
      if (el) el.click();
    }

    async function runTests() {
      resultsEl.innerHTML = '';
      if (!document.getElementById('toastContainer')) {
        const tc = document.createElement('div'); tc.id = 'toastContainer'; document.body.appendChild(tc);
      }

      // ── Suite 1: Renderizado inicial ──────────────────
      resultsEl.innerHTML += '<div class="suite"><h2>1. Renderizado inicial</h2></div>';
      Recetas.render('produccion');
      await esperar(200);
      assert(!!document.querySelector('.recetas-libro-paginas'), 'Vista de libro renderizada');
      const tarjetasIniciales = document.querySelectorAll('.recetas-tarjeta-libro');
      assert(tarjetasIniciales.length === 1, 'Hay 1 receta inicial en el libro');

      // ── Suite 2: Crear nueva receta (persistencia) ─────
      resultsEl.innerHTML += '<div class="suite"><h2>2. Crear receta y persistencia</h2></div>';
      simularClick('#recetas-boton-nueva');
      await esperar(300);
      const modal = document.getElementById('modalRecetaSheet');
      assert(modal && modal.classList.contains('activo'), 'Modal sheet abierto');

      // Llenar campos
      document.getElementById('recModalNombre').value = 'Cebolla caramelizada';
      document.getElementById('recModalCapitulo').value = 'guarniciones';
      document.getElementById('recModalNivel').value = 'preparacion';
      document.getElementById('recModalIntermedio').checked = true;
      document.querySelector('#recModalToggleDestino button[data-destino="cocina"]').click();

      // Agregar ingrediente
      document.getElementById('recModalTipoIng').value = 'insumo';
      document.getElementById('recModalTipoIng').dispatchEvent(new Event('change', { bubbles: true }));
      await esperar(50);
      document.getElementById('recModalSelectorIng').value = 'ing_cebolla';
      document.getElementById('recModalCantidadIng').value = '2';
      simularClick('#btnAgregarIngModal');
      await esperar(50);
      assert(document.querySelectorAll('#recModalIngredientesLista .recetas-ingrediente-item').length === 1, 'Ingrediente agregado en el sheet');

      // Agregar paso
      const inputPaso = document.querySelector('#recModalPasosEditor .recetas-paso-editor-input');
      inputPaso.value = 'Cortar la cebolla en pluma';
      inputPaso.dispatchEvent(new Event('input', { bubbles: true }));

      // Guardar
      simularClick('#btnGuardarModalSheet');
      await esperar(500);

      // Verificar persistencia en DB local
      const recetaCreada = DB.recetas.find(r => r.productoId && DB.productos.some(p => p.id === r.productoId && p.nombre === 'Cebolla caramelizada'));
      assert(!!recetaCreada, 'Receta guardada en DB local');
      assert(recetaCreada.categoria === 'guarniciones', 'Capítulo guardado correctamente');
      assert(recetaCreada.nivel === 'preparacion', 'Nivel guardado correctamente');
      assert(recetaCreada.es_intermedio === true, 'Es preparación intermedia');
      assert(recetaCreada.instrucciones.includes('Cortar la cebolla'), 'Instrucciones guardadas');

      // Verificar persistencia en localStorage
      const storedRecetas = JSON.parse(localStorage.getItem('pubpos_recetas') || '[]');
      const storedEnLocal = storedRecetas.find(r => r.id === recetaCreada.id);
      assert(!!storedEnLocal, 'Receta persistida en localStorage');

      // Verificar persistencia en Appwrite mock
      const appwriteRecetas = appwriteMockDB.recetas;
      const storedEnAppwrite = appwriteRecetas.find(r => r.id === recetaCreada.id);
      assert(!!storedEnAppwrite, 'Receta persistida en Appwrite');
      assert(storedEnAppwrite.categoria === 'guarniciones', 'Capítulo correcto en Appwrite');

      // Verificar producto creado
      const productoNuevo = DB.productos.find(p => p.nombre === 'Cebolla caramelizada');
      assert(!!productoNuevo, 'Producto creado en DB');
      const storedProductos = JSON.parse(localStorage.getItem('pubpos_productos') || '[]');
      assert(storedProductos.some(p => p.nombre === 'Cebolla caramelizada'), 'Producto persistido en localStorage');
      const appwriteProductos = appwriteMockDB.productos;
      assert(appwriteProductos.some(p => p.nombre === 'Cebolla caramelizada'), 'Producto persistido en Appwrite');

      // Verificar que la UI se actualiza
      await esperar(200);
      const tarjetasDespues = document.querySelectorAll('.recetas-tarjeta-libro');
      assert(tarjetasDespues.length === 2, 'Ahora hay 2 recetas en el libro');

      // ── Suite 3: Editar la receta creada ──────────────
      resultsEl.innerHTML += '<div class="suite"><h2>3. Editar receta</h2></div>';
      // Hacer clic en la tarjeta de la nueva receta
      const tarjetaNueva = Array.from(document.querySelectorAll('.recetas-tarjeta-libro'))
        .find(t => t.querySelector('.recetas-tarjeta-libro-nombre').textContent === 'Cebolla caramelizada');
      assert(!!tarjetaNueva, 'Tarjeta de la nueva receta encontrada');
      tarjetaNueva.click();
      await esperar(300);
      assert(modal.classList.contains('activo'), 'Modal de edición abierto');

      // Cambiar el capítulo y el nivel
      document.getElementById('recModalCapitulo').value = 'salsas';
      document.getElementById('recModalNivel').value = 'aderezo';
      document.getElementById('recModalIntermedio').checked = false;

      // Guardar cambios
      simularClick('#btnGuardarModalSheet');
      await esperar(500);

      const recetaEditada = DB.recetas.find(r => r.id === recetaCreada.id);
      assert(recetaEditada.categoria === 'salsas', 'Capítulo actualizado en DB');
      assert(recetaEditada.nivel === 'aderezo', 'Nivel actualizado en DB');
      assert(recetaEditada.es_intermedio === false, 'Ya no es preparación intermedia');

      // Verificar en Appwrite
      const appwriteEditada = appwriteMockDB.recetas.find(r => r.id === recetaCreada.id);
      assert(appwriteEditada && appwriteEditada.categoria === 'salsas', 'Cambios persistidos en Appwrite');

      // ── Suite 4: Eliminar receta ──────────────────────
      resultsEl.innerHTML += '<div class="suite"><h2>4. Eliminar receta</h2></div>';
      const idAEliminar = recetaCreada.id;
      // Simular eliminación (llamada directa al repositorio)
      const { crearRecetaRepo } = await import('../js/repositorios/receta-repository.js');
      const repo = crearRecetaRepo();
      await repo.eliminarReceta(idAEliminar);
      await esperar(200);

      const recetaEliminada = DB.recetas.find(r => r.id === idAEliminar);
      assert(!recetaEliminada, 'Receta eliminada de DB');

      // Verificar localStorage
      const storedDespuesEliminar = JSON.parse(localStorage.getItem('pubpos_recetas') || '[]');
      assert(!storedDespuesEliminar.some(r => r.id === idAEliminar), 'Receta eliminada de localStorage');

      // Verificar Appwrite
      const appwriteDespuesEliminar = appwriteMockDB.recetas;
      assert(!appwriteDespuesEliminar.some(r => r.id === idAEliminar), 'Receta eliminada de Appwrite');

      // Forzar repintado
      Recetas.render('produccion');
      await esperar(200);
      const tarjetasFinal = document.querySelectorAll('.recetas-tarjeta-libro');
      assert(tarjetasFinal.length === 1, 'Solo queda la receta inicial tras eliminar');

      // ── Suite 5: Ejecutar preparación ─────────────────
      resultsEl.innerHTML += '<div class="suite"><h2>5. Ejecutar preparación</h2></div>';
      // Volvemos a crear una preparación intermedia para probar ejecución
      document.getElementById('recetas-boton-nueva').click();
      await esperar(300);
      document.getElementById('recModalNombre').value = 'Salsa BBQ';
      document.getElementById('recModalCapitulo').value = 'salsas';
      document.getElementById('recModalNivel').value = 'preparacion';
      document.getElementById('recModalIntermedio').checked = true;
      document.getElementById('recModalTipoIng').value = 'insumo';
      document.getElementById('recModalTipoIng').dispatchEvent(new Event('change', { bubbles: true }));
      await esperar(50);
      document.getElementById('recModalSelectorIng').value = 'ing_aceite';
      document.getElementById('recModalCantidadIng').value = '0.5';
      simularClick('#btnAgregarIngModal');
      await esperar(50);
      const inputPaso2 = document.querySelector('#recModalPasosEditor .recetas-paso-editor-input');
      inputPaso2.value = 'Mezclar aceite y especias';
      inputPaso2.dispatchEvent(new Event('input', { bubbles: true }));
      simularClick('#btnGuardarModalSheet');
      await esperar(500);

      // Ir a Mi Stock
      simularClick('.recetas-pestana[data-pestana="stock"]');
      await esperar(200);
      const btnPreparar = document.querySelector('.recetas-accion-preparar');
      if (btnPreparar) {
        btnPreparar.click();
        await esperar(200);
        const inputCant = document.getElementById('rec-cantidad-preparar');
        if (inputCant) {
          inputCant.value = '2';
          simularClick('#rec-aceptar-cantidad');
          await esperar(300);
          // Verificar que el stock del ingrediente se descontó
          const aceite = DB.ingredientes.find(i => i.id === 'ing_aceite');
          assert(aceite.stock === 19, 'Stock de aceite descontado (20 - 0.5*2 = 19)');
          // Verificar en Appwrite
          const aceiteAppwrite = appwriteMockDB.ingredientes.find(i => i.id === 'ing_aceite');
          assert(aceiteAppwrite && aceiteAppwrite.stock === 19, 'Stock de aceite actualizado en Appwrite');
        }
      }

      // ── Suite 6: Modal de detalle ─────────────────────
      resultsEl.innerHTML += '<div class="suite"><h2>6. Modal de detalle</h2></div>';
      Recetas.mostrarDetalle('rec_1');
      await esperar(200);
      const modalDetalle = document.getElementById('modalRecetaDetalle');
      assert(modalDetalle && modalDetalle.style.display === 'flex', 'Modal de detalle abierto');
      assert(modalDetalle.textContent.includes('Papas fritas'), 'Muestra nombre del producto');
      simularClick('#btnCerrarDetalle');
      await esperar(100);
      assert(modalDetalle.style.display === 'none', 'Modal de detalle cerrado');

      // ── Suite 7: Sincronización de Store ──────────────
      resultsEl.innerHTML += '<div class="suite"><h2>7. Sincronización Store</h2></div>';
      const state = Store.getState();
      assert(state.recetas.length >= 2, 'El Store refleja las recetas actuales');
      assert(state.productos.some(p => p.nombre === 'Salsa BBQ'), 'El Store tiene el nuevo producto');
      assert(!state.recetas.some(r => r.id === idAEliminar), 'El Store no contiene la receta eliminada');

      // Limpiar
      document.getElementById('view-recetas')?.remove();
      document.querySelectorAll('.modal-overlay').forEach(o => o.remove());

      resultsEl.innerHTML += `<div class="summary">${passed} pasaron, ${failed} fallaron</div>`;
      if (failed === 0) resultsEl.innerHTML += '<div class="test pass">✔ Todos los tests de persistencia pasaron.</div>';
    }

    window.addEventListener('load', () => runTests().catch(e => {
      resultsEl.innerHTML += `<div class="error">Error en tests: ${e.message}</div>`;
      console.error(e);
    }));
  </script>
</body>
</html>
