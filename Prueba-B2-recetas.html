<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Recetario — Modal de Creación/Edición</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..900;1,9..144,400..900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --color-bg: #0f0f14;
      --color-card: #1a1a24;
      --color-panel: #21212e;
      --color-hover: #2a2a3a;
      --color-border: #2e2e42;
      --color-text: #f1f5f9;
      --color-text-sec: #94a3b8;
      --color-text-muted: #64748b;
      --color-accent: #f59e0b;
      --color-success: #22c55e;
      --color-danger: #ef4444;
      --color-info: #3b82f6;
      --color-warning: #f59e0b;
      --color-cocina: #f97316;
      --color-barra: #8b5cf6;
      --radius: 12px;
      --radius-sm: 8px;
      --radius-xs: 6px;
      --shadow-sm: 0 2px 8px rgba(0,0,0,.2);
      --shadow-md: 0 8px 24px rgba(0,0,0,.4);
      --t: .2s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      display: flex; flex-direction: column;
      height: 100vh; height: 100dvh;
      overflow: hidden; max-width: 520px; margin: 0 auto;
    }
    .font-libro { font-family: 'Fraunces', Georgia, serif; }

    /* ── Header ────────────────────────────────── */
    .recetas-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px; background: var(--color-panel);
      border-bottom: 1px solid var(--color-border); z-index: 20; flex-shrink: 0;
    }
    .recetas-header h2 { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    .recetas-header h2 i { color: var(--color-accent); }
    .btn-nueva-receta {
      background: var(--color-accent); color: #000; border: none; border-radius: 99px;
      padding: 10px 18px; font-weight: 700; font-size: 13px; cursor: pointer;
      display: flex; align-items: center; gap: 8px; transition: var(--t);
    }
    .btn-nueva-receta:active { transform: scale(.95); }

    /* ── Contenido principal ──────────────────── */
    .main-content { flex: 1; overflow-y: auto; padding: 20px; }
    .receta-card {
      background: var(--color-card); border: 1px solid var(--color-border); border-radius: var(--radius);
      padding: 16px; margin-bottom: 12px; cursor: pointer; display: flex; align-items: center;
      justify-content: space-between; transition: var(--t);
    }
    .receta-card:active { background: var(--color-hover); }
    .receta-card h3 { font-family: 'Fraunces', serif; font-size: 16px; }
    .receta-card .meta { font-size: 11px; color: var(--color-text-muted); }

    /* ── Overlay y modal ──────────────────────── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 100;
      display: none; align-items: flex-end; justify-content: center;
    }
    .modal-overlay.activo { display: flex; }
    .modal-sheet {
      background: var(--color-panel); border-radius: 20px 20px 0 0;
      max-width: 520px; width: 100%; max-height: 90vh; overflow-y: auto;
      display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom);
      animation: subir .3s cubic-bezier(.4,0,.2,1);
    }
    @keyframes subir { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .modal-handle { width: 36px; height: 5px; background: var(--color-border); border-radius: 3px; margin: 12px auto 0; }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px 8px;
    }
    .modal-header h3 { font-family: 'Fraunces', serif; font-size: 20px; }
    .modal-close { background: none; border: none; color: var(--color-text-muted); font-size: 20px; cursor: pointer; }

    .modal-body { padding: 0 20px 20px; display: flex; flex-direction: column; gap: 14px; }

    /* ── Campos del formulario ────────────────── */
    .campo { display: flex; flex-direction: column; gap: 4px; }
    .campo label {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: .5px; color: var(--color-text-muted);
    }
    .campo input, .campo select, .campo textarea {
      background: var(--color-card); border: 1px solid var(--color-border);
      border-radius: var(--radius-sm); padding: 12px 14px; color: var(--color-text);
      font-size: 14px; font-family: inherit; outline: none; width: 100%;
    }
    .campo input:focus, .campo select:focus, .campo textarea:focus {
      border-color: var(--color-accent);
    }
    .campo textarea { resize: vertical; min-height: 80px; }

    /* ── Fila de dos columnas ─────────────────── */
    .fila { display: flex; gap: 10px; }
    .fila .campo { flex: 1; }

    /* ── Toggle Cocina/Barra ──────────────────── */
    .toggle-destino {
      display: flex; background: var(--color-card); border: 1px solid var(--color-border);
      border-radius: var(--radius-sm); overflow: hidden;
    }
    .toggle-destino button {
      flex: 1; padding: 12px; border: none; background: transparent;
      color: var(--color-text-muted); font-weight: 600; font-size: 13px;
      cursor: pointer; transition: var(--t); display: flex; align-items: center;
      justify-content: center; gap: 6px;
    }
    .toggle-destino button.activo { background: var(--color-cocina); color: #fff; }
    .toggle-destino button.activo.barra { background: var(--color-barra); }

    /* ── Ingredientes ─────────────────────────── */
    .ingredientes-lista { display: flex; flex-direction: column; gap: 6px; }
    .ingrediente-item {
      display: flex; align-items: center; gap: 8px; background: var(--color-card);
      border: 1px solid var(--color-border); border-radius: var(--radius-sm);
      padding: 10px 12px; font-size: 13px;
    }
    .ingrediente-item .ing-nombre { flex: 1; font-weight: 500; }
    .ingrediente-item .ing-cantidad {
      font-weight: 700; color: var(--color-accent); white-space: nowrap;
    }
    .btn-quitar-ing {
      background: none; border: none; color: var(--color-danger); cursor: pointer;
      font-size: 14px; padding: 4px;
    }

    .agregar-ingrediente {
      display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
    }
    .agregar-ingrediente select { flex: 1; min-width: 100px; }
    .agregar-ingrediente input { width: 70px; }
    .agregar-ingrediente button {
      background: var(--color-accent); color: #000; border: none; border-radius: var(--radius-sm);
      padding: 10px 14px; font-weight: 700; font-size: 12px; cursor: pointer;
      white-space: nowrap;
    }

    /* ── Editor de pasos ──────────────────────── */
    .pasos-editor { display: flex; flex-direction: column; gap: 8px; }
    .paso-editor-item {
      display: flex; gap: 10px; align-items: flex-start;
    }
    .paso-editor-num {
      width: 32px; height: 32px; border-radius: var(--radius-xs);
      background: var(--color-accent); color: #000; font-weight: 800;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px; flex-shrink: 0; font-family: 'Fraunces', serif;
    }
    .paso-editor-input {
      flex: 1; background: var(--color-card); border: 1px solid var(--color-border);
      border-radius: var(--radius-sm); padding: 10px 12px; color: var(--color-text);
      font-size: 13px; font-family: inherit; outline: none;
    }
    .paso-editor-input:focus { border-color: var(--color-accent); }
    .btn-quitar-paso {
      background: none; border: none; color: var(--color-text-muted);
      cursor: pointer; font-size: 16px; padding: 6px;
    }

    .btn-agregar-paso {
      background: var(--color-card); border: 1px dashed var(--color-border);
      color: var(--color-text-muted); border-radius: var(--radius-sm);
      padding: 12px; font-size: 13px; font-weight: 600; cursor: pointer;
      width: 100%; display: flex; align-items: center; justify-content: center;
      gap: 6px; transition: var(--t);
    }
    .btn-agregar-paso:hover { border-color: var(--color-accent); color: var(--color-text); }

    /* ── Footer del modal ─────────────────────── */
    .modal-footer {
      display: flex; gap: 10px; padding: 16px 20px;
      border-top: 1px solid var(--color-border); background: var(--color-panel);
    }
    .modal-footer button {
      flex: 1; padding: 14px; border-radius: var(--radius-sm);
      font-weight: 700; font-size: 14px; cursor: pointer; transition: var(--t);
    }
    .btn-guardar { background: var(--color-accent); color: #000; border: none; }
    .btn-cancelar { background: var(--color-card); color: var(--color-text-sec); border: 1px solid var(--color-border); }
    .btn-guardar:active { transform: scale(.97); }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="recetas-header">
    <h2><i class="fas fa-book-open"></i> Recetario</h2>
    <button class="btn-nueva-receta" id="btnNuevaReceta"><i class="fas fa-plus"></i> Nueva</button>
  </div>

  <!-- Lista de recetas (simulada) -->
  <div class="main-content" id="mainContent">
    <div class="receta-card" data-id="rec_1">
      <div><h3>Cebolla caramelizada</h3><div class="meta">Guarniciones · Preparación</div></div>
      <button class="btn-editar" data-id="rec_1" style="background:var(--color-card);border:1px solid var(--color-border);color:var(--color-text-sec);padding:8px 12px;border-radius:var(--radius-sm);cursor:pointer;"><i class="fas fa-pen"></i></button>
    </div>
    <div class="receta-card" data-id="rec_2">
      <div><h3>Chimichurri</h3><div class="meta">Salsas · Preparación</div></div>
      <button class="btn-editar" data-id="rec_2" style="background:var(--color-card);border:1px solid var(--color-border);color:var(--color-text-sec);padding:8px 12px;border-radius:var(--radius-sm);cursor:pointer;"><i class="fas fa-pen"></i></button>
    </div>
  </div>

  <!-- MODAL DE CREACIÓN/EDICIÓN -->
  <div class="modal-overlay" id="modalReceta">
    <div class="modal-sheet">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <h3 class="font-libro" id="modalTitulo">Nueva Receta</h3>
        <button class="modal-close" id="btnCerrarModal"><i class="fas fa-times"></i></button>
      </div>
      <div class="modal-body">
        <!-- Nombre del producto -->
        <div class="campo">
          <label>Nombre del producto</label>
          <input type="text" id="inputNombre" placeholder="Ej: Cebolla caramelizada">
        </div>

        <!-- Capítulo y destino -->
        <div class="fila">
          <div class="campo">
            <label>Capítulo</label>
            <select id="inputCapitulo">
              <option value="salsas">Salsas</option>
              <option value="mayonesas">Mayonesas</option>
              <option value="guarniciones">Guarniciones</option>
              <option value="bebidas">Bebidas</option>
              <option value="pizzas">Pizzas</option>
              <option value="cocteles">Cócteles</option>
              <option value="sin_categoria">Sin categoría</option>
            </select>
          </div>
          <div class="campo">
            <label>Nivel (etiqueta)</label>
            <input type="text" id="inputNivel" placeholder="Ej: salsa, guarnicion...">
          </div>
        </div>

        <!-- Destino: Cocina / Barra -->
        <div class="campo">
          <label>Destino</label>
          <div class="toggle-destino" id="toggleDestino">
            <button class="activo" data-destino="cocina"><i class="fas fa-fire-burner"></i> Cocina</button>
            <button data-destino="barra"><i class="fas fa-wine-glass"></i> Barra</button>
          </div>
        </div>

        <!-- Preparación intermedia -->
        <div class="campo">
          <label style="display:flex;align-items:center;gap:8px;">
            <input type="checkbox" id="inputIntermedio" style="width:auto;">
            ¿Es una preparación intermedia? (genera stock interno)
          </label>
        </div>

        <!-- Ingredientes -->
        <div class="campo">
          <label>Ingredientes</label>
          <div class="ingredientes-lista" id="ingredientesLista"></div>
          <div class="agregar-ingrediente" style="margin-top:8px;">
            <select id="tipoIngrediente" style="flex:1;">
              <option value="insumo">Insumo (Despensa)</option>
              <option value="subreceta">Sub-receta (Preparación)</option>
            </select>
            <select id="selectorIngrediente" style="flex:2;">
              <option value="">— Seleccionar —</option>
            </select>
            <input type="number" id="cantidadIngrediente" placeholder="Cant." step="0.01" style="width:70px;">
            <button id="btnAgregarIng">Agregar</button>
          </div>
        </div>

        <!-- Instrucciones (por pasos) -->
        <div class="campo">
          <label>Instrucciones (por pasos)</label>
          <div class="pasos-editor" id="pasosEditor">
            <!-- Se llena dinámicamente -->
          </div>
          <button class="btn-agregar-paso" id="btnAgregarPaso" style="margin-top:8px;">
            <i class="fas fa-plus"></i> Añadir paso
          </button>
        </div>
      </div>

      <div class="modal-footer">
        <button class="btn-cancelar" id="btnCancelar">Cancelar</button>
        <button class="btn-guardar" id="btnGuardar"><i class="fas fa-save"></i> Guardar</button>
      </div>
    </div>
  </div>

<script>
  // ==================== DATOS DE PRUEBA ====================
  const ingredientesDespensa = [
    { id:'ins_1', nombre:'Cebolla', unidad:'kg', stock: 10 },
    { id:'ins_2', nombre:'Aceite de oliva', unidad:'L', stock: 5 },
    { id:'ins_3', nombre:'Perejil', unidad:'kg', stock: 2 },
    { id:'ins_4', nombre:'Ajo', unidad:'kg', stock: 3 },
    { id:'ins_5', nombre:'Huevo', unidad:'u', stock: 60 },
    { id:'ins_6', nombre:'Mantequilla', unidad:'kg', stock: 4 },
    { id:'ins_7', nombre:'Muzzarella', unidad:'kg', stock: 8 },
    { id:'ins_8', nombre:'Tomate triturado', unidad:'kg', stock: 12 },
  ];

  const recetasIntermedias = [
    { id:'rec_1', nombre:'Cebolla caramelizada', unidadStock:'kg', stockActual: 3, es_intermedio: true },
    { id:'rec_2', nombre:'Chimichurri', unidadStock:'L', stockActual: 1.2, es_intermedio: true },
    { id:'rec_4', nombre:'Mayonesa casera', unidadStock:'L', stockActual: 0.5, es_intermedio: true },
  ];

  // Datos de recetas existentes
  const recetasBD = {
    rec_1: {
      id: 'rec_1', nombre: 'Cebolla caramelizada', capitulo: 'guarniciones', nivel: 'preparacion',
      destino: 'cocina', es_intermedio: true,
      ingredientes: [
        { tipo: 'insumo', id: 'ins_1', cantidad: 2, _nombre: 'Cebolla', _unidad: 'kg' },
        { tipo: 'insumo', id: 'ins_2', cantidad: 0.1, _nombre: 'Aceite de oliva', _unidad: 'L' }
      ],
      pasos: ['Cortar la cebolla en pluma fina.', 'Calentar el aceite en una sartén.', 'Cocinar a fuego lento por 25 minutos.']
    },
    rec_2: {
      id: 'rec_2', nombre: 'Chimichurri', capitulo: 'salsas', nivel: 'salsa',
      destino: 'cocina', es_intermedio: true,
      ingredientes: [
        { tipo: 'insumo', id: 'ins_3', cantidad: 0.1, _nombre: 'Perejil', _unidad: 'kg' },
        { tipo: 'insumo', id: 'ins_4', cantidad: 0.03, _nombre: 'Ajo', _unidad: 'kg' },
        { tipo: 'insumo', id: 'ins_2', cantidad: 0.2, _nombre: 'Aceite de oliva', _unidad: 'L' }
      ],
      pasos: ['Picar finamente el perejil y el ajo.', 'Mezclar con aceite, vinagre y orégano.', 'Dejar reposar 1 hora antes de usar.']
    }
  };

  let ingredientesActuales = [];
  let pasosActuales = [];
  let editandoId = null;

  // ==================== MODAL ====================
  const modal = document.getElementById('modalReceta');
  const modalTitulo = document.getElementById('modalTitulo');

  function abrirModal(idReceta = null) {
    editandoId = idReceta;
    if (idReceta && recetasBD[idReceta]) {
      const r = recetasBD[idReceta];
      modalTitulo.textContent = 'Editar Receta';
      document.getElementById('inputNombre').value = r.nombre;
      document.getElementById('inputCapitulo').value = r.capitulo;
      document.getElementById('inputNivel').value = r.nivel;
      document.getElementById('inputIntermedio').checked = r.es_intermedio;
      document.querySelector(`#toggleDestino button[data-destino="${r.destino}"]`).click();
      ingredientesActuales = JSON.parse(JSON.stringify(r.ingredientes));
      pasosActuales = [...r.pasos];
    } else {
      modalTitulo.textContent = 'Nueva Receta';
      document.getElementById('inputNombre').value = '';
      document.getElementById('inputCapitulo').value = 'salsas';
      document.getElementById('inputNivel').value = '';
      document.getElementById('inputIntermedio').checked = false;
      document.querySelector('#toggleDestino button[data-destino="cocina"]').click();
      ingredientesActuales = [];
      pasosActuales = [''];
    }
    pintarIngredientes();
    pintarPasos();
    actualizarSelectorIngredientes();
    modal.classList.add('activo');
  }

  function cerrarModal() { modal.classList.remove('activo'); }

  document.getElementById('btnNuevaReceta').addEventListener('click', () => abrirModal());
  document.getElementById('btnCerrarModal').addEventListener('click', cerrarModal);
  document.getElementById('btnCancelar').addEventListener('click', cerrarModal);
  document.querySelectorAll('.btn-editar').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      abrirModal(btn.dataset.id);
    });
  });

  // ==================== TOGGLE COCINA/BARRA ====================
  document.querySelectorAll('#toggleDestino button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('#toggleDestino button').forEach(b => {
        b.classList.remove('activo', 'barra');
      });
      btn.classList.add('activo');
      if (btn.dataset.destino === 'barra') btn.classList.add('barra');
    });
  });

  // ==================== INGREDIENTES ====================
  function actualizarSelectorIngredientes() {
    const tipo = document.getElementById('tipoIngrediente').value;
    const select = document.getElementById('selectorIngrediente');
    select.innerHTML = '<option value="">— Seleccionar —</option>';
    if (tipo === 'insumo') {
      ingredientesDespensa.forEach(i => {
        const opt = document.createElement('option');
        opt.value = i.id;
        opt.textContent = `${i.nombre} (${i.unidad})`;
        opt.dataset.unidad = i.unidad;
        opt.dataset.nombre = i.nombre;
        select.appendChild(opt);
      });
    } else {
      recetasIntermedias.forEach(r => {
        const opt = document.createElement('option');
        opt.value = r.id;
        opt.textContent = `${r.nombre} (${r.unidadStock})`;
        opt.dataset.unidad = r.unidadStock;
        opt.dataset.nombre = r.nombre;
        select.appendChild(opt);
      });
    }
  }

  document.getElementById('tipoIngrediente').addEventListener('change', actualizarSelectorIngredientes);

  function pintarIngredientes() {
    const lista = document.getElementById('ingredientesLista');
    if (!ingredientesActuales.length) {
      lista.innerHTML = '<div style="color:var(--color-text-muted);font-size:13px;padding:8px 0;">Sin ingredientes</div>';
      return;
    }
    lista.innerHTML = ingredientesActuales.map((ing, idx) => `
      <div class="ingrediente-item">
        <span class="ing-nombre">${ing.tipo === 'subreceta' ? '📦' : '🧄'} ${ing._nombre}</span>
        <span class="ing-cantidad">${ing.cantidad} ${ing._unidad}</span>
        <button class="btn-quitar-ing" data-idx="${idx}"><i class="fas fa-trash"></i></button>
      </div>
    `).join('');

    lista.querySelectorAll('.btn-quitar-ing').forEach(btn => {
      btn.addEventListener('click', () => {
        ingredientesActuales.splice(parseInt(btn.dataset.idx), 1);
        pintarIngredientes();
      });
    });
  }

  document.getElementById('btnAgregarIng').addEventListener('click', () => {
    const tipo = document.getElementById('tipoIngrediente').value;
    const select = document.getElementById('selectorIngrediente');
    const cantidad = parseFloat(document.getElementById('cantidadIngrediente').value);
    if (!select.value || isNaN(cantidad) || cantidad <= 0) {
      alert('Selecciona un ingrediente y una cantidad válida');
      return;
    }
    const opt = select.options[select.selectedIndex];
    ingredientesActuales.push({
      tipo,
      id: select.value,
      cantidad,
      _nombre: opt.dataset.nombre,
      _unidad: opt.dataset.unidad
    });
    document.getElementById('cantidadIngrediente').value = '';
    select.value = '';
    pintarIngredientes();
  });

  // ==================== PASOS ====================
  function pintarPasos() {
    const editor = document.getElementById('pasosEditor');
    if (!pasosActuales.length) {
      editor.innerHTML = '<div style="color:var(--color-text-muted);font-size:13px;padding:8px 0;">Sin pasos definidos</div>';
      return;
    }
    editor.innerHTML = pasosActuales.map((paso, idx) => `
      <div class="paso-editor-item">
        <span class="paso-editor-num">${idx + 1}</span>
        <input type="text" class="paso-editor-input" value="${paso.replace(/"/g, '&quot;')}" data-idx="${idx}" placeholder="Describe este paso...">
        <button class="btn-quitar-paso" data-idx="${idx}"><i class="fas fa-trash"></i></button>
      </div>
    `).join('');

    editor.querySelectorAll('.paso-editor-input').forEach(input => {
      input.addEventListener('input', (e) => {
        pasosActuales[parseInt(e.target.dataset.idx)] = e.target.value;
      });
    });
    editor.querySelectorAll('.btn-quitar-paso').forEach(btn => {
      btn.addEventListener('click', () => {
        pasosActuales.splice(parseInt(btn.dataset.idx), 1);
        pintarPasos();
      });
    });
  }

  document.getElementById('btnAgregarPaso').addEventListener('click', () => {
    pasosActuales.push('');
    pintarPasos();
  });

  // ==================== GUARDAR ====================
  document.getElementById('btnGuardar').addEventListener('click', () => {
    const nombre = document.getElementById('inputNombre').value.trim();
    const capitulo = document.getElementById('inputCapitulo').value;
    const nivel = document.getElementById('inputNivel').value.trim().toLowerCase();
    const esIntermedio = document.getElementById('inputIntermedio').checked;
    const destino = document.querySelector('#toggleDestino button.activo').dataset.destino;
    const pasosValidos = pasosActuales.filter(p => p.trim());

    if (!nombre) { alert('El nombre es obligatorio'); return; }
    if (!ingredientesActuales.length) { alert('Añade al menos un ingrediente'); return; }
    if (!pasosValidos.length) { alert('Añade al menos un paso'); return; }

    const receta = {
      id: editandoId || ('rec_' + Date.now()),
      nombre,
      capitulo,
      nivel: nivel || 'sin_nivel',
      destino,
      es_intermedio: esIntermedio,
      ingredientes: ingredientesActuales,
      pasos: pasosValidos,
    };

    console.log('Receta guardada:', receta);
    recetasBD[receta.id] = receta;
    cerrarModal();
    actualizarListaRecetas();
  });

  function actualizarListaRecetas() {
    const main = document.getElementById('mainContent');
    main.innerHTML = Object.values(recetasBD).map(r => `
      <div class="receta-card" data-id="${r.id}">
        <div><h3>${r.nombre}</h3><div class="meta">${r.capitulo} · ${r.nivel} · ${r.destino}</div></div>
        <button class="btn-editar" data-id="${r.id}" style="background:var(--color-card);border:1px solid var(--color-border);color:var(--color-text-sec);padding:8px 12px;border-radius:var(--radius-sm);cursor:pointer;"><i class="fas fa-pen"></i></button>
      </div>
    `).join('');
    document.querySelectorAll('.btn-editar').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        abrirModal(btn.dataset.id);
      });
    });
  }

  // ==================== INICIAR ====================
  actualizarSelectorIngredientes();
</script>
</body>
</html>
