<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test D – Reparto</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      padding: 30px;
      max-width: 700px;
      margin: auto;
    }
    h1 { color: #f59e0b; margin-bottom: 4px; }
    .subtitulo { color: #a0a0a0; font-size: 13px; margin-bottom: 20px; }
    .resultado {
      background: #2a2a2a;
      border-radius: 8px;
      padding: 12px 16px;
      margin: 8px 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .ok { border-left: 4px solid #22c55e; }
    .fallo { border-left: 4px solid #ef4444; }
    .icono { font-size: 18px; }
    .seccion { color: #f59e0b; font-size: 13px; min-width: 100px; }
    .mensaje { flex: 1; }
  </style>
</head>
<body>
  <h1>Test D – Reparto (v5.0)</h1>
  <p class="subtitulo">Filtro por estado • Edición de ítems • Prevención de duplicación de comandas</p>
  <div id="resultados"></div>

  <script>
    // ─── Stubs del sistema ───────────────────────────────
    const Logger = { info: console.log, warn: console.warn, error: console.error, debug: console.log };
    const EventBus = {
      events: {},
      on(ev, cb) { (this.events[ev] = this.events[ev] || []).push(cb); },
      emit(ev, data) { (this.events[ev] || []).forEach(cb => cb(data)); }
    };
    const Store = {
      state: {},
      getState() { return this.state; },
      subscribe() {}
    };
    const Auth = { _rol: 'admin', getRol() { return this._rol; }, getNombre() { return 'Test'; } };
    let toastMessages = [];
    function showToast(tipo, msg) { toastMessages.push({tipo, msg}); }

    const DB = {
      pedidosDelivery: [],
      productos: [
        { id: 'prod1', nombre: 'Hamburguesa', precio: 1500, activo: true, destino: 'cocina' },
        { id: 'prod2', nombre: 'Papas fritas', precio: 800, activo: true, destino: 'cocina' }
      ],
      comandas: [],
      actualizarPedidoDelivery(id, datos) {
        const ped = this.pedidosDelivery.find(p => p.id === id);
        if (ped) Object.assign(ped, datos);
      },
      eliminarPedidoDelivery(id) { this.pedidosDelivery = this.pedidosDelivery.filter(p => p.id !== id); },
      saveComandas() {},
      crearPedidoDelivery(datos) {
        const nuevo = { id: 'deliv_test' + Date.now(), ...datos, created_at: new Date().toISOString() };
        this.pedidosDelivery.push(nuevo);
        return nuevo;
      }
    };
    window.fmtMoney = (val) => `$${val.toFixed(0)}`;
  </script>

  <script src="js/ui/reparto.js"></script>

  <script>
    function resultado(ok, seccion, mensaje) {
      const div = document.createElement('div');
      div.className = 'resultado ' + (ok ? 'ok' : 'fallo');
      div.innerHTML = `
        <span class="icono">${ok ? '✔' : '✘'}</span>
        <span class="seccion">[${seccion}]</span>
        <span class="mensaje">${mensaje}</span>
      `;
      document.getElementById('resultados').appendChild(div);
    }

    async function iniciarTests() {
      const pedPendiente = {
        id: 'deliv_001',
        direccion: 'Av. Siempre Viva 742',
        telefono: '123456789',
        items: [{ nombre: 'Hamburguesa', precio: 1500, qty: 1 }, { nombre: 'Papas fritas', precio: 800, qty: 2 }],
        total: 3100,
        estado: 'pendiente',
        repartidor: 'Juan',
        observaciones: '',
        created_at: new Date().toISOString()
      };
      const pedEnCamino = {
        id: 'deliv_002',
        direccion: 'Calle Falsa 123',
        telefono: '987654321',
        items: [{ nombre: 'Hamburguesa', precio: 1500, qty: 2 }],
        total: 3000,
        estado: 'en_camino',
        repartidor: 'Ana',
        observaciones: '',
        created_at: new Date().toISOString()
      };

      Store.state = { pedidosDelivery: [pedPendiente, pedEnCamino] };
      DB.pedidosDelivery = [pedPendiente, pedEnCamino];
      DB.comandas = [];
      toastMessages = [];

      // ── Render ────────────────────────────────────────
      EventBus.emit('vista:cambiada', 'reparto');
      await new Promise(r => setTimeout(r, 100));
      const filas = document.querySelectorAll('#repartoBody tr');
      resultado(filas.length === 2, 'Render', '2 pedidos visibles');

      // ── Filtro ────────────────────────────────────────
      document.getElementById('repartoEstadoFilter').value = 'pendiente';
      Reparto.filtrarPorEstado('pendiente');
      await new Promise(r => setTimeout(r, 100));
      resultado(document.querySelectorAll('#repartoBody tr').length === 1, 'Filtro', 'Solo pedido pendiente');

      document.getElementById('repartoEstadoFilter').value = 'todos';
      Reparto.filtrarPorEstado('todos');
      await new Promise(r => setTimeout(r, 100));
      resultado(document.querySelectorAll('#repartoBody tr').length === 2, 'Filtro', 'Todos los pedidos');

      // ── Edición de ítems ──────────────────────────────
      resultado(typeof Reparto.editarItems === 'function', 'Edición', 'Función disponible');
      Reparto.editarItems('deliv_001');
      await new Promise(r => setTimeout(r, 200));
      const modal = document.getElementById('modalEditarItems');
      resultado(modal && modal.style.display === 'flex', 'Edición', 'Modal abierto');
      
      const lista = document.getElementById('editItemsLista');
      resultado(lista && lista.textContent.includes('1x Hamburguesa'), 'Edición', 'Hamburguesa precargada');
      resultado(lista && lista.textContent.includes('2x Papas fritas'), 'Edición', 'Papas precargadas');

      Reparto._setItemsTemporales([
        { prodId: 'prod1', nombre: 'Hamburguesa', precio: 1500, qty: 3 },
        { prodId: 'prod2', nombre: 'Papas fritas', precio: 800, qty: 1 }
      ]);
      await Reparto.guardarEdicionItems('deliv_001');
      await new Promise(r => setTimeout(r, 100));
      
      const actualizado = DB.pedidosDelivery.find(p => p.id === 'deliv_001');
      resultado(actualizado.items.length === 2, 'Edición', '2 ítems');
      resultado(actualizado.items[0].qty === 3, 'Edición', 'Hamburguesa x3');
      resultado(actualizado.items[1].qty === 1, 'Edición', 'Papas x1');
      resultado(actualizado.total === 5300, 'Edición', 'Total $5300');
      resultado(modal.style.display === 'none', 'Edición', 'Modal cerrado');

      // ── Duplicación de comandas ────────────────────────
      window.DeliveryService = undefined;
      await Reparto.enviarACocina('deliv_001');
      await new Promise(r => setTimeout(r, 100));
      let comandas = DB.comandas.filter(c => c.deliveryId === 'deliv_001');
      resultado(comandas.length === 1, 'Duplicación', 'Comanda creada');
      resultado(toastMessages.some(t => t.tipo === 'success'), 'Duplicación', 'Toast éxito');

      await Reparto.enviarACocina('deliv_001');
      await new Promise(r => setTimeout(r, 100));
      comandas = DB.comandas.filter(c => c.deliveryId === 'deliv_001');
      resultado(comandas.length === 1, 'Duplicación', 'No duplicada');
      resultado(toastMessages.some(t => t.tipo === 'warning' && t.msg.includes('ya tiene una comanda')), 'Duplicación', 'Toast advertencia');

      // Limpiar vista
      const vista = document.getElementById('view-reparto');
      if (vista) vista.style.display = 'none';

      console.log('Tests de reparto finalizados correctamente.');
    }

    window.addEventListener('load', () => setTimeout(iniciarTests, 200));
  </script>
</body>
</html>
