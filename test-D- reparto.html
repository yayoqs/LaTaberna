<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test D – Reparto (Estructura Modular)</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #1a1a1a; color: #e0e0e0; padding: 30px; max-width: 700px; margin: auto; }
    h1 { color: #f59e0b; }
    .resultado { background: #2a2a2a; border-radius: 8px; padding: 12px 16px; margin: 8px 0; display: flex; align-items: center; gap: 12px; }
    .ok { border-left: 4px solid #22c55e; }
    .fallo { border-left: 4px solid #ef4444; }
    .seccion { color: #f59e0b; font-size: 13px; min-width: 120px; }
  </style>
</head>
<body>
  <h1>Test D – Reparto (v2.0.0 — Modular)</h1>
  <p style="color:#a0a0a0; font-size:13px;">Prueba de protección contra ids nulos con la nueva estructura modular.</p>
  <div id="resultados"></div>

  <script>
    const Logger = { info: console.log, warn: console.warn, error: console.error, debug: console.log };
    const EventBus = { events: {}, on(ev, cb) { (this.events[ev] = this.events[ev] || []).push(cb); }, emit(ev, data) { (this.events[ev] || []).forEach(cb => cb(data)); } };
    const Store = { state: {}, getState() { return this.state; }, subscribe() {} };
    const Auth = { _rol: 'admin', getRol() { return this._rol; }, getNombre() { return 'Test'; } };
    let toastMessages = [];
    function showToast(tipo, msg) { toastMessages.push({tipo, msg}); }

    const DB = {
      pedidosDelivery: [],
      productos: [
        { id: 'prod1', nombre: 'Hamburguesa', precio: 1500, activo: true, destino: 'cocina' },
        { id: 'prod2', nombre: 'Papas fritas', precio: 800, activo: true, destino: 'cocina' }
      ],
      comandas: [],
      actualizarPedidoDelivery(id, datos) {
        const ped = this.pedidosDelivery.find(p => p.id === id);
        if (ped) Object.assign(ped, datos);
      },
      eliminarPedidoDelivery(id) { this.pedidosDelivery = this.pedidosDelivery.filter(p => p.id !== id); },
      saveComandas() {},
      crearPedidoDelivery(datos) {
        const nuevo = { id: 'deliv_test' + Date.now(), ...datos, created_at: new Date().toISOString() };
        this.pedidosDelivery.push(nuevo);
        return nuevo;
      }
    };
    window.fmtMoney = (val) => `$${val.toFixed(0)}`;
  </script>

  <!-- Cargar el orquestador como módulo -->
  <script type="module" src="js/ui/reparto.js"></script>
  <script type="module">
    import { Reparto } from './js/ui/reparto.js';
    window.Reparto = Reparto;
  </script>

  <script>
    function resultado(ok, seccion, mensaje) {
      const div = document.createElement('div');
      div.className = 'resultado ' + (ok ? 'ok' : 'fallo');
      div.innerHTML = `<span>${ok ? '✔' : '✘'}</span><span class="seccion">[${seccion}]</span><span>${mensaje}</span>`;
      document.getElementById('resultados').appendChild(div);
    }

    async function iniciarTests() {
      const pedidoValido = {
        id: 'deliv_001',
        direccion: 'Av. Siempre Viva 742',
        telefono: '123456789',
        items: [{ nombre: 'Hamburguesa', precio: 1500, qty: 1 }],
        total: 1500,
        estado: 'pendiente',
        repartidor: 'Juan',
        created_at: new Date().toISOString()
      };
      const pedidoNulo = null;
      const pedidoIdNulo = {
        id: null,
        direccion: 'Calle Falsa',
        telefono: '000',
        items: [],
        total: 0,
        estado: 'pendiente',
        repartidor: 'Nadie'
      };

      Store.state = { pedidosDelivery: [pedidoValido, pedidoNulo, pedidoIdNulo] };
      DB.pedidosDelivery = [pedidoValido];

      // Llamar a render directamente
      window.Reparto.render();
      await new Promise(r => setTimeout(r, 150));
      const filas = document.querySelectorAll('#repartoBody tr');
      resultado(filas.length === 1, 'Protección', 'Solo se renderiza 1 pedido (el válido)');
      resultado(!document.querySelector('#repartoBody').textContent.includes('Calle Falsa'), 'Protección', 'Pedido con id nulo no aparece');

      document.getElementById('view-reparto').style.display = 'none';
      console.log('Tests de reparto con estructura modular finalizados.');
    }

    window.addEventListener('load', () => setTimeout(iniciarTests, 150));
  </script>
</body>
</html>
