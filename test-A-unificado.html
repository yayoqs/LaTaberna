<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test A — Unificado Core</title>
  <style>
    body { font-family: monospace; background: #111827; color: #f9fafb; padding: 30px; line-height: 1.5; }
    h1 { color: #f59e0b; }
    h2 { color: #60a5fa; margin-top: 20px; }
    .test { margin: 6px 0; padding: 8px 12px; border-radius: 6px; }
    .pass { background: rgba(16,185,129,.15); border-left: 4px solid #10b981; }
    .fail { background: rgba(239,68,68,.15); border-left: 4px solid #ef4444; }
    .info { background: rgba(59,130,246,.15); border-left: 4px solid #3b82f6; }
    .summary { margin-top: 20px; padding: 12px; background: #1f2937; border: 1px solid #374151; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>🧪 Test A — Unificado Core</h1>
  <p>Batería completa: sanidad, autenticación, registro, jerarquía de roles, mesas, comandas, factories, dominio, casos extremos, cartas, variantes, Realtime, motor de descuento sin receta y chequeo de ciclos.</p>
  <div id="results"></div>

  <script src="/js/appwrite.min.js"></script>

  <script type="module">

// ╔══════════════════════════════════════════════════════════════════╗
// ║ SECCIÓN 2 — IMPORTS                                              ║
// ║ Todas las dependencias del bundle que se van a testear.          ║
// ╚══════════════════════════════════════════════════════════════════╝
// ▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼

import { Logger } from './js/lib/logger.js';
import { EventBus } from './js/lib/eventBus.js';
import { Store } from './js/lib/store.js';
import { CommandBus } from './js/lib/command-bus.js';
import { Deps } from './js/lib/deps.js';
import { DBAppwrite } from './js/db-appwrite.js';
import { DB } from './js/db.js';
import { Auth } from './js/auth.js';
import { inicializarAuth } from './js/auth.js';
import { Roles } from './js/roles.js';
import { PedidoManager } from './js/managers/pedido-manager.js';
import { PedidoRepositoryLocal } from './js/repositorios/pedido-repository.js';
import { crearVarianteRepo } from './js/repositorios/variante-repository.js';
import { crearRecetaRepo } from './js/repositorios/receta-repository.js';
import { DBCore, mesaVacia } from './js/db-core.js';
import { PedidoAgregado, reconstruirPedidoAgregado } from './js/dominio/pedido.js';
import { Delivery, reconstruirDelivery } from './js/dominio/delivery.js';
import { Cantidad, crearCantidad } from './js/dominio/cantidad.js';
import { Dinero, crearDinero } from './js/dominio/dinero.js';
import { Resultado } from './js/dominio/resultado.js';
import { $id, formatearDinero, mostrarToast, calcularTotal, formatearHoraCorta } from './js/utils.js';
import { ID_FUNCION_ASIGNAR_ROL } from './js/config-appwrite.js';
import './js/comandos/agregar-mesa.js';
import './js/comandos/crear-pedido-mesa.js';
import './js/comandos/enviar-comanda.js';
import './js/comandos/liberar-mesa.js';
import './js/comandos/completar-subcomanda.js';

window.crearCantidad = crearCantidad;

// ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲
// ▲ FIN SECCIÓN 2
// ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲


// ╔══════════════════════════════════════════════════════════════════╗
// ║ SECCIÓN 3 — UTILIDADES DE TESTING                                ║
// ║ Contadores de asserts, helpers de output, y espera asíncrona.    ║
// ╚══════════════════════════════════════════════════════════════════╝
// ▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼

const resultsEl = document.getElementById('results');
let passed = 0, failed = 0;

function assert(cond, msg) {
  if (cond) { passed++; resultsEl.innerHTML += `<div class="test pass">✔ ${msg}</div>`; }
  else { failed++; resultsEl.innerHTML += `<div class="test fail">✘ ${msg}</div>`; }
}
function info(msg) { resultsEl.innerHTML += `<div class="test info">ℹ️ ${msg}</div>`; }
function suite(msg) { resultsEl.innerHTML += `<h2>${msg}</h2>`; }
const esperar = ms => new Promise(r => setTimeout(r, ms));

// ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲
// ▲ FIN SECCIÓN 3
// ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲


// ╔══════════════════════════════════════════════════════════════════╗
// ║ SECCIÓN 4 — ESTADO DE HUELLA Y LIMPIEZA                          ║
// ║ El test crea filas temporales en Appwrite. Aquí se rastrean y    ║
// ║ se limpian al final para no dejar basura en la base de datos.    ║
// ╚══════════════════════════════════════════════════════════════════╝
// ▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼

const idsCreados = {
  mesas: [], pedidos: [], comandas: [], perfiles: [], espacios: [],
  variantes: [], cartas: [], insumos: [], productos: []
};

async function limpiarSesion() { try { await Auth.cerrarSesion(); } catch {} }

async function limpiarHuella() {
  for (const id of idsCreados.comandas) { try { await DBAppwrite.eliminar('comandas', id); } catch {} }
  for (const id of idsCreados.pedidos) { try { await DBAppwrite.eliminar('pedidos', id); } catch {} }
  for (const id of idsCreados.mesas) { try { await DBAppwrite.eliminar('mesas', id); } catch {} }
  for (const id of idsCreados.perfiles) { try { await DBAppwrite.eliminar('global_perfiles', id); } catch {} }
  for (const id of idsCreados.espacios) { try { await DBAppwrite.eliminar('global_espacios', id); } catch {} }
  for (const id of idsCreados.variantes) { try { await DBAppwrite.eliminar('variantes', id); } catch {} }
  for (const id of idsCreados.cartas) { try { await DBAppwrite.eliminar('cartas', id); } catch {} }
  for (const id of idsCreados.insumos) { try { await DBAppwrite.eliminar('insumos', id); } catch {} }
  for (const id of idsCreados.productos) { try { await DBAppwrite.eliminar('productos', id); } catch {} }
  idsCreados.mesas = []; idsCreados.pedidos = []; idsCreados.comandas = [];
  idsCreados.perfiles = []; idsCreados.espacios = []; idsCreados.variantes = [];
  idsCreados.cartas = []; idsCreados.insumos = []; idsCreados.productos = [];
}

// ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲
// ▲ FIN SECCIÓN 4
// ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲


// ╔══════════════════════════════════════════════════════════════════╗
// ║ SECCIÓN 5 — HELPER DE REGISTRO                                   ║
// ║ Crea un usuario temporal, captura su perfil y su espacio         ║
// ║ personal para poder limpiarlos después.                          ║
// ╚══════════════════════════════════════════════════════════════════╝
// ▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼

async function registrarYRegistrarPerfil(nombre, password) {
  const reg = await Auth.registrarUsuario(nombre, password);
  if (!reg.exito) return null;
  const perfil = await DBAppwrite.obtenerPerfilPorUsuarioId(reg.usuarioId);
  if (perfil) idsCreados.perfiles.push(perfil.id);
  const espacioId = `mirefugio_${reg.usuarioId}`;
  try {
    await DBAppwrite.obtenerEspacioPorId(espacioId);
    idsCreados.espacios.push(espacioId);
  } catch {}
  return { nombre, password, usuarioId: reg.usuarioId, perfilId: perfil?.id || null };
}

// ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲
// ▲ FIN SECCIÓN 5
// ▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲▲


// ╔══════════════════════════════════════════════════════════════════╗
// ║ SECCIÓN 6 — CUERPO PRINCIPAL DE run()                            ║
// ║ Ejecuta todas las sub-suites en orden. Cada sub-suite (6.0 a     ║
// ║ 6.14) es independiente y tiene su propio bloque de asserts.      ║
// ╚══════════════════════════════════════════════════════════════════╝
// ▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼▼

async function run() {
  Logger.setLevel('ERROR');
  resultsEl.innerHTML = '';
  Deps.registrar('auth', Auth);

  // ═════════════════════════════════════════════════════════════════
  // SUITE 6.0 — SANIDAD DE MÓDULOS Y BUNDLE
  // ═════════════════════════════════════════════════════════════════
  suite('6.0 Sanidad de módulos y bundle');
  info('Verificando que todos los módulos y utilidades estén definidos.');
  assert(typeof window.Appwrite !== 'undefined', 'SDK Appwrite cargado');
  assert(typeof Logger !== 'undefined', 'Logger existe');
  assert(typeof EventBus !== 'undefined', 'EventBus existe');
  assert(typeof Store !== 'undefined', 'Store existe');
  assert(typeof CommandBus !== 'undefined', 'CommandBus existe');
  assert(typeof Deps !== 'undefined', 'Deps existe');
  assert(typeof DB !== 'undefined', 'DB existe');
  assert(typeof DBAppwrite !== 'undefined', 'DBAppwrite existe');
  assert(typeof Roles !== 'undefined', 'Roles existe');
  assert(typeof PedidoManager !== 'undefined', 'PedidoManager existe');
  assert(typeof PedidoRepositoryLocal !== 'undefined', 'PedidoRepositoryLocal existe');
  assert(typeof crearVarianteRepo === 'function', 'crearVarianteRepo es función');
  assert(typeof DBCore !== 'undefined', 'DBCore existe');
  assert(typeof mesaVacia === 'function', 'mesaVacia es función');
  assert(typeof $id === 'function', '$id es función');
  assert(typeof formatearDinero === 'function', 'formatearDinero es función');
  assert(typeof mostrarToast === 'function', 'mostrarToast es función');
  assert(typeof calcularTotal === 'function', 'calcularTotal es función');
  assert(typeof formatearHoraCorta === 'function', 'formatearHoraCorta es función');
  assert(typeof crearCantidad === 'function', 'crearCantidad es función');
  assert(typeof crearDinero === 'function', 'crearDinero es función');
  assert(typeof Resultado !== 'undefined', 'Resultado existe');
  assert(DBAppwrite.COLECCIONES.cartas === 'laTaberna_Cartas', 'COLECCIONES.cartas = laTaberna_Cartas');
  assert(DBAppwrite.COLECCIONES.variantes === 'laTaberna_Variantes', 'COLECCIONES.variantes = laTaberna_Variantes');
  assert(DBAppwrite.COLECCIONES.menus === undefined, 'COLECCIONES.menus ya no existe');
  assert(Array.isArray(Store.obtenerEstado().variantes), 'Store tiene slice variantes (array)');

  // ═════════════════════════════════════════════════════════════════
  // SUITE 6.1 — AUTENTICACIÓN E INICIALIZACIÓN
  // ═════════════════════════════════════════════════════════════════
  suite('6.1 Autenticación e inicialización');
  info('Inicializando Auth y Appwrite...');
  await inicializarAuth();
  if (!(await DBAppwrite.iniciar())) { assert(false, 'No se pudo inicializar Appwrite'); return; }
  await limpiarSesion();
  if (!(await Auth.iniciarSesion('jefePub', 'jefe1234'))) { assert(false, 'No se pudo autenticar como jefePub'); return; }
  assert(true, 'jefePub autenticado');
  assert(Auth.obtenerLocalActivo()?.id === 'PubPrueba', 'Espacio resuelto automáticamente: PubPrueba');
  await DB.init();
  PedidoManager.init({ pedidoRepo: PedidoRepositoryLocal });
  Deps.registrar('pedidoRepo', PedidoRepositoryLocal);
  Deps.registrar('inventarioService', { validarStockParaArticulos: () => ({ ok: true, faltantes: [] }) });
  info('DB y PedidoManager inicializados');

  // ═════════════════════════════════════════════════════════════════
  // SUITE 6.2 — REGISTRO Y PERFIL GLOBAL
  // ═════════════════════════════════════════════════════════════════
  suite('6.2 Registro y perfil global');
  const nombreJugador = 'test_jugador_' + Date.now();
  const passwordJugador = 'pass12345';
  const jugador = await registrarYRegistrarPerfil(nombreJugador, passwordJugador);
  assert(jugador !== null, 'Usuario registrado mediante función');
  assert(jugador?.usuarioId !== undefined, 'usuarioId devuelto');
  await limpiarSesion();
  assert(await Auth.iniciarSesion(nombreJugador, passwordJugador), 'Jugador inicia sesión');
  assert(Auth.obtenerRolesEfectivos().includes('jugador'), 'Rol inicial jugador');
  const perfilJugador = Auth.obtenerUsuarioActual()?.perfil;
  assert(!!perfilJugador, 'Perfil global cargado');
  assert(perfilJugador?.nombreUsuario === nombreJugador, 'Perfil con nombreUsuario correcto');
  assert(perfilJugador?.nombre === nombreJugador, 'Perfil con nombre visible correcto');
  const perfilAppwrite = await DBAppwrite.obtenerPerfilPorUsuarioId(jugador.usuarioId);
  assert(!!perfilAppwrite, 'Perfil global existe en Appwrite');
  assert(perfilAppwrite?.nombreUsuario === nombreJugador, 'Perfil en Appwrite con nombreUsuario correcto');
  const espacioPersonalId = `mirefugio_${jugador.usuarioId}`;
  const espacioPersonal = await DBAppwrite.obtenerEspacioPorId(espacioPersonalId);
  assert(!!espacioPersonal, 'Espacio personal de MiRefugio creado automáticamente');
  assert(espacioPersonal?.app === 'mirefugio', 'Espacio personal con app correcta');
  assert(espacioPersonal?.tipo === 'hogar', 'Espacio personal con tipo hogar');
  assert(espacioPersonal?.adminAsignado === jugador.usuarioId, 'Espacio personal asignado al jugador');
  if (espacioPersonal) idsCreados.espacios.push(espacioPersonalId);

  // ═════════════════════════════════════════════════════════════════
  // SUITE 6.3 — JERARQUÍA DE ROLES
  // ═════════════════════════════════════════════════════════════════
  suite('6.3 Jerarquía de roles');
  assert(Roles.puedeAsignar('owner', 'admin') === true, 'owner puede asignar admin');
  assert(Roles.puedeAsignar('owner', 'mesero') === true, 'owner puede asignar mesero');
  assert(Roles.puedeAsignar('owner', 'owner') === false, 'owner NO puede asignar owner');
  assert(Roles.puedeAsignar('admin', 'mesero') === true, 'admin puede asignar mesero');
  assert(Roles.puedeAsignar('admin', 'admin') === false, 'admin NO puede asignar admin');
  assert(Roles.puedeAsignar('mesero', 'mesero') === false, 'mesero NO puede asignar mesero');
  assert(Roles.puedeAsignar('master', 'owner') === true, 'master puede asignar owner');

  // ═════════════════════════════════════════════════════════════════
  // SUITE 6.4 — MESAS, PEDIDOS Y COMANDAS
  // ═════════════════════════════════════════════════════════════════
  suite('6.4 Mesas, pedidos y comandas');
  await limpiarSesion();
  await Auth.iniciarSesion('jefePub', 'jefe1234');
  const numMesa = 'test_mesa_' + Date.now();
  const rAgregar = await CommandBus.ejecutar({ type: 'agregarMesa', datos: { numero: numMesa, zona: 'salon' } });
  assert(rAgregar.exito === true, 'Mesa creada');
  idsCreados.mesas.push(numMesa);
  await esperar(500);
  const rPedido = await CommandBus.ejecutar({ type: 'crearPedidoMesa', datos: { numeroMesa: numMesa, mozo: 'Test', comensales: 2 } });
  assert(rPedido.exito === true, 'Pedido creado en mesa');
  const pedidoId = rPedido.data?.id;
  if (pedidoId) idsCreados.pedidos.push(pedidoId);
  await esperar(500);
  const itemPrueba = { prodId: 'prod_test', nombre: 'Hamburguesa', precio: 1500, qty: 1, destino: 'cocina', obs: '', enviado: false };
  await DB.actualizarPedido(pedidoId, { items: [itemPrueba] });
  await esperar(300);
  const mesaActual = (await DBAppwrite.listar('mesas')).find(m => m.numero === numMesa);
  assert(!!mesaActual, 'Mesa existe en Appwrite');
  assert(mesaActual?.estado === 'ocupada', 'Mesa ocupada');
  assert(!!mesaActual?.pedidoId, 'Mesa con pedidoId');
  const rEnviar = await CommandBus.ejecutar({ type: 'enviarComanda', datos: { mesa: mesaActual, mozo: 'Test', comensales: 2, observaciones: '', itemsPendientes: [itemPrueba] } });
  assert(rEnviar.exito === true, 'Comanda enviada');
  const comandasCreadas = rEnviar.data?.comandas || [];
  comandasCreadas.forEach(c => idsCreados.comandas.push(c.id));
  assert(comandasCreadas.length >= 1, 'Al menos una comanda creada');
  await esperar(1500);
  const comandaEnAppwrite = comandasCreadas.length ? (await DBAppwrite.listar('comandas')).find(c => c.id === comandasCreadas[0].id) : null;
  assert(!!comandaEnAppwrite, 'Comanda en Appwrite');
  assert(comandaEnAppwrite?.destino === 'cocina', 'Destino cocina correcto');
  const rCompletar = await CommandBus.ejecutar({ type: 'completarSubcomanda', datos: { idOriginal: comandaEnAppwrite.id, destino: 'cocina' } });
  assert(rCompletar.exito === true, 'Subcomanda completada');
  assert(rCompletar.data?.ambasListas === true, 'Ambas listas');
  await esperar(500);
  const comandaCompletada = (await DBAppwrite.listar('comandas')).find(c => c.id === comandaEnAppwrite.id);
  assert(comandaCompletada?.estado === 'completada', 'Comanda principal completada');
  const rLiberar = await CommandBus.ejecutar({ type: 'liberarMesa', datos: { numeroMesa: numMesa } });
  assert(rLiberar.exito === true, 'Mesa liberada');
  await esperar(500);
  const mesaLiberada = (await DBAppwrite.listar('mesas')).find(m => m.numero === numMesa);
  assert(mesaLiberada?.estado === 'libre', 'Mesa libre');

  // ═════════════════════════════════════════════════════════════════
  // SUITE 6.5 — NORMALIZACIÓN Y FÁBRICA
  // ═════════════════════════════════════════════════════════════════
  suite('6.5 Normalización y fábrica');
  const prod1 = DBCore._normalizarProducto({ nombre: 'Test', precio: 100 });
  assert(prod1.activo === true, 'Producto sin campo activo → por defecto true');
  assert(prod1.estado === 'disponible', 'Producto sin estado → por defecto disponible');
  assert(prod1.disponible === true, 'Producto disponible derivado true');
  const mesaStr = DBCore._normalizarMesa({ numero: '1' });
  assert(mesaStr.numero === '1', 'Mesa con numero string se conserva');
  assert(mesaStr.estado === 'libre', 'Mesa sin estado → por defecto libre');
  assert(mesaStr.items === undefined, 'Mesa NO tiene campo items (eliminado)');
  assert(mesaStr.mozo === undefined, 'Mesa NO tiene campo mozo (eliminado)');
  const nueva = mesaVacia(50, 'salon');
  assert(nueva.numero === '50', 'mesaVacia: numero es string');
  assert(nueva.estado === 'libre', 'mesaVacia: estado libre');
  assert(nueva.esVirtual === false, 'mesaVacia: esVirtual = false');
  assert(nueva.items === undefined, 'mesaVacia: sin campo items');
  assert(nueva.mozo === undefined, 'mesaVacia: sin campo mozo');

  // ═════════════════════════════════════════════════════════════════
  // SUITE 6.6 — FACTORIES
  // ═════════════════════════════════════════════════════════════════
  suite('6.6 Factories');
  const pedRec = reconstruirPedidoAgregado({ id: 'ped_recon_test', mesa: 1, mozo: 'Trini', comensales: 2, items: [], descuento: 0, estado: 'abierto', observaciones: '' });
  assert(pedRec instanceof PedidoAgregado, 'reconstruirPedidoAgregado devuelve un PedidoAgregado');

  let ok1 = Resultado.ok({ id: 5 });

  let fail1 = Resultado.fallo('boom');

  assert(fail1.error === 'boom', 'Resultado: fallo conserva error');
  assert(fail1.datos === null, 'Resultado: fallo no tiene datos');
  let chain = ok1.encadenar(data => Resultado.ok(data.id * 2));

  assert(chain.datos === 10, 'Resultado: encadenar transforma datos (5*2=10)');

    eventoMovimientoRecibido = m;
  });
  
  // 6.18.3 — Ajuste manual positivo (entrada)
  const resultadoAjustePos = await DB.ajustarStock(insumoMovId, 20, 'Ajuste test positivo');
  assert(resultadoAjustePos?.exito === true, 'A.74 ajuste positivo exitoso');
  if (resultadoAjustePos?.exito) {
    assert(resultadoAjustePos.datos.stock === 120,
      'A.74 stock quedó en 120 (100 + 20)');
  }
  
  await esperar(500);
  
  assert(eventoMovimientoRecibido !== null,
    'A.74 evento movimientos:actualizados emitido');
  if (eventoMovimientoRecibido) {
    assert(eventoMovimientoRecibido.insumoId === insumoMovId,
      'A.74 movimiento lleva el insumoId correcto');
    assert(eventoMovimientoRecibido.insumoNombre === 'Insumo Movimiento Test',
      'A.74 movimiento lleva insumoNombre denormalizado');
    assert(eventoMovimientoRecibido.unidad === 'kg',
      'A.74 movimiento lleva unidad denormalizada');
    assert(eventoMovimientoRecibido.tipo === 'entrada',
      'A.74 movimiento tipo=entrada');
    assert(eventoMovimientoRecibido.cantidad === 20,
      'A.74 movimiento cantidad=20');
    assert(eventoMovimientoRecibido.espacioId === 'PubPrueba',
      'A.74 movimiento lleva espacioId');
  }
  limpiarEventoMovimiento();
  
  // 6.18.4 — Verificar que el movimiento aparece en el Store
  const movsEnStore = Store.obtenerEstado().movimientos;
  assert(movsEnStore.length === 1, 'A.74 Store tiene 1 movimiento tras ajuste');
  if (movsEnStore.length > 0) {
    assert(movsEnStore[0].insumoId === insumoMovId,
      'A.74 Store: movimiento con insumoId correcto');
  }
  
  // 6.18.5 — Verificar persistencia en Appwrite
  const movsAppwrite = await DBAppwrite.listar('movimientos');
  const movimientoPersistido = movsAppwrite.find(m => m.insumoId === insumoMovId);
  assert(!!movimientoPersistido, 'A.74 movimiento persiste en Appwrite');
  if (movimientoPersistido) {
    assert(movimientoPersistido.tipo === 'entrada',
      'A.74 Appwrite: tipo=entrada');
    assert(Number(movimientoPersistido.cantidad) === 20,
      'A.74 Appwrite: cantidad=20');
  }
  
  // 6.18.6 — Ajuste negativo (salida)
  Store.despachar({ type: 'MOVIMIENTOS_LIMPIAR' });
  
  const resultadoAjusteNeg = await DB.ajustarStock(insumoMovId, -30, 'Ajuste test negativo');
  assert(resultadoAjusteNeg?.exito === true, 'A.74 ajuste negativo exitoso');
  if (resultadoAjusteNeg?.exito) {
    assert(resultadoAjusteNeg.datos.stock === 90,
      'A.74 stock quedó en 90 (120 - 30)');
    assert(resultadoAjusteNeg.movimiento.tipo === 'salida',
      'A.74 movimiento tipo=salida');
    assert(resultadoAjusteNeg.movimiento.cantidad === -30,
      'A.74 movimiento cantidad=-30');
  }
  
  // 6.18.7 — Delta efectivo cuando el stock se recorta a 0
  Store.despachar({ type: 'MOVIMIENTOS_LIMPIAR' });
  
  const resultadoRecorte = await DB.ajustarStock(insumoMovId, -500, 'Recorte a 0');
  assert(resultadoRecorte?.exito === true, 'A.74 ajuste con recorte exitoso');
  if (resultadoRecorte?.exito) {
    assert(resultadoRecorte.datos.stock === 0,
      'A.74 stock quedó en 0');
    assert(resultadoRecorte.movimiento.cantidad === -90,
      'A.74 movimiento registra delta efectivo (-90), no el solicitado (-500)');
  }
  
  // 6.18.8 — Salida temprana si delta === 0
  Store.despachar({ type: 'MOVIMIENTOS_LIMPIAR' });
  const resultadoSinCambio = await DB.ajustarStock(insumoMovId, 0, 'Delta cero');
  assert(resultadoSinCambio?.exito === true, 'A.74 ajuste con delta 0 devuelve exito');
  assert(resultadoSinCambio?.sinCambio === true,
    'A.74 ajuste con delta 0 marca sinCambio');
  const movsTrasSinCambio = Store.obtenerEstado().movimientos.length;
  assert(movsTrasSinCambio === 0,
    'A.74 no se crea movimiento cuando delta=0');
  
  // 6.18.9 — obtenerMovimientos con filtros
  Store.despachar({ type: 'MOVIMIENTOS_LIMPIAR' });
  await DB.ajustarStock(insumoMovId, 10, 'Entrada 1');
  await esperar(300);
  await DB.ajustarStock(insumoMovId, 5, 'Entrada 2');
  await esperar(300);
  await DB.ajustarStock(insumoMovId, -3, 'Salida 1');
  await esperar(300);
  
  const consulta = await DB.obtenerMovimientos({
    insumoId: insumoMovId,
    limite: 10
  });
  assert(Array.isArray(consulta.movimientos), 'A.74 obtenerMovimientos retorna array');
  assert(consulta.movimientos.length >= 3, 'A.74 obtenerMovimientos retorna al menos 3');
  
  const soloEntradas = await DB.obtenerMovimientos({
    insumoId: insumoMovId,
    tipo: 'entrada',
    limite: 10
  });
  assert(Array.isArray(soloEntradas.movimientos), 'A.74 filtro por tipo retorna array');
  if (soloEntradas.movimientos.length > 0) {
    assert(soloEntradas.movimientos.every(m => m.tipo === 'entrada'),
      'A.74 filtro por tipo=entrada solo devuelve entradas');
  }
  
  // 6.18.10 — Limpieza final de los movimientos de test
  const todosLosMovs = await DBAppwrite.listar('movimientos');
  const misMovs = todosLosMovs.filter(m => m.insumoId === insumoMovId);
  for (const m of misMovs) {
    try { await DBAppwrite.eliminar('movimientos', m.id); } catch {}
  }
  info(`A.74: eliminados ${misMovs.length} movimientos de test`);

    
  // ═════════════════════════════════════════════════════════════════
  // SUITE 6.14 — LIMPIEZA FINAL Y RESUMEN
  // ═════════════════════════════════════════════════════════════════
  suite('6.14 Limpieza final');
  info('Limpiando huella...');
  await limpiarSesion();
  await Auth.iniciarSesion('jefePub', 'jefe1234');
  await limpiarHuella();

  resultsEl.innerHTML += `<div class="summary">${passed} pasaron, ${failed} fallaron</div>`;
  if (failed === 0) resultsEl.innerHTML += `<div class="test pass">✔ Test unificado superado por completo.</div>`;
}
