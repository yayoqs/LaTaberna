<!--
  LaTaberna - PubPOS — Test D Temporal (A.52 guardarProducto)
  Archivo: test-D-temporal.html (raíz)
  Versión: 1.0.0
  Propósito: Diagnóstico del fix A.52. Valida que
             receta-repository.guardarProducto persiste
             categoria, precio, descripcion, imagen, alergenos,
             y respeta el estado del input (no lo hardcodea a
             'disponible').

  Este test es temporal. Se elimina cuando:
    · pase verde contra el fix de receta-repository v1.2.1;
    · sus aserciones se absorban al Bloque 12 del unificado.

  Credenciales: jefePub / jefe1234 en espacio PubPrueba.
-->
<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test D Temporal — A.52 guardarProducto</title>
  <link rel="stylesheet" href="css/vars.css">
  <link rel="stylesheet" href="css/base.css">
  <script src="js/appwrite.min.js"></script>
  <style>
    html, body { height: auto; min-height: 100vh; overflow-y: auto; margin: 0; }
    body { display: block; background: #0f0f14; color: #f1f5f9; font-family: 'Nunito', system-ui, sans-serif; padding: 20px; box-sizing: border-box; }
    .panel-test { background: #1a1a24; border: 1px solid #2e2e42; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
    .panel-test h2 { font-size: 18px; margin: 0 0 12px; }
    .log-positivo { color: #22c55e; font-weight: 700; }
    .log-error { color: #ef4444; font-weight: 700; }
    .log-info { color: #60a5fa; font-weight: 700; }
    .log-seccion { color: #f59e0b; font-weight: 800; font-size: 14px; margin-top: 16px; margin-bottom: 6px; padding-top: 8px; border-top: 1px solid #2e2e42; }
    code { background: #252535; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>

<body>

  <div class="panel-test">
    <h2>Test D Temporal — A.52 guardarProducto</h2>
    <div id="logTest"></div>
  </div>

  <script type="module">
    import { Auth }       from './js/auth.js';
    import { DB }         from './js/db.js';
    import { DBAppwrite } from './js/db-appwrite.js';
    import { Logger }     from './js/lib/logger.js';
    import { Store }      from './js/lib/store.js';
    import { Deps }       from './js/lib/deps.js';
    import { crearRecetaRepo } from './js/repositorios/receta-repository.js';

    Logger.setLevel('ERROR');
    const log = document.getElementById('logTest');
    const resultados = [];

    function agregarResultado(nombre, ok, detalle = '') {
      const fila = document.createElement('div');
      fila.className = ok ? 'log-positivo' : 'log-error';
      fila.innerHTML = `${ok ? '✅' : '❌'} ${nombre}${detalle ? ` — <code>${detalle}</code>` : ''}`;
      log.appendChild(fila);
      resultados.push({ nombre, ok });
    }

    function agregarInfo(mensaje) {
      const fila = document.createElement('div');
      fila.className = 'log-info';
      fila.innerHTML = `ℹ️ ${mensaje}`;
      log.appendChild(fila);
    }

    function agregarSeccion(titulo) {
      const fila = document.createElement('div');
      fila.className = 'log-seccion';
      fila.textContent = `── ${titulo} ──`;
      log.appendChild(fila);
    }

    const esperar = ms => new Promise(r => setTimeout(r, ms));

    async function esperarHasta(fn, timeout = 8000, intervalo = 200) {
      const inicio = Date.now();
      while (Date.now() - inicio < timeout) {
        const r = await fn();
        if (r) return r;
        await esperar(intervalo);
      }
      return null;
    }

    async function leerProductoRemoto(id) {
      try {
        return await DBAppwrite.baseDeDatos.getRow({
          databaseId: DBAppwrite.idBaseDeDatos,
          tableId: DBAppwrite.COLECCIONES.productos,
          rowId: id
        });
      } catch { return null; }
    }

    const idsCreados = [];

    async function run() {
      log.innerHTML = '';

      Deps.registrar('auth', Auth);
      await DB.init();
      await Auth.cerrarSesion();

      const loginOk = await Auth.iniciarSesion('jefePub', 'jefe1234');
      if (!loginOk) {
        agregarResultado('Login jefePub/jefe1234', false);
        return;
      }

      const espacioId = Auth.obtenerLocalActivo()?.id || null;
      agregarResultado('Login jefePub/jefe1234', true, `Espacio: ${espacioId}`);

      const repo = crearRecetaRepo();
      const ts = Date.now().toString().slice(-6);

      // ════════════════════════════════════════════════════════
      // CASO A — Producto nuevo sin estado → persiste 'disponible'
      // ════════════════════════════════════════════════════════
      agregarSeccion('Caso A — Producto nuevo sin estado');

      const pA = await repo.guardarProducto({
        nombre: `Temporal A ${ts}`,
        categoria: 'test_temporal',
        activo: true,
        destino: 'cocina'
        // Sin campo `estado` intencionalmente.
      });

      if (!pA?.id) {
        agregarResultado('Caso A · Producto creado', false, 'devolvió null');
        return;
      }
      idsCreados.push(pA.id);
      agregarResultado('Caso A · Producto creado', true, pA.id);

      await esperar(500);
      const docA = await leerProductoRemoto(pA.id);
      agregarResultado('Caso A · Doc en Appwrite', !!docA);

      if (docA) {
        agregarResultado(
          'Caso A · estado = "disponible" por defecto',
          docA.estado === 'disponible',
          `estado=${docA.estado}`
        );
      }

      // ════════════════════════════════════════════════════════
      // CASO B — Producto con estado 'agotado' → persiste 'agotado'
      // ════════════════════════════════════════════════════════
      agregarSeccion('Caso B — Producto con estado "agotado"');

      const pB = await repo.guardarProducto({
        nombre: `Temporal B ${ts}`,
        categoria: 'test_temporal',
        activo: true,
        destino: 'cocina',
        estado: 'agotado'
      });

      if (!pB?.id) {
        agregarResultado('Caso B · Producto agotado creado', false);
      } else {
        idsCreados.push(pB.id);
        agregarResultado('Caso B · Producto agotado creado', true, pB.id);

        await esperar(500);
        const docB1 = await leerProductoRemoto(pB.id);
        agregarResultado(
          'Caso B · estado = "agotado" en Appwrite',
          docB1?.estado === 'agotado',
          `estado=${docB1?.estado}`
        );

        // Editar OTRO campo del producto agotado.
        const pBEdit = await repo.guardarProducto({
          ...pB,
          id: pB.id,
          nombre: `Temporal B Editado ${ts}`,
          categoria: 'test_temporal',
          activo: true,
          destino: 'cocina',
          estado: 'agotado'
        });

        await esperar(500);
        const docB2 = await leerProductoRemoto(pB.id);
        agregarResultado(
          'Caso B · Edición preserva estado "agotado"',
          docB2?.estado === 'agotado',
          `estado=${docB2?.estado}`
        );
        agregarResultado(
          'Caso B · Nombre editado persistió',
          docB2?.nombre === `Temporal B Editado ${ts}`,
          docB2?.nombre
        );
      }

      // ════════════════════════════════════════════════════════
      // CASO C — Todos los campos persistidos
      // ════════════════════════════════════════════════════════
      agregarSeccion('Caso C — Todos los campos persistidos');

      const pC = await repo.guardarProducto({
        nombre: `Temporal C ${ts}`,
        categoria: 'bebidas_premium',
        precio: 4500,
        descripcion: 'Descripción de prueba con acentos: ñáéíóú',
        imagen: 'https://placehold.co/200x200/6366f1/fff?text=TestC',
        activo: true,
        destino: 'barra',
        estado: 'disponible',
        alergenos: ['gluten', 'lactosa']
      });

      if (!pC?.id) {
        agregarResultado('Caso C · Producto completo creado', false);
      } else {
        idsCreados.push(pC.id);
        agregarResultado('Caso C · Producto completo creado', true, pC.id);

        await esperar(500);
        const docC = await leerProductoRemoto(pC.id);
        agregarResultado('Caso C · Doc en Appwrite', !!docC);

        if (docC) {
          agregarResultado('Caso C · categoria persistida', docC.categoria === 'bebidas_premium', `categoria=${docC.categoria}`);
          agregarResultado('Caso C · precio persistido', Number(docC.precio) === 4500, `precio=${docC.precio}`);
          agregarResultado('Caso C · descripcion persistida', docC.descripcion === 'Descripción de prueba con acentos: ñáéíóú', `descripcion=${docC.descripcion}`);
          agregarResultado('Caso C · imagen persistida', docC.imagen === 'https://placehold.co/200x200/6366f1/fff?text=TestC', `imagen=${docC.imagen}`);
          agregarResultado('Caso C · destino persistido', docC.destino === 'barra', `destino=${docC.destino}`);
          agregarResultado('Caso C · estado persistido', docC.estado === 'disponible', `estado=${docC.estado}`);
          agregarResultado('Caso C · activo persistido', docC.activo === true, `activo=${docC.activo}`);

          // alergenos viaja como string JSON en columna varchar.
          let alergenosParseados = null;
          try { alergenosParseados = JSON.parse(docC.alergenos || '[]'); } catch {}
          agregarResultado(
            'Caso C · alergenos persistidos como JSON parseable',
            Array.isArray(alergenosParseados) && alergenosParseados.length === 2,
            `tipo=${typeof docC.alergenos} valor=${docC.alergenos}`
          );
          agregarResultado(
            'Caso C · alergenos contienen gluten',
            Array.isArray(alergenosParseados) && alergenosParseados.includes('gluten')
          );
          agregarResultado(
            'Caso C · alergenos contienen lactosa',
            Array.isArray(alergenosParseados) && alergenosParseados.includes('lactosa')
          );
        }
      }

      // ════════════════════════════════════════════════════════
      // CASO D — Producto sin alergenos → persiste '[]'
      // ════════════════════════════════════════════════════════
      agregarSeccion('Caso D — Producto sin alergenos');

      const pD = await repo.guardarProducto({
        nombre: `Temporal D ${ts}`,
        categoria: 'test_temporal',
        activo: true,
        destino: 'cocina'
        // Sin alergenos intencionalmente.
      });

      if (!pD?.id) {
        agregarResultado('Caso D · Producto sin alergenos creado', false);
      } else {
        idsCreados.push(pD.id);
        agregarResultado('Caso D · Producto sin alergenos creado', true, pD.id);

        await esperar(500);
        const docD = await leerProductoRemoto(pD.id);
        agregarResultado('Caso D · Doc en Appwrite', !!docD);

        if (docD) {
          let alergenosParseados = null;
          let parseError = null;
          try { alergenosParseados = JSON.parse(docD.alergenos || '[]'); } catch (e) { parseError = e.message; }
          agregarResultado(
            'Caso D · alergenos persistidos como JSON parseable',
            Array.isArray(alergenosParseados) && alergenosParseados.length === 0,
            `tipo=${typeof docD.alergenos} valor=${docD.alergenos}${parseError ? ` error=${parseError}` : ''}`
          );
        }
      }

      // ════════════════════════════════════════════════════════
      // CASO E — Alergenos como string pre-serializado
      // ════════════════════════════════════════════════════════
      agregarSeccion('Caso E — Alergenos como string pre-serializado');

      const pE = await repo.guardarProducto({
        nombre: `Temporal E ${ts}`,
        categoria: 'test_temporal',
        activo: true,
        destino: 'cocina',
        alergenos: JSON.stringify(['mani', 'huevo'])
      });

      if (!pE?.id) {
        agregarResultado('Caso E · Producto con string pre-serializado', false);
      } else {
        idsCreados.push(pE.id);
        agregarResultado('Caso E · Producto con string pre-serializado', true, pE.id);

        await esperar(500);
        const docE = await leerProductoRemoto(pE.id);
        let alergenosParseados = null;
        try { alergenosParseados = JSON.parse(docE?.alergenos || '[]'); } catch {}
        agregarResultado(
          'Caso E · String pre-serializado se conserva',
          Array.isArray(alergenosParseados) && alergenosParseados.includes('mani') && alergenosParseados.includes('huevo'),
          `alergenos=${docE?.alergenos}`
        );
      }

      // ════════════════════════════════════════════════════════
      // LIMPIEZA
      // ════════════════════════════════════════════════════════
      agregarSeccion('Limpieza');

      let limpiezaOk = true;
      for (const id of idsCreados) {
        try { await DBAppwrite.eliminar('productos', id); }
        catch { limpiezaOk = false; }
      }
      agregarResultado('Productos de prueba eliminados', limpiezaOk, `${idsCreados.length} docs`);

      await Auth.cerrarSesion();

      const total = resultados.length;
      const pasaron = resultados.filter(r => r.ok).length;
      const fallaron = total - pasaron;
      const resumen = document.createElement('div');
      resumen.style.marginTop = '12px';
      resumen.className = fallaron === 0 ? 'log-positivo' : 'log-error';
      resumen.innerHTML = `<strong>Resumen temporal A.52:</strong> ${pasaron} correctos, ${fallaron} fallidos.`;
      log.appendChild(resumen);
    }

    const _arrancar = () => {
      run().catch(e => {
        log.innerHTML += `<div class="log-error">Error fatal: ${e.message}</div>`;
        console.error(e);
      });
    };

    if (document.readyState === 'loading') {
      window.addEventListener('load', _arrancar);
    } else {
      setTimeout(_arrancar, 100);
    }
  </script>
</body>
</html>
