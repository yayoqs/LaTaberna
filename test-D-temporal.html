<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Test D — Temporal: Perfil v2</title>
  <link rel="stylesheet" href="css/vars.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/modals.css">
  <link rel="stylesheet" href="css/perfil.css">
  <script src="js/appwrite.min.js"></script>
  <style>
    html, body {
      height: auto;
      min-height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
    }
    body {
      display: block;
      background: #0f0f14;
      color: #f1f5f9;
      font-family: 'Nunito', system-ui, sans-serif;
      padding: 20px;
      box-sizing: border-box;
    }
    .panel-test {
      background: #1a1a24;
      border: 1px solid #2e2e42;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-sizing: border-box;
    }
    .panel-test h2 { font-size: 18px; margin: 0 0 12px; }
    .log-positivo { color: #22c55e; font-weight: 700; }
    .log-error { color: #ef4444; font-weight: 700; }
    .log-info { color: #60a5fa; font-weight: 700; }
    code { background: #252535; padding: 2px 6px; border-radius: 4px; }
    #view-perfil { display: block; height: auto; min-height: 0; overflow: visible; }
    @media (max-width: 768px) {
      body { padding: 12px; }
      .panel-test { padding: 14px; }
    }
  </style>
</head>
<body>
  <div class="panel-test">
    <h2>Test D — Temporal: Perfil v2</h2>
    <p style="font-size:13px; color:#94a3b8; margin:0 0 8px;">
      Verifica la interfaz real de perfil: render, paneles, pestañas, edición y administración de roles.
    </p>
    <div id="logTest"></div>
  </div>
  <main id="view-perfil"></main>

  <script type="module">
    import { Auth } from './js/auth.js';
    import { DB } from './js/db.js';
    import { DBAppwrite } from './js/db-appwrite.js';
    import { Logger } from './js/lib/logger.js';
    import { Perfil } from './js/ui/perfil.js';

    Logger.setLevel('ERROR');
    const log = document.getElementById('logTest');
    const resultados = [];

    function agregarResultado(nombre, ok, detalle = '') {
      const fila = document.createElement('div');
      fila.className = ok ? 'log-positivo' : 'log-error';
      fila.innerHTML = `${ok ? '✅' : '❌'} ${nombre}${detalle ? ` — <code>${detalle}</code>` : ''}`;
      log.appendChild(fila);
      resultados.push({ nombre, ok });
    }
    function agregarInfo(mensaje) {
      const fila = document.createElement('div');
      fila.className = 'log-info';
      fila.innerHTML = `ℹ️ ${mensaje}`;
      log.appendChild(fila);
    }
    const esperar = ms => new Promise(r => setTimeout(r, ms));

    async function run() {
      Logger.setLevel('ERROR');
      log.innerHTML = '';

      await DB.init();
      await Auth.cerrarSesion();
      const loginMaster = await Auth.iniciarSesion('master', 'master123');
      if (!loginMaster) { agregarResultado('Login master', false); return; }
      agregarResultado('Login master', true);

      // Generar nombre corto (máximo 30 caracteres)
      const sufijo = Date.now().toString().slice(-8);
      const nombreAdmin = `tpa_${sufijo}`; // 4 + 8 = 12 caracteres
      const passwordAdmin = 'Pass12345';
      agregarInfo(`Creando admin temporal: ${nombreAdmin}`);

      const regAdmin = await Auth.registrarUsuario(nombreAdmin, passwordAdmin);
      if (!regAdmin.exito) {
        agregarResultado('Registrar admin temporal', false, regAdmin.error);
        return;
      }
      agregarResultado('Registrar admin temporal', true);

      const staffAdmin = await DB.crearOActualizarStaff({
        nombre: 'Admin Perfil Test',
        usuarioId: regAdmin.usuarioId,
        espacioId: 'lataberna',
        roles: ['admin'],
        rolPrincipal: 'admin',
        estado: 'activo',
        tokenVinculacion: ''
      });
      if (!staffAdmin) { agregarResultado('Crear staff admin temporal', false); return; }
      agregarResultado('Crear staff admin temporal', true);

      await Auth.cerrarSesion();
      const loginAdmin = await Auth.iniciarSesion(nombreAdmin, passwordAdmin);
      if (!loginAdmin) { agregarResultado('Login admin temporal', false); return; }
      agregarResultado('Login admin temporal', true);

      Perfil.activar();
      await esperar(500);

      const vistaPerfil = document.getElementById('view-perfil');
      agregarResultado('Vista perfil creada', !!vistaPerfil && !!vistaPerfil.querySelector('.main-layout'));
      agregarResultado('Header perfil existe', !!document.querySelector('#view-perfil .perfil-header'));
      agregarResultado('Panel izquierdo existe', !!document.getElementById('panelIzquierdoPerfil'));
      agregarResultado('Panel derecho existe', !!document.getElementById('panelDerechoPerfil'));

      const idCard = document.getElementById('perfilIdCard');
      agregarResultado('ID card existe', !!idCard);
      agregarResultado('Nombre visible en ID card', idCard?.textContent.includes(nombreAdmin));

      const modoVitrina = document.getElementById('modoVitrinaPerfil');
      const modoEdicion = document.getElementById('modoEdicionPerfil');
      agregarResultado('Modo vitrina visible', modoVitrina && modoVitrina.style.display !== 'none');
      agregarResultado('Modo edición oculto', modoEdicion && (modoEdicion.style.display === 'none' || !modoEdicion.style.display));

      const btnEditarPerfil = document.getElementById('btnEditarPerfil');
      agregarResultado('Botón editar perfil existe', !!btnEditarPerfil);
      if (btnEditarPerfil) {
        btnEditarPerfil.click();
        await esperar(300);
        agregarResultado('Modo edición visible tras clic', modoEdicion && modoEdicion.style.display !== 'none');
        agregarResultado('Modo vitrina oculto tras clic', modoVitrina && modoVitrina.style.display === 'none');
      }

      const tabs = document.querySelectorAll('#view-perfil .central-tab');
      const tabsVisibles = [...tabs].filter(t => t.classList.contains('visible'));
      agregarResultado('Pestañas visibles existentes', tabsVisibles.length >= 3);

      const tabPublico = document.querySelector('#view-perfil .central-tab[data-tab="publico"]');
      agregarResultado('Pestaña pública activa por defecto', tabPublico?.classList.contains('activo'));

      const inputApodo = document.getElementById('editarApodo');
      if (inputApodo) {
        inputApodo.value = 'Apodo Temporal';
        const btnGuardarPublico = document.getElementById('btnGuardarPerfilPublico');
        if (btnGuardarPublico) {
          btnGuardarPublico.click();
          await esperar(300);
          agregarResultado('Apodo guardado sin errores', true);
        }
      }

      const tabPrefs = document.querySelector('#view-perfil .central-tab[data-tab="preferencias"]');
      if (tabPrefs) {
        tabPrefs.click();
        await esperar(300);
        agregarResultado('Pestaña preferencias activada', document.getElementById('tab-preferencias')?.classList.contains('activo'));
      }

      const tabAdmin = document.querySelector('#view-perfil .central-tab[data-tab="admin"]');
      agregarResultado('Pestaña admin visible', tabAdmin?.classList.contains('visible'));
      if (tabAdmin) {
        tabAdmin.click();
        await esperar(500);
        const tabAdminContent = document.getElementById('tab-admin');
        agregarResultado('Pestaña admin activa', tabAdminContent?.classList.contains('activo'));
        agregarResultado('Botón nuevo staff en pestaña admin', !!tabAdminContent?.querySelector('#btnNuevoStaff'));
        agregarResultado('Lista personal en pestaña admin', !!tabAdminContent?.querySelector('#listaPersonalContainer'));
      }

      const btnVolver = document.getElementById('btnVolverVitrina');
      if (btnVolver) {
        btnVolver.click();
        await esperar(300);
        agregarResultado('Volver a vitrina funciona', modoVitrina && modoVitrina.style.display !== 'none');
      }

      await Auth.cerrarSesion();
      await Auth.iniciarSesion('master', 'master123');
      if (staffAdmin?.id) await DBAppwrite.eliminar('staff', staffAdmin.id);
      const staffActual = await DB.obtenerStaffPorEspacio('lataberna');
      agregarResultado('Staff admin temporal eliminado', !staffActual.some(s => s.id === staffAdmin?.id));
      await Auth.cerrarSesion();

      const total = resultados.length;
      const pasaron = resultados.filter(r => r.ok).length;
      const fallaron = total - pasaron;
      const resumen = document.createElement('div');
      resumen.style.marginTop = '12px';
      resumen.className = fallaron === 0 ? 'log-positivo' : 'log-error';
      resumen.innerHTML = `<strong>Resumen:</strong> ${pasaron} correctos, ${fallaron} fallidos.`;
      log.appendChild(resumen);
      Logger.info(`[test-D-temporal-perfil-v2] Finalizado. ${pasaron}/${total} correctos.`);
    }

    window.addEventListener('load', () => run().catch(e => {
      log.innerHTML += `<div class="log-error">Error: ${e.message}</div>`;
      console.error(e);
    }));
  </script>
</body>
</html>
