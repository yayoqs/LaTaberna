<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test B — Mapa de Mesas (v2.0.1) – ES6</title>
  <style>
    body { font-family: monospace; background: #1a1a24; color: #f1f5f9; padding: 20px; }
    h1 { color: #f59e0b; }
    .suite { margin-bottom: 24px; border-bottom: 1px solid #2e2e42; padding-bottom: 12px; }
    .test { margin: 4px 0; padding: 4px 8px; border-radius: 4px; }
    .pass { background: rgba(34,197,94,.2); }
    .fail { background: rgba(239,68,68,.2); }
    .summary { margin-top: 20px; font-weight: bold; }
    .info { color: #94a3b8; font-size: 12px; margin: 2px 0; }
    .error { color: #ef4444; }
  </style>
</head>
<body>
  <h1>🧪 Test B — Mapa de Mesas (v2.0.1) – ES6</h1>
  <p class="info">Valida micro-insignias, colores por estado, long-press, popover, estado 'pagada' y notificaciones unificadas.</p>
  <div id="results"></div>

  <script type="module">
    import { Mesas } from '../js/ui/mesas.js';
    import { Store } from '../js/lib/store.js';
    import { EventBus } from '../js/lib/eventBus.js';
    import { Logger } from '../js/lib/logger.js';

    // Mock de DB mínimo
    window.DB = {
      config: { zonas: [{ nombre: 'salon', cantidad: 5 }] },
      mozos: [{ id: 'm1', nombre: 'Carlos', activo: true }],
      mesas: [
        { numero: 1, estado: 'ocupada', zona: 'salon', items: [], mozo: 'Carlos', comensales: 2, pedidoId: 'p1', esVirtual: false, permite_prepedidos: false },
        { numero: 2, estado: 'libre', zona: 'salon', items: [], mozo: '', comensales: 1, pedidoId: null, esVirtual: false, permite_prepedidos: false }
      ],
      pedidos: [],
      comandas: [],
      saveMesas: () => {},
      saveComandas: () => {},
      fusionarMesas: () => null
    };
    window.showToast = () => {};

    // Sincronizar Store sin recursión infinita
    const originalGetState = Store.getState.bind(Store);
    Store.getState = function() {
      const state = originalGetState();
      state.mesas = window.DB.mesas;
      state.comandas = window.DB.comandas;
      state.config = window.DB.config;
      return state;
    };
    Store.dispatch({ type: 'MESAS_INICIALIZAR', payload: window.DB.mesas });

    const resultsEl = document.getElementById('results');
    let passed = 0, failed = 0;

    function assert(condition, msg) {
      if (condition) {
        passed++;
        resultsEl.innerHTML += '<div class="test pass">✔ ' + msg + '</div>';
      } else {
        failed++;
        resultsEl.innerHTML += '<div class="test fail">✘ ' + msg + '</div>';
      }
    }

    const esperar = ms => new Promise(resolve => setTimeout(resolve, ms));

    // Crear vista
    const main = document.createElement('main');
    main.id = 'view-mesas';
    main.className = 'view active';
    main.innerHTML = '<div id="mesasGrid"></div><div id="popoverContainer"></div>';
    document.body.appendChild(main);

    Mesas.render();
    await esperar(50);

    // Suite 1: Micro-insignias visibles
    resultsEl.innerHTML += '<div class="suite"><h2>1. Micro-insignias visibles</h2></div>';
    let microCocina = document.querySelector('.micro-cocina');
    let microBarra = document.querySelector('.micro-barra');
    assert(!!microCocina, 'Aparece micro-insignia de cocina');
    assert(!!microBarra, 'Aparece micro-insignia de barra');

    // Suite 2: Colores según estado de comandas
    resultsEl.innerHTML += '<div class="suite"><h2>2. Colores según estado</h2></div>';
    assert(microCocina.style.background === 'rgb(156, 163, 175)', 'Cocina gris (pendiente) sin comandas');
    assert(microBarra.style.background === 'rgb(156, 163, 175)', 'Barra gris (pendiente) sin comandas');

    window.DB.comandas = [
      {
        id: 'com_1', mesa: 1, destino: 'cocina',
        items: [{ prodId: 'prod_x', nombre: 'Hamburguesa', qty: 1, obs: '', enviadoA: 'cocina' }],
        estado: 'en-proceso', ts: Date.now() - 5 * 60 * 1000, mozo: 'Carlos', observaciones: ''
      }
    ];
    Mesas.render();
    await esperar(50);
    microCocina = document.querySelector('.micro-cocina');
    assert(microCocina.style.background === 'rgb(245, 158, 11)', 'Cocina amarilla (en-proceso)');

    window.DB.comandas[0].estado = 'lista';
    Mesas.render();
    await esperar(50);
    microCocina = document.querySelector('.micro-cocina');
    assert(microCocina.style.background === 'rgb(34, 197, 94)', 'Cocina verde (lista)');

    // Suite 3: Long-press despliega popover
    resultsEl.innerHTML += '<div class="suite"><h2>3. Long-press despliega popover</h2></div>';
    const card = document.querySelector('.mesa-card');
    assert(!!card, 'Tarjeta de mesa existe');

    card.dispatchEvent(new MouseEvent('mousedown', { bubbles: true }));
    await esperar(450);
    card.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
    await esperar(50);

    const popover = document.querySelector('#popoverContainer div');
    assert(!!popover, 'Popover aparece tras long-press');
    if (popover) {
      assert(popover.textContent.includes('Mesa 1'), 'Popover muestra número de mesa');
      assert(popover.textContent.includes('lista'), 'Popover muestra estado lista');
      const btnCerrar = popover.querySelector('button');
      if (btnCerrar) btnCerrar.click();
    }

    // Suite 4: Clic simple no despliega popover
    resultsEl.innerHTML += '<div class="suite"><h2>4. Clic simple no despliega popover</h2></div>';
    const popoverAntes = document.querySelector('#popoverContainer div');
    card.dispatchEvent(new MouseEvent('mousedown', { bubbles: true }));
    await esperar(100);
    card.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
    await esperar(50);
    const popoverDespues = document.querySelector('#popoverContainer div');
    if (!popoverAntes) {
      assert(popoverDespues === null, 'Clic simple NO despliega popover');
    }

    // Suite 5: Estado 'pagada' se refleja correctamente
    resultsEl.innerHTML += '<div class="suite"><h2>5. Estado pagada</h2></div>';
    window.DB.mesas[0].estado = 'pagada';
    Mesas.render();
    await esperar(50);
    const cardPagada = document.querySelector('.mesa-card.pagada');
    assert(!!cardPagada, 'Tarjeta de mesa tiene clase "pagada"');
    const labelPagada = cardPagada.querySelector('.mesa-estado-label');
    assert(labelPagada && labelPagada.textContent === 'PAGADA', 'Etiqueta muestra PAGADA');

    // Suite 6: Notificaciones unificadas
    resultsEl.innerHTML += '<div class="suite"><h2>6. Notificaciones unificadas</h2></div>';
    window.DB.mesas[1].estado = 'libre';
    window.DB.mesas[1].permite_prepedidos = false;
    Mesas.setClienteEsperando(2);
    Mesas.render();
    await esperar(50);
    const badgeEspera = document.querySelector('.esperando-cliente-badge');
    assert(!!badgeEspera, 'Aparece insignia de cliente esperando');

    Mesas.setBadge(2, 3, 'prec_123');
    Mesas.render();
    await esperar(50);
    const badgePrecarga = document.querySelector('.precarga-badge');
    assert(!!badgePrecarga && badgePrecarga.textContent.includes('3'), 'Badge de precarga con cantidad 3');

    // Resumen
    resultsEl.innerHTML += '<div class="summary">' + passed + ' pasaron, ' + failed + ' fallaron</div>';
    if (failed === 0) {
      resultsEl.innerHTML += '<div class="test pass">✔ Todos los tests de mesas v2.0.1 pasaron.</div>';
    }
  </script>
</body>
</html>
