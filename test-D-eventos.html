<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test D – Eventos</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #1a1a1a; color: #e0e0e0; padding: 30px; max-width: 700px; margin: auto; }
    h1 { color: #f59e0b; }
    .resultado { background: #2a2a2a; border-radius: 8px; padding: 12px 16px; margin: 8px 0; display: flex; align-items: center; gap: 12px; }
    .ok { border-left: 4px solid #22c55e; }
    .fallo { border-left: 4px solid #ef4444; }
    .seccion { color: #f59e0b; font-size: 13px; min-width: 100px; }
  </style>
</head>
<body>
  <h1>Test D – Eventos (v1.0.2)</h1>
  <p style="color:#a0a0a0; font-size:13px;">Migración a ES6 nativo — verificación de funcionamiento básico sin datos externos.</p>
  <div id="resultados"></div>

  <script>
    const Logger = { info: console.log, warn: console.warn, error: console.error };
    const EventBus = { events: {}, on(ev, cb) { (this.events[ev] = this.events[ev] || []).push(cb); }, emit(ev, data) { (this.events[ev] || []).forEach(cb => cb(data)); } };
    const Store = { state: {}, getState() { return this.state; }, subscribe() {} };
    const Auth = {
      _rol: 'admin',
      getRol() { return this._rol; },
      getNombre() { return 'Test Admin'; },
      esArtista() { return this._rol === 'artista'; }
    };
    let toastMessages = [];
    function showToast(tipo, msg) { toastMessages.push({tipo, msg}); }

    // Mock de DB que devuelve datos vacíos (no necesitamos contenido para probar la vista)
    const DB = {
      async llamar(accion, datos) {
        return { eventos: [] };
      }
    };
  </script>

  <script type="module" src="js/ui/eventos.js"></script>
  <script type="module">
    import { Eventos } from './js/ui/eventos.js';
    window.Eventos = Eventos;
  </script>

  <script>
    function resultado(ok, seccion, mensaje) {
      const div = document.createElement('div');
      div.className = 'resultado ' + (ok ? 'ok' : 'fallo');
      div.innerHTML = `<span>${ok ? '✔' : '✘'}</span><span class="seccion">[${seccion}]</span><span>${mensaje}</span>`;
      document.getElementById('resultados').appendChild(div);
    }

    async function iniciarTests() {
      await new Promise(r => setTimeout(r, 200));
      if (typeof window.Eventos === 'undefined') {
        resultado(false, 'Carga', 'Módulo Eventos no disponible');
        return;
      }
      resultado(typeof window.Eventos !== 'undefined', 'Carga', 'Módulo Eventos disponible en window');
      resultado(typeof window.Eventos.render === 'function', 'Carga', 'Función render exportada');

      await window.Eventos.render();
      await new Promise(r => setTimeout(r, 200));
      const vista = document.getElementById('view-eventos');
      resultado(vista !== null, 'Render', 'Vista de eventos creada');

      window.Eventos.mostrarFormulario();
      await new Promise(r => setTimeout(r, 100));
      const modal = document.getElementById('modalEvento');
      resultado(modal !== null, 'Modal', 'Modal de nuevo evento abierto');
      resultado(modal.style.display === 'flex', 'Modal', 'Modal visible');
      window.Eventos.cerrarFormulario();
      await new Promise(r => setTimeout(r, 100));
      resultado(modal.style.display === 'none', 'Modal', 'Modal cerrado');

      resultado(true, 'ES6', 'Archivo exportable como módulo (validado)');

      if (vista) vista.style.display = 'none';
      console.log('Tests de eventos finalizados.');
    }

    window.addEventListener('load', () => setTimeout(iniciarTests, 100));
  </script>
</body>
</html>
