<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Taberna — Eventos en Vivo (Prototipo v2)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --color-bg: #0f0f14;
            --color-accent: #f59e0b;
            --color-primary: #6366f1;
            --color-card: #1a1a24;
            --color-border: #2e2e42;
            --color-text: #f1f5f9;
            --color-text-sec: #94a3b8;
            --color-text-muted: #64748b;
            --font-ui: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --radius: 16px;
            --radius-sm: 10px;
            --t: all 0.25s ease;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-ui);
            background: var(--color-bg);
            color: var(--color-text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .vista-eventos {
            width: 100%;
            max-width: 480px;
            min-height: 650px;
            background: var(--color-bg);
            border-radius: var(--radius);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 40px rgba(0,0,0,.5);
        }

        /* Fondo animado */
        .eventos-fondo {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 30% 40%, rgba(99,102,241,.12) 0%, transparent 55%),
                radial-gradient(circle at 70% 60%, rgba(245,158,11,.1) 0%, transparent 55%),
                radial-gradient(circle at 50% 80%, rgba(239,68,68,.08) 0%, transparent 55%);
            animation: eventos-mesh 12s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 0;
        }
        @keyframes eventos-mesh {
            0%   { transform: scale(1); }
            100% { transform: scale(1.08); }
        }

        .eventos-contenido {
            position: relative;
            z-index: 1;
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 28px 20px 24px;
            gap: 20px;
        }

        /* Header */
        .eventos-header {
            text-align: center;
            flex-shrink: 0;
        }
        .eventos-header h1 {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(to right, var(--color-accent), var(--color-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 6px;
        }
        .eventos-sub {
            font-size: 14px;
            color: var(--color-text-sec);
            font-style: italic;
            margin-bottom: 12px;
        }

        /* Badge En vivo con pulso mejorado */
        .eventos-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(239,68,68,0.12);
            border: 1px solid rgba(239,68,68,0.25);
            border-radius: 99px;
            padding: 6px 16px;
            font-size: 12px;
            font-weight: 700;
            color: #ef4444;
            transition: var(--t);
        }
        .eventos-punto {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ef4444;
            animation: punto-vivo 1s ease-in-out infinite;
        }
        @keyframes punto-vivo {
            0%, 100% { opacity: 1; transform: scale(1); }
            50%      { opacity: .3; transform: scale(1.3); }
        }

        /* Tarjeta principal con borde degradado */
        .eventos-card {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--color-card);
            border-radius: var(--radius);
            padding: 28px 20px;
            text-align: center;
            align-items: center;
            justify-content: center;
            gap: 14px;
            background-image: linear-gradient(rgba(26,26,36,.95), rgba(26,26,36,.95)),
                              linear-gradient(135deg, var(--color-accent), var(--color-primary));
            background-origin: border-box;
            background-clip: padding-box, border-box;
            border: 2px solid transparent;
            transition: opacity 0.4s ease;
        }
        .eventos-icono { font-size: 56px; }
        .eventos-card h2 { font-size: 22px; }
        .eventos-descripcion { font-size: 14px; color: var(--color-text-sec); max-width: 400px; }

        /* Ecualizador con colores de paleta */
        .ecualizador {
            display: flex;
            align-items: flex-end;
            gap: 5px;
            height: 36px;
            margin-top: 8px;
        }
        .ecualizador span {
            width: 7px;
            border-radius: 3px;
            animation: eco 0.8s ease-in-out infinite alternate;
        }
        .ecualizador span:nth-child(odd)  { background: var(--color-accent); }
        .ecualizador span:nth-child(even) { background: var(--color-primary); }
        .ecualizador span:nth-child(1) { height: 50%; animation-delay: 0s; }
        .ecualizador span:nth-child(2) { height: 75%; animation-delay: .1s; }
        .ecualizador span:nth-child(3) { height: 40%; animation-delay: .2s; }
        .ecualizador span:nth-child(4) { height: 90%; animation-delay: .3s; }
        .ecualizador span:nth-child(5) { height: 60%; animation-delay: .4s; }
        @keyframes eco {
            0%   { transform: scaleY(0.5); }
            100% { transform: scaleY(1); }
        }

        /* Estado vacío mejorado */
        .eventos-vacio {
            text-align: center;
        }
        .eventos-vacio i {
            font-size: 48px;
            opacity: 0.2;
            display: block;
            margin-bottom: 16px;
            color: var(--color-text-muted);
        }
        .eventos-vacio h2 { margin-bottom: 8px; }
        .eventos-vacio p  { font-size: 14px; color: var(--color-text-muted); margin-bottom: 20px; }
        .ecualizador.inactivo span { animation: none; opacity: .25; background: var(--color-text-muted); }

        /* Votación */
        .eventos-votacion {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 300px;
        }
        .votacion-opcion {
            background: var(--color-panel, #21212e);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-sm);
            color: var(--color-text);
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--t);
            text-align: center;
        }
        .votacion-opcion:hover {
            border-color: var(--color-accent);
            background: var(--color-hover, #2a2a3a);
            color: var(--color-accent);
        }
    </style>
</head>
<body>
    <div class="vista-eventos">
        <div class="eventos-fondo"></div>
        <div class="eventos-contenido">
            <div class="eventos-header">
                <h1>🎉 Eventos en Vivo</h1>
                <p class="eventos-sub">Conectate a la energía de La Taberna</p>
                <div class="eventos-badge">
                    <span class="eventos-punto"></span> En vivo
                </div>
            </div>

            <!-- Ejemplo: tarjeta de karaoke activo -->
            <div class="eventos-card">
                <div class="eventos-icono">🎤</div>
                <h2>Karaoke en vivo</h2>
                <p class="eventos-descripcion">Subí al escenario y brillá como una estrella</p>
                <div class="ecualizador">
                    <span></span><span></span><span></span><span></span><span></span>
                </div>
            </div>

            <!-- Para probar estado vacío, comentar la tarjeta de arriba y descomentar esto:
            <div class="eventos-card">
                <div class="eventos-vacio">
                    <i class="fa-solid fa-calendar-alt"></i>
                    <h2>No hay eventos activos ahora</h2>
                    <p>Volvé más tarde o consultá el cronograma en la barra.</p>
                    <div class="ecualizador inactivo">
                        <span></span><span></span><span></span><span></span><span></span>
                    </div>
                </div>
            </div>
            -->
        </div>
    </div>
</body>
</html>
