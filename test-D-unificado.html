<!--
  LaTaberna - PubPOS — Test D Unificado
  Archivo: test-D-unificado.html (raíz)
  Versión: 3.10.3
  Propósito: batería completa de Célula D (Administración).
             Cubre jerarquía de roles, alta de staff, configuración
             por espacio, despensa, insumo vendible, editor de
             cartas, sección Catálogo, editor de variantes y Modo
             Variantes del editor de cartas.
  Credenciales: jefePub / jefe1234 en espacio PubPrueba.

  v3.10.3: Bloque 3 — timeout del assert "Staff aparece en la
           lista" sube de 15s a 40s. El re-render de la pestaña
           Personal se dispara después de cerrar el modal de
           contraseña y sufre el mismo cold start variable que
           el modal (17s a 24s en corridas consecutivas).
  v3.10.2: dos cambios.
           · Bloque 3: timeout del modal de contraseña temporal
             sube de 20s a 40s. La serverless registrar-usuario
             tiene cold start variable (16.9s en una corrida,
             >20s en la siguiente). 20s era demasiado ajustado.
           · Bloque 12: normaliza recetas antes de despachar al
             Store (§5.2). Elimina el error de consola
             "receta.ingredientes.reduce is not a function".
  v3.10.1: migra Bloque 9 al slice cartas (CARTAS_INICIALIZAR)
           tras el rename E.x13 (brief D.13). Agrega dos aserciones
           que validan el cambio de slice.
  v3.10.0: agrega Bloque 12 (Modo Variantes del Editor de Cartas) y
           limpieza temprana de huérfanos de config.
  v3.9.x:  paquetes del sistema de variantes (bloques 10 y 11).
-->

<body class="test-mode">

  <!-- ════════════════════════════════════════════════════════════
       SECCIÓN 0.2 — DOM DEL TEST
       ════════════════════════════════════════════════════════════ -->
  <div class="panel-test">
    <h2>Test D — Unificado v3.10.3</h2>
    <div id="logTest"></div>
  </div>

  <main id="view-perfil"></main>
  <div id="view-config"></div>
  <div id="view-despensa"></div>
  <main id="view-carta-editor" class="view"></main>
  <div id="contenedor-variantes-test"></div>

  <script type="module">
    // ════════════════════════════════════════════════════════════
    //  SECCIÓN 0.3 — IMPORTS
    // ════════════════════════════════════════════════════════════

    // ── Core (Célula A) ────────────────────────────────────────
    import { Auth }        from './js/auth.js';
    import { Roles }       from './js/roles.js';
    import { DB }          from './js/db.js';
    import { DBAppwrite }  from './js/db-appwrite.js';

    // ── Infraestructura (Célula E) ─────────────────────────────
    import { Logger }      from './js/lib/logger.js';
    import { Store }       from './js/lib/store.js';
    import { Deps }        from './js/lib/deps.js';

    // ── Repositorios y servicios ───────────────────────────────
    import { crearInventarioRepo } from './js/repositorios/inventario-repository.js';
    import { crearVarianteRepo }   from './js/repositorios/variante-repository.js';
    import { crearRecetaRepo }     from './js/repositorios/receta-repository.js';
    import { InventarioService }   from './js/servicios/inventario-service.js';

    // ── Vistas de Célula D ─────────────────────────────────────
    import { renderTabAdmin } from './js/ui/perfil/admin-roles.js';
    import { Config }         from './js/ui/config.js';
    import { Perfil }         from './js/ui/perfil.js';
    import { Despensa }       from './js/ui/despensa.js';
    import * as ModalInsumo   from './js/ui/despensa/modal-insumo.js';
    import { setFiltroVendibles, getFiltroVendibles } from './js/ui/despensa/estado.js';

    // ── Carta Editor ───────────────────────────────────────────
    import { CartaEditor }    from './js/ui/carta-editor.js';
    import { getMenuActivo, setMenuActivo } from './js/ui/carta-editor/estado.js';
    import { guardarMenu }    from './js/ui/carta-editor/acciones.js';
    import * as cicloVidaVariantes from './js/ui/carta-editor/variantes/ciclo-vida.js';

    console.log('[Test D] Módulos importados correctamente');

    // ════════════════════════════════════════════════════════════
    //  SECCIÓN 0.4 — SISTEMA DE LOG DEL TEST
    // ════════════════════════════════════════════════════════════

    Logger.setLevel('DEBUG');
    const log = document.getElementById('logTest');
    const resultados = [];

    function agregarResultado(nombre, ok, detalle = '') {
      const fila = document.createElement('div');
      fila.className = ok ? 'log-positivo' : 'log-error';
      fila.innerHTML = `${ok ? '✅' : '❌'} ${nombre}${detalle ? ` — <code>${detalle}</code>` : ''}`;
      log.appendChild(fila);
      resultados.push({ nombre, ok });
    }

    function agregarInfo(mensaje) {
      const fila = document.createElement('div');
      fila.className = 'log-info';
      fila.innerHTML = `ℹ️ ${mensaje}`;
      log.appendChild(fila);
    }

    function agregarSeccion(titulo) {
      const fila = document.createElement('div');
      fila.className = 'log-seccion';
      fila.textContent = `── ${titulo} ──`;
      log.appendChild(fila);
    }

    // ════════════════════════════════════════════════════════════
    //  SECCIÓN 0.5 — HELPERS GENERALES
    // ════════════════════════════════════════════════════════════

    const esperar = ms => new Promise(r => setTimeout(r, ms));

    async function esperarElemento(selector, timeout = 6000) {
      const inicio = Date.now();
      while (Date.now() - inicio < timeout) {
        const el = document.querySelector(selector);
        if (el) return el;
        await esperar(100);
      }
      return null;
    }

    async function esperarStaffEnLista(contenedorId, nombreVisible, timeout = 15000) {
      const inicio = Date.now();
      while (Date.now() - inicio < timeout) {
        const filas = document.querySelectorAll(`#${contenedorId} .usuario-row`);
        for (const fila of filas) {
          const nombreFila = fila.querySelector('strong')?.textContent || '';
          if (nombreFila === nombreVisible) return fila;
        }
        await esperar(200);
      }
      return null;
    }

    async function esperarHasta(fn, timeout = 10000, intervalo = 200) {
      const inicio = Date.now();
      while (Date.now() - inicio < timeout) {
        const r = await fn();
        if (r) return r;
        await esperar(intervalo);
      }
      return null;
    }

    async function leerConfigRemoto(espacioId) {
      try {
        const doc = await DBAppwrite.baseDeDatos.getRow({
          databaseId: DBAppwrite.idBaseDeDatos,
          tableId: DBAppwrite.COLECCIONES.configuracion,
          rowId: `${espacioId}_global`
        });
        return doc?.valor ? JSON.parse(doc.valor) : null;
      } catch (e) {
        if (e.code === 404) return null;
        return null;
      }
    }

    function escribir(input, valor) {
      input.value = valor;
      input.dispatchEvent(new Event('input', { bubbles: true }));
    }

    function disparar(input, tipo = 'change') {
      input.dispatchEvent(new Event(tipo, { bubbles: true }));
    }

    // ════════════════════════════════════════════════════════════
    //  FUNCIÓN PRINCIPAL — run()
    // ════════════════════════════════════════════════════════════

    async function run() {
      console.log('[Test D] run() iniciado');
      Logger.setLevel('ERROR');
      log.innerHTML = '';

      // ── Limpieza temprana de huérfanos de config ────────────
      // Elimina docs con clave='global' y espacioId='PubPrueba'
      // que NO sean 'PubPrueba_global'. Evita falsos positivos
      // en el assert del Bloque 5 por residuos de corridas
      // anteriores que no llegaron a limpiar.
      try {
        const configsPrevios = await DBAppwrite.listar('configuracion');
        const huerfanosPrevios = configsPrevios.filter(d =>
          d.clave === 'global' &&
          d.espacioId === 'PubPrueba' &&
          d.id !== 'PubPrueba_global'
        );
        for (const h of huerfanosPrevios) {
          try { await DBAppwrite.eliminar('configuracion', h.id); } catch { /* ignorar */ }
        }
        if (huerfanosPrevios.length > 0) {
          console.log(`[Test D] Limpieza temprana: ${huerfanosPrevios.length} huérfanos de config eliminados.`);
        }
      } catch { /* ignorar */ }

      // ══════════════════════════════════════════════════════════
      //  SECCIÓN 1 — SETUP INICIAL
      // ══════════════════════════════════════════════════════════

      Deps.registrar('auth', Auth);
      await DB.init();
      await Auth.cerrarSesion();
      const loginOk = await Auth.iniciarSesion('jefePub', 'jefe1234');
      if (!loginOk) {
        agregarResultado('Login jefePub/jefe1234', false);
        return;
      }
      agregarResultado('Login jefePub/jefe1234', true);

      const usuarioOriginal = Auth.obtenerUsuarioActual();
      const espacioId = Auth.obtenerLocalActivo()?.id || null;
      agregarResultado('Espacio resuelto como PubPrueba', espacioId === 'PubPrueba', `Espacio: ${espacioId}`);

      const rolesJefe = usuarioOriginal.rolesEfectivos || [];
      agregarResultado('jefePub tiene rol owner', rolesJefe.includes('owner'), `Roles: ${rolesJefe.join(', ')}`);

      agregarSeccion('Preparación de datos compartidos');

      const docFalsoId = `PubPrueba_test_falso_${Date.now().toString().slice(-6)}`;
      let placeholderStaffId = null;

      const staffActual = await DB.obtenerStaffPorEspacio('PubPrueba');
      if (staffActual.length === 0) {
        try {
          const placeholder = await DB.crearOActualizarStaff({
            nombre: 'Placeholder Staff',
            usuarioId: `sim_user_${Date.now()}`,
            espacioId: 'PubPrueba',
            roles: ['mesero'],
            rolPrincipal: 'mesero',
            estado: 'activo',
            tokenVinculacion: `tk_placeholder_${Date.now()}`
          });
          if (placeholder?.id) {
            placeholderStaffId = placeholder.id;
            agregarResultado('Crear placeholder de staff', true, placeholder.id);
          } else {
            agregarResultado('Crear placeholder de staff', false, 'Devolvió null');
          }
        } catch (e) {
          agregarResultado('Crear placeholder de staff', false, e.message);
        }
      } else {
        agregarResultado('Staff ya presente en PubPrueba', true, `${staffActual.length} registros`);
      }

      // ══════════════════════════════════════════════════════════
      //  BLOQUE 1 — JERARQUÍA VISUAL
      // ══════════════════════════════════════════════════════════

      agregarSeccion('BLOQUE 1 — Jerarquía visual (usuarios simulados)');

      const adminPuro = { nombre: 'admin_puro', rolesEfectivos: ['admin'], rolPrincipal: 'admin', localActivoId: 'PubPrueba' };
      const contenedorAdminPuro = document.createElement('div');
      contenedorAdminPuro.id = 'tab-admin-puro-test';
      document.body.appendChild(contenedorAdminPuro);
      await renderTabAdmin(adminPuro, false, 'tab-admin-puro-test');

      const checksAdminPuro = [...document.querySelectorAll('#tab-admin-puro-test .rol-check input[type="checkbox"]')];
      const rolesVistosPuro = [...new Set(checksAdminPuro.map(c => c.dataset.rol))];
      agregarResultado('Admin puro no ve owner', !rolesVistosPuro.includes('owner'));
      agregarResultado('Admin puro no ve admin', !rolesVistosPuro.includes('admin'));
      agregarResultado('Admin puro no ve jugador', !rolesVistosPuro.includes('jugador'));
      agregarResultado('Admin puro ve chef', rolesVistosPuro.includes('chef'), `Roles vistos: ${rolesVistosPuro.join(', ')}`);
      agregarResultado('Admin puro ve cocinaAyudante', rolesVistosPuro.includes('cocinaAyudante'));
      agregarResultado('Admin puro ve barman', rolesVistosPuro.includes('barman'));
      agregarResultado('Admin puro ve barraAyudante', rolesVistosPuro.includes('barraAyudante'));
      agregarResultado('Admin puro ve mesero', rolesVistosPuro.includes('mesero'));
      agregarResultado('Admin puro ve caja', rolesVistosPuro.includes('caja'));
      agregarResultado('Admin puro ve repartidor', rolesVistosPuro.includes('repartidor'));
      agregarResultado('Admin puro ve artista', rolesVistosPuro.includes('artista'));

      const owner = { nombre: 'owner', rolesEfectivos: ['owner'], rolPrincipal: 'owner', localActivoId: 'PubPrueba' };
      const contenedorOwner = document.createElement('div');
      contenedorOwner.id = 'tab-owner-test';
      document.body.appendChild(contenedorOwner);
      await renderTabAdmin(owner, false, 'tab-owner-test');

      const checksOwner = [...document.querySelectorAll('#tab-owner-test .rol-check input[type="checkbox"]')];
      const rolesVistosOwner = [...new Set(checksOwner.map(c => c.dataset.rol))];
      agregarResultado('Owner ve admin', rolesVistosOwner.includes('admin'), `Roles vistos: ${rolesVistosOwner.join(', ')}`);
      agregarResultado('Owner no ve owner', !rolesVistosOwner.includes('owner'));
      agregarResultado('Owner no ve jugador', !rolesVistosOwner.includes('jugador'));
      agregarResultado('Owner ve chef', rolesVistosOwner.includes('chef'));
      agregarResultado('Owner ve cocinaAyudante', rolesVistosOwner.includes('cocinaAyudante'));
      agregarResultado('Owner ve barman', rolesVistosOwner.includes('barman'));
      agregarResultado('Owner ve barraAyudante', rolesVistosOwner.includes('barraAyudante'));
      agregarResultado('Owner ve mesero', rolesVistosOwner.includes('mesero'));
      agregarResultado('Owner ve caja', rolesVistosOwner.includes('caja'));
      agregarResultado('Owner ve repartidor', rolesVistosOwner.includes('repartidor'));
      agregarResultado('Owner ve artista', rolesVistosOwner.includes('artista'));

      const master = { nombre: 'master', rolesEfectivos: ['master'], rolPrincipal: 'master', localActivoId: 'PubPrueba' };
      const contenedorMaster = document.createElement('div');
      contenedorMaster.id = 'tab-master-test';
      document.body.appendChild(contenedorMaster);
      await renderTabAdmin(master, true, 'tab-master-test');

      const checksMaster = [...document.querySelectorAll('#tab-master-test .rol-check input[type="checkbox"]')];
      const rolesVistosMaster = [...new Set(checksMaster.map(c => c.dataset.rol))];
      agregarResultado('Master ve owner', rolesVistosMaster.includes('owner'), `Roles vistos: ${rolesVistosMaster.join(', ')}`);
      agregarResultado('Master no ve admin', !rolesVistosMaster.includes('admin'));
      agregarResultado('Master no ve jugador', !rolesVistosMaster.includes('jugador'));
      agregarResultado('Master no ve staff', ['chef','cocinaAyudante','barman','barraAyudante','mesero','caja','repartidor','artista'].every(r => !rolesVistosMaster.includes(r)));

      // ══════════════════════════════════════════════════════════
      //  BLOQUE 2 — JERARQUÍA LÓGICA
      // ══════════════════════════════════════════════════════════

      agregarSeccion('BLOQUE 2 — Jerarquía lógica');
      agregarResultado('owner puede asignar admin', Roles.puedeAsignar('owner', 'admin') === true);
      agregarResultado('owner puede asignar mesero', Roles.puedeAsignar('owner', 'mesero') === true);
      agregarResultado('owner NO puede asignar owner', Roles.puedeAsignar('owner', 'owner') === false);
      agregarResultado('admin puede asignar mesero', Roles.puedeAsignar('admin', 'mesero') === true);
      agregarResultado('admin NO puede asignar admin', Roles.puedeAsignar('admin', 'admin') === false);
      agregarResultado('mesero NO puede asignar mesero', Roles.puedeAsignar('mesero', 'mesero') === false);
      agregarResultado('master puede asignar owner', Roles.puedeAsignar('master', 'owner') === true);

      // ══════════════════════════════════════════════════════════
      //  BLOQUE 3 — ALTA DE STAFF CON CONTRASEÑA TEMPORAL
      // ══════════════════════════════════════════════════════════

      agregarSeccion('BLOQUE 3 — Alta de staff con contraseña temporal');

      const contenedorAlta = document.createElement('div');
      contenedorAlta.id = 'tab-alta-test';
      document.body.appendChild(contenedorAlta);
      await renderTabAdmin(usuarioOriginal, false, 'tab-alta-test');

      const btnNuevo = document.querySelector('#tab-alta-test #btnNuevoStaff');
      agregarResultado('Botón Nuevo personal existe', !!btnNuevo);
      btnNuevo.click();
      await esperar(500);

      const modalAlta = await esperarElemento('#altaUsuario');
      agregarResultado('Modal de alta aparece', !!modalAlta);

      const nombreUsuarioAlta = `staff_pub_${Date.now().toString().slice(-8)}`;
      const nombreVisibleAlta = `Personal Prueba ${Date.now().toString().slice(-4)}`;
      modalAlta.value = nombreUsuarioAlta;
      document.querySelector('#altaNombreVisible').value = nombreVisibleAlta;

      const checkMesero = [...document.querySelectorAll('#altaRolesChecks input[type="checkbox"]')]
        .find(c => c.value === 'mesero');
      const checkCaja = [...document.querySelectorAll('#altaRolesChecks input[type="checkbox"]')]
        .find(c => c.value === 'caja');

      agregarResultado('Checkboxes mesero y caja disponibles', !!checkMesero && !!checkCaja);
      checkMesero.checked = true;
      checkMesero.dispatchEvent(new Event('change', { bubbles: true }));
      checkCaja.checked = true;
      checkCaja.dispatchEvent(new Event('change', { bubbles: true }));

      await esperar(300);

      const selectPrincipal = document.querySelector('#altaRolPrincipal');
      const opciones = [...selectPrincipal.options].map(o => o.value);
      agregarResultado('Rol principal incluye mesero', opciones.includes('mesero'));
      agregarResultado('Rol principal incluye caja', opciones.includes('caja'));

      selectPrincipal.value = 'mesero';
      selectPrincipal.dispatchEvent(new Event('change', { bubbles: true }));

      const t0Bloque3 = Date.now();
      document.querySelector('#btnConfirmarAltaStaff').click();
      agregarInfo('Confirmando alta...');

      // v3.10.2: timeout subido de 20s a 40s. La serverless
      // registrar-usuario tiene cold start variable (16.9s en una
      // corrida, >20s en la siguiente). El fetch a la función de
      // sincronización de labels falla por CORS y el navegador
      // tarda varios segundos en dar el error de red, alargando el
      // flujo total. 40s da margen real sin enmascarar bugs.
      const inputPassword = await esperarElemento('#inputPasswordTemporal', 40000);
      const msBloque3 = Date.now() - t0Bloque3;
      agregarResultado('Modal de contraseña temporal aparece', !!inputPassword, inputPassword ? `${msBloque3}ms` : `no en 40s`);

      if (inputPassword) {
        agregarResultado('Input de contraseña es readonly', inputPassword.readOnly === true);
        agregarResultado('Contraseña visible no vacía', inputPassword.value.length > 0);
        agregarResultado('Botón copiar existe', !!document.querySelector('#btnCopiarPasswordTemporal'));
        const modalPassword = inputPassword.closest('.modal-overlay');
        const textoAdvertencia = modalPassword?.textContent || '';
        agregarResultado('Advertencia de no volver a mostrar', textoAdvertencia.includes('no se volverá a mostrar'));
        document.querySelector('#btnContinuarPasswordTemporal')?.click();
      }

      // v3.10.3: timeout subido de 15s a 40s. El re-render de la
      // pestaña Personal se dispara DESPUÉS de cerrar el modal de
      // contraseña, y la llamada a DB.obtenerStaffPorEspacio sufre
      // el mismo cold start variable que el modal (17s a 24s en
      // corridas consecutivas). 15s no alcanzaba cuando el cold
      // start se alargaba.
      const staffCreado = await esperarStaffEnLista('tab-alta-test', nombreVisibleAlta, 40000);
      agregarResultado('Staff aparece en la lista', !!staffCreado);

      // ══════════════════════════════════════════════════════════
      //  BLOQUE 4 — SECCIÓN PERSONAL COMPLETA
      // ══════════════════════════════════════════════════════════

      agregarSeccion('BLOQUE 4 — Sección Personal completa');

      const contenedorPersonal = document.createElement('div');
      contenedorPersonal.id = 'sec-personal-test';
      document.body.appendChild(contenedorPersonal);
      await renderTabAdmin(usuarioOriginal, false, 'sec-personal-test');

      agregarResultado('Botón nuevo existe', !!document.querySelector('#sec-personal-test #btnNuevoStaff'));
      agregarResultado('Búsqueda existe', !!document.querySelector('#sec-personal-test #buscarPersonalInput'));
      agregarResultado('Lista existe', !!document.querySelector('#sec-personal-test #listaPersonalContainer'));
      agregarResultado('Nota muestra rol correcto', document.querySelector('#sec-personal-test .nota-privacidad')?.textContent.includes('owner'));

      // ══════════════════════════════════════════════════════════
      //  BLOQUE 5 — CONFIGURACIÓN POR ESPACIO
      // ══════════════════════════════════════════════════════════

      agregarSeccion('BLOQUE 5 — Configuración por espacio');

      await DBAppwrite.crear('configuracion', docFalsoId, {
        clave: 'global',
        valor: JSON.stringify({ nombreLocal: 'Falso' })
      });

      await DBAppwrite.listar('mesas');
      await esperar(200);

      Config.activar();

      const inputNombre = document.getElementById('cfgNombreLocal');
      agregarResultado('Campos de configuración disponibles', !!inputNombre);
      if (inputNombre) {
        inputNombre.value = 'La Taberna Test';
        document.getElementById('cfgDireccion').value = 'Dirección Test';
        document.getElementById('cfgCuit').value = '12345678';
        document.getElementById('cfgPie').value = 'Pie Test';
        document.getElementById('btnGuardarConfig').click();

      const filaP2Panel12 = buscarFila12(nombres12.p2);
      const chipV2Panel12 = [...(filaP2Panel12?.querySelectorAll('.asig-chip-variante') || [])]
        .find(c => c.dataset.varianteId === `v_blq12_quitar_${ts12}`);
      agregarResultado('12j · Chip de variante con quitar encontrado', !!chipV2Panel12);

      if (chipV2Panel12) {
        chipV2Panel12.querySelector('[data-action="asig-abrir-panel"]').click();
        await esperar(500);

        const panel12 = document.getElementById('asig-panel-lateral');
        agregarResultado('12j · Panel lateral abierto', panel12?.classList.contains('abierto'));

        const panelTitulo12 = document.getElementById('asig-panel-titulo');
        agregarResultado('12j · Título del panel correcto',
          panelTitulo12?.textContent.includes(`Con Quitar ${ts12}`), panelTitulo12?.textContent);

        const panelBody12 = document.getElementById('asig-panel-body');
        agregarResultado('12j · Panel muestra aviso de insumos quitar sin receta',
          !!panelBody12.querySelector('.asig-panel-aviso.error'));

        const opciones12 = panelBody12.querySelectorAll('.asig-opcion-card');
        agregarResultado('12j · Panel muestra opciones', opciones12.length >= 1, `${opciones12.length} opciones`);

        document.querySelector('[data-action="asig-cerrar-panel"]')?.click();
        await esperar(400);
        agregarResultado('12j · Panel cerrado', !panel12.classList.contains('abierto'));
      }

      agregarInfo('12k. Volver a Modo Lienzo');

      const btnLienzoVuelta12 = document.querySelector('#menuModoSwitch [data-modo="lienzo"]');
      btnLienzoVuelta12?.click();
      await esperar(500);

      agregarResultado('12k · Botón Lienzo activo', btnLienzoVuelta12?.classList.contains('activo'));
      agregarResultado('12k · Contenedor Lienzo visible',
        document.getElementById('menuModoLienzoContainer')?.style.display === 'flex');
      agregarResultado('12k · Contenedor Variantes oculto',
        document.getElementById('menuModoVariantesContainer')?.style.display === 'none');
      agregarResultado('12k · Banda de contexto oculta',
        document.getElementById('menuModoContexto')?.style.display === 'none');
      agregarResultado('12k · Botón contexto visible en modo Lienzo',
        document.getElementById('menuCtxBtn')?.style.display !== 'none');

      agregarInfo('12 · Limpieza del Bloque 12');

      CartaEditor.limpiar();
      await esperar(300);

      let limpiezaProds12 = true;
      for (const id of ids12.productos) {
        try { await DBAppwrite.eliminar('productos', id); }
        catch (e) { limpiezaProds12 = false; Logger.warn(`[Test] Producto ${id} no eliminado: ${e.message}`); }
      }
      agregarResultado('12 · Productos de prueba eliminados', limpiezaProds12);

      let limpiezaVars12 = true;
      for (const id of ids12.variantes) {
        try { await DBAppwrite.eliminar('variantes', id); }
        catch (e) { limpiezaVars12 = false; Logger.warn(`[Test] Variante ${id} no eliminada: ${e.message}`); }
      }
      agregarResultado('12 · Variantes de prueba eliminadas', limpiezaVars12);

      let limpiezaRecs12 = true;
      for (const id of ids12.recetas) {
        try { await DBAppwrite.eliminar('recetas', id); }
        catch (e) { limpiezaRecs12 = false; Logger.warn(`[Test] Receta ${id} no eliminada: ${e.message}`); }
      }
      agregarResultado('12 · Recetas de prueba eliminadas', limpiezaRecs12);

      // ══════════════════════════════════════════════════════════
      //  SECCIÓN FINAL — LIMPIEZA Y RESUMEN
      // ══════════════════════════════════════════════════════════

      agregarSeccion('Limpieza final');

      const staffPubFinal = await DB.obtenerStaffPorEspacio('PubPrueba');
      const staffAltaFinal = staffPubFinal.find(s => s.nombre === nombreVisibleAlta);
      if (staffAltaFinal?.id) await DBAppwrite.eliminar('staff', staffAltaFinal.id);
      const staffAltaEliminado = !(await DB.obtenerStaffPorEspacio('PubPrueba')).some(s => s.nombre === nombreVisibleAlta);
      agregarResultado('Staff de alta eliminado', staffAltaEliminado);

      if (placeholderStaffId) {
        await DBAppwrite.eliminar('staff', placeholderStaffId);
        const placeholderEliminado = !(await DB.obtenerStaffPorEspacio('PubPrueba')).some(s => s.id === placeholderStaffId);
        agregarResultado('Placeholder de staff eliminado', placeholderEliminado);
      }

      try {
        await DBAppwrite.eliminar('configuracion', docFalsoId);
        agregarResultado('Doc alternativo de config eliminado', true);
      } catch (e) {
        agregarResultado('Doc alternativo de config eliminado', false, e.message);
      }

      try {
        const restantes = await DBAppwrite.listar('configuracion');
        const huerfanos = restantes.filter(d =>
          d.clave === 'global' &&
          d.espacioId === 'PubPrueba' &&
          d.id !== 'PubPrueba_global'
        );
        for (const h of huerfanos) {
          await DBAppwrite.eliminar('configuracion', h.id);
        }
        if (huerfanos.length > 0) {
          agregarResultado('Huérfanos extra de config limpiados', true, `${huerfanos.length}`);
        }
      } catch (e) { }

      setFiltroVendibles(false);
      Config.limpiar();

      await Auth.cerrarSesion();

      const total = resultados.length;
      const pasaron = resultados.filter(r => r.ok).length;
      const fallaron = total - pasaron;
      const resumen = document.createElement('div');
      resumen.style.marginTop = '12px';
      resumen.className = fallaron === 0 ? 'log-positivo' : 'log-error';
      resumen.innerHTML = `<strong>Resumen:</strong> ${pasaron} correctos, ${fallaron} fallidos.`;
      log.appendChild(resumen);
      Logger.info(`[test-D-unificado] Finalizado. ${pasaron}/${total} correctos.`);
    }

    // ════════════════════════════════════════════════════════════
    //  SECCIÓN ARRANQUE
    // ════════════════════════════════════════════════════════════

    const _arrancarTest = () => {
      console.log('[Test D] Arrancando test...');
      run().catch(e => {
        log.innerHTML += `<div class="log-error">Error: ${e.message}</div>`;
        console.error('[Test D] Error en run():', e);
      });
    };

    if (document.readyState === 'loading') {
      console.log('[Test D] DOM cargando, esperando load...');
      window.addEventListener('load', _arrancarTest);
    } else {
      console.log('[Test D] DOM ya listo, arrancando directo');
      setTimeout(_arrancarTest, 100);
    }
  </script>
</body>
</html>
