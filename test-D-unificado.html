<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Test D — Unificado</title>
  <link rel="stylesheet" href="css/vars.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/modals.css">
  <link rel="stylesheet" href="css/config.css">
  <link rel="stylesheet" href="css/perfil.css">
  <link rel="stylesheet" href="css/despensa.css">
  <script src="js/appwrite.min.js"></script>
  <style>
    html, body {
      height: auto;
      min-height: 100vh;
      overflow-y: auto;
      overflow-x: hidden;
      margin: 0;
      padding: 0;
    }

    body {
      display: block;
      background: #0f0f14;
      color: #f1f5f9;
      font-family: 'Nunito', system-ui, sans-serif;
      padding: 20px;
      box-sizing: border-box;
    }

    .panel-test {
      background: #1a1a24;
      border: 1px solid #2e2e42;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-sizing: border-box;
    }

    .panel-test h2 {
      font-size: 18px;
      margin: 0 0 12px;
    }

    .log-positivo { color: #22c55e; font-weight: 700; }
    .log-error { color: #ef4444; font-weight: 700; }
    .log-info { color: #60a5fa; font-weight: 700; }

    code {
      background: #252535;
      padding: 2px 6px;
      border-radius: 4px;
    }

    #view-config,
    #view-despensa,
    #view-perfil {
      display: block;
      height: auto;
      min-height: 0;
      overflow: visible;
    }

    @media (max-width: 768px) {
      body { padding: 12px; }
      .panel-test { padding: 14px; }
    }
  </style>
</head>
<body>

  <div class="panel-test">
    <h2>Test D — Unificado</h2>
    <p style="font-size:13px; color:#94a3b8; margin:0 0 8px;">
      Batería completa: jerarquía de roles, alta de staff, sección personal,
      configuración por espacio, despensa, perfil y limpieza.
    </p>
    <div id="logTest"></div>
  </div>

  <div class="panel-test">
    <h2>Render Master</h2>
    <div id="tab-master-test"></div>
  </div>

  <div class="panel-test">
    <h2>Render Admin</h2>
    <div id="tab-admin-test"></div>
  </div>

  <div class="panel-test">
    <h2>Render Gerente</h2>
    <div id="tab-gerente-test"></div>
  </div>

  <div class="panel-test">
    <h2>Sección Personal (como master)</h2>
    <div id="sec-personal-test"></div>
  </div>

  <div class="panel-test">
    <h2>Configuración por espacio</h2>
    <div id="view-config"></div>
  </div>

  <div class="panel-test">
    <h2>Despensa</h2>
    <div id="view-despensa"></div>
  </div>

  <div class="panel-test">
    <h2>Perfil</h2>
    <div id="view-perfil"></div>
  </div>

  <script type="module">
    import { Auth } from './js/auth.js';
    import { Roles } from './js/roles.js';
    import { DB } from './js/db.js';
    import { DBAppwrite } from './js/db-appwrite.js';
    import { Logger } from './js/lib/logger.js';
    import { Store } from './js/lib/store.js';
    import { renderTabAdmin } from './js/ui/perfil/admin-roles.js';
    import { Config } from './js/ui/config.js';
    import { Despensa } from './js/ui/despensa.js';
    import { Perfil } from './js/ui/perfil.js';
    import { InventarioService } from './js/servicios/inventario-service.js';
    import { crearInventarioRepo } from './js/repositorios/inventario-repository.js';

    Logger.setLevel('DEBUG');

    const log = document.getElementById('logTest');
    const resultados = [];

    function agregarResultado(nombre, ok, detalle = '') {
      const fila = document.createElement('div');
      fila.className = ok ? 'log-positivo' : 'log-error';
      fila.innerHTML = `${ok ? '✅' : '❌'} ${nombre}${detalle ? ` — <code>${detalle}</code>` : ''}`;
      log.appendChild(fila);
      resultados.push({ nombre, ok });
    }

    function agregarInfo(mensaje) {
      const fila = document.createElement('div');
      fila.className = 'log-info';
      fila.innerHTML = `ℹ️ ${mensaje}`;
      log.appendChild(fila);
    }

    const esperar = ms => new Promise(r => setTimeout(r, ms));

    async function esperarElemento(selector, timeout = 6000) {
      const inicio = Date.now();
      while (Date.now() - inicio < timeout) {
        const el = document.querySelector(selector);
        if (el) return el;
        await esperar(100);
      }
      return null;
    }

    async function esperarStaffEnLista(contenedorId, nombreVisible, timeout = 15000) {
      const inicio = Date.now();
      while (Date.now() - inicio < timeout) {
        const filas = document.querySelectorAll(`#${contenedorId} .usuario-row`);
        for (const fila of filas) {
          const nombreFila = fila.querySelector('strong')?.textContent || '';
          if (nombreFila === nombreVisible) return fila;
        }
        await esperar(200);
      }
      return null;
    }

    async function run() {
      Logger.setLevel('ERROR');
      log.innerHTML = '';

      // ── Inicialización ────────────────────────────────
      await Auth.cerrarSesion();
      await DB.init();
      const loginMasterInicial = await Auth.iniciarSesion('master', 'master123');
      if (!loginMasterInicial) {
        agregarResultado('Login master inicial', false);
        return;
      }
      agregarResultado('Login master inicial', true);

      // ── Bloque 1: Jerarquía de roles ─────────────────
      agregarInfo('--- Bloque 1: Jerarquía de roles ---');

      const usuarioMaster = Auth.obtenerUsuarioActual();
      await renderTabAdmin(usuarioMaster, true, 'tab-master-test');
      const checksMaster = [...document.querySelectorAll('#tab-master-test .rol-check input[type="checkbox"]')];
      const rolesMasterUnicos = [...new Set(checksMaster.map(c => c.dataset.rol))];

      agregarResultado(
        'Master solo puede asignar admin',
        rolesMasterUnicos.length === 1 && rolesMasterUnicos[0] === 'admin',
        `Roles únicos: ${rolesMasterUnicos.join(', ')}`
      );

      const nombreAdmin = `tpa_${Date.now().toString().slice(-8)}`;
      const passwordAdmin = 'Pass12345';
      const regAdmin = await Auth.registrarUsuario(nombreAdmin, passwordAdmin);
      if (!regAdmin.exito) {
        agregarResultado('Registrar admin', false, regAdmin.error);
        return;
      }

      const staffAdmin = await DB.crearOActualizarStaff({
        nombre: 'Admin Test',
        usuarioId: regAdmin.usuarioId,
        espacioId: 'lataberna',
        roles: ['admin'],
        rolPrincipal: 'admin',
        estado: 'activo',
        tokenVinculacion: ''
      });
      agregarResultado('Crear staff admin', !!staffAdmin);

      await Auth.cerrarSesion();
      const loginAdmin1 = await Auth.iniciarSesion(nombreAdmin, passwordAdmin);
      if (!loginAdmin1) {
        agregarResultado('Login admin (Bloque 1)', false);
        return;
      }
      agregarResultado('Login admin (Bloque 1)', true);

      const usuarioAdmin = Auth.obtenerUsuarioActual();
      await renderTabAdmin(usuarioAdmin, false, 'tab-admin-test');
      const checksAdmin = [...document.querySelectorAll('#tab-admin-test .rol-check input[type="checkbox"]')];
      const rolesAdminUnicos = [...new Set(checksAdmin.map(c => c.dataset.rol))];

      agregarResultado('Admin no ve admin', !rolesAdminUnicos.includes('admin'));
      agregarResultado('Admin no ve master', !rolesAdminUnicos.includes('master'));
      agregarResultado('Admin no ve artista', !rolesAdminUnicos.includes('artista'));
      agregarResultado('Admin ve gerente', rolesAdminUnicos.includes('gerente'));
      agregarResultado('Admin ve cocinaAyudante', rolesAdminUnicos.includes('cocinaAyudante'));
      agregarResultado('Admin ve barraAyudante', rolesAdminUnicos.includes('barraAyudante'));
      agregarResultado('Admin ve mesero', rolesAdminUnicos.includes('mesero'));
      agregarResultado('Admin ve caja', rolesAdminUnicos.includes('caja'));
      agregarResultado('Admin ve repartidor', rolesAdminUnicos.includes('repartidor'));

      await Auth.cerrarSesion();
      const loginMaster2 = await Auth.iniciarSesion('master', 'master123');
      if (!loginMaster2) {
        agregarResultado('Login master (para crear gerente)', false);
        return;
      }
      const nombreGerente = `tge_${Date.now().toString().slice(-8)}`;
      const passwordGerente = 'Pass12345';
      const regGerente = await Auth.registrarUsuario(nombreGerente, passwordGerente);
      if (!regGerente.exito) {
        agregarResultado('Registrar gerente', false, regGerente.error);
        return;
      }

      const staffGerente = await DB.crearOActualizarStaff({
        nombre: 'Gerente Test',
        usuarioId: regGerente.usuarioId,
        espacioId: 'lataberna',
        roles: ['gerente'],
        rolPrincipal: 'gerente',
        estado: 'activo',
        tokenVinculacion: ''
      });
      agregarResultado('Crear staff gerente', !!staffGerente);

      await Auth.cerrarSesion();
      const loginGerente = await Auth.iniciarSesion(nombreGerente, passwordGerente);
      if (!loginGerente) {
        agregarResultado('Login gerente', false);
        return;
      }
      agregarResultado('Login gerente', true);

      const usuarioGerente = Auth.obtenerUsuarioActual();
      await renderTabAdmin(usuarioGerente, false, 'tab-gerente-test');
      const checksGerente = [...document.querySelectorAll('#tab-gerente-test .rol-check input[type="checkbox"]')];
      const rolesGerenteUnicos = [...new Set(checksGerente.map(c => c.dataset.rol))];

      agregarResultado('Gerente no ve admin', !rolesGerenteUnicos.includes('admin'));
      agregarResultado('Gerente no ve master', !rolesGerenteUnicos.includes('master'));
      agregarResultado('Gerente ve mesero', rolesGerenteUnicos.includes('mesero'));
      agregarResultado('Gerente ve caja', rolesGerenteUnicos.includes('caja'));
      agregarResultado('Gerente ve repartidor', rolesGerenteUnicos.includes('repartidor'));
      agregarResultado('Gerente ve cocinaAyudante', rolesGerenteUnicos.includes('cocinaAyudante'));
      agregarResultado('Gerente ve barraAyudante', rolesGerenteUnicos.includes('barraAyudante'));

      // ── Bloque 2: Alta de staff con contraseña temporal ──
      agregarInfo('--- Bloque 2: Alta de staff ---');

      await Auth.cerrarSesion();
      const loginAdmin2 = await Auth.iniciarSesion(nombreAdmin, passwordAdmin);
      if (!loginAdmin2) {
        agregarResultado('Login admin (Bloque 2)', false);
        return;
      }
      agregarResultado('Login admin (Bloque 2)', true);

      const usuarioAdminAlta = Auth.obtenerUsuarioActual();
      await renderTabAdmin(usuarioAdminAlta, false, 'tab-admin-test');

      const btnNuevo = document.querySelector('#tab-admin-test #btnNuevoStaff');
      agregarResultado('Botón Nuevo personal existe', !!btnNuevo);
      btnNuevo.click();
      await esperar(500);

      const modalAlta = await esperarElemento('#altaUsuario');
      agregarResultado('Modal de alta aparece', !!modalAlta);

      const nombreUsuarioAlta = `tpa_${Date.now().toString().slice(-8)}`;
      const nombreVisibleAlta = 'Personal de Prueba';
      modalAlta.value = nombreUsuarioAlta;
      document.querySelector('#altaNombreVisible').value = nombreVisibleAlta;

      const checkMesero = [...document.querySelectorAll('#altaRolesChecks input[type="checkbox"]')]
        .find(c => c.value === 'mesero');
      const checkCaja = [...document.querySelectorAll('#altaRolesChecks input[type="checkbox"]')]
        .find(c => c.value === 'caja');

      agregarResultado('Checkboxes mesero y caja disponibles', !!checkMesero && !!checkCaja);
      checkMesero.checked = true;
      checkMesero.dispatchEvent(new Event('change', { bubbles: true }));
      checkCaja.checked = true;
      checkCaja.dispatchEvent(new Event('change', { bubbles: true }));

      await esperar(300);

      const selectPrincipal = document.querySelector('#altaRolPrincipal');
      const opciones = [...selectPrincipal.options].map(o => o.value);
      agregarResultado('Rol principal incluye mesero', opciones.includes('mesero'));
      agregarResultado('Rol principal incluye caja', opciones.includes('caja'));

      selectPrincipal.value = 'mesero';
      selectPrincipal.dispatchEvent(new Event('change', { bubbles: true }));

      document.querySelector('#btnConfirmarAltaStaff').click();
      agregarInfo('Confirmando alta...');

      const inputPassword = await esperarElemento('#inputPasswordTemporal', 10000);
      agregarResultado('Modal de contraseña temporal aparece', !!inputPassword);
      agregarResultado('Input de contraseña es readonly', inputPassword?.readOnly === true);
      agregarResultado('Contraseña visible no vacía', inputPassword?.value.length > 0);
      agregarResultado('Botón copiar existe', !!document.querySelector('#btnCopiarPasswordTemporal'));

      const modalPassword = inputPassword?.closest('.modal-overlay');
      const textoAdvertencia = modalPassword?.textContent || '';
      agregarResultado('Advertencia de no volver a mostrar', textoAdvertencia.includes('no se volverá a mostrar'));

      document.querySelector('#btnContinuarPasswordTemporal')?.click();

      const staffCreado = await esperarStaffEnLista('tab-admin-test', nombreVisibleAlta, 15000);
      agregarResultado('Staff aparece en la lista', !!staffCreado);

      // ── Bloque 3: Sección Personal completa (master) ──
      agregarInfo('--- Bloque 3: Sección Personal completa ---');

      await Auth.cerrarSesion();
      const loginMaster3 = await Auth.iniciarSesion('master', 'master123');
      if (!loginMaster3) {
        agregarResultado('Login master (Bloque 3)', false);
        return;
      }
      const usuarioMaster2 = Auth.obtenerUsuarioActual();
      const esMasterReal = usuarioMaster2.rolesEfectivos.includes('master');
      await renderTabAdmin(usuarioMaster2, esMasterReal, 'sec-personal-test');

      agregarResultado('Botón nuevo existe', !!document.querySelector('#sec-personal-test #btnNuevoStaff'));
      agregarResultado('Búsqueda existe', !!document.querySelector('#sec-personal-test #buscarPersonalInput'));
      agregarResultado('Lista existe', !!document.querySelector('#sec-personal-test #listaPersonalContainer'));
      agregarResultado(
        'Nota muestra master',
        document.querySelector('#sec-personal-test .nota-privacidad')?.textContent.includes('master')
      );

      // ── Bloque 4: Configuración por espacio ─────────────
      agregarInfo('--- Bloque 4: Configuración por espacio ---');

      const espacioFalso = 'espacio_falso_' + Date.now();
      await DBAppwrite.crear('configuracion', 'unique()', {
        clave: 'global',
        valor: JSON.stringify({ nombreLocal: 'Falso' }),
        espacioId: espacioFalso
      });

      Config.activar();

      const inputNombre = document.getElementById('cfgNombreLocal');
      agregarResultado('Campos de configuración disponibles', !!inputNombre);
      if (inputNombre) {
        inputNombre.value = 'La Taberna Test';
        document.getElementById('cfgDireccion').value = 'Dirección Test';
        document.getElementById('cfgCuit').value = '12345678';
        document.getElementById('cfgPie').value = 'Pie Test';
        document.getElementById('btnGuardarConfig').click();
        await esperar(2000);

        const configs = await DBAppwrite.listar('configuracion');
        const docCorrecto = configs.find(d => d.clave === 'global' && d.espacioId === 'lataberna');
        const docFalso = configs.find(d => d.clave === 'global' && d.espacioId === espacioFalso);

        agregarResultado(
          'Documento con espacio correcto actualizado',
          !!docCorrecto && docCorrecto.valor.includes('La Taberna Test')
        );
        agregarResultado(
          'Documento con espacio falso no fue tocado',
          !!docFalso && docFalso.valor.includes('Falso')
        );

        if (docFalso) await DBAppwrite.eliminar('configuracion', docFalso.id);
        const configsDespues = await DBAppwrite.listar('configuracion');
        const falsoEliminado = !configsDespues.some(d => d.id === docFalso?.id);
        agregarResultado('Documento falso eliminado', falsoEliminado);
      }

      // ── Bloque 5: Despensa ─────────────────────────────
      agregarInfo('--- Bloque 5: Despensa ---');

      const inventarioRepo = crearInventarioRepo();
      InventarioService.configurar(inventarioRepo);

      const nombreInsumoBase = 'Insumo Base Temporal ' + Date.now();
      const insumoBase = await InventarioService.guardarInsumo({
        nombre: nombreInsumoBase,
        stock: 10,
        stock_minimo: 2,
        unidad: 'kg',
        categoria: 'cocina',
        ubicacion: 'Test Base',
        tipo: 'cocina',
        costo_manual: 100
      });

      if (!insumoBase?.exito) {
        agregarResultado('Crear insumo base', false, insumoBase?.error || 'Sin resultado');
        return;
      }
      const insumoBaseId = insumoBase.datos?.id || insumoBase.datos?._id;
      agregarResultado('Crear insumo base', !!insumoBaseId, insumoBaseId);

      Despensa.activar();
      await esperar(500);

      const vistaDespensa = document.getElementById('view-despensa');
      agregarResultado('Vista despensa creada', !!vistaDespensa && !!vistaDespensa.querySelector('.main-layout'));

      const panelTabs = document.querySelectorAll('#view-despensa .panel-tab');
      agregarResultado('Dos pestañas panel izquierdo', panelTabs.length === 2);
      agregarResultado('Pestaña proveedores activa', panelTabs[0]?.classList.contains('activo'));

      const centralTabs = document.querySelectorAll('#view-despensa .central-tab');
      agregarResultado('Dos pestañas centrales', centralTabs.length === 2);

      const searchInput = document.getElementById('inventarioSearch');
      agregarResultado('Input de búsqueda existe', !!searchInput);
      if (searchInput) {
        searchInput.value = 'insumo base';
        searchInput.dispatchEvent(new Event('input', { bubbles: true }));
        await esperar(300);
        agregarResultado('Búsqueda no rompe render', !!document.getElementById('espaciosContainer'));
        searchInput.value = '';
        searchInput.dispatchEvent(new Event('input', { bubbles: true }));
        await esperar(200);
      }

      const inputCompra = document.getElementById('inputCompra');
      const btnAddCompra = document.getElementById('btnAddCompra');
      agregarResultado('Input lista de compras existe', !!inputCompra && !!btnAddCompra);
      if (inputCompra && btnAddCompra) {
        inputCompra.value = 'Item Temporal Test';
        btnAddCompra.click();
        await esperar(300);
        const listaCompras = document.getElementById('listaCompras');
        const itemAgregado = listaCompras?.textContent.includes('Item Temporal Test');
        agregarResultado('Item agregado a lista', itemAgregado);

        if (itemAgregado) {
          const btnQuitar = await esperarElemento('#listaCompras .btn-quitar[data-item="Item Temporal Test"]');
          if (btnQuitar) {
            btnQuitar.click();
            await esperar(300);
            const itemQuitado = !document.getElementById('listaCompras')?.textContent.includes('Item Temporal Test');
            agregarResultado('Item quitado de lista', itemQuitado);
          } else {
            agregarResultado('Botón quitar encontrado', false);
          }
        }
      }

      const btnNuevoProveedor = document.getElementById('btnNuevoProveedor');
      agregarResultado('Botón nuevo proveedor existe', !!btnNuevoProveedor);
      if (btnNuevoProveedor) {
        btnNuevoProveedor.click();
        await esperar(300);
        const modalProv = await esperarElemento('#modalProveedor');
        agregarResultado('Modal proveedor abre', !!modalProv && modalProv.style.display === 'flex');

        if (modalProv) {
          const nombreProv = 'Proveedor Temporal ' + Date.now();
          document.getElementById('provNombre').value = nombreProv;
          document.getElementById('provTipo').value = 'distribuidor';
          document.getElementById('provContacto').value = 'Contacto Temporal';
          document.getElementById('provTelefono').value = '+56912345678';
          document.getElementById('provEmail').value = 'prov@test.cl';
          document.getElementById('provRubro').value = 'Test';
          document.getElementById('btnGuardarModalProv').click();
          await esperar(1000);

          const listaProv = await DBAppwrite.listar('proveedores');
          const creado = listaProv.find(p => p.nombre === nombreProv);
          agregarResultado('Proveedor creado en Appwrite', !!creado);
          if (creado) {
            await DBAppwrite.eliminar('proveedores', creado.id);
            agregarResultado('Proveedor temporal eliminado', true);
          }
        }
      }

      const btnNuevoProducto = document.getElementById('btnNuevoProducto');
      agregarResultado('Botón nuevo producto existe', !!btnNuevoProducto);
      if (btnNuevoProducto) {
        btnNuevoProducto.click();
        await esperar(300);
        const modalInsumo = await esperarElemento('#modalInsumo');
        agregarResultado('Modal insumo abre', !!modalInsumo && modalInsumo.style.display === 'flex');

        if (modalInsumo) {
          const nombreInsumo = 'Insumo Temporal ' + Date.now();
          document.getElementById('insumoNombre').value = nombreInsumo;
          document.getElementById('insumoCategoria').value = 'cocina';
          document.getElementById('insumoTipo').value = 'cocina';
          document.getElementById('insumoStock').value = '10';
          document.getElementById('insumoStockMin').value = '2';
          document.getElementById('insumoUnidad').value = 'kg';
          document.getElementById('insumoUbicacion').value = 'Test';
          document.getElementById('insumoCostoManual').value = '100';
          document.getElementById('btnGuardarModalInsumo').click();
          await esperar(1000);

          const listaIns = await DBAppwrite.listar('insumos');
          const creadoIns = listaIns.find(i => i.nombre === nombreInsumo);
          agregarResultado('Insumo creado en Appwrite', !!creadoIns);
          if (creadoIns) {
            await DBAppwrite.eliminar('insumos', creadoIns.id);
            agregarResultado('Insumo temporal eliminado', true);
          }
        }
      }

      if (insumoBaseId) {
        await DBAppwrite.eliminar('insumos', insumoBaseId);
        agregarResultado('Insumo base eliminado', true);
      }

      // ── Bloque 6: Perfil ───────────────────────────────
      agregarInfo('--- Bloque 6: Perfil ---');

      await Auth.cerrarSesion();
      const loginAdminPerfil = await Auth.iniciarSesion(nombreAdmin, passwordAdmin);
      if (!loginAdminPerfil) {
        agregarResultado('Login admin (Perfil)', false);
        return;
      }
      agregarResultado('Login admin (Perfil)', true);

      Perfil.activar();
      await esperar(500);

      const vistaPerfil = document.getElementById('view-perfil');
      agregarResultado('Vista perfil creada', !!vistaPerfil && !!vistaPerfil.querySelector('.main-layout'));
      agregarResultado('Header perfil existe', !!document.querySelector('#view-perfil .perfil-header'));
      agregarResultado('Panel izquierdo existe', !!document.getElementById('panelIzquierdoPerfil'));
      agregarResultado('Panel derecho existe', !!document.getElementById('panelDerechoPerfil'));

      const idCard = document.getElementById('perfilIdCard');
      agregarResultado('ID card existe', !!idCard);
      agregarResultado('Nombre visible en ID card', idCard?.textContent.includes(nombreAdmin));

      const modoVitrina = document.getElementById('modoVitrinaPerfil');
      const modoEdicion = document.getElementById('modoEdicionPerfil');
      agregarResultado('Modo vitrina visible', modoVitrina && modoVitrina.style.display !== 'none');
      agregarResultado('Modo edición oculto', modoEdicion && (modoEdicion.style.display === 'none' || !modoEdicion.style.display));

      const btnEditarPerfil = document.getElementById('btnEditarPerfil');
      agregarResultado('Botón editar perfil existe', !!btnEditarPerfil);
      if (btnEditarPerfil) {
        btnEditarPerfil.click();
        await esperar(300);
        agregarResultado('Modo edición visible tras clic', modoEdicion && modoEdicion.style.display !== 'none');
        agregarResultado('Modo vitrina oculto tras clic', modoVitrina && modoVitrina.style.display === 'none');
      }

      const tabs = document.querySelectorAll('#view-perfil .central-tab');
      const tabsVisibles = [...tabs].filter(t => t.classList.contains('visible'));
      agregarResultado('Pestañas visibles existentes', tabsVisibles.length >= 3);

      const tabPublico = document.querySelector('#view-perfil .central-tab[data-tab="publico"]');
      agregarResultado('Pestaña pública activa por defecto', tabPublico?.classList.contains('activo'));

      const inputApodo = document.getElementById('editarApodo');
      if (inputApodo) {
        inputApodo.value = 'Apodo Temporal';
        const btnGuardarPublico = document.getElementById('btnGuardarPerfilPublico');
        if (btnGuardarPublico) {
          btnGuardarPublico.click();
          await esperar(300);
          agregarResultado('Apodo guardado sin errores', true);
        }
      }

      const tabPrefs = document.querySelector('#view-perfil .central-tab[data-tab="preferencias"]');
      if (tabPrefs) {
        tabPrefs.click();
        await esperar(300);
        agregarResultado('Pestaña preferencias activada', document.getElementById('tab-preferencias')?.classList.contains('activo'));
      }

      const tabAdmin = document.querySelector('#view-perfil .central-tab[data-tab="admin"]');
      agregarResultado('Pestaña admin visible', tabAdmin?.classList.contains('visible'));
      if (tabAdmin) {
        tabAdmin.click();
        await esperar(500);
        const tabAdminContent = document.getElementById('tab-admin');
        agregarResultado('Pestaña admin activa', tabAdminContent?.classList.contains('activo'));
        agregarResultado('Botón nuevo staff en pestaña admin', !!tabAdminContent?.querySelector('#btnNuevoStaff'));
        agregarResultado('Lista personal en pestaña admin', !!tabAdminContent?.querySelector('#listaPersonalContainer'));
      }

      const btnVolver = document.getElementById('btnVolverVitrina');
      if (btnVolver) {
        btnVolver.click();
        await esperar(300);
        agregarResultado('Volver a vitrina funciona', modoVitrina && modoVitrina.style.display !== 'none');
      }

      // ── Bloque 7: Limpieza de huella ───────────────────
      agregarInfo('--- Bloque 7: Limpieza de huella ---');

      await Auth.cerrarSesion();
      const loginMasterFinal = await Auth.iniciarSesion('master', 'master123');
      if (!loginMasterFinal) {
        agregarResultado('Login master final', false);
        return;
      }

      const staffActual = await DB.obtenerStaffPorEspacio('lataberna');
      const staffAlta = staffActual.find(s => s.nombre === nombreVisibleAlta);
      const staffAdminActual = staffActual.find(s => s.id === staffAdmin?.id);
      const staffGerenteActual = staffActual.find(s => s.id === staffGerente?.id);

      if (staffAlta?.id) await DBAppwrite.eliminar('staff', staffAlta.id);
      if (staffAdminActual?.id) await DBAppwrite.eliminar('staff', staffAdminActual.id);
      if (staffGerenteActual?.id) await DBAppwrite.eliminar('staff', staffGerenteActual.id);

      const staffDespues = await DB.obtenerStaffPorEspacio('lataberna');
      agregarResultado('Staff de alta eliminado', !staffDespues.some(s => s.nombre === nombreVisibleAlta));
      agregarResultado('Staff admin temporal eliminado', !staffDespues.some(s => s.id === staffAdmin?.id));
      agregarResultado('Staff gerente temporal eliminado', !staffDespues.some(s => s.id === staffGerente?.id));

      // ── Resumen final ─────────────────────────────────
      const total = resultados.length;
      const pasaron = resultados.filter(r => r.ok).length;
      const fallaron = total - pasaron;

      const resumen = document.createElement('div');
      resumen.style.marginTop = '12px';
      resumen.className = fallaron === 0 ? 'log-positivo' : 'log-error';
      resumen.innerHTML = `<strong>Resumen:</strong> ${pasaron} correctos, ${fallaron} fallidos.`;
      log.appendChild(resumen);

      Logger.info(`[test-D-unificado] Finalizado. ${pasaron}/${total} correctos.`);
    }

    window.addEventListener('load', () => run().catch(e => {
      log.innerHTML += `<div class="log-error">Error: ${e.message}</div>`;
      console.error(e);
    }));
  </script>
</body>
</html>
