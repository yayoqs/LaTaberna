<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Test Integral Rotativo — La Taberna (ES6) v2.2</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f0f14; color: #f1f5f9; padding: 20px; }
        h1 { color: #f59e0b; }
        .suite { margin: 20px 0; border-top: 1px solid #2e2e42; padding-top: 10px; }
        .suite h2 { font-size: 1.1rem; }
        .test { margin: 4px 0; padding: 4px 8px; border-radius: 4px; }
        .pass { background: rgba(34,197,94,.2); }
        .fail { background: rgba(239,68,68,.2); }
        .info { color: #94a3b8; font-size: 13px; }
        .summary { margin-top: 24px; font-weight: bold; font-size: 1.1rem; }
    </style>
</head>
<body>
    <h1>🧪 Test Integral Rotativo — La Taberna (ES6) v2.2</h1>
    <p class="info">Flujo completo: cliente → staff → cocina/barra → administración → dinero.</p>
    <p class="info">Ejecutar localmente con un servidor que soporte módulos ES6.</p>

    <div id="toastContainer" class="toast-container" aria-live="polite"></div>
    <div id="results"></div>

    <script type="module">
        import { Logger } from '../js/lib/logger.js';
        import { EventBus } from '../js/lib/eventBus.js';
        import { Store } from '../js/lib/store.js';
        import { CommandBus } from '../js/lib/command-bus.js';
        import { DB } from '../js/db.js';
        import { DBAppwrite } from '../js/db-appwrite.js';
        import { Auth } from '../js/auth.js';
        import { Mesas } from '../js/ui/mesas.js';
        import { Comanda } from '../js/ui/comanda.js';
        import { Carta } from '../js/ui/carta.js';
        import { Pedido } from '../js/ui/pedido-ui.js';
        import { KDS } from '../js/ui/kds.js';
        import { Caja } from '../js/ui/caja.js';
        import { Cobro } from '../js/ui/cobro.js';
        import { PrecargaControl } from '../js/modulos/interno/precarga-control.js';
        import { Recetas } from '../js/ui/recetas.js';
        import { Despensa } from '../js/ui/despensa.js';
        import { EventosEnVivo } from '../js/modulos/admin/eventos-en-vivo.js';
        import { PantallaInicio } from '../js/modulos/cliente/pantalla-inicio.js';
        import { PantallaBienvenida } from '../js/modulos/cliente/pantalla-bienvenida.js';
        import { MenuDigital } from '../js/modulos/cliente/menu-digital.js';
        import { Orden } from '../js/modulos/cliente/orden.js';
        import { PantallaEventos } from '../js/modulos/cliente/pantalla-eventos.js';

        const resultsEl = document.getElementById('results');
        let passed = 0, failed = 0;

        function assert(condition, msg) {
            if (condition) { passed++; resultsEl.innerHTML += '<div class="test pass">✔ ' + msg + '</div>'; }
            else { failed++; resultsEl.innerHTML += '<div class="test fail">✘ ' + msg + '</div>'; }
        }
        const esperar = ms => new Promise(resolve => setTimeout(resolve, ms));

        function resetDB() {
            DB.config = { zonas: [{ nombre: 'salon', cantidad: 5 }] };
            DB.mozos = [{ id: 'm1', nombre: 'Carlos', activo: true }];
            DB.mesas = [];
            for (let i = 1; i <= 5; i++) {
                DB.mesas.push({ numero: i, estado: 'libre', zona: 'salon', items: [], mozo: '', comensales: 1, pedidoId: null, permite_prepedidos: false, esVirtual: false });
            }
            DB.mesas.push({ numero: 0, nombre: 'barra', estado: 'libre', zona: 'barra', items: [], mozo: '', comensales: 0, pedidoId: null, permite_prepedidos: false, esVirtual: true });
            DB.pedidos = [];
            DB.comandas = [];
            DB.productos = [
                { id: 'prod_1', nombre: 'Hamburguesa', precio: 1500, categoria: 'platos', destino: 'cocina', disponible: true, activo: true },
                { id: 'prod_2', nombre: 'Cerveza', precio: 800, categoria: 'bebidas', destino: 'barra', disponible: true, activo: true },
                { id: 'prod_3', nombre: 'Nachos', precio: 1200, categoria: 'entradas', destino: 'cocina', disponible: false, activo: true }
            ];
            DB.ingredientes = [
                { id: 'ing_pan', nombre: 'Pan', unidad: 'u', stock: 10, stock_minimo: 2 },
                { id: 'ing_carne', nombre: 'Carne', unidad: 'g', stock: 2000, stock_minimo: 500 },
                { id: 'ing_queso', nombre: 'Queso', unidad: 'feta', stock: 1, stock_minimo: 5 }
            ];
            DB.recetas = [{
                productoId: 'prod_1',
                ingredientes: [
                    { ingredienteId: 'ing_pan', cantidad: 2 },
                    { ingredienteId: 'ing_carne', cantidad: 200 },
                    { ingredienteId: 'ing_queso', cantidad: 1 }
                ],
                instrucciones: 'Armar y cocinar'
            }];
            DB.saveMesas = DB.savePedidos = DB.saveComandas = DB.saveRecetas = DB.saveConfig = () => {};
            DB.getMesa = num => DB.mesas.find(m => m.numero == num);
            DB.eventos_en_vivo = [];

            // Mock de DBAppwrite
            if (!DBAppwrite._mockActivo) {
                DBAppwrite.crear = async (coleccion, id, datos) => ({ id: id === 'unique()' ? 'doc_' + Date.now() : id, ...datos });
                DBAppwrite.actualizar = async (coleccion, id, datos) => ({ id, ...datos });
                DBAppwrite.eliminar = async () => true;
                DBAppwrite.listar = async () => [];
                DBAppwrite._mockActivo = true;
            }

            // Mock de Auth.getAppwriteUserId
            Auth.getAppwriteUserId = async () => 'user_test_123';

            // Mock de window.confirm
            window.confirm = () => true;

            // Mock de CommandBus
            CommandBus.ejecutar = async (comando) => {
                if (comando.type === 'crearPedidoMesa') {
                    const mesa = DB.mesas.find(m => m.numero == comando.datos.numeroMesa);
                    if (mesa) { mesa.estado = 'ocupada'; mesa.pedidoId = 'ped_test'; mesa.mozo = comando.datos.mozo || 'Carlos'; mesa.permite_prepedidos = true; }
                    return { exito: true, data: { id: 'ped_test' } };
                }
                if (comando.type === 'enviarComanda') {
                    const c = { id: 'kds_' + Date.now(), mesa: comando.datos.mesa.numero, items: comando.datos.itemsPendientes, estado: 'nueva', ts: Date.now(), mozo: comando.datos.mozo || 'Mozo', destino: comando.datos.itemsPendientes[0]?.destino || 'cocina', observaciones: comando.datos.observaciones || '' };
                    DB.comandas.push(c);
                    return { exito: true, data: c };
                }
                if (comando.type === 'completarSubcomanda') return { exito: true, data: { ambasListas: true } };
                if (comando.type === 'precarga:revisar') return { exito: true };
                if (comando.type === 'liberarMesa') {
                    const mesa = DB.mesas.find(m => m.numero == comando.datos.numeroMesa);
                    if (mesa) { mesa.estado = 'libre'; mesa.items = []; mesa.pedidoId = null; }
                    return { exito: true };
                }
                if (comando.type === 'agregarMesa') {
                    const nueva = { numero: comando.datos.numero, estado: 'libre', zona: comando.datos.zona, items: [], mozo: '', comensales: 1, pedidoId: null, permite_prepedidos: false, esVirtual: false };
                    DB.mesas.push(nueva);
                    return { exito: true, data: nueva };
                }
                if (comando.type === 'producto:marcar_agotado') {
                    const prod = DB.productos.find(p => p.id === comando.datos.prodId);
                    if (prod) prod.disponible = false;
                    return { exito: true };
                }
                return { exito: false, error: 'Comando no mockeado' };
            };

            // Sincronizar Store con DB
            const _originalGetState = Store.getState.bind(Store);
            Store.getState = function() {
                const state = _originalGetState();
                state.mesas = DB.mesas;
                state.productos = DB.productos;
                state.recetas = DB.recetas;
                state.ingredientes = DB.ingredientes;
                state.comandas = DB.comandas;
                state.config = DB.config;
                state.eventos_en_vivo = DB.eventos_en_vivo || [];
                state.pedidos = DB.pedidos;
                state.pedidosDelivery = DB.pedidosDelivery || [];
                state.cliente = state.cliente || { permitePrepedidos: false, mesa: null };
                return state;
            };

            // Mock de Store.dispatch para procesar COMANDA_ITEM_AGREGAR sobre DB.mesas
            const _originalDispatch = Store.dispatch.bind(Store);
            Store.dispatch = function(action) {
                if (action.type === 'COMANDA_ITEM_AGREGAR') {
                    const mesa = DB.mesas.find(m => m.numero === action.payload.numeroMesa);
                    if (mesa) {
                        const item = action.payload.item;
                        const existente = mesa.items.find(it =>
                            it.prodId === item.prodId && !it.enviado && it.persona === (item.persona || 'General')
                        );
                        if (existente) existente.qty++;
                        else mesa.items.push({ ...item, qty: 1 });
                    }
                }
                _originalDispatch(action);
            };
        }

        function limpiarDOM() {
            document.querySelectorAll('.modal-overlay, .view, .orden-panel, .guia-mesero-overlay').forEach(el => el.remove());
            const popover = document.getElementById('popoverContainer');
            if (popover) popover.innerHTML = '';
            const tc = document.getElementById('toastContainer');
            if (tc) tc.innerHTML = '';
        }

        // ════════════════════════════════════════════════
        // SUITE 1: CLIENTE
        // ════════════════════════════════════════════════
        async function suiteCliente() {
            resultsEl.innerHTML += '<div class="suite"><h2>1. Flujo del Cliente</h2></div>';
            resetDB();
            limpiarDOM();
            Store.dispatch({ type: 'MESAS_INICIALIZAR', payload: DB.mesas });

            const vistaInicio = PantallaInicio.render();
            PantallaInicio.mostrar();
            assert(vistaInicio.id === 'view-inicio', 'Pantalla de inicio renderizada');
            assert(vistaInicio.querySelector('.login-corner') !== null, 'Triángulo de acceso presente');

            PantallaInicio.ocultar();
            await Auth.login('cliente', 'cliente');
            EventBus.emit('app:cambiarVista', 'bienvenida');
            let vistaBienvenida = document.getElementById('view-bienvenida');
            if (!vistaBienvenida) { PantallaBienvenida.render(); PantallaBienvenida.mostrar(); vistaBienvenida = document.getElementById('view-bienvenida'); }
            else PantallaBienvenida.mostrar();
            assert(vistaBienvenida.classList.contains('active'), 'Bienvenida activa');

            document.getElementById('inputMesa').value = 5;
            document.getElementById('btnGuardarMesa').click();
            await esperar(80);
            assert(PantallaBienvenida.obtenerMesa() === 5, 'Mesa 5 vinculada');
            assert(document.getElementById('cardIngresoMesa').style.display === 'none', 'Tarjeta ingreso oculta');
            assert(document.getElementById('cardEspera').style.display === 'block', 'Tarjeta espera visible');

            DB.mesas[4].permite_prepedidos = true;
            EventBus.emit('mesas:actualizada', { numero: 5, estado: 'ocupada' });
            await esperar(80);
            assert(PantallaBienvenida.permitePrepedidos() === true, 'permitePrepedidos true');

            document.getElementById('cardGastronomica').click();
            MenuDigital.render();
            MenuDigital.mostrar();
            await esperar(80);
            const vistaMenu = document.getElementById('view-menu-digital');
            assert(vistaMenu && vistaMenu.classList.contains('active'), 'Menú digital activo');
            assert(document.getElementById('menuDigitalGrid').innerHTML.includes('Hamburguesa'), 'Producto Hamburguesa visible');

            const btnHamburguesa = Array.from(document.querySelectorAll('.btn-agregar-orden:not(.btn-deshabilitado)')).find(b => b.dataset.nombre === 'Hamburguesa');
            assert(!!btnHamburguesa, 'Botón de Hamburguesa disponible');
            btnHamburguesa.click();
            assert(Orden.obtenerItems().length === 1, '1 ítem en orden');
            assert(Orden.obtenerTotal() === 1500, 'Total correcto');

            document.getElementById('btnToggleOrden').click();
            await esperar(50);
            await document.getElementById('btnConfirmarOrden').click();
            await esperar(200);
            assert(Orden.obtenerItems().length === 0, 'Orden vacía tras confirmar');
            assert(Orden.obtenerTotal() === 0, 'Total en 0');

            MenuDigital.ocultar();
            PantallaBienvenida.mostrar();
            document.getElementById('cardEntretenimiento').click();
            PantallaEventos.render();
            PantallaEventos.mostrar();
            await esperar(500);
            assert(document.getElementById('view-eventos-cliente').classList.contains('active'), 'Eventos activa');
            assert(document.getElementById('eventosContenido').innerHTML.includes('No hay eventos activos'), 'Sin eventos activos');

            DB.eventos_en_vivo = [{ id: 'evt_1', tipo: 'votacion', estado: 'activo', titulo: 'Mejor canción', opciones: [{ nombre: 'Opción A' }, { nombre: 'Opción B' }], resultados: {} }];
            Store.dispatch({ type: 'EVENTOS_INICIALIZAR', payload: DB.eventos_en_vivo });
            EventBus.emit('eventos_en_vivo:actualizada', {});
            await esperar(500);
            assert(document.getElementById('eventosContenido').innerHTML.includes('Mejor canción'), 'Evento votación visible');
            const btnVoto = document.querySelector('.votacion-opcion');
            btnVoto.click();
            assert(btnVoto.classList.contains('seleccionada'), 'Voto seleccionado');

            Auth.logout();
            EventBus.emit('app:cambiarVista', 'inicio');
            PantallaInicio.mostrar();
            assert(document.getElementById('view-inicio').classList.contains('active'), 'Inicio activa al cerrar sesión');

            limpiarDOM();
        }

        // ════════════════════════════════════════════════
        // SUITE 2: STAFF (Garzón/Mesero)
        // ════════════════════════════════════════════════
        async function suiteStaff() {
            resultsEl.innerHTML += '<div class="suite"><h2>2. Staff (Garzón/Mesero)</h2></div>';
            resetDB();
            limpiarDOM();
            await Auth.login('admin', 'admin123');
            Store.dispatch({ type: 'MESAS_INICIALIZAR', payload: DB.mesas });

            const mainMesas = document.createElement('main');
            mainMesas.id = 'view-mesas';
            mainMesas.className = 'view active';
            mainMesas.innerHTML = '<div id="mesasGrid"></div><div id="popoverContainer"></div>';
            document.body.appendChild(mainMesas);
            Mesas.render();
            await esperar(80);
            assert(document.querySelectorAll('.mesa-card').length >= 5, 'El mapa de mesas tiene al menos 5 tarjetas');

            EventBus.emit('cliente:mesa_ingresada', { mesa: 5 });
            await esperar(80);
            assert(document.querySelectorAll('.esperando-cliente-badge').length === 1, 'Aparece insignia de cliente esperando en mesa 5');

            const mesa5 = DB.mesas[4];
            await Pedido._confirmarApertura(5);
            await esperar(200);
            assert(mesa5.estado === 'ocupada' && mesa5.permite_prepedidos === true, 'Mesa en estado ocupada y permite prepedidos');
            Mesas.render();
            await esperar(80);
            assert(document.querySelectorAll('.esperando-cliente-badge').length === 0, 'Insignia de espera desaparece al abrir la mesa');

            const modalPedido = document.getElementById('modalPedido');
            if (modalPedido) modalPedido.style.display = 'none';
            Comanda.setMesaActiva(mesa5);
            EventBus.emit('cliente:precarga_enviada', {
                id: 'pre_123', mesa: 5,
                items: [{ prodId: 'prod_1', nombre: 'Hamburguesa', precio: 1500, categoria: 'platos', destino: 'cocina', qty: 2, obs: '' }],
                clienteId: 'Diego', id_usuario: 'user_abc', nombre_comensal: 'Diego', timestamp: Date.now()
            });
            await esperar(100);
            const badgePrecarga = document.querySelector('.precarga-badge');
            assert(!!badgePrecarga, 'Badge de precarga aparece en mesa 5');
            if (badgePrecarga) { badgePrecarga.click(); await esperar(150); }
            assert(mesa5.items.length > 0, 'Ítems cargados en la comanda desde la precarga');
            assert(!document.querySelector('.precarga-badge'), 'Badge de precarga desaparece después de cargar');

            const tarjetaMesa5 = document.querySelector('.mesa-card');
            tarjetaMesa5.dispatchEvent(new MouseEvent('mousedown', { bubbles: true }));
            await esperar(500);
            tarjetaMesa5.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
            await esperar(100);
            const popover = document.querySelector('#popoverContainer div');
            assert(!!popover, 'Popover aparece tras long-press');
            if (popover) { const btnCerrar = popover.querySelector('button'); if (btnCerrar) btnCerrar.click(); }

            Auth.logout();
            limpiarDOM();
        }

        // ════════════════════════════════════════════════
        // SUITE 3: COCINA / BARRA (KDS)
        // ════════════════════════════════════════════════
        async function suiteCocina() {
            resultsEl.innerHTML += '<div class="suite"><h2>3. Cocina / Barra (KDS)</h2></div>';
            resetDB();
            limpiarDOM();
            await Auth.login('admin', 'admin123');
            const mainKds = document.createElement('main');
            mainKds.id = 'view-cocina';
            mainKds.className = 'view';
            mainKds.innerHTML = '<div id="cocinaKDS" class="kds-grid"></div>';
            document.body.appendChild(mainKds);

            DB.comandas = [{
                id: 'com_ambos', mesa: 5, destino: 'ambos',
                items: [
                    { prodId: 'prod_1', nombre: 'Hamburguesa', qty: 1, destino: 'cocina' },
                    { prodId: 'prod_2', nombre: 'Cerveza', qty: 2, destino: 'barra' }
                ],
                estado: 'nueva', ts: Date.now(), mozo: 'Carlos', observaciones: 'Combo'
            }];
            Store.dispatch({ type: 'COMANDA_AGREGADA', payload: DB.comandas[0] });
            KDS.refresh();
            await esperar(80);

            assert(!!document.getElementById('kds-com_ambos_cocina'), 'Tarjeta virtual de cocina visible');
            assert(!!document.getElementById('kds-com_ambos_barra'), 'Tarjeta virtual de barra visible');
            assert(!document.getElementById('kds-com_ambos'), 'La comanda original no se renderiza');

            await Auth.login('cocina', 'cocina');
            KDS.refresh();
            await esperar(80);
            assert(!document.getElementById('kds-com_ambos_barra'), 'Con rol cocina, la virtual de barra se oculta');
            await Auth.login('admin', 'admin123');

            KDS.refresh();
            await esperar(80);
            const botonPanico = document.querySelector('.kds-panico-btn');
            if (botonPanico) {
                botonPanico.click();
                await esperar(100);
                const producto = DB.productos.find(p => p.id === 'prod_1');
                assert(producto.disponible === false, 'Botón de pánico marcó el producto como agotado');
            }

            DB.comandas.push({
                id: 'com_urg', mesa: 5, destino: 'cocina',
                items: [{ prodId: 'prod_1', nombre: 'Hamburguesa', qty: 1, destino: 'cocina' }],
                estado: 'nueva', ts: Date.now() - 20 * 60 * 1000, mozo: 'Carlos', observaciones: ''
            });
            KDS.refresh();
            await esperar(80);
            assert(!!document.querySelector('.kds-time.urgente'), 'Comanda de 20 min muestra clase urgente');

            Auth.logout();
            if (mainKds) mainKds.remove();
            limpiarDOM();
        }

        // ════════════════════════════════════════════════
        // SUITE 4: ADMINISTRACIÓN
        // ════════════════════════════════════════════════
        async function suiteAdmin() {
            resultsEl.innerHTML += '<div class="suite"><h2>4. Administración (Recetas / Despensa / Eventos)</h2></div>';
            resetDB();
            limpiarDOM();
            await Auth.login('admin', 'admin123');

            EventBus.emit('vista:cambiada', 'despensa');
            await esperar(150);
            Despensa.render();
            await esperar(400);
            const vistaDespensa = document.getElementById('view-despensa');
            assert(!!vistaDespensa, 'Despensa: vista creada');
            assert(document.getElementById('alertasStockList').innerHTML.includes('Queso'), 'Despensa: alerta de Queso bajo mínimo');

            await Auth.login('cocina', 'cocina');
            Recetas.render('consulta');
            await esperar(300);
            const vistaRecetas = document.getElementById('view-recetas');
            assert(!!vistaRecetas, 'Recetas: vista de consulta creada');
            assert(document.getElementById('btnNuevaReceta').style.display === 'none', 'Recetas: botón Nueva Receta oculto');
            assert(document.querySelector('.receta-card').textContent.includes('Hamburguesa'), 'Recetas: nombre del producto visible');
            await Auth.login('admin', 'admin123');

            if (typeof EventosEnVivo !== 'undefined') {
                EventBus.emit('vista:cambiada', 'eventos-en-vivo');
                await esperar(300);
                assert(!!document.getElementById('view-eventos-en-vivo'), 'Eventos: panel del animador creado');
                document.getElementById('selTipoEvento').value = 'votacion';
                await EventosEnVivo.crearEvento();
                await esperar(150);
                assert(document.getElementById('estadoEvento').textContent.includes('votacion'), 'Eventos: badge muestra votación');
                await EventosEnVivo.cambiarEstado('activo');
                await esperar(150);
                assert(!!document.getElementById('nuevaOpcion'), 'Eventos: campo de nueva opción visible');
                document.getElementById('nuevaOpcion').value = 'Opción A';
                await EventosEnVivo.agregarOpcion();
                await esperar(150);
                document.getElementById('nuevaOpcion').value = 'Opción B';
                await EventosEnVivo.agregarOpcion();
                await esperar(150);
                document.getElementById('view-eventos-en-vivo').style.display = 'none';
            }

            Auth.logout();
            if (vistaDespensa) vistaDespensa.style.display = 'none';
            if (vistaRecetas) vistaRecetas.style.display = 'none';
            limpiarDOM();
        }

        // ════════════════════════════════════════════════
        // SUITE 5: FLUJO DE DINERO
        // ════════════════════════════════════════════════
        async function suiteDinero() {
            resultsEl.innerHTML += '<div class="suite"><h2>5. Flujo de Dinero</h2></div>';
            resetDB();
            limpiarDOM();
            await Auth.login('admin', 'admin123');

            const pedido = {
                id: 'ped_001', mesa: 5, estado: 'activa',
                items: [{ prodId: 'prod_1', nombre: 'Hamburguesa', precio: 1500, qty: 2 }, { prodId: 'prod_2', nombre: 'Cerveza', precio: 800, qty: 1 }],
                total: 3800, formaPago: 'efectivo'
            };
            DB.pedidos.push(pedido);
            assert(pedido.total === 3800, 'Total calculado correctamente');

            pedido.estado = 'cerrada';
            DB.pedidos[0] = pedido;
            assert(DB.pedidos[0].estado === 'cerrada', 'Pedido cerrado');
            assert(DB.pedidos[0].total === 3800, 'Total final registrado');

            Caja.render();
            await esperar(80);
            assert(!!document.getElementById('view-caja'), 'Caja se renderiza sin errores');
            document.getElementById('view-caja').remove();

            Auth.logout();
            limpiarDOM();
        }

        // ════════════════════════════════════════════════
        // EJECUCIÓN SECUENCIAL
        // ════════════════════════════════════════════════
        try {
            await Auth._cargarUsuarios();
            await suiteCliente();
            await suiteStaff();
            await suiteCocina();
            await suiteAdmin();
            await suiteDinero();
        } catch (e) {
            resultsEl.innerHTML += '<div class="test fail">✘ Error global: ' + e.message + '</div>';
            console.error(e);
            failed++;
        }

        resultsEl.innerHTML += '<div class="summary">' + passed + ' pasaron, ' + failed + ' fallaron</div>';
        if (failed === 0) resultsEl.innerHTML += '<div class="test pass">✔ Todos los flujos implementados funcionan correctamente.</div>';
    </script>
</body>
</html>
