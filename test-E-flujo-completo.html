<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Test Integral — La Taberna (v1.0.7 — Módulos D Reales)</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f0f14; color: #f1f5f9; padding: 20px; }
        h1 { color: #f59e0b; }
        .suite { margin: 20px 0; border-top: 1px solid #2e2e42; padding-top: 10px; }
        .suite h2 { font-size: 1.1rem; }
        .test { margin: 4px 0; padding: 4px 8px; border-radius: 4px; }
        .pass { background: rgba(34,197,94,.2); }
        .fail { background: rgba(239,68,68,.2); }
        .pending { background: rgba(245,158,11,.2); }
        .info { color: #94a3b8; font-size: 13px; }
        .summary { margin-top: 24px; font-weight: bold; font-size: 1.1rem; }
    </style>
</head>
<body>
    <h1>🧪 Test Integral — La Taberna (v1.0.7 — Módulos D Reales)</h1>
    <p class="info">Flujo completo: cliente → staff → cocina/barra → administración → dinero → basura (pendiente).</p>
    <div id="results"></div>

    <!-- Mocks tempranos -->
    <script>
        window.DBInventario = { validarStockParaItems: function() { return { ok: true, faltantes: [] }; } };
        window.DBFusion = { fusionarMesas: function() { return null; }, liberarMesasFusionadas: function() {} };
        window.Auth = {
            getNombre: function() { return 'Diego Cliente'; },
            esCliente: function() { return true; },
            getUsuarioActual: function() { return { nombre: 'Diego Cliente', rol: 'cliente' }; },
            getAppwriteUserId: async function() { return 'user_abc123'; },
            mostrarLogin: function() {},
            login: async function() { return true; },
            registrarCliente: async function() { return { exito: true, nombre: 'Nuevo' }; },
            logout: function() { window.App.showView('inicio'); },
            getRol: function() { return 'admin'; },
            esAdmin: function() { return true; },
            puede: function() { return true; }
        };
        window.showToast = function() {};
        window.confirm = function() { return true; };
        window.fmtMoney = function(val) { return '$' + val.toLocaleString('es-CL'); };
    </script>

    <!-- Dependencias legacy del núcleo -->
    <script src="/js/utils.js"></script>
    <script src="/js/lib/logger.js"></script>
    <script src="/js/lib/eventBus.js"></script>
    <script src="/js/lib/store.js"></script>
    <script src="/js/lib/command-bus.js"></script>
    <script src="/js/lib/deps.js"></script>
    <script src="/js/db-core.js"></script>
    <script src="/js/db-appwrite.js"></script>
    <script src="/js/db.js"></script>

    <!-- Módulos del Frontend Interno -->
    <script src="/js/ui/mesas.js"></script>
    <script src="/js/ui/comanda.js"></script>
    <script src="/js/ui/carta.js"></script>
    <script src="/js/ui/pedido-ui.js"></script>
    <script src="/js/ui/kds.js"></script>
    <script src="/js/ui/caja.js"></script>
    <script src="/js/modulos/interno/precarga-control.js"></script>

    <!-- Módulos reales de la Célula D (carga global + módulo para EventosEnVivo) -->
    <script src="/js/ui/recetas.js"></script>
    <script src="/js/ui/despensa.js"></script>
    <script type="module" src="/js/modulos/admin/eventos-en-vivo.js"></script>

    <!-- Módulo principal de la Célula C -->
    <script type="module" src="/js/modulos/cliente/principal.js"></script>

    <script>
        (function() {
            var resultsEl = document.getElementById('results');
            var passed = 0, failed = 0, pending = 0;

            function assert(condition, msg) {
                if (condition) {
                    passed++;
                    resultsEl.innerHTML += '<div class="test pass">✔ ' + msg + '</div>';
                } else {
                    failed++;
                    resultsEl.innerHTML += '<div class="test fail">✘ ' + msg + '</div>';
                }
            }

            function markPending(msg) {
                pending++;
                resultsEl.innerHTML += '<div class="test pending">⏳ ' + msg + ' (pendiente)</div>';
            }

            function esperar(ms) {
                return new Promise(function(resolve) { setTimeout(resolve, ms); });
            }

            async function runAll() {
                resultsEl.innerHTML = '';
                Logger.setLevel('ERROR');

                // ── Configurar DB mock ─────────────────────
                window.DB = window.DB || {};
                DB.config = { zonas: [{ nombre: 'salon', cantidad: 5 }] };
                DB.mozos = [{ id: 'm1', nombre: 'Carlos', activo: true }];
                DB.mesas = [
                    { numero: 5, estado: 'libre', zona: 'salon', items: [], mozo: '', comensales: 1, pedidoId: null, permite_prepedidos: false, esVirtual: false },
                    { numero: 0, nombre: 'barra', estado: 'libre', zona: 'barra', items: [], mozo: '', comensales: 0, pedidoId: null, permite_prepedidos: false, esVirtual: true }
                ];
                DB.pedidos = [];
                DB.comandas = [];
                DB.productos = [
                    { id: 'prod_1', nombre: 'Hamburguesa', precio: 1500, categoria: 'platos', destino: 'cocina', disponible: true, activo: true },
                    { id: 'prod_2', nombre: 'Cerveza', precio: 800, categoria: 'bebidas', destino: 'barra', disponible: true, activo: true },
                    { id: 'prod_3', nombre: 'Nachos', precio: 1200, categoria: 'entradas', destino: 'cocina', disponible: false, activo: true }
                ];
                DB.ingredientes = [
                    { id: 'ing_pan', nombre: 'Pan', unidad: 'u', stock: 10, stock_minimo: 2, categoria: 'cocina', valor_unitario: 50, ubicacion: 'Estante 1' },
                    { id: 'ing_carne', nombre: 'Carne', unidad: 'g', stock: 2000, stock_minimo: 500, categoria: 'cocina', valor_unitario: 0.5, ubicacion: 'Estante 2' },
                    { id: 'ing_queso', nombre: 'Queso', unidad: 'feta', stock: 1, stock_minimo: 5, categoria: 'cocina', valor_unitario: 10, ubicacion: 'Estante 3' }
                ];
                DB.recetas = [
                    { productoId: 'prod_1', ingredientes: [
                        { ingredienteId: 'ing_pan', cantidad: 2 },
                        { ingredienteId: 'ing_carne', cantidad: 200 },
                        { ingredienteId: 'ing_queso', cantidad: 1 }
                    ], instrucciones: 'Armar y cocinar' }
                ];
                DB.movimientos = [];
                DB.eventos_en_vivo = [];
                DB.saveMesas = function() {};
                DB.savePedidos = function() {};
                DB.saveComandas = function() {};
                DB.saveRecetas = function() {};
                DB.saveConfig = function() {};
                DB.syncGuardarReceta = async function() {};
                DB.syncGuardarIngrediente = async function() {};
                DB.ajustarStock = function(id, cantidad, motivo) {
                    var ing = DB.ingredientes.find(i => i.id === id);
                    if (ing) ing.stock += cantidad;
                    DB.movimientos.push({ ingredienteId: id, cantidad, motivo, fecha: Date.now() });
                };
                DB.getMesa = function(num) { return DB.mesas.find(m => m.numero == num); };

                window.DBAppwrite = window.DBAppwrite || {};
                DBAppwrite.crear = async function(col, id, datos) {
                    var docId = id === 'unique()' ? col + '_' + Date.now() : id;
                    return { id: docId, ...datos };
                };
                DBAppwrite.actualizar = async function(col, id, cambios) {
                    return { id: id, ...cambios };
                };
                DBAppwrite.listar = async function(col) {
                    if (col === 'recetas') return DB.recetas;
                    if (col === 'mesas') return DB.mesas;
                    if (col === 'comandas') return DB.comandas;
                    if (col === 'ingredientes') return DB.ingredientes;
                    return [];
                };

                // ── Mock de CommandBus.ejecutar ──
                var commandBusOriginal = window.CommandBus;
                window.CommandBus.ejecutar = async function(comando) {
                    if (comando.type === 'crearPedidoMesa') {
                        var mesa = DB.mesas.find(m => m.numero == comando.datos.numeroMesa);
                        if (mesa) {
                            mesa.estado = 'ocupada';
                            mesa.pedidoId = 'ped_test';
                            mesa.mozo = comando.datos.mozo || 'Carlos';
                            mesa.comensales = comando.datos.comensales || 2;
                            mesa.permite_prepedidos = true;
                        }
                        return { exito: true, data: { id: 'ped_test' } };
                    }
                    if (comando.type === 'enviarComanda') {
                        var comanda = { id: 'kds_' + Date.now(), mesa: comando.datos.mesa.numero, items: comando.datos.itemsPendientes, estado: 'nueva', ts: Date.now() };
                        DB.comandas.push(comanda);
                        return { exito: true, data: comanda };
                    }
                    if (comando.type === 'completarSubcomanda') {
                        return { exito: true, data: { ambasListas: true } };
                    }
                    if (comando.type === 'precarga:revisar') {
                        return { exito: true };
                    }
                    if (commandBusOriginal && typeof commandBusOriginal.ejecutar === 'function') {
                        return commandBusOriginal.ejecutar(comando);
                    }
                    return { exito: false };
                };

                // Mock del Store que refleja cambios de comanda en DB.mesas
                var originalDispatch = Store.dispatch;
                Store.dispatch = function(action) {
                    if (action.type === 'COMANDA_ITEM_AGREGAR') {
                        var mesa = DB.mesas.find(function(m) { return m.numero === action.payload.numeroMesa; });
                        if (mesa) {
                            var item = action.payload.item;
                            var existente = mesa.items.find(function(it) {
                                return it.prodId === item.prodId && !it.enviado && it.persona === (item.persona || 'General');
                            });
                            if (existente) existente.qty++;
                            else mesa.items.push({ ...item, qty: 1 });
                        }
                    } else if (action.type === 'COMANDA_ITEM_CAMBIAR') {
                        var mesa = DB.mesas.find(function(m) { return m.numero === action.payload.numeroMesa; });
                        if (mesa && mesa.items[action.payload.index]) {
                            Object.assign(mesa.items[action.payload.index], action.payload.cambios);
                        }
                    } else if (action.type === 'COMANDA_ITEM_QUITAR') {
                        var mesa = DB.mesas.find(function(m) { return m.numero === action.payload.numeroMesa; });
                        if (mesa) mesa.items.splice(action.payload.index, 1);
                    }
                    originalDispatch.call(Store, action);
                };

                // Sincronizar Store con DB mock
                var originalGetState = Store.getState;
                Store.getState = function() {
                    var state = originalGetState.call(Store);
                    state.mesas = DB.mesas;
                    state.productos = DB.productos;
                    state.recetas = DB.recetas;
                    state.ingredientes = DB.ingredientes;
                    state.comandas = DB.comandas;
                    state.config = DB.config;
                    state.eventos_en_vivo = DB.eventos_en_vivo || [];
                    return state;
                };
                Store.dispatch({ type: 'MESAS_INICIALIZAR', payload: DB.mesas });

                window.App = {
                    showView: function(vista) {
                        EventBus.emit('vista:cambiada', vista);
                    }
                };

                // Crear DOM mínimo para mesas
                var mainMesas = document.createElement('main');
                mainMesas.id = 'view-mesas';
                mainMesas.className = 'view active';
                mainMesas.innerHTML = '<div id="mesasGrid"></div><div id="popoverContainer"></div>';
                document.body.appendChild(mainMesas);
                Mesas.render();

                // ── Esperar a que los módulos de la Célula D estén listos ──
                await esperar(800);

                if (typeof window.Recetas === 'undefined') {
                    resultsEl.innerHTML += '<div class="test fail">✘ Módulo Recetas no se cargó</div>';
                    failed++;
                }
                if (typeof window.Despensa === 'undefined') {
                    resultsEl.innerHTML += '<div class="test fail">✘ Módulo Despensa no se cargó</div>';
                    failed++;
                }

                var intentosEv = 0;
                while (typeof window.EventosEnVivo === 'undefined' && intentosEv < 30) {
                    await esperar(100);
                    intentosEv++;
                }
                if (typeof window.EventosEnVivo === 'undefined') {
                    resultsEl.innerHTML += '<div class="test fail">✘ Módulo EventosEnVivo no se cargó (timeout)</div>';
                    failed++;
                }

                // ── 1. CLIENTE ──────────────────────────────────────
                resultsEl.innerHTML += '<div class="suite"><h2>1. Flujo del Cliente</h2></div>';

                var ClienteModulo = window.ClienteModulo;
                if (!ClienteModulo) {
                    resultsEl.innerHTML += '<div class="test fail">✘ window.ClienteModulo no está definido.</div>';
                    failed++;
                } else {
                    var PantallaInicio = ClienteModulo.PantallaInicio;
                    var PantallaBienvenida = ClienteModulo.PantallaBienvenida;
                    var MenuDigital = ClienteModulo.MenuDigital;
                    var Orden = ClienteModulo.Orden;
                    var PantallaEventos = ClienteModulo.PantallaEventos;

                    if (!PantallaInicio || !PantallaBienvenida || !MenuDigital || !Orden || !PantallaEventos) {
                        resultsEl.innerHTML += '<div class="test fail">✘ Faltan módulos en ClienteModulo.</div>';
                        failed++;
                    } else {
                        var vistaInicio = PantallaInicio.render();
                        PantallaInicio.mostrar();
                        assert(vistaInicio.id === 'view-inicio', 'Pantalla de inicio renderizada');
                        assert(vistaInicio.querySelector('.login-corner') !== null, 'Triángulo de acceso presente');

                        PantallaInicio.ocultar();
                        App.showView('bienvenida');
                        var vistaBienvenida = document.getElementById('view-bienvenida');
                        if (!vistaBienvenida) {
                            PantallaBienvenida.render();
                            PantallaBienvenida.mostrar();
                            vistaBienvenida = document.getElementById('view-bienvenida');
                        } else {
                            PantallaBienvenida.mostrar();
                        }
                        assert(vistaBienvenida.classList.contains('active'), 'Bienvenida activa');

                        document.getElementById('inputMesa').value = 5;
                        document.getElementById('btnGuardarMesa').click();
                        assert(PantallaBienvenida.obtenerMesa() === 5, 'Mesa 5 vinculada');
                        assert(document.getElementById('cardIngresoMesa').style.display === 'none', 'Tarjeta ingreso oculta');
                        assert(document.getElementById('cardEspera').style.display === 'block', 'Tarjeta espera visible');

                        DB.mesas[0].permite_prepedidos = true;
                        EventBus.emit('mesas:actualizada', { numero: 5, estado: 'ocupada' });
                        assert(PantallaBienvenida.permitePrepedidos() === true, 'permitePrepedidos true');
                        assert(document.getElementById('cardEspera').innerHTML.includes('Mesa 5 activada'), 'Mesa activada en UI');

                        document.getElementById('cardGastronomica').click();
                        MenuDigital.render();
                        MenuDigital.mostrar();
                        var vistaMenu = document.getElementById('view-menu-digital');
                        assert(vistaMenu.classList.contains('active'), 'Menú digital activo');
                        var grid = document.getElementById('menuDigitalGrid');
                        assert(grid.innerHTML.includes('Hamburguesa'), 'Producto Hamburguesa visible');
                        assert(grid.innerHTML.includes('Cerveza'), 'Producto Cerveza visible');

                        var btnHamburguesa = Array.from(document.querySelectorAll('.btn-agregar-orden:not(.btn-deshabilitado)')).find(b => b.dataset.nombre === 'Hamburguesa');
                        btnHamburguesa.click();
                        assert(Orden.obtenerItems().length === 1, '1 ítem en orden');
                        assert(Orden.obtenerTotal() === 1500, 'Total correcto');

                        document.getElementById('btnToggleOrden').click();
                        var btnConfirmar = document.getElementById('btnConfirmarOrden');
                        await btnConfirmar.click();
                        await esperar(100);
                        assert(Orden.obtenerItems().length === 0, 'Orden vacía tras confirmar');
                        assert(Orden.obtenerTotal() === 0, 'Total en 0');

                        var panelOrden = document.getElementById('panelOrden');
                        if (panelOrden) panelOrden.remove();

                        MenuDigital.ocultar();
                        PantallaBienvenida.mostrar();
                        document.getElementById('cardEntretenimiento').click();
                        PantallaEventos.render();
                        PantallaEventos.mostrar();
                        await esperar(400);
                        var vistaEventos = document.getElementById('view-eventos-cliente');
                        assert(vistaEventos.classList.contains('active'), 'Eventos activa');
                        assert(document.getElementById('eventosContenido').innerHTML.includes('No hay eventos activos'), 'Sin eventos activos');

                        DB.eventos_en_vivo = [{
                            id: 'evt_1', tipo: 'votacion', estado: 'activo',
                            titulo: 'Mejor canción', descripcion: 'Votá',
                            opciones: [{ nombre: 'Opción A' }, { nombre: 'Opción B' }], resultados: {}
                        }];
                        Store.dispatch({ type: 'EVENTOS_INICIALIZAR', payload: DB.eventos_en_vivo });
                        EventBus.emit('eventos_en_vivo:actualizada', {});
                        await esperar(500);
                        var contenido = document.getElementById('eventosContenido');
                        assert(contenido.innerHTML.includes('Mejor canción'), 'Evento votación visible');
                        var btnVoto = document.querySelector('.votacion-opcion');
                        btnVoto.click();
                        assert(btnVoto.classList.contains('seleccionada'), 'Voto seleccionado');

                        PantallaEventos.ocultar();
                        document.getElementById('btnLogout').click();
                        App.showView('inicio');
                        PantallaInicio.mostrar();
                        assert(document.getElementById('view-inicio').classList.contains('active'), 'Inicio activa al cerrar sesión');
                    }
                }

                // Limpiar vistas del cliente
                var vistasCliente = document.querySelectorAll('.view');
                vistasCliente.forEach(function(v) { v.remove(); });
                var overlaysCliente = document.querySelectorAll('.modal-overlay');
                overlaysCliente.forEach(function(o) { o.remove(); });

                // ── 2. STAFF ─────────────────────────────────────────
                resultsEl.innerHTML += '<div class="suite"><h2>2. Staff (Garzón/Mesero)</h2></div>';

                // Restaurar mesa a libre
                DB.mesas[0].estado = 'libre';
                DB.mesas[0].permite_prepedidos = false;
                DB.mesas[0].items = [];
                DB.mesas[0].pedidoId = null;
                Mesas.render();
                await esperar(50);

                var tarjetas = document.querySelectorAll('.mesa-card');
                assert(tarjetas.length >= 1, 'El mapa de mesas tiene al menos una tarjeta');

                EventBus.emit('cliente:mesa_ingresada', { mesa: 5 });
                await esperar(50);
                var insigniasEspera = document.querySelectorAll('.esperando-cliente-badge');
                assert(insigniasEspera.length === 1, 'Aparece insignia de cliente esperando en mesa 5');

                var mesa5 = DB.mesas[0];
                await Pedido._confirmarApertura(5);
                await esperar(150);
                assert(mesa5.estado === 'ocupada' && mesa5.permite_prepedidos === true, 'Mesa en estado ocupada y permite prepedidos');
                Mesas.render();
                await esperar(50);
                insigniasEspera = document.querySelectorAll('.esperando-cliente-badge');
                assert(insigniasEspera.length === 0, 'Insignia de espera desaparece al abrir la mesa');

                var modalPedido = document.getElementById('modalPedido');
                if (modalPedido) modalPedido.style.display = 'none';

                Comanda.setMesaActiva(mesa5);

                EventBus.emit('cliente:precarga_enviada', {
                    id: 'pre_123', mesa: 5,
                    items: [{ prodId: 'prod_1', nombre: 'Hamburguesa', precio: 1500, categoria: 'platos', destino: 'cocina', qty: 2, obs: '' }],
                    clienteId: 'Diego', id_usuario: 'user_abc', nombre_comensal: 'Diego', timestamp: Date.now()
                });
                await esperar(50);
                var badgePrecarga = document.querySelector('.precarga-badge');
                assert(!!badgePrecarga, 'Badge de precarga aparece en mesa 5');
                if (badgePrecarga) {
                    badgePrecarga.click();
                    await esperar(100);
                }
                assert(mesa5.items.length > 0, 'Ítems cargados en la comanda desde la precarga');
                badgePrecarga = document.querySelector('.precarga-badge');
                assert(!badgePrecarga, 'Badge de precarga desaparece después de cargar');

                var tarjetaMesa5 = document.querySelector('.mesa-card');
                tarjetaMesa5.dispatchEvent(new MouseEvent('mousedown', { bubbles: true }));
                await esperar(450);
                tarjetaMesa5.dispatchEvent(new MouseEvent('mouseup', { bubbles: true }));
                await esperar(50);
                var popover = document.querySelector('#popoverContainer div');
                assert(!!popover, 'Popover aparece tras long-press');
                if (popover) {
                    var btnCerrar = popover.querySelector('button');
                    if (btnCerrar) btnCerrar.click();
                }

                // Limpiar vistas del staff
                var vistasStaff = document.querySelectorAll('.view');
                vistasStaff.forEach(function(v) { v.remove(); });
                var overlaysStaff = document.querySelectorAll('.modal-overlay');
                overlaysStaff.forEach(function(o) { o.remove(); });

                // ── 3. COCINA / BARRA ─────────────────────────────────
                resultsEl.innerHTML += '<div class="suite"><h2>3. Cocina / Barra (KDS)</h2></div>';

                var mainKds = document.createElement('main');
                mainKds.id = 'view-cocina';
                mainKds.className = 'view';
                mainKds.innerHTML = '<div id="cocinaKDS" class="kds-grid"></div>';
                document.body.appendChild(mainKds);

                DB.comandas = [];
                DB.comandas.push({
                    id: 'com_ambos', mesa: 5, destino: 'ambos',
                    items: [
                        { prodId: 'prod_1', nombre: 'Hamburguesa', qty: 1, destino: 'cocina' },
                        { prodId: 'prod_2', nombre: 'Cerveza', qty: 2, destino: 'barra' }
                    ],
                    estado: 'nueva', ts: Date.now(), mozo: 'Carlos', observaciones: 'Combo'
                });
                Store.dispatch({ type: 'COMANDA_AGREGADA', payload: DB.comandas[0] });
                KDS.refresh();
                await esperar(50);

                var tarjetaCocina = document.getElementById('kds-com_ambos_cocina');
                var tarjetaBarra = document.getElementById('kds-com_ambos_barra');
                var tarjetaOriginal = document.getElementById('kds-com_ambos');
                assert(!!tarjetaCocina, 'Tarjeta virtual de cocina visible');
                assert(!!tarjetaBarra, 'Tarjeta virtual de barra visible');
                assert(tarjetaOriginal === null, 'La comanda original no se renderiza');

                Auth.getRol = function() { return 'cocina'; };
                KDS.refresh();
                await esperar(50);
                tarjetaBarra = document.getElementById('kds-com_ambos_barra');
                assert(tarjetaBarra === null, 'Con rol cocina, la virtual de barra se oculta');
                Auth.getRol = function() { return 'admin'; };

                KDS.refresh();
                await esperar(50);
                var botonPanico = document.querySelector('.kds-panico-btn');
                if (botonPanico) {
                    var llamadoPanico = false;
                    window.DBAppwrite.actualizar = async function(col, id, cambios) {
                        if (col === 'productos' && cambios.disponible === false) llamadoPanico = true;
                        return { id: id, ...cambios };
                    };
                    botonPanico.click();
                    await esperar(50);
                    assert(llamadoPanico, 'Botón de pánico ejecutó DBAppwrite.actualizar correctamente');
                }

                DB.comandas.push({
                    id: 'com_urg', mesa: 5, destino: 'cocina',
                    items: [{ prodId: 'prod_1', nombre: 'Hamburguesa', qty: 1, destino: 'cocina' }],
                    estado: 'nueva', ts: Date.now() - 20 * 60 * 1000, mozo: 'Carlos', observaciones: ''
                });
                KDS.refresh();
                await esperar(50);
                var tiempoUrgente = document.querySelector('.kds-time.urgente');
                assert(!!tiempoUrgente, 'Comanda de 20 min muestra clase urgente');

                if (mainKds) mainKds.remove();

                // ── 4. ADMINISTRACIÓN (MÓDULOS REALES D) ──
                resultsEl.innerHTML += '<div class="suite"><h2>4. Administración (Módulos Reales Célula D)</h2></div>';

                // 4.1 Despensa
                EventBus.emit('vista:cambiada', 'despensa');
                await esperar(100);
                if (Despensa.render) Despensa.render();
                await esperar(300);
                var vistaDespensa = document.getElementById('view-despensa');
                assert(vistaDespensa !== null, 'Despensa: vista creada');
                var alertasDiv = document.getElementById('alertasStockList');
                assert(alertasDiv !== null, 'Despensa: lista de alertas visible');
                var htmlAlertas = alertasDiv.innerHTML;
                assert(htmlAlertas.indexOf('Queso') !== -1, 'Despensa: alerta de Queso bajo mínimo');
                assert(htmlAlertas.indexOf('Quedan 1') !== -1, 'Despensa: stock actual de Queso es 1');

                // 4.2 Recetas
                Auth.getRol = function() { return 'cocina'; };
                Recetas.render('consulta');
                await esperar(200);
                var vistaRecetas = document.getElementById('view-recetas');
                assert(vistaRecetas !== null, 'Recetas: vista de consulta creada');
                assert(document.getElementById('btnNuevaReceta').style.display === 'none', 'Recetas: botón Nueva Receta oculto');
                var tarjetaReceta = document.querySelector('.receta-card');
                assert(tarjetaReceta !== null, 'Recetas: tarjeta de Hamburguesa visible');
                assert(tarjetaReceta.textContent.includes('Hamburguesa'), 'Recetas: nombre del producto visible');

                // Restaurar rol admin para Eventos en Vivo
                Auth.getRol = function() { return 'admin'; };

                // 4.3 Eventos en Vivo (con fix local)
                if (typeof EventosEnVivo !== 'undefined') {
                    EventBus.emit('vista:cambiada', 'eventos-en-vivo');
                    await esperar(200);
                    var vistaEventosAdmin = document.getElementById('view-eventos-en-vivo');
                    assert(vistaEventosAdmin !== null, 'Eventos: panel del animador creado');
                
                    document.getElementById('selTipoEvento').value = 'votacion';
                    await EventosEnVivo.crearEvento();
                    await esperar(100);
                    assert(document.getElementById('estadoEvento').textContent.includes('votacion'), 'Eventos: badge muestra votación');
                
                    await EventosEnVivo.cambiarEstado('activo');
                    await esperar(100);
                    var inputOpcion = document.getElementById('nuevaOpcion');
                    assert(inputOpcion !== null, 'Eventos: campo de nueva opción visible');
                
                    if (inputOpcion) {
                        inputOpcion.value = 'Opción A';
                        await EventosEnVivo.agregarOpcion();
                        await esperar(100);
                        inputOpcion = document.getElementById('nuevaOpcion');
                        if (inputOpcion) {
                            inputOpcion.value = 'Opción B';
                            await EventosEnVivo.agregarOpcion();
                            await esperar(100);
                        }
                    }
                
                    // Simular llegada de voto
                    await DBAppwrite.actualizar('eventos_en_vivo', 'doc_votacion', {
                        datos: { resultados: { 'Opción A': 1, 'Opción B': 0 } }
                    });
                    EventBus.emit('eventos_en_vivo:actualizada', {
                        id: 'doc_votacion', tipo: 'votacion', estado: 'activo',
                        datos: { opciones: ['Opción A', 'Opción B'], resultados: { 'Opción A': 1, 'Opción B': 0 } }
                    });
                    await esperar(200);
                    var listaVotos = document.querySelector('.votacion-lista');
                    if (listaVotos) {
                        assert(listaVotos.textContent.includes('Opción A — 1 votos'), 'Eventos: voto registrado para Opción A');
                        assert(listaVotos.textContent.includes('Opción B — 0 votos'), 'Eventos: Opción B sin votos');
                    }
                    if (vistaEventosAdmin) vistaEventosAdmin.style.display = 'none';
                }

                // Limpiar vistas de administración
                if (vistaDespensa) vistaDespensa.style.display = 'none';
                if (vistaRecetas) vistaRecetas.style.display = 'none';

                // ── 5. FLUJO DE DINERO ────────────────────────────────
                resultsEl.innerHTML += '<div class="suite"><h2>5. Flujo de Dinero</h2></div>';

                var pedido = {
                    id: 'ped_001', mesa: 5, estado: 'activa', items: [
                        { prodId: 'prod_1', nombre: 'Hamburguesa', precio: 1500, qty: 2 },
                        { prodId: 'prod_2', nombre: 'Cerveza', precio: 800, qty: 1 }
                    ], total: 3800, formaPago: 'efectivo'
                };
                DB.pedidos.push(pedido);
                assert(pedido.total === 3800, 'Total calculado correctamente');

                pedido.estado = 'cerrada';
                var index = DB.pedidos.findIndex(p => p.id === 'ped_001');
                DB.pedidos[index] = pedido;
                assert(DB.pedidos[0].estado === 'cerrada', 'Pedido cerrado');
                assert(DB.pedidos[0].total === 3800, 'Total final registrado');

                Caja.render();
                await esperar(50);
                var vistaCaja = document.getElementById('view-caja');
                assert(!!vistaCaja, 'Caja se renderiza sin errores');
                if (vistaCaja) vistaCaja.remove();

                // ── 6. GESTIÓN DE BASURA ──────────────────────────────
                resultsEl.innerHTML += '<div class="suite"><h2>6. Gestión de Basura</h2></div>';
                if (typeof window.GestionBasura === 'undefined' && typeof window.Residuos === 'undefined') {
                    markPending('Módulo de gestión de basura/residuos no implementado');
                } else {
                    assert(true, 'Módulo de basura encontrado');
                }

                // ── LIMPIEZA FINAL ─────────────────────────────────────
                var todosLosModales = document.querySelectorAll('.modal-overlay');
                todosLosModales.forEach(function(m) { m.remove(); });
                var todasLasVistas = document.querySelectorAll('.view');
                todasLasVistas.forEach(function(v) { v.remove(); });
                var mainMesasEl = document.getElementById('view-mesas');
                if (mainMesasEl) mainMesasEl.remove();
                var popoverEl = document.getElementById('popoverContainer');
                if (popoverEl) popoverEl.innerHTML = '';

                // ── RESUMEN ─────────────────────────────────────────
                resultsEl.innerHTML += '<div class="summary">' + passed + ' pasaron, ' + failed + ' fallaron, ' + pending + ' pendientes</div>';
                if (failed === 0) {
                    resultsEl.innerHTML += '<div class="test pass">✔ Todos los flujos implementados funcionan correctamente.</div>';
                }
                if (pending > 0) {
                    resultsEl.innerHTML += '<div class="test pending">⏳ Hay funcionalidades pendientes de implementación.</div>';
                }
            }

            window.addEventListener('load', function() {
                setTimeout(runAll, 500);
            });
        })();
    </script>
</body>
</html>
