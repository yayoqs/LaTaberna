<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test D – Config (v2.0.2)</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f0f14; color: #f1f5f9; padding: 20px; }
    h1 { color: #f59e0b; }
    .resultado { background: #1a1a24; border-radius: 8px; padding: 12px 16px; margin: 8px 0; display: flex; align-items: center; gap: 12px; }
    .ok { border-left: 4px solid #22c55e; }
    .fallo { border-left: 4px solid #ef4444; }
    .salto { border-left: 4px solid #3b82f6; }
    .seccion { color: #f59e0b; font-size: 13px; min-width: 110px; }
  </style>
</head>
<body>
  <h1>Test D – Config (v2.0.2 — Zonas, Mozos, Contraseñas)</h1>
  <p style="color:#a0a0a0; font-size:13px;">Prueba de la vista de configuración actual (sin sección de productos).</p>
  <div id="resultados"></div>
  <div id="toastContainer"></div>

  <!-- Dependencias reales -->
  <script type="module" src="js/lib/logger.js"></script>
  <script type="module" src="js/lib/eventBus.js"></script>
  <script type="module" src="js/lib/store.js"></script>
  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/utils.js"></script>
  <script type="module" src="js/db.js"></script>
  <script type="module" src="js/db-appwrite.js"></script>

  <!-- Inyectar datos de prueba en el Store -->
  <script type="module">
    import { Store } from './js/lib/store.js';
    import { DB } from './js/db.js';

    DB.config = {
      nombreLocal: 'La Taberna Test',
      direccion: 'Av. Test 123',
      cuit: '30-12345678-9',
      pieTicket: '¡Gracias por visitarnos!',
      zonas: [
        { nombre: 'salon', cantidad: 12 },
        { nombre: 'terraza', cantidad: 4 }
      ],
      bloquearStockInsuficiente: true
    };
    DB.mozos = [
      { id: 'mozo1', nombre: 'Carlos', activo: true },
      { id: 'mozo2', nombre: 'Ana', activo: true }
    ];

    Store.despachar({ type: 'CONFIG_INICIALIZAR', payload: DB.config });
    Store.despachar({ type: 'MOZOS_INICIALIZAR', payload: DB.mozos });
  </script>

  <!-- Módulo real de configuración -->
  <script type="module" src="js/ui/config.js"></script>

  <script type="module">
    import { Store } from './js/lib/store.js';
    import { DB } from './js/db.js';
    import { Config } from './js/ui/config.js';

    function resultado(ok, seccion, mensaje) {
      const div = document.createElement('div');
      const clase = ok === 'salto' ? 'salto' : (ok ? 'ok' : 'fallo');
      div.className = 'resultado ' + clase;
      const icono = ok === 'salto' ? '→' : (ok ? '✔' : '✘');
      div.innerHTML = `<span>${icono}</span><span class="seccion">[${seccion}]</span><span>${mensaje}</span>`;
      document.getElementById('resultados').appendChild(div);
    }

    async function iniciarTests() {
      // Activar la vista
      Config.cargar();
      await new Promise(r => setTimeout(r, 200));

      // 1. Carga de la vista
      resultado(document.getElementById('view-config') !== null, 'Carga', 'Vista de configuración creada');
      resultado(document.querySelector('.config-grid') !== null, 'Carga', 'Grid de configuración presente');

      // 2. Verificar secciones principales
      const secciones = document.querySelectorAll('.config-card');
      resultado(secciones.length >= 3, 'Secciones', 'Al menos 3 tarjetas de configuración (Impresoras, Datos, Mozos)');

      // 3. Datos del local cargados correctamente
      const nombreLocal = document.getElementById('cfgNombreLocal');
      resultado(nombreLocal && nombreLocal.value === 'La Taberna Test', 'Datos', 'Nombre del local cargado');

      // 4. Zonas cargadas
      const zonasContainer = document.getElementById('zonasContainer');
      resultado(zonasContainer && zonasContainer.children.length === 2, 'Zonas', 'Dos zonas cargadas (salon, terraza)');

      // 5. Mozos cargados
      const mozosLista = document.getElementById('mozosLista');
      resultado(mozosLista && mozosLista.children.length === 2, 'Mozos', 'Dos mozos cargados');

      // 6. Agregar mozo
      const inputMozo = document.getElementById('nuevoMozoNombre');
      const btnAgregarMozo = document.getElementById('btnAgregarMozo');
      if (inputMozo && btnAgregarMozo) {
        inputMozo.value = 'Pedro';
        btnAgregarMozo.click();
        await new Promise(r => setTimeout(r, 100));
        const mozosActualizados = document.getElementById('mozosLista');
        resultado(mozosActualizados && mozosActualizados.children.length === 3, 'Mozos', 'Mozo agregado correctamente');
      }

      // 7. Eliminar mozo (el último)
      const btnEliminarMozo = document.querySelector('#mozosLista .btn-icon-sm.del');
      if (btnEliminarMozo) {
        btnEliminarMozo.click();
        await new Promise(r => setTimeout(r, 200)); // Esperar confirmación
        // Nota: la confirmación requiere interacción manual, así que solo verificamos que el botón existe
        resultado(true, 'Mozos', 'Botón de eliminar mozo presente');
      }

      // 8. Verificar toggle de stock
      const chkStock = document.getElementById('cfgBloquearStock');
      resultado(chkStock && chkStock.checked, 'Datos', 'Checkbox de bloquear stock activado');

      // 9. Sección de contraseñas (solo master)
      const usuariosCard = document.getElementById('usuariosCard');
      // Con usuario admin no debería verse
      resultado(usuariosCard && usuariosCard.style.display === 'none', 'Seguridad', 'Sección de contraseñas oculta para admin');

      // Limpiar
      const vista = document.getElementById('view-config');
      if (vista) vista.style.display = 'none';
      console.log('Tests de configuración v2.0.2 completados.');
    }

    window.addEventListener('load', () => setTimeout(iniciarTests, 100));
  </script>
</body>
</html>
