<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Test D – Config</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #1a1a1a; color: #e0e0e0; padding: 30px; max-width: 700px; margin: auto; }
    h1 { color: #f59e0b; }
    .resultado { background: #2a2a2a; border-radius: 8px; padding: 12px 16px; margin: 8px 0; display: flex; align-items: center; gap: 12px; }
    .ok { border-left: 4px solid #22c55e; }
    .fallo { border-left: 4px solid #ef4444; }
    .seccion { color: #f59e0b; font-size: 13px; min-width: 110px; }
  </style>
</head>
<body>
  <h1>Test D – Config (v5.0)</h1>
  <p style="color:#a0a0a0; font-size:13px;">Mejoras: validación de zonas, vista previa de imagen, autoajuste de precio.</p>
  <div id="resultados"></div>

  <script>
    const Logger = { info: console.log, warn: console.warn, error: console.error };
    const EventBus = { events: {}, on(ev, cb) { (this.events[ev] = this.events[ev] || []).push(cb); }, emit(ev, data) { (this.events[ev] || []).forEach(cb => cb(data)); } };
    const Store = { state: { config: { zonas: [{ nombre: 'salon', cantidad: 10 }] }, productos: [], mozos: [] }, getState() { return this.state; }, subscribe() {} };
    const Auth = { _rol: 'admin', getRol() { return this._rol; }, getNombre() { return 'Test Admin'; }, esMasterReal() { return false; } };
    let toastMessages = [];
    function showToast(tipo, msg) { toastMessages.push({tipo, msg}); }
    window.fmtMoney = (val) => `$${val.toFixed(0)}`;

    const DB = {
      config: { nombreLocal: 'Test', direccion: '', cuit: '', pieTicket: '', zonas: [{ nombre: 'salon', cantidad: 10 }], bloquearStockInsuficiente: true },
      mozos: [],
      productos: [],
      saveConfig() {}, saveMozos() {}, saveMesas() {},
      syncGuardarProducto() {},
      syncEliminarProducto() {}
    };
    window.DB = DB;
  </script>

  <script src="js/ui/config.js"></script>

  <script>
    function resultado(ok, seccion, mensaje) {
      const div = document.createElement('div');
      div.className = 'resultado ' + (ok ? 'ok' : 'fallo');
      div.innerHTML = `<span>${ok ? '✔' : '✘'}</span><span class="seccion">[${seccion}]</span><span>${mensaje}</span>`;
      document.getElementById('resultados').appendChild(div);
    }

    async function iniciarTests() {
      // Cargar vista
      EventBus.emit('vista:cambiada', 'config');
      await new Promise(r => setTimeout(r, 100));
      resultado(document.getElementById('view-config') !== null, 'Carga', 'Vista de configuración creada');

      // Validación de zonas
      const zonasContainer = document.getElementById('zonasContainer');
      zonasContainer.innerHTML = '';
      await Config.guardar();
      await new Promise(r => setTimeout(r, 50));
      resultado(toastMessages.some(t => t.tipo === 'error' && t.msg.includes('al menos una zona')), 'Zonas', 'Error al guardar sin zonas');
      toastMessages = [];

      zonasContainer.innerHTML = '<div><input value="salon"><input value="10"></div>';
      await Config.guardar();
      await new Promise(r => setTimeout(r, 50));
      resultado(toastMessages.some(t => t.tipo === 'success'), 'Zonas', 'Guardado exitoso con una zona');

      // Modal producto
      Config.abrirModalProducto();
      await new Promise(r => setTimeout(r, 100));
      const precioInput = document.getElementById('prodPrecio');

      // Autoajuste de precio vacío
      precioInput.value = '';
      Config._autoajustarPrecio();
      resultado(precioInput.value === '0', 'Producto', 'Precio vacío se ajusta a 0');

      // Autoajuste de precio negativo
      precioInput.value = '-5';
      Config._autoajustarPrecio();
      resultado(precioInput.value === '0', 'Producto', 'Precio negativo se ajusta a 0');

      // Autoajuste de precio válido no cambia
      precioInput.value = '150';
      Config._autoajustarPrecio();
      resultado(precioInput.value === '150', 'Producto', 'Precio válido se conserva');

      // Vista previa de imagen
      document.getElementById('prodImagen').value = 'https://via.placeholder.com/150';
      Config._vistaPreviaImagen();
      await new Promise(r => setTimeout(r, 50));
      const imgPrev = document.querySelector('#vistaPreviaImagen img');
      resultado(imgPrev !== null, 'Producto', 'Vista previa visible');

      document.getElementById('prodImagen').value = '';
      Config._vistaPreviaImagen();
      await new Promise(r => setTimeout(r, 50));
      resultado(document.querySelector('#vistaPreviaImagen img') === null, 'Producto', 'Vista previa oculta');

      Config.cerrarModalProducto();
      const vista = document.getElementById('view-config');
      if (vista) vista.style.display = 'none';
      console.log('Tests de configuración finalizados.');
    }

    window.addEventListener('load', () => setTimeout(iniciarTests, 200));
  </script>
</body>
</html>
