<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Encargado de Cocina — La Taberna (Prototipo)</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* Variables de prueba (no :root en producción) */
    :root {
      --color-bg: #0f0f0f;
      --color-card: #1a1a1a;
      --color-panel: #262626;
      --color-border: #333;
      --color-text: #e0e0e0;
      --color-text-sec: #b0b0b0;
      --color-text-muted: #888;
      --color-accent: #f59e0b;
      --color-success: #22c55e;
      --color-info: #3b82f6;
      --color-warning: #f59e0b;
      --color-danger: #ef4444;
      --color-cocina: #f97316;
      --color-barra: #8b5cf6;
      --radius: 12px;
      --radius-sm: 8px;
      --radius-xs: 6px;
      --shadow: 0 4px 14px rgba(0,0,0,.4);
      --t: .2s ease;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--color-bg);
      color: var(--color-text);
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* ── Toolbar ──────────────────────────────── */
    .toolbar {
      position: sticky;
      top: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px 10px;
      background: var(--color-panel);
      border-bottom: 1px solid var(--color-border);
      flex-shrink: 0;
    }
    .toolbar h2 {
      font-size: 17px;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--color-cocina);
    }
    .toolbar h2 small {
      display: block;
      font-size: 10px;
      color: var(--color-text-muted);
      font-weight: 500;
      margin-top: 1px;
    }
    .toolbar-acciones {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-icono {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      color: var(--color-text-sec);
      width: 34px; height: 34px;
      border-radius: var(--radius-sm);
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: var(--t);
    }
    .btn-icono:active { background: var(--color-border); }
    .campana { position: relative; }
    .campana .punto {
      position: absolute; top: -3px; right: -3px;
      width: 9px; height: 9px; border-radius: 50%;
      background: var(--color-danger); box-shadow: 0 0 0 2px var(--color-panel);
      display: none;
    }
    .campana.activa .punto { display: block; }
    .reloj {
      font-size: 14px;
      font-weight: 600;
      color: var(--color-text);
      min-width: 46px;
      text-align: right;
    }

    /* ── Filtros ──────────────────────────────── */
    .kds-filtros {
      display: flex;
      gap: 6px;
      padding: 8px 16px;
      background: var(--color-bg);
      border-bottom: 1px solid var(--color-border);
      overflow-x: auto;
    }
    .kds-chip {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      color: var(--color-text-sec);
      padding: 5px 13px;
      border-radius: 99px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: var(--t);
    }
    .kds-chip.activo { background: var(--color-accent); color: #000; border-color: var(--color-accent); }

    /* ── Pestañas de estado ───────────────────── */
    .kds-pestanas {
      display: flex;
      gap: 6px;
      padding: 10px 16px;
      background: var(--color-bg);
      border-bottom: 1px solid var(--color-border);
    }
    .kds-pestana {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-sm);
      padding: 7px 4px;
      cursor: pointer;
    }
    .kds-pestana b { font-size: 16px; }
    .kds-pestana span { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .3px; color: var(--color-text-muted); }
    .kds-pestana[data-estado="nueva"].activo { box-shadow: inset 0 0 0 2px var(--color-warning); }
    .kds-pestana[data-estado="nueva"].activo b { color: var(--color-warning); }
    .kds-pestana[data-estado="en-proceso"].activo { box-shadow: inset 0 0 0 2px var(--color-cocina); }
    .kds-pestana[data-estado="en-proceso"].activo b { color: var(--color-cocina); }
    .kds-pestana[data-estado="lista"].activo { box-shadow: inset 0 0 0 2px var(--color-success); }
    .kds-pestana[data-estado="lista"].activo b { color: var(--color-success); }

    /* ── Resumen ──────────────────────────────── */
    .kds-resumen {
      display: flex;
      gap: 8px;
      padding: 8px 16px;
      background: var(--color-bg);
      border-bottom: 1px solid var(--color-border);
      overflow-x: auto;
    }
    .kds-pildora {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--color-card);
      border: 1px solid var(--color-border);
      padding: 5px 11px;
      border-radius: 99px;
      font-size: 11px;
      font-weight: 600;
      color: var(--color-text-sec);
      white-space: nowrap;
    }
    .kds-pildora b { color: var(--color-text); }
    .kds-swatch { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }

    /* ── Lista de comandas ────────────────────── */
    .kds-lista {
      flex: 1;
      overflow-y: auto;
      padding: 14px 14px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .kds-vacio { text-align: center; color: var(--color-text-muted); margin-top: 50px; }

    /* ── Ticket ───────────────────────────────── */
    .kds-ticket {
      background: var(--color-card);
      border: 2px solid var(--color-border);
      border-radius: var(--radius);
      padding: 13px 14px;
      box-shadow: var(--shadow);
      animation: kds-llegar .3s ease-out;
    }
    @keyframes kds-llegar { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    .kds-ticket.kds-saliendo { animation: kds-salir .22s ease-in forwards; }
    @keyframes kds-salir { to { opacity: 0; transform: scale(.95) translateY(6px); } }
    .kds-ticket.kds-urgente { border-color: var(--color-danger); }

    .kds-ticket-cabecera { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .kds-ticket-numero { font-size: 23px; font-weight: 800; line-height: 1; color: var(--color-text); }
    .kds-ticket-mesa { font-size: 11px; color: var(--color-text-muted); font-weight: 600; margin-top: 2px; }
    .kds-ticket-tipo {
      font-size: 9px; font-weight: 800; text-transform: uppercase;
      padding: 3px 8px; border-radius: 99px; letter-spacing: .4px; flex-shrink: 0;
    }
    .kds-tipo-mesa { background: rgba(59,130,246,.2); color: var(--color-info); }
    .kds-tipo-reparto { background: rgba(139,92,246,.2); color: var(--color-barra); }
    .kds-tipo-retiro { background: rgba(34,197,94,.2); color: var(--color-success); }

    .kds-ticket-tiempo {
      display: inline-flex; align-items: center; gap: 5px;
      font-weight: 700; font-size: 12px; padding: 3px 9px;
      border-radius: var(--radius-xs); margin-top: 8px;
    }
    .t-ok { background: rgba(34,197,94,.15); color: var(--color-success); }
    .t-warn { background: rgba(245,158,11,.15); color: var(--color-warning); }
    .t-peligro { background: rgba(239,68,68,.15); color: var(--color-danger); animation: kds-pulso 1s infinite; }
    @keyframes kds-pulso { 0%,100% { box-shadow: 0 0 0 0 rgba(239,68,68,.35); } 50% { box-shadow: 0 0 0 5px rgba(239,68,68,0); } }

    .kds-ticket-items { margin-top: 9px; display: flex; flex-direction: column; gap: 3px; }
    .kds-item {
      display: flex; align-items: center; gap: 8px; font-size: 13.5px;
      padding: 5px 6px; margin: 0 -6px; border-radius: var(--radius-xs);
      transition: background .15s;
    }
    .kds-item.kds-item-tocable { cursor: pointer; }
    .kds-item.kds-item-tocable:active { background: rgba(255,255,255,.05); }
    .kds-item-cantidad {
      background: var(--color-accent); color: #000; font-weight: 800;
      width: 21px; height: 21px; border-radius: var(--radius-xs);
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; flex-shrink: 0;
    }
    .kds-item-check {
      width: 20px; height: 20px; border-radius: 50%; flex-shrink: 0;
      border: 2px solid var(--color-border); display: flex; align-items: center; justify-content: center;
      font-size: 10px; color: transparent; transition: var(--t);
    }
    .kds-item-check.kds-item-marcado { background: var(--color-success); border-color: var(--color-success); color: #04220f; }
    .kds-item-nombre { flex: 1; }
    .kds-item.kds-item-listo .kds-item-nombre { color: var(--color-text-muted); text-decoration: line-through; }

    .kds-progreso {
      font-size: 10.5px; color: var(--color-text-muted); font-weight: 600;
      margin-top: 6px; display: flex; align-items: center; gap: 5px;
    }
    .kds-progreso-barra { flex: 1; height: 4px; background: var(--color-border); border-radius: 99px; overflow: hidden; }
    .kds-progreso-lleno { height: 100%; background: var(--color-success); border-radius: 99px; transition: width .25s; }

    .kds-ticket-banderas { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 5px; }
    .kds-bandera { font-size: 9px; font-weight: 800; text-transform: uppercase; padding: 3px 7px; border-radius: var(--radius-xs); }
    .kds-bandera-grupo { background: rgba(139,92,246,.15); color: #c4b5fd; }

    .kds-ticket-acciones { margin-top: 12px; }
    .kds-boton {
      width: 100%;
      padding: 13px 10px;
      border-radius: var(--radius-sm);
      font-size: 13.5px;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform .12s, background .15s;
      border: none;
    }
    .kds-boton:active { transform: scale(.97); }
    .kds-boton-iniciar { background: var(--color-warning); color: #1a0d00; }
    .kds-boton-listo { background: var(--color-success); color: #04220f; }
    .kds-boton-entregar { background: var(--color-info); color: #04122b; }

    .kds-acciones-secundarias { display: flex; justify-content: flex-end; margin-top: 6px; }
    .kds-boton-reabrir {
      background: transparent;
      border: 1px solid var(--color-info);
      color: var(--color-info);
      padding: 5px 10px;
      border-radius: var(--radius-xs);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: var(--t);
    }
    .kds-boton-reabrir:active { background: var(--color-info); color: #04122b; }

    /* ── Panel de simulación ──────────────────── */
    .kds-simulacion {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 20;
      background: var(--color-panel);
      border: 1px solid var(--color-border);
      border-radius: var(--radius);
      padding: 12px 14px;
      width: 200px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .kds-simulacion button {
      background: var(--color-card);
      border: 1px solid var(--color-border);
      color: var(--color-text);
      padding: 6px 10px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-size: 11px;
      font-weight: 600;
    }
    .kds-simulacion button:hover { background: var(--color-border); }
    .kds-simulacion .kds-nota { font-size: 9px; color: var(--color-text-muted); margin-top: 4px; }

    /* ── Toast ────────────────────────────────── */
    #kds-toast-contenedor {
      position: fixed; top: calc(env(safe-area-inset-top) + 8px); left: 50%;
      transform: translateX(-50%); z-index: 60;
      display: flex; flex-direction: column; gap: 6px;
      width: calc(100% - 32px); max-width: 488px;
    }
    .kds-toast {
      background: var(--color-panel); border: 1px solid var(--color-border); border-left: 4px solid var(--color-cocina);
      color: var(--color-text); padding: 10px 14px; border-radius: var(--radius-xs);
      font-size: 12.5px; font-weight: 600; box-shadow: var(--shadow);
      animation: kds-toast-entrada .25s ease-out, kds-toast-salida .3s ease-in 2.7s forwards;
    }
    @keyframes kds-toast-entrada { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes kds-toast-salida { to { opacity: 0; transform: translateY(-8px); } }

    @media (prefers-reduced-motion: reduce) {
      .kds-ticket, .kds-toast, .t-peligro { animation: none !important; }
    }
  </style>
</head>
<body>

  <div id="kds-toast-contenedor"></div>

  <div class="toolbar">
    <h2><i class="fas fa-fire-burner"></i> <span>Encargado de Cocina<small>La Taberna · en vivo</small></span></h2>
    <div class="toolbar-acciones">
      <button class="btn-icono" id="btnModo" title="Cambiar Cocina/Barra"><i class="fas fa-exchange-alt"></i></button>
      <button class="btn-icono" id="btnRecetario"><i class="fas fa-book-open"></i></button>
      <div class="btn-icono campana" id="campana"><i class="fas fa-bell"></i><span class="punto"></span></div>
      <span class="reloj" id="reloj">--:--</span>
    </div>
  </div>

  <div class="kds-filtros" id="kds-filtros">
    <span class="kds-chip activo" data-filtro="todos">Todos</span>
    <span class="kds-chip" data-filtro="mesa">Mesa</span>
    <span class="kds-chip" data-filtro="reparto">Reparto</span>
    <span class="kds-chip" data-filtro="retiro">Retiro</span>
  </div>

  <div class="kds-pestanas" id="kds-pestanas">
    <div class="kds-pestana activo" data-estado="nueva"><b id="kds-num-nuevas">0</b><span>Nuevas</span></div>
    <div class="kds-pestana" data-estado="en-proceso"><b id="kds-num-proceso">0</b><span>En preparación</span></div>
    <div class="kds-pestana" data-estado="lista"><b id="kds-num-listas">0</b><span>Listas</span></div>
  </div>

  <div class="kds-resumen" id="kds-resumen"></div>

  <div class="kds-lista" id="kds-lista"></div>

  <div class="kds-simulacion">
    <button id="btnNuevaComanda">➕ Nueva comanda</button>
    <button id="btnAvanzar">➡ Avanzar más antiguo</button>
    <button id="btnRetirar">✔ Retirar de listas</button>
    <span class="kds-nota">Simulación para pruebas</span>
  </div>

<script>
  (() => {
    /* ─── Estado y catálogo ───────────────────── */
    let _modo = 'cocina';
    let _pedidos = [];
    let _contador = 1;
    let _filtroActivo = 'todos';
    let _estadoActivo = 'nueva';
    let _ctxAudio = null;

    const CATALOGO = {
      cocina: {
        icono: 'fa-fire-burner', titulo: 'Encargado de Cocina', color: 'var(--color-cocina)',
        items: [
          { nombre: 'Hamburguesa', icono: '🍔' }, { nombre: 'Papas fritas', icono: '🍟' },
          { nombre: 'Pizza muzzarella', icono: '🍕' }, { nombre: 'Ensalada mixta', icono: '🥗' },
          { nombre: 'Milanesa napolitana', icono: '🍖' }, { nombre: 'Pasta al pesto', icono: '🍝' },
          { nombre: 'Sopa del día', icono: '🥣' }, { nombre: 'Empanadas', icono: '🥟' }
        ]
      },
      barra: {
        icono: 'fa-wine-glass', titulo: 'Encargado de Barra', color: 'var(--color-barra)',
        items: [
          { nombre: 'Gin tonic', icono: '🍸' }, { nombre: 'Fernet con cola', icono: '🥃' },
          { nombre: 'Mojito', icono: '🍹' }, { nombre: 'Cerveza IPA', icono: '🍺' },
          { nombre: 'Café cortado', icono: '☕' }, { nombre: 'Limonada', icono: '🍋' },
          { nombre: 'Vino tinto copa', icono: '🍷' }, { nombre: 'Aperol spritz', icono: '🧊' }
        ]
      }
    };

    /* ─── Funciones auxiliares ────────────────── */
    function _idUnico() { return 'c' + (_contador++) + '_' + Math.random().toString(36).slice(2,6); }

    function _crearPedido() {
      const cat = CATALOGO[_modo];
      const tipos = ['mesa', 'reparto', 'retiro'];
      const tipo = tipos[Math.floor(Math.random() * tipos.length)];
      const numItems = Math.floor(Math.random() * 3) + 1;
      const items = [];
      for (let i = 0; i < numItems; i++) {
        const prod = cat.items[Math.floor(Math.random() * cat.items.length)];
        items.push({ ...prod, qty: Math.floor(Math.random() * 2) + 1, listo: false });
      }
      let etiqueta;
      if (tipo === 'mesa') etiqueta = 'Mesa ' + (Math.floor(Math.random() * 20) + 1);
      else if (tipo === 'reparto') etiqueta = 'Reparto #' + (Math.floor(Math.random() * 90) + 10);
      else etiqueta = 'Retiro #' + (Math.floor(Math.random() * 50) + 1);

      return {
        id: _idUnico(),
        numero: String(_contador - 1).padStart(2, '0'),
        tipo, etiqueta, items,
        estado: 'nueva',
        ts: Date.now(),
        grupo: Math.random() > 0.78 ? 'Combo' : null
      };
    }

    function _clasificarTiempo(ms) { const min = ms / 60000; if (min < 5) return 't-ok'; if (min < 12) return 't-warn'; return 't-peligro'; }
    function _formatearTiempo(ms) { const s = Math.floor(ms / 1000), m = Math.floor(s / 60), r = s % 60; return m + ':' + String(r).padStart(2, '0'); }

    function _reproducirAlerta() {
      try {
        _ctxAudio = _ctxAudio || new (window.AudioContext || window.webkitAudioContext)();
        const o = _ctxAudio.createOscillator(), g = _ctxAudio.createGain();
        o.frequency.value = 880; o.type = 'sine';
        g.gain.setValueAtTime(0.001, _ctxAudio.currentTime);
        g.gain.linearRampToValueAtTime(0.12, _ctxAudio.currentTime + 0.02);
        g.gain.exponentialRampToValueAtTime(0.001, _ctxAudio.currentTime + 0.35);
        o.connect(g); g.connect(_ctxAudio.destination);
        o.start(); o.stop(_ctxAudio.currentTime + 0.4);
      } catch (e) {}
      if (navigator.vibrate) navigator.vibrate(120);
    }

    function _mostrarToast(msg) {
      const cont = document.getElementById('kds-toast-contenedor');
      const t = document.createElement('div'); t.className = 'kds-toast'; t.textContent = msg;
      cont.appendChild(t);
      setTimeout(() => t.remove(), 3050);
    }

    /* ─── Render de tickets ───────────────────── */
    function _crearTicket(p) {
      const el = document.createElement('div');
      el.dataset.id = p.id;
      const transcurrido = Date.now() - p.ts;
      const claseTiempo = _clasificarTiempo(transcurrido);
      const urgente = claseTiempo === 't-peligro';
      const tipoClase = p.tipo === 'mesa' ? 'kds-tipo-mesa' : (p.tipo === 'reparto' ? 'kds-tipo-reparto' : 'kds-tipo-retiro');
      const interactivo = p.estado === 'en-proceso';
      const listos = p.items.filter(i => i.listo).length;

      el.className = 'kds-ticket' + (urgente ? ' kds-urgente' : '');
      el.innerHTML = `
        <div class="kds-ticket-cabecera">
          <div><div class="kds-ticket-numero">#${p.numero}</div><div class="kds-ticket-mesa">${p.etiqueta}</div></div>
          <span class="kds-ticket-tipo ${tipoClase}">${p.tipo}</span>
        </div>
        <span class="kds-ticket-tiempo ${claseTiempo}">⏱ ${_formatearTiempo(transcurrido)}</span>
        <div class="kds-ticket-items">${p.items.map((i, idx) => `
          <div class="kds-item ${interactivo ? 'kds-item-tocable' : ''} ${i.listo ? 'kds-item-listo' : ''}" data-idx="${idx}">
            <span class="kds-item-check ${i.listo ? 'kds-item-marcado' : ''}"><i class="fas fa-check"></i></span>
            <span class="kds-item-cantidad">${i.qty}</span>
            <span class="kds-item-nombre">${i.nombre} ${i.icono || ''}</span>
          </div>`).join('')}
        </div>
        ${interactivo ? `<div class="kds-progreso"><span>${listos}/${p.items.length} listos</span><span class="kds-progreso-barra"><span class="kds-progreso-lleno" style="width:${(listos/p.items.length)*100}%"></span></span></div>` : ''}
        ${p.grupo ? `<div class="kds-ticket-banderas"><span class="kds-bandera kds-bandera-grupo">${p.grupo}</span></div>` : ''}
        <div class="kds-ticket-acciones">
          ${p.estado === 'nueva' ? `<button class="kds-boton kds-boton-iniciar"><i class="fas fa-fire"></i> Iniciar</button>` : ''}
          ${p.estado === 'en-proceso' ? `<button class="kds-boton kds-boton-listo"><i class="fas fa-check-double"></i> Marcar todo listo</button>` : ''}
          ${p.estado === 'lista' ? `<button class="kds-boton kds-boton-entregar"><i class="fas fa-box-open"></i> Entregar / Retirar</button>` : ''}
        </div>
        ${p.estado === 'lista' ? `<div class="kds-acciones-secundarias"><button class="kds-boton-reabrir"><i class="fas fa-undo"></i> Reabrir</button></div>` : ''}
      `;

      if (interactivo) {
        el.querySelectorAll('.kds-item').forEach(row => {
          row.addEventListener('click', (ev) => {
            ev.stopPropagation();
            const idx = Number(row.dataset.idx);
            p.items[idx].listo = !p.items[idx].listo;
            if (navigator.vibrate) navigator.vibrate(20);
            if (p.items.every(i => i.listo)) {
              p.estado = 'lista';
              _mostrarToast(`Comanda #${p.numero} lista`);
            }
            _pintar();
          });
        });
      }

      const btn = el.querySelector('.kds-boton');
      if (btn) {
        btn.addEventListener('click', (ev) => {
          ev.stopPropagation();
          if (navigator.vibrate) navigator.vibrate(30);
          if (p.estado === 'en-proceso') {
            p.items.forEach(i => i.listo = true);
            p.estado = 'lista';
            _mostrarToast(`Comanda #${p.numero} lista para pase`);
          } else if (p.estado === 'lista') {
            el.classList.add('kds-saliendo');
            setTimeout(() => {
              _pedidos = _pedidos.filter(x => x.id !== p.id);
              _pintar();
            }, 240);
            _mostrarToast(`📦 Comanda #${p.numero} entregada`);
          } else {
            p.estado = 'en-proceso';
            _mostrarToast(`Comanda #${p.numero} iniciada`);
          }
          _pintar();
        });
      }

      const btnReabrir = el.querySelector('.kds-boton-reabrir');
      if (btnReabrir) {
        btnReabrir.addEventListener('click', (ev) => {
          ev.stopPropagation();
          p.estado = 'en-proceso';
          _mostrarToast(`Comanda #${p.numero} reabierta`);
          _pintar();
        });
      }

      return el;
    }

    function _pintar() {
      const filtradas = _filtroActivo === 'todos' ? _pedidos : _pedidos.filter(p => p.tipo === _filtroActivo);
      const visibles = filtradas.filter(p => p.estado === _estadoActivo).sort((a, b) => a.ts - b.ts);

      const lista = document.getElementById('kds-lista');
      lista.innerHTML = '';
      if (!visibles.length) {
        const textos = { nueva: 'Sin pedidos nuevos', 'en-proceso': 'Nada en preparación', lista: 'Nada listo por ahora' };
        lista.innerHTML = `<div class="kds-vacio"><p>${textos[_estadoActivo]}</p></div>`;
      } else {
        visibles.forEach(p => lista.appendChild(_crearTicket(p)));
      }

      document.getElementById('kds-num-nuevas').textContent = filtradas.filter(p => p.estado === 'nueva').length;
      document.getElementById('kds-num-proceso').textContent = filtradas.filter(p => p.estado === 'en-proceso').length;
      document.getElementById('kds-num-listas').textContent = filtradas.filter(p => p.estado === 'lista').length;

      const urgentes = _pedidos.filter(p => p.estado !== 'lista' && _clasificarTiempo(Date.now() - p.ts) === 't-peligro').length;
      document.getElementById('kds-resumen').innerHTML = `
        <div class="kds-pildora"><span class="kds-swatch" style="background:var(--color-warning)"></span> Activos <b>${_pedidos.filter(p => p.estado !== 'lista').length}</b></div>
        <div class="kds-pildora"><span class="kds-swatch" style="background:var(--color-danger)"></span> Demorados <b>${urgentes}</b></div>
        <div class="kds-pildora"><span class="kds-swatch" style="background:var(--color-success)"></span> Listos <b>${_pedidos.filter(p => p.estado === 'lista').length}</b></div>
      `;

      document.getElementById('campana').classList.toggle('activa', _pedidos.some(p => p.estado === 'nueva'));
    }

    function _actualizarCronometros() {
      document.querySelectorAll('.kds-ticket').forEach(el => {
        const p = _pedidos.find(x => x.id === el.dataset.id);
        if (!p) return;
        const transcurrido = Date.now() - p.ts;
        const claseTiempo = _clasificarTiempo(transcurrido);
        const badge = el.querySelector('.kds-ticket-tiempo');
        if (badge) {
          badge.textContent = '⏱ ' + _formatearTiempo(transcurrido);
          badge.classList.remove('t-ok', 't-warn', 't-peligro');
          badge.classList.add(claseTiempo);
        }
        const yaUrgente = el.classList.contains('kds-urgente');
        if (claseTiempo === 't-peligro' && !yaUrgente) el.classList.add('kds-urgente');
        if (claseTiempo !== 't-peligro' && yaUrgente) el.classList.remove('kds-urgente');
      });
    }

    /* ─── Simulación ──────────────────────────── */
    function _agregarComanda() {
      const p = _crearPedido();
      _pedidos.push(p);
      _reproducirAlerta();
      _mostrarToast(`📥 Nueva comanda #${p.numero} — ${p.etiqueta}`);
      _pintar();
    }

    function _avanzar() {
      for (const estado of ['nueva', 'en-proceso']) {
        const candidatos = _pedidos.filter(p => p.estado === estado).sort((a, b) => a.ts - b.ts);
        if (candidatos.length) {
          candidatos[0].estado = estado === 'nueva' ? 'en-proceso' : 'lista';
          _pintar();
          return;
        }
      }
    }

    function _retirar() {
      const listas = _pedidos.filter(p => p.estado === 'lista').sort((a, b) => a.ts - b.ts);
      if (listas.length) {
        _pedidos = _pedidos.filter(p => p.id !== listas[0].id);
        _pintar();
      }
    }

    function _programarLlegada() {
      const espera = 9000 + Math.random() * 14000;
      setTimeout(() => { _agregarComanda(); _programarLlegada(); }, espera);
    }

    /* ─── Eventos ─────────────────────────────── */
    document.getElementById('kds-filtros').addEventListener('click', (e) => {
      const chip = e.target.closest('.kds-chip');
      if (!chip) return;
      document.querySelectorAll('#kds-filtros .kds-chip').forEach(c => c.classList.remove('activo'));
      chip.classList.add('activo');
      _filtroActivo = chip.dataset.filtro;
      _pintar();
    });

    document.getElementById('kds-pestanas').addEventListener('click', (e) => {
      const pestana = e.target.closest('.kds-pestana');
      if (!pestana) return;
      _estadoActivo = pestana.dataset.estado;
      document.querySelectorAll('#kds-pestanas .kds-pestana').forEach(p => p.classList.toggle('activo', p === pestana));
      _pintar();
    });

    document.getElementById('btnNuevaComanda').addEventListener('click', _agregarComanda);
    document.getElementById('btnAvanzar').addEventListener('click', _avanzar);
    document.getElementById('btnRetirar').addEventListener('click', _retirar);

    document.getElementById('btnModo').addEventListener('click', () => {
      _modo = _modo === 'cocina' ? 'barra' : 'cocina';
      const cat = CATALOGO[_modo];
      document.querySelector('.toolbar h2 i').className = 'fas ' + cat.icono;
      document.querySelector('.toolbar h2 span').innerHTML = cat.titulo + '<small>La Taberna · en vivo</small>';
      document.querySelector('.toolbar h2').style.color = cat.color;
      _pedidos = []; _contador = 1;
      for (let i = 0; i < 4; i++) _pedidos.push(_crearPedido());
      _pedidos[0].estado = 'en-proceso'; _pedidos[0].ts -= 8 * 60000;
      _pedidos[1].estado = 'lista'; _pedidos[1].ts -= 10 * 60000;
      _pedidos[2].ts -= 14 * 60000;
      _pedidos[3].grupo = 'Combo';
      _pintar();
    });

    document.getElementById('btnRecetario').addEventListener('click', () => {
      _mostrarToast('📖 Recetario — próximamente');
    });

    function _actualizarReloj() {
      document.getElementById('reloj').textContent = new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
    }

    /* ─── Inicialización ──────────────────────── */
    for (let i = 0; i < 4; i++) _pedidos.push(_crearPedido());
    _pedidos[0].estado = 'en-proceso'; _pedidos[0].ts -= 8 * 60000;
    _pedidos[1].estado = 'lista'; _pedidos[1].ts -= 10 * 60000;
    _pedidos[2].ts -= 14 * 60000;
    _pedidos[3].grupo = 'Combo';
    _pintar();
    _actualizarReloj();
    setInterval(_actualizarCronometros, 1000);
    setInterval(_actualizarReloj, 1000);
    _programarLlegada();
  })();
</script>
</body>
</html>
